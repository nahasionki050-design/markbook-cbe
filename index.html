/* ============================= ACCESS / SUBSCRIPTION CONTROL ============================= */
function schoolAccessStatus(school){
  if(!school) return {ok:false, msg:'This portal is not available. Please contact your school administrator.'};
  if(school.status==='suspended') return {ok:false, msg:'Access to this portal is currently unavailable. Please contact your school administrator.'};
  if(school.status==='trial' && Date.now() > school.trialEndsAt) return {ok:false, msg:'The trial period for this portal has ended. Please contact your school administrator to restore access.'};
  return {ok:true};
}
function schoolStatusLabel(s){
  if(s.status==='suspended') return '<span class="badge BE">Suspended</span>';
  if(s.status==='active') return '<span class="badge EE">Active</span>';
  const daysLeft = Math.ceil((s.trialEndsAt-Date.now())/86400000);
  if(daysLeft<=0) return '<span class="badge BE">Trial Expired</span>';
  return `<span class="badge AE">Trial: ${daysLeft}d left</span>`;
}

/* ============================= SESSION ============================= */
let session = JSON.parse(sessionStorage.getItem('cbc_session')||'null');
// Holds the trimmed, single-learner view a parent session works from (see
// buildParentSafeSchool below). Deliberately a plain in-memory variable, never written
// to DB/localStorage: a parent's own device should end this session holding nothing
// more than what was on screen. It does not survive a page refresh on purpose — route()
// below sends a parent back to the login form if it's missing, so a reload never tries
// to silently serve stale data and never needs the full school pulled again unless the
// parent actively re-identifies their child.
let parentSchoolData = null;
function setSession(s){ session = s; sessionStorage.setItem('cbc_session', JSON.stringify(s)); resetInactivityTimer(); }
function logout(){ Object.keys(smsPinMem).forEach(k=>delete smsPinMem[k]); teacherTab='dashboard'; parentTab='dashboard'; adminTab='dashboard'; session=null; parentSchoolData=null; sessionStorage.removeItem('cbc_session'); syncState.enabled=false; syncState.connectedCode=null; detachLiveListeners(); detachAdminLiveListener(); clearTimeout(inactivityTimer); route(); }

function currentSchool(){ return session && session.schoolCode ? DB.schools[session.schoolCode] : null; }

/* ============================= INACTIVITY AUTO-LOGOUT =============================
   Any signed-in session (Admin, DOS/HOI, or Teacher) is signed out automatically after
   15 minutes with no mouse/keyboard/touch/scroll activity — both for security on shared
   school computers and so a suspended/expired account isn't left logged in indefinitely. */
const INACTIVITY_LIMIT_MS = 15*60*1000;
let inactivityTimer = null;
function resetInactivityTimer(){
  clearTimeout(inactivityTimer);
  if(!session) return;
  inactivityTimer = setTimeout(()=>{
    if(session){
      logout();
      setTimeout(()=>toast('You were signed out after 15 minutes of inactivity.','err'), 50);
    }
  }, INACTIVITY_LIMIT_MS);
}
['mousemove','mousedown','keydown','scroll','touchstart','click'].forEach(evt=>{
  window.addEventListener(evt, resetInactivityTimer, {passive:true});
});
// Also re-arm whenever the tab regains focus/visibility, in case timers were throttled
// while the tab was backgrounded.
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) resetInactivityTimer(); });

/* ============================= LIVE ACCESS ENFORCEMENT =============================
   Suspending a school (or letting a trial expire) should lock out anyone already signed
   in on that school immediately — not just block their *next* login. When synced school
   data changes (see mergeDataFromCloud below), this checks whether the currently active
   DOS/HOI or Teacher session on this device still has access, and force-logs them out
   right away if not. */
function enforceAccessForActiveSession(code){
  if(!session || session.schoolCode !== code) return;
  if(session.role !== 'dos' && session.role !== 'teacher') return;
  const access = schoolAccessStatus(DB.schools[code]);
  if(!access.ok){
    const msg = access.msg;
    logout();
    setTimeout(()=>toast(msg,'err'), 50);
  }
}

/* ============================= HELPERS ============================= */
// Falls back to the table's last row if pct matches no band — see gradingIssues() in the
// Grading tab, which is what actually protects against that ever silently happening for a
// real score: it flags gaps/overlaps in the DOS/HOI's UI before they reach here.
function gradeFor(school, pct, classId){
  const table = gradingFor(school, classId);
  const g = table.find(r=> pct>=r.min && pct<=r.max);
  return g || table[table.length-1];
}
function pctOf(score,max){ return max>0 ? (score/max*100) : 0; }
// Returns the learning areas that apply to a given class/grade.
// Only a learning area explicitly ticked for this class is included — an area with no
// classes ticked applies to NONE (see migrateDB's one-time "_scoped" step for why old
// schools whose subjects were never ticked at all still keep working exactly as before).
// This used to fall back to "an empty classIds list means every class", which silently
// counted an area a class was never actually assigned toward that class's overall
// performance the moment someone created it and forgot (or didn't get round) to tick
// anything — exactly what dragged a class's Mean %/level down for a subject its learners
// were never being taught.
function areasForClass(school, classId){
  return school.learningAreas.filter(a => a.classIds && a.classIds.includes(classId));
}
// Learners in a class, ordered by admission number ascending (smallest first) — used
// everywhere a class roster is listed (marks entry, reports, sheets) for a consistent,
// predictable order. Numeric admission numbers sort numerically; non-numeric ones
// (e.g. "ADM/001") fall back to a natural string comparison.
// Everyone who belongs on an exam's sheets/reports: the grade's current learners PLUS any learner
// who has marks recorded in that exam but has since been moved or promoted to another grade — so
// past results always stay complete under the grade they were sat in.
function studentsForExam(school, e){
  const mk = school.marks[e.id] || {};
  return school.students.filter(s=> s.classId===e.classId || (mk[s.id] && Object.keys(mk[s.id]).length)).sort(admOrName);
}
function unionStudents(list){ return [...new Map(list.map(s=>[s.id,s])).values()].sort(admOrName); }
/* ===== Gender helpers ===== */
function normGender(v){ const t=String(v||'').trim().toLowerCase(); if(['m','male','boy'].includes(t)) return 'M'; if(['f','female','girl'].includes(t)) return 'F'; return ''; }
function genderLabel(g){ return g==='M'?'Boy':g==='F'?'Girl':''; }
function genderPickerHTML(id){
  return `<div><label>Print for</label><select id="${id}"><option value="all">All learners</option><option value="M">Boys only</option><option value="F">Girls only</option><option value="split">Boys &amp; Girls (separate lists)</option></select></div>`;
}
function genderMode(id){ const el=qs('#'+id); return el?el.value:'all'; }
function genderNote(mode){
  if(mode==='M') return '<p class="small">Showing: Boys only (positions are class positions)</p>';
  if(mode==='F') return '<p class="small">Showing: Girls only (positions are class positions)</p>';
  if(mode==='split') return '<p class="small">Listed separately: Boys, then Girls (positions are class positions)</p>';
  return '';
}
function applyGenderMode(list, mode, getS){
  getS = getS || (x=>x);
  const g = x=>getS(x).gender;
  if(mode==='M' || mode==='F') return list.filter(x=>g(x)===mode);
  if(mode==='split') return [...list.filter(x=>g(x)==='M'), ...list.filter(x=>g(x)==='F'), ...list.filter(x=>g(x)!=='M' && g(x)!=='F')];
  return list;
}
// Renders table rows; in "split" mode adds a Boys / Girls heading row before each group (numbering restarts per group via idx).
function groupedRowsHTML(list, mode, colspan, getS, rowFn){
  if(mode!=='split') return list.map((x,i)=>rowFn(x,i)).join('');
  return [['Boys','M'],['Girls','F'],['Gender not specified','']].map(([label,code])=>{
    const grp = list.filter(x=>{ const gg=getS(x).gender; return code ? gg===code : (gg!=='M' && gg!=='F'); });
    if(!grp.length) return '';
    return `<tr class="gender-head"><td colspan="${colspan}">${label} (${grp.length})</td></tr>` + grp.map((x,i)=>rowFn(x,i)).join('');
  }).join('');
}
// Boys vs Girls performance table for a class (rows = [{s, meanPct}] for the WHOLE class).
function genderSummaryHTML(school, classId, rows){
  if(!rows.some(r=>r.s.gender==='M' || r.s.gender==='F')) return '';
  const levels = gradingFor(school, classId).map(k=>k.level);
  const line = (label, list)=>{
    const n = list.length, mean = n ? list.reduce((t,r)=>t+r.meanPct,0)/n : null, cnt = {};
    list.forEach(r=>{ const lv = gradeFor(school, r.meanPct, classId).level; cnt[lv] = (cnt[lv]||0)+1; });
    return `<tr><td style="text-align:left"><b>${label}</b></td><td>${n}</td><td>${mean!=null?mean.toFixed(1)+'%':'-'}</td>${levels.map(l=>`<td>${cnt[l]||0}</td>`).join('')}</tr>`;
  };
  const boys = rows.filter(r=>r.s.gender==='M'), girls = rows.filter(r=>r.s.gender==='F');
  const none = rows.filter(r=>r.s.gender!=='M' && r.s.gender!=='F');
  return `<div class="gender-summary"><p class="small" style="margin:14px 0 4px"><b>Performance by gender</b> (whole class)</p>
  <table><tr><th style="text-align:left">Group</th><th>Learners</th><th>Mean %</th>${levels.map(l=>`<th>${escapeHtml(l)}</th>`).join('')}</tr>
  ${line('Boys',boys)}${line('Girls',girls)}${none.length?line('Not specified',none):''}${line('All learners',rows)}</table></div>`;
}
function studentsInClass(school, classId){
  return school.students.filter(s=>s.classId===classId).sort(admOrName);
}
// Shared comparator: orders learners by admission number (numeric, ascending) first.
// A learner with no admission number recorded is never compared numerically (that
// would sort blanks to the very top, ahead of everyone) — instead, learners with an
// admission number always come first in adm order, and anyone missing one is placed
// after them, sorted alphabetically by name among themselves.
function admOrName(a,b){
  const aHas = a.adm!=null && String(a.adm).trim()!=='';
  const bHas = b.adm!=null && String(b.adm).trim()!=='';
  if(aHas && bHas){
    const na = Number(a.adm), nb = Number(b.adm);
    if(!isNaN(na) && !isNaN(nb)) return na-nb;
    return String(a.adm).localeCompare(String(b.adm), undefined, {numeric:true, sensitivity:'base'});
  }
  if(aHas !== bHas) return aHas ? -1 : 1;
  return (a.name||'').localeCompare(b.name||'', undefined, {sensitivity:'base'});
}
// KNEC Assessment Number helpers. The number is optional, so every sheet/roster/list only shows
// an "Assess. No." column when at least one learner in THAT list actually has one recorded —
// schools that don't use it see no empty column. getS lets it work on rows shaped {s:learner}.
function hasAssessNo(list, getS){
  getS = getS || (x=>x);
  return (list||[]).some(x=>{ const st = getS(x); return st && st.assessNo && String(st.assessNo).trim()!==''; });
}
function assessTh(on){ return on ? '<th>Assess. No.</th>' : ''; }
function assessTd(st, on){ return on ? `<td>${st && st.assessNo ? escapeHtml(st.assessNo) : '—'}</td>` : ''; }
// Returns the grading/performance-level table that applies to a class: that class's own
// custom grading if it has been set up, otherwise the school-wide default. This is what
// keeps a grading change made for one class from ever affecting any other class.
function gradingFor(school, classId){
  const cls = classId ? school.classes.find(c=>c.id===classId) : null;
  return (cls && cls.gradingSystem && cls.gradingSystem.length) ? cls.gradingSystem : school.gradingSystem;
}
function escapeHtml(s){ return (s+'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
// Builds the small "address | phone | email | NEMIS/Reg No" contact line shown under the
// school name on every printed report/sheet header. Any field the school hasn't filled in
// is skipped, and the whole line is omitted if none of them have been entered yet.
function schoolContactLine(school){
  const parts = [school.address, school.phone, school.email].filter(v=>v && v.trim());
  if(school.regNo && school.regNo.trim()) parts.push('NEMIS/Reg No: '+school.regNo.trim());
  if(!parts.length) return '';
  return `<p class="small">${parts.map(escapeHtml).join(' &nbsp;|&nbsp; ')}</p>`;
}
// The logo + school name + motto block used at the top of every printed report/sheet
// header, in place of a bare <h2>school name</h2>. Logo and motto are each skipped when
// not set, so a school that hasn't uploaded either still gets exactly the old plain header.
function schoolHeaderTop(school){
  const logo = school.logo ? `<img class="rc-logo" src="${school.logo}" alt="School logo">` : '';
  const motto = school.motto && school.motto.trim() ? `<p class="rc-motto">${escapeHtml(school.motto)}</p>` : '';
  return `${logo}<h2>${escapeHtml(school.name)}</h2>${motto}`;
}
function qs(sel,root=document){return root.querySelector(sel);}
function qsa(sel,root=document){return [...root.querySelectorAll(sel)];}
function toast(msg,type='ok'){
  const el = document.createElement('div');
  el.className='msg '+type;
  el.style.position='fixed'; el.style.top='10px'; el.style.right='10px'; el.style.zIndex=9999;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),2500);
}
function getQueryParams(){
  const p = new URLSearchParams(location.search);
  return {school:p.get('school'), role:p.get('role'), sync:p.get('sync'), key:p.get('key'), p:p.get('p')};
}
// Figures out which Firebase config (if any) should be used to bootstrap a login: a sync
// link the person opened, a Sync Code they pasted on the login form, or a config this
// browser already knows for that school code from a previous connect.
function resolveLoginSyncConfig(code){
  const qp = getQueryParams();
  if(qp.sync){ const c = decodeSyncCode(qp.sync); if(c) return c; }
  const manual = qs('#syncCodeInput');
  if(manual && manual.value.trim()){ const c = decodeSyncCode(manual.value.trim()); if(c) return c; }
  const existing = DB.schools[code] && DB.schools[code].syncConfig;
  if(existing && existing.enabled && existing.config) return existing.config;
  // This device has never seen this school code before at all (as opposed to knowing
  // it and having sync off on purpose) — try the deployment's shared project, if any,
  // so a first-time DOS/HOI or Teacher link on a brand-new device can still resolve.
  if(!DB.schools[code] && hasPlatformConfig()) return window.PLATFORM_FIREBASE_CONFIG;
  return null;
}
/* ============================= ADMIN: RETRIEVE A MISSING SCHOOL =============================
   A school's data lives wherever it's synced (this deployment's shared database, or that
   school's own per-school Sync Code) — NOT tied to any one admin device's local list. If an
   admin's "All Schools" list is missing an entry (e.g. it was created on a different browser/
   device than the one they're viewing now), this reuses the exact same cloud pull that a DOS/
   HOI or Teacher's first login already does (bootstrapFromCloudIfNeeded), just triggered from
   the Admin panel by code instead of by logging in as that school. */
function parseSchoolCodeInput(raw){
  raw = String(raw||'').trim();
  const m = raw.match(/[?&]school=([0-9A-Za-z_-]+)/);
  return m ? decodeURIComponent(m[1]) : raw;
}
function parseSyncCodeInput(raw){
  raw = String(raw||'').trim();
  if(!raw) return '';
  const m = raw.match(/[?&]sync=([^&\s]+)/);
  return m ? decodeURIComponent(m[1]) : raw;
}
async function adminRetrieveSchoolByCode(){
  const msgEl = qs('#adminLookupMsg');
  const code = parseSchoolCodeInput(qs('#adminLookupCode').value);
  if(!code){ msgEl.innerHTML = '<div class="msg err">Enter the school code (or paste a DOS/Teacher login link).</div>'; return; }
  if(DB.schools[code]){ msgEl.innerHTML = '<div class="msg ok">That school is already in your list below.</div>'; return; }
  const syncRaw = parseSyncCodeInput(qs('#adminLookupSync').value);
  let config = null;
  if(syncRaw){
    config = decodeSyncCode(syncRaw);
    if(!config){ msgEl.innerHTML = '<div class="msg err">That Sync Code (or link) could not be read — check it was pasted in full.</div>'; return; }
  } else if(hasPlatformConfig()){
    config = window.PLATFORM_FIREBASE_CONFIG;
  }
  if(!config){ msgEl.innerHTML = '<div class="msg err">This deployment has no shared database configured, and no Sync Code was given — ask that school\'s DOS/HOI for their Sync Code (My Account → Multi-Device Sync → "Get Teacher Sync Link / Code") and paste it above.</div>'; return; }
  msgEl.innerHTML = '<div class="msg ok">Looking up…</div>';
  try{ await withTimeout(bootstrapFromCloudIfNeeded(code, config), 8000, 'Lookup'); }
  catch(e){ msgEl.innerHTML = '<div class="msg err">Lookup timed out — check your connection and try again.</div>'; return; }
  if(!DB.schools[code]){ msgEl.innerHTML = '<div class="msg err">No school found for that code with that database. Double-check the code, or that the Sync Code is the right one for this specific school.</div>'; return; }
  msgEl.innerHTML = `<div class="msg ok">✅ Found "${escapeHtml(DB.schools[code].name)}" — added to your list below.</div>`;
  adminTab = 'schools'; renderAdmin(); toast('School found and added to All Schools');
}

const app = document.getElementById('app');
const whoBar = document.getElementById('whoBar');

function route(){
  document.body.classList.remove('dos-menu-open');
  whoBar.innerHTML='';
  if(!session){
    renderLogin();
    return;
  }
  // A parent session's data (parentSchoolData) is an in-memory-only snapshot that does
  // not survive a page refresh on purpose (see where it's declared) — so a reload with a
  // parent session still in sessionStorage but no snapshot in hand sends them back to
  // login rather than trying to silently re-fetch or serve anything stale.
  if(session.role==='parent' && !parentSchoolData){
    logout();
    return;
  }
  if(session.role==='dos' || session.role==='teacher' || session.role==='finance' || session.role==='sadmin' || session.role==='parent'){
    const school = session.role==='parent' ? parentSchoolData : DB.schools[session.schoolCode];
    const access = schoolAccessStatus(school);
    if(!access.ok){
      const msg = access.msg;
      logout();
      setTimeout(()=>toast(msg,'err'), 50);
      return;
    }
  }
  whoBar.innerHTML = `${escapeHtml(session.label)}<span id="syncBadge"></span> &nbsp;|&nbsp; <button class="ghost" onclick="logout()">Logout</button>`;
  if(session.role==='admin') renderAdmin();
  else if(session.role==='dos'){ renderDOS(); maybeShowWaGroupPrompt(); }
  else if(session.role==='teacher') renderTeacher();
  else if(session.role==='finance') renderFinance();
  else if(session.role==='sadmin') renderSadmin();
  else if(session.role==='parent') renderParent();
  // Parent sessions deliberately never call ensureSyncConnected: they get one snapshot
  // of the school's data at login (see doParentLogin), never a live/writable connection,
  // and never touch renderDOS/renderTeacher/renderAdmin or anything reachable from them.
  if(session.role==='dos' || session.role==='teacher' || session.role==='finance' || session.role==='sadmin') ensureSyncConnected(DB.schools[session.schoolCode]);
  if(session.role==='admin'){ ensureAdminSyncConnected(); refreshAllSchoolsFromCloud(true); }
}

    try{
      const incoming = JSON.parse(e.target.result);

function maskContact(dest){
  if(!dest) return '';
  if(dest.includes('@')){
    const [name, domain] = dest.split('@');
    return `${name.slice(0,1)}${'*'.repeat(Math.max(name.length-1,1))}@${domain}`;
  }
  return dest.length>4 ? `${'*'.repeat(dest.length-4)}${dest.slice(-4)}` : dest;
}
function findStaffRecord(role, code, username){
  const school = DB.schools[code];
  if(!school || !username) return null;
  const list = role==='dos' ? school.dos : school.teachers;
  const rec = (list||[]).find(x=>x.username===username);
  return rec ? {school, rec} : null;
}
let otpSendTimes = [];
async function sendStaffOtp(role){
  const scodeEl = qs('#scode');
  const code = scodeEl ? scodeEl.value.trim() : '';
  const username = (role==='dos' ? qs('#duser') : qs('#tuser')).value.trim();
  const contactEl = qs('#otpContact');
  const contact = contactEl ? contactEl.value.trim() : '';
  const msgEl = qs('#staffOtpMsg');
  const otherRole = role==='dos' ? 'platform administrator' : 'DOS/HOI';
  if(!code || !username){ msgEl.innerHTML = '<div class="msg err">Enter the school code and your username above first, then try again.</div>'; return; }
  if(!contact){ msgEl.innerHTML = '<div class="msg err">Enter your registered email or phone number.</div>'; return; }
  const generic = `<div class="msg err">If those details match an account, a code has been sent. If not, ask your ${otherRole} to check the contact details on file for your account.</div>`;
  const found = findStaffRecord(role, code, username);
  if(!found){ msgEl.innerHTML = generic; return; }
  const rec = found.rec;
  const normPhone = normalizePhone(contact);
  const emailMatches = !!(rec.email && rec.email.trim().toLowerCase()===contact.toLowerCase());
  const phoneMatches = !!(normPhone && rec.phone && normalizePhone(rec.phone)===normPhone);
  if(!emailMatches && !phoneMatches){ msgEl.innerHTML = generic; return; }
  const channel = emailMatches ? 'email' : 'phone';
  if(channel==='email' && !hasEmailConfig()){
    msgEl.innerHTML = `<div class="msg err">⚠ Email codes aren't set up for this deployment yet (see EMAIL_SETUP.md).${rec.phone?' Try your registered phone number instead.':''}</div>`;
    return;
  }
  if(channel==='phone' && !hasSmsConfig()){
    msgEl.innerHTML = `<div class="msg err">⚠ SMS codes aren't set up for this deployment yet (see GO_LIVE.md).${rec.email?' Try your registered email instead.':''}</div>`;
    return;
  }
  // Throttle: 60s between codes and max 5/hour per device, so the recovery form can't be used
  // to spam someone's phone (each phone code is a real SMS paid by the platform).
  const nowTs = Date.now();
  otpSendTimes = otpSendTimes.filter(t=>nowTs-t < 3600000);
  if(otpSendTimes.length && nowTs-otpSendTimes[otpSendTimes.length-1] < 60000){
    msgEl.innerHTML = `<div class="msg err">Please wait ${Math.ceil((60000-(nowTs-otpSendTimes[otpSendTimes.length-1]))/1000)}s before requesting another code.</div>`; return;
  }
  if(otpSendTimes.length >= 5){ msgEl.innerHTML = '<div class="msg err">Too many code requests. Try again in an hour.</div>'; return; }
  const otp = String(100000 + (crypto.getRandomValues(new Uint32Array(1))[0] % 900000));
  otpSendTimes.push(nowTs);
  const dest = channel==='email' ? rec.email : rec.phone;
  msgEl.innerHTML = '<p class="small">Sending code…</p>';
  try{
    if(channel==='phone'){
      // Flagged test:true, same as the admin's "Send Test SMS" — an account-recovery code
      // is a platform cost, not something that should eat into a school's parent-SMS credit.
      const res = await fetch(window.PLATFORM_SMS_ENDPOINT, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({purpose:'otp', schoolCode: code, role, username, recipients:[{phone: normalizePhone(rec.phone), message: `Your EduTrack CBC verification code is ${otp}. It expires in 10 minutes. Didn't request this? Ignore this message.`}]})
      });
      const data = await res.json();
      if(!res.ok || !data.ok) throw new Error(data.error || ('HTTP '+res.status));
    } else {
      // Sent straight from the browser via EmailJS — no backend involved. The "public key"
      // is meant to be visible in client code like this; EmailJS's own dashboard is what
      // controls which templates/services it's allowed to trigger.
      await emailjs.send(
        window.PLATFORM_EMAILJS_SERVICE_ID,
        window.PLATFORM_EMAILJS_TEMPLATE_ID,
        { to_email: rec.email, subject: 'Your EduTrack CBC verification code',
          message: `Your verification code is ${otp}. It expires in 10 minutes. Didn't request this? Ignore this email.` },
        { publicKey: window.PLATFORM_EMAILJS_PUBLIC_KEY }
      );
    }
  }catch(err){
    msgEl.innerHTML = `<div class="msg err">Could not send the code: ${escapeHtml(String(err.message||err))}</div>`;
    return;
  }
  staffOtpState = {role, schoolCode: code, userId: rec.id, otp, expiresAt: Date.now()+10*60*1000, channel, dest};
  msgEl.innerHTML = `<div class="msg ok">Code sent to ${escapeHtml(maskContact(dest))}. It expires in 10 minutes.</div>
    <div class="row" style="margin-top:8px"><div><label>6-digit Code</label><input id="otpCode" maxlength="6" inputmode="numeric"></div></div>
    <div class="row">
      <div><label>New Password</label><input type="password" id="otpNewPw"></div>
      <div><label>Confirm New Password</label><input type="password" id="otpConfPw"></div>
    </div>
    <div class="flexbtns">
      <button onclick="verifyStaffOtp()">Verify &amp; Reset Password</button>
      <button class="ghost" onclick="sendStaffOtp('${role}')">Resend Code</button>
    </div>
    <div id="staffOtpMsg2"></div>`;
}
function verifyStaffOtp(){
  const msgEl = qs('#staffOtpMsg2') || qs('#staffOtpMsg');
  if(!staffOtpState){ if(msgEl) msgEl.innerHTML = '<div class="msg err">Request a new code first.</div>'; return; }
  if(Date.now() > staffOtpState.expiresAt){ msgEl.innerHTML = '<div class="msg err">That code has expired — send a new one.</div>'; staffOtpState = null; return; }
  const entered = (qs('#otpCode').value||'').trim();
  if(entered !== staffOtpState.otp){ msgEl.innerHTML = '<div class="msg err">Incorrect code.</div>'; return; }
  const nw = qs('#otpNewPw').value, conf = qs('#otpConfPw').value;
  if(!nw || nw.length<4){ msgEl.innerHTML = '<div class="msg err">New password must be at least 4 characters.</div>'; return; }
  if(nw !== conf){ msgEl.innerHTML = '<div class="msg err">New password and confirmation do not match.</div>'; return; }
  const school = DB.schools[staffOtpState.schoolCode];
  const list = staffOtpState.role==='dos' ? (school&&school.dos) : (school&&school.teachers);
  const rec = list && list.find(x=>x.id===staffOtpState.userId);
  if(!rec){ msgEl.innerHTML = '<div class="msg err">That account no longer exists.</div>'; staffOtpState = null; return; }
  rec.password = nw;
  saveDB(DB);
  staffOtpState = null;
  const area = qs('#staffRecoveryArea'); if(area){ area.classList.add('hidden'); area.innerHTML = ''; }
  if(qs('#dpass')) qs('#dpass').value = '';
  if(qs('#tpass')) qs('#tpass').value = '';
  toast('Password reset — sign in with your new password');
}
async function doDosLogin(){
  const code = qs('#scode').value.trim();
  const u = qs('#duser').value.trim();
  const p = qs('#dpass').value;
  setLoginBusy(true, 'Logging in…');
  // Fast path: if this device already holds this school locally, check credentials
  // against that copy immediately instead of waiting on the network — login is instant
  // on a device that's been used before. A fresh cloud copy is still pulled in right
  // after, in the background, so the session catches up with anything changed elsewhere.
  const cached = DB.schools[code];
  const cachedRec = cached && cached.dos.find(d=>d.username===u && d.password===p);
  if(cachedRec){
    const access = schoolAccessStatus(cached);
    if(!access.ok){ setLoginBusy(false); qs('#loginMsg').innerHTML=`<div class="msg err">${escapeHtml(access.msg)}</div>`; return; }
    setSession({role:'dos', schoolCode:code, userId:cachedRec.id, label:`${cachedRec.name} · ${cached.name}`});
    route();
    const config = resolveLoginSyncConfig(code);
    if(config) bootstrapFromCloudIfNeeded(code, config).then(()=>{ if(session && session.role==='dos' && session.schoolCode===code) route(); });
    return;
  }
  const config = resolveLoginSyncConfig(code);
  if(config){
    qs('#loginMsg').innerHTML='<div class="msg ok">Connecting to sync…</div>';
    try{ await withTimeout(bootstrapFromCloudIfNeeded(code, config), 8000, 'Sync'); }
    catch(e){ console.warn('Sync bootstrap did not complete in time, continuing with local login', e); qs('#loginMsg').innerHTML='<div class="msg err">Sync is slow to respond — checking what\'s on this device instead.</div>'; }
  }
  const school = DB.schools[code];
  if(!school){ setLoginBusy(false); qs('#loginMsg').innerHTML='<div class="msg err">School code not found.</div>'; return; }
  const rec = school.dos.find(d=>d.username===u && d.password===p);
  if(!rec){ setLoginBusy(false); qs('#loginMsg').innerHTML='<div class="msg err">Invalid credentials.</div>'; return; }
  const access = schoolAccessStatus(school);
  if(!access.ok){ setLoginBusy(false); qs('#loginMsg').innerHTML=`<div class="msg err">${escapeHtml(access.msg)}</div>`; return; }
  setSession({role:'dos', schoolCode:code, userId:rec.id, label:`${rec.name} · ${school.name}`});
  route();
}

// Parent Portal login: instead of a username/password, a parent proves they're looking
// up their own child by supplying the learner's full name, admission number, AND a
// Parent PIN the school gave only to them (see genParentPin / the Learners admin table).
// Three independent factors: name and admission number are things a classmate, a sibling,
// or a school notice could plausibly leak, but the PIN is never printed anywhere public and
// is only ever handed to the parent directly — so guessing all three together is far harder
// than guessing any one or two. All must match the same learner record.
function parentCandidateMatches(s, norm, nameInput, admInput, pinInput){
  if(!s.adm || !s.parentPin) return false; // PIN not yet set up for this learner — never a valid match
  return norm(s.adm)===norm(admInput) && norm(s.name)===norm(nameInput) && norm(s.parentPin)===norm(pinInput);
}
async function doParentLogin(){
  const code = qs('#pcode').value.trim();
  const nameInput = qs('#pname').value.trim();
  const admInput = qs('#padm').value.trim();
  const pinInput = qs('#ppin').value.trim();
  if(!code || !nameInput || !admInput || !pinInput){ qs('#loginMsg').innerHTML='<div class="msg err">Enter the school code, learner\'s full name, admission number, and your Parent PIN.</div>'; return; }
  setLoginBusy(true, 'Looking up…');
  const norm = s => String(s||'').trim().toLowerCase();
  const config = resolveLoginSyncConfig(code);
  // Lockout check first, before doing any lookup at all: someone brute-forcing name/admission/
  // PIN combinations for this school code gets stopped here regardless of which path below would
  // otherwise have handled their guess (see PARENT PORTAL: LOGIN LOCKOUT above).
  const lockout = await checkParentLockout(code, config);
  if(lockout.locked){
    setLoginBusy(false);
    qs('#loginMsg').innerHTML = `<div class="msg err">Too many failed attempts for this school. Please try again in ${formatLockoutRemaining(lockout.remainingMs)}, or contact the school directly.</div>`;
    return;
  }
  // Generic, identical failure message everywhere below — deliberately doesn't distinguish
  // "no such learner", "name/admission right but PIN wrong", or "PIN never set up" from one
  // another. Giving a different message for any of those would let a guesser use the
  // response itself to confirm a name+admission pair is real even without the PIN.
  const failMsg = 'No learner found matching those details. Please check with the school and try again.';
  // Fast path: a device that already holds this school locally (e.g. shared with staff,
  // or looked up before) can resolve the learner without a network round trip.
  const cachedFull = DB.schools[code];
  const cachedMatch = cachedFull && cachedFull.students.find(s => parentCandidateMatches(s, norm, nameInput, admInput, pinInput));
  if(cachedMatch){
    const access = schoolAccessStatus(cachedFull);
    if(!access.ok){ setLoginBusy(false); qs('#loginMsg').innerHTML=`<div class="msg err">${escapeHtml(access.msg)}</div>`; return; }
    if(cachedFull.parentPortalEnabled===false){ setLoginBusy(false); qs('#loginMsg').innerHTML='<div class="msg err">The Parent Portal has been closed by the school. Please contact the school directly for results.</div>'; return; }
    parentSchoolData = buildParentSafeSchool(cachedFull, cachedMatch);
    setSession({role:'parent', schoolCode:code, studentId:cachedMatch.id, label:`${cachedMatch.name} (Parent) · ${cachedFull.name}`});
    clearParentAttempts(code, config);
    route();
    return;
  }
  // Deliberately NOT bootstrapFromCloudIfNeeded (that pulls the whole school into the
  // shared DB/localStorage, which is right for staff but not for a public parent login —
  // see the note above parentCloudLookup/buildParentSafeSchool). `fullSchool` here is a
  // throwaway local variable: it's read just long enough to find the one matching learner
  // and is never assigned into DB, so nothing beyond that learner's own class data ever
  // gets written to this device.
  let fullSchool = null;
  if(config){
    qs('#loginMsg').innerHTML='<div class="msg ok">Looking up learner…</div>';
    try{ fullSchool = await withTimeout(parentCloudLookup(code, config), 8000, 'Sync'); }
    catch(e){ console.warn('Parent cloud lookup did not complete in time, falling back to local data', e); qs('#loginMsg').innerHTML='<div class="msg err">Sync is slow to respond — checking what\'s on this device instead.</div>'; }
  }
  // Offline / no sync configured for this school: fall back to whatever this device
  // already has locally (e.g. a device previously used by staff already holds the full
  // school). Still routed through buildParentSafeSchool below either way, so the parent
  // session itself never ends up holding more than its one learner's own class.
  if(!fullSchool) fullSchool = DB.schools[code];
  if(!fullSchool){ setLoginBusy(false); qs('#loginMsg').innerHTML='<div class="msg err">School code not found.</div>'; return; }
  const access = schoolAccessStatus(fullSchool);
  if(!access.ok){ setLoginBusy(false); qs('#loginMsg').innerHTML=`<div class="msg err">${escapeHtml(access.msg)}</div>`; return; }
  if(fullSchool.parentPortalEnabled===false){ setLoginBusy(false); qs('#loginMsg').innerHTML='<div class="msg err">The Parent Portal has been closed by the school. Please contact the school directly for results.</div>'; return; }
  const student = fullSchool.students.find(s => parentCandidateMatches(s, norm, nameInput, admInput, pinInput));
  if(!student){
    recordParentFailure(code, config);
    setLoginBusy(false);
    qs('#loginMsg').innerHTML=`<div class="msg err">${failMsg}</div>`;
    return;
  }
  parentSchoolData = buildParentSafeSchool(fullSchool, student);
  setSession({role:'parent', schoolCode:code, studentId:student.id, label:`${student.name} (Parent) · ${fullSchool.name}`});
  clearParentAttempts(code, config);
  route();
}

function importBackup(evt){
  const file = evt.target.files[0]; if(!file) return;
  if(!confirm('Importing will REPLACE all data currently on this device with the backup file. Continue?')){ evt.target.value=''; return; }
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const incoming = JSON.parse(e.target.result);
      if(!incoming || typeof incoming!=='object' || !('schools' in incoming)) throw new Error('Not a valid backup file');
      DB = migrateDB(incoming);
      saveDB(DB);
      qs('#backupMsg').innerHTML = '<div class="msg ok">Backup restored successfully. All schools are back.</div>';
      renderAdmin();
    }catch(err){
      qs('#backupMsg').innerHTML = '<div class="msg err">Could not read that file — make sure it is a backup exported from this app.</div>';
    }
  };
  reader.readAsText(file);
  evt.target.value='';
}

async function deleteSchool(code){
  const unused = (DB.schools[code] && DB.schools[code].smsCredits) || 0;
  if(!confirm('Delete this school and ALL its data permanently?' + (unused>0 ? `\n\nIt still has ${unused} unused SMS credit(s); they will be discarded.` : ''))) return;
  // Clear the server-side SMS wallet + PIN first, so a school created later with the same code can't inherit them.
  if(hasSmsConfig()){
    try{ await adminSmsCall({purpose:'deleteschool', schoolCode: code}); }
    catch(err){
      if(!confirm(`The school's SMS wallet and PIN could not be cleared on the server:\n${String(err.message||err)}\n\nDelete the school anyway? (If you ever re-use this code, first remove schools/${code}/sms in the Firebase console.)`)) return;
    }
  }
  const ownConfig = DB.schools[code] && DB.schools[code].syncConfig && DB.schools[code].syncConfig.config;
  delete DB.schools[code]; saveDB(DB); removeSchoolFromPlatform(code, ownConfig); renderAdmin();
}
// Lets the admin replace the auto-generated 8-digit school code with one the school
// prefers (e.g. their own registration number or a short name). The code is the key
// everything is stored/looked-up under, so this moves the school's whole record to the
// new key and updates its own .code field — any DOS/HOI or Teacher login link built on
// the OLD code (already shared with the school, or open in someone else's browser right
// now) will stop working and needs to be regenerated/re-shared via "🪪 Credentials".
async function editSchoolCode(oldCode){
  const s = DB.schools[oldCode];
  if(!s) return;
  const input = prompt(`Enter the new school code for "${s.name}".\n\nThis replaces the current code (${oldCode}). Any login link already shared using the old code will stop working — you'll need to share the new one from "🪪 Credentials" afterwards.`, oldCode);
  if(input==null) return; // cancelled
  const newCode = input.trim();
  if(!newCode){ toast('School code cannot be empty','err'); return; }
  if(!/^[A-Za-z0-9_-]+$/.test(newCode)){ toast('School code can only contain letters, numbers, - and _','err'); return; }
  if(newCode===oldCode) return;
  if(DB.schools[newCode]){ toast('That school code is already in use by another school','err'); return; }
  if(!confirm(`Change school code from ${oldCode} to ${newCode}? Existing login links using ${oldCode} will stop working.`)) return;
  // The SMS wallet and PIN are keyed by school code on the server, so they must move with the school.
  if(hasSmsConfig()){
    try{ await adminSmsCall({purpose:'movecode', oldCode, newCode}); }
    catch(err){
      if(!confirm(`The school's SMS balance and PIN could not be moved to the new code:\n${String(err.message||err)}\n\nChange the code anyway? (Its SMS balance and PIN would stay behind on ${oldCode} and the school would need a new PIN and top-up.)`)) return;
    }
  }
  await refreshSchoolFromCloud(oldCode); // pull the school's latest data before moving it to the new code
  const fresh = DB.schools[oldCode];
  const ownConfig = fresh.syncConfig && fresh.syncConfig.config;
  delete DB.schools[oldCode];
  fresh.code = newCode;
  DB.schools[newCode] = fresh;
  saveDB(DB);
  removeSchoolFromPlatform(oldCode, ownConfig);
  pushSchoolDataToPlatform(newCode);
  toast(`School code updated to ${newCode}`);
  renderAdmin();
  showCredentials(newCode);
}

  if(isNaN(days)||days<0){ toast('Enter a valid number','err'); return; }
  await adminEditAndPush(code, fresh=>{
    fresh.trialDays = days;
    fresh.trialEndsAt = fresh.createdAt + days*24*60*60*1000;
    if(fresh.status==='active'){ /* leave paid schools as active regardless of trial math */ }
  });
  toast('Trial period updated'); renderAdmin();
}

function dosAttention(school){
  const editReqs = school.exams.reduce((n,e)=>n+(e.editRequests||[]).filter(r=>r.status==='pending').length,0);
  const awaiting = school.requireApproval
    ? school.exams.filter(e=>e.resultsApproval==='pending' && Object.keys(school.marks[e.id]||{}).length>0).length : 0;
  return {editReqs, awaiting, total: editReqs+awaiting};
}

function copyLinkBox(btn){

  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done, ()=>toast('Could not copy — select the link and copy it manually.','err')); }

/* --- HOI Signature Pad ---
   A single signature, drawn once by the HOI and stored on the school (school.hoiSignature,
   a PNG data URL), stamped onto every learner's report card across every grade — sparing a
   busy HOI from physically signing each printed report by hand. Purely a convenience stamp;
   it carries no cryptographic guarantee and any DOS/HOI account holder can redraw it, same
   as they can already edit the HOI's typed name. */
let sigDrawing = false, sigLastX = 0, sigLastY = 0;
function initHoiSigPad(){
  const canvas = qs('#hoiSigPad');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#123a63';
  // Canvas drawing-buffer size (set via width/height attributes) can differ from its
  // on-screen CSS size, so pointer coordinates are scaled into buffer space here —
  // without this, a signature drawn on a resized/mobile canvas lands in the wrong spot.
  const posFromEvent = evt=>{
    const rect = canvas.getBoundingClientRect();
    const t = evt.touches && evt.touches[0];
    const clientX = t ? t.clientX : evt.clientX, clientY = t ? t.clientY : evt.clientY;
    return {x:(clientX-rect.left)*(canvas.width/rect.width), y:(clientY-rect.top)*(canvas.height/rect.height)};
  };
  const start = evt=>{ evt.preventDefault(); sigDrawing = true; const p = posFromEvent(evt); sigLastX = p.x; sigLastY = p.y; ctx.beginPath(); ctx.arc(p.x,p.y,1.2,0,Math.PI*2); ctx.fillStyle='#123a63'; ctx.fill(); };
  const move = evt=>{
    if(!sigDrawing) return; evt.preventDefault();
    const p = posFromEvent(evt);
    ctx.beginPath(); ctx.moveTo(sigLastX, sigLastY); ctx.lineTo(p.x, p.y); ctx.stroke();
    sigLastX = p.x; sigLastY = p.y;
  };
  const end = ()=>{ sigDrawing = false; };
  canvas.onmousedown = start; canvas.onmousemove = move; canvas.onmouseup = end; canvas.onmouseleave = end;
  window.addEventListener('mouseup', end); window.addEventListener('touchcancel', end);
  canvas.ontouchstart = start; canvas.ontouchmove = move; canvas.ontouchend = end;
}

/* Crops a drawn signature to its ink (plus a small margin). The pad is 600x180 and people
   rarely sign edge-to-edge, so without this the visible strokes float in the middle of a
   big transparent image and never land on the line. */
function trimSignature(dataUrl, cb){
  const im = new Image();
  im.onload = ()=>{
    try{
      const w = im.naturalWidth, h = im.naturalHeight;
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const x = c.getContext('2d'); x.drawImage(im,0,0);
      const d = x.getImageData(0,0,w,h).data;
      let x0=w, y0=h, x1=-1, y1=-1;
      for(let y=0;y<h;y++) for(let xx=0;xx<w;xx++){
        if(d[(y*w+xx)*4+3]>12){ if(xx<x0)x0=xx; if(xx>x1)x1=xx; if(y<y0)y0=y; if(y>y1)y1=y; }
      }
      if(x1<0){ cb(dataUrl); return; }
      const pad = 3;
      x0=Math.max(0,x0-pad); y0=Math.max(0,y0-pad); x1=Math.min(w-1,x1+pad); y1=Math.min(h-1,y1+pad);
      const cw = x1-x0+1, ch = y1-y0+1;
      const o = document.createElement('canvas'); o.width = cw; o.height = ch;
      o.getContext('2d').drawImage(c, x0,y0,cw,ch, 0,0,cw,ch);
      cb(o.toDataURL('image/png'));
    }catch(e){ cb(dataUrl); }
  };
  im.onerror = ()=>cb(dataUrl);
  im.src = dataUrl;
}

  qs('#syncMsg').innerHTML='<div class="msg ok">Connecting…</div>';
  try{
    await initSync(config);

// Creates a grade, files it in the right order, and (unless copyFrom is '') gives it the same
// learning areas and custom grading table as another grade so it isn't left with zero subjects.
// copyFrom: a grade id, 'auto' = the nearest lower grade already in the list, or '' = none.
function createGrade(school, name, copyFrom){
  const cls = {id:uid('cls_'), name};
  school.classes.push(cls); sortClasses(school);
  let src = null;
  if(copyFrom==='auto'){ const i = school.classes.indexOf(cls); src = i>0 ? school.classes[i-1] : null; }
  else if(copyFrom){ src = school.classes.find(c=>c.id===copyFrom) || null; }
  if(src){
    school.learningAreas.forEach(a=>{ if(a.classIds && a.classIds.includes(src.id) && !a.classIds.includes(cls.id)) a.classIds.push(cls.id); });
    if(src.gradingSystem && src.gradingSystem.length) cls.gradingSystem = JSON.parse(JSON.stringify(src.gradingSystem));
  }
  return {cls, src};
}

// Guesses the next grade's name from the current one by incrementing its LAST number —
// "Grade 7" → "Grade 8", "Grade 7 Blue" → "Grade 8 Blue". Just a starting suggestion in
// the promote prompt; the DOS/HOI can type over it with anything they like.
function suggestNextClassName(name){
  const m = name.match(/(\d+)(?!.*\d)/);
  if(!m) return '';
  return name.slice(0,m.index) + (parseInt(m[1],10)+1) + name.slice(m.index+m[1].length);
}
// Moves every learner currently in `classId` into another class — an existing one picked
// by name, or a brand-new one typed in, which is created automatically. This is what lets
// a whole class be promoted to the next grade (Grade 7 → Grade 8) in one action instead of
// re-adding each learner by hand. The class being promoted FROM is deliberately left in
// place afterwards (now with no learners) rather than deleted — its exam history, past
// assessment sheets and report cards all stay exactly as they were, and the DOS/HOI can
// reuse it for next year's intake into that grade or delete it themselves once they're
// sure they're done with it. A newly-created destination class inherits the same learning
// areas (and any custom grading table) the source class had, so it isn't left with zero
// subjects until someone configures it by hand.
function promoteClass(classId){
  const school = currentSchool();
  const cls = school.classes.find(c=>c.id===classId);
  if(!cls) return;
  const learners = school.students.filter(s=>s.classId===classId);
  if(!learners.length){ toast('This grade has no learners to promote','err'); return; }
  const destName = prompt(`Promote all ${learners.length} learner(s) in "${cls.name}" to which grade?\n\nType the name of an EXISTING grade to move them into it, or a brand-new name to create that grade automatically.`, suggestNextClassName(cls.name));
  if(destName===null) return;
  const trimmed = destName.trim();
  if(!trimmed){ toast('Enter a grade name','err'); return; }
  let destCls = school.classes.find(c=>c.name.toLowerCase()===trimmed.toLowerCase());
  if(destCls && destCls.id===classId){ toast('Pick a different grade to promote into','err'); return; }
  const willCreate = !destCls;
  if(!confirm(`Move all ${learners.length} learner(s) from "${cls.name}" into ${willCreate?`a new grade "${trimmed}"`:`"${destCls.name}"`}? Their past exam results and report history stay exactly as they were, filed under "${cls.name}".`)) return;
  if(!destCls){
    destCls = {id:uid('cls_'), name: trimmed};
    school.classes.push(destCls); sortClasses(school);
    school.learningAreas.forEach(a=>{ if(a.classIds && a.classIds.includes(classId) && !a.classIds.includes(destCls.id)) a.classIds.push(destCls.id); });
    if(cls.gradingSystem && cls.gradingSystem.length){ destCls.gradingSystem = JSON.parse(JSON.stringify(cls.gradingSystem)); }
  }
  learners.forEach(s=>{ s.classId = destCls.id; });
  saveDB(DB);
  toast(`${learners.length} learner(s) promoted to "${destCls.name}"${willCreate?' (new grade created)':''}`);
  renderDOS();
}

/* --- Grading System (school-wide default, or customized per class) --- */
// Checks a grading table for the mistakes that silently corrupt every score built on top of
// it: a gap (a percentage no band covers), an overlap (two bands both claim the same
// percentage), a band with Min % > Max %, and duplicate level codes. gradeFor() has no way
// to signal any of this at the moment it happens — a score that falls in a gap just falls
// through to the LAST row in the table, which usually means it's silently mislabelled as the
// worst level, even on a report card. Returns plain-language warning strings; empty = safe.
function gradingIssues(rows){
  const issues = [];
  if(!rows.length){ issues.push('No performance levels defined — every score will show as ungraded.'); return issues; }
  rows.forEach(g=>{
    if(Number(g.min) > Number(g.max)) issues.push(`"${g.level||'(blank)'}" has Min % (${g.min}) greater than Max % (${g.max}).`);
  });
  const codes = rows.map(g=>g.level);
  const dupes = [...new Set(codes.filter((c,i)=>codes.indexOf(c)!==i))];
  if(dupes.length) issues.push(`Duplicate level code(s): ${dupes.join(', ')} — give each level its own code.`);
  const sorted = rows.filter(g=>Number(g.min)<=Number(g.max)).slice().sort((a,b)=>a.min-b.min);
  for(let i=0;i<sorted.length-1;i++){
    const a = sorted[i], b = sorted[i+1];
    if(b.min > a.max+1) issues.push(`Gap between ${a.max}% and ${b.min}%: a score in between (e.g. ${a.max+1}%) won't match any level.`);
    else if(b.min <= a.max) issues.push(`Overlap: "${a.level}" (${a.min}-${a.max}%) and "${b.level}" (${b.min}-${b.max}%) both cover ${b.min}-${Math.min(a.max,b.max)}%.`);
  }
  if(sorted.length){
    if(Number(sorted[0].min) > 0) issues.push(`Scores below ${sorted[0].min}% aren't covered by any level.`);
    if(Number(sorted[sorted.length-1].max) < 100) issues.push(`Scores above ${sorted[sorted.length-1].max}% aren't covered by any level.`);
    for(let i=0;i<sorted.length-1;i++){
      if(Number(sorted[i].points) > Number(sorted[i+1].points)) issues.push(`"${sorted[i].level}" (the lower band) is worth more Points than "${sorted[i+1].level}" (the higher band) — mean points, rankings and badge colours will read backwards.`);
    }
  }
  return issues;
}

  const issues = gradingIssues(rows);
  return `<div class="card"><h2>🎯 Editable Grading / Performance Level System</h2>
  <p class="small">Editing here only affects this grade — others keep the school default.</p>
  ${issues.length ? `<div class="msg err"><b>⚠ ${issues.length} issue${issues.length>1?'s':''} with this grading table:</b>

    <td><input class="lvl-icon-input" value="${escapeHtml(g.icon||'')}" placeholder="e.g. ⭐" maxlength="4" ${cls&&!editingCustom?'disabled':''} onchange="updGrade(${i},'icon',this.value)"></td>
    <td><input type="color" class="lvl-color-input" value="${g.color||'#6b7c8f'}" ${cls&&!editingCustom?'disabled':''} onchange="updGrade(${i},'color',this.value)"></td>
    <td class="lvl-preview">${raBadge(school,cls?cls.id:'',g.level)}</td>
    <td>${(!cls||editingCustom) ? `<button class="danger" onclick="delGrade(${i})">✕</button>` : ''}</td>
  </tr>`).join('')}

// Returns the array currently being edited: the school default, or — once a class has
// been switched to its own custom grading — that class's own gradingSystem array.
function activeGradingArray(school){
  if(gradingClassId){
    const cls = school.classes.find(c=>c.id===gradingClassId);
    if(cls && cls.gradingSystem && cls.gradingSystem.length) return cls.gradingSystem;
  }
  return school.gradingSystem;
}
// Suggests a ready-to-use, full-length remark for a custom grading level based on its level
// code's prefix (EE/ME/AE/BE, with or without a trailing sub-level digit like EE1/EE2) — used
// only to pre-fill a brand-new or freshly-renamed level's remark field; the DOS/HOI can freely
// edit or clear it afterwards from the same table. Returns '' for an unrecognized code.
function suggestRemarkForLevelCode(code){
  const c = String(code||'').trim().toUpperCase();
  const prefix = c.replace(/\d+$/,''); // "EE1" -> "EE", "ME2" -> "ME", "EE" -> "EE"
  const bank = {
    EE: 'An outstanding performance this term. The learner has fully grasped the concepts covered, applies them confidently and independently, and consistently produces work above the standard expected for this level. Keep encouraging this learner with more challenging tasks and opportunities to mentor peers.',
    ME: 'A solid, dependable performance this term. The learner understands and applies most of the concepts covered with only minor gaps, and completes set work with reasonable independence. Continued practice on the more challenging areas will help push this towards an even stronger result next term.',
    AE: 'The learner is making genuine progress but has not yet fully grasped several of the concepts covered this term, often needing guidance to complete tasks correctly. With more consistent practice, closer follow-up at home, and revisiting foundational topics, steady improvement is well within reach.',
    BE: 'The learner is finding this term’s work considerably challenging and has struggled to grasp the core concepts covered so far, even with support. Closer follow-up both at school and at home, extra remedial practice, and revisiting earlier foundational topics are strongly recommended going forward.'
  };
  return bank[prefix] || '';
}
function updGrade(i,field,val){
  const g = activeGradingArray(currentSchool())[i];
  g[field] = (field==='min'||field==='max'||field==='points') ? Number(val) : val;
  // Auto-fill a full remark the moment a level's code is set/changed to a recognized CBC
  // prefix — but only while the remark is still blank, so this never overwrites text the
  // DOS/HOI already typed. Still fully editable afterwards, same as any other level.
  if(field==='level' && !g.remark){
    const suggested = suggestRemarkForLevelCode(val);
    if(suggested) g.remark = suggested;
  }
  saveDB(DB); renderDOS();
}

function filteredStudents(school){

    if(g && s.classId!==g) return false;
    if(stuFilterGender){ if(stuFilterGender==='none'){ if(s.gender==='M'||s.gender==='F') return false; } else if(s.gender!==stuFilterGender) return false; }

    return true;
  }).sort((a,b)=>{
    const ca = school.classes.find(c=>c.id===a.classId), cb = school.classes.find(c=>c.id===b.classId);

    return admOrName(a,b);
  });

// Move one learner to a different grade. Their past exam marks stay with the exams they sat
// (see studentsForExam), so old sheets/reports still show them under the old grade.
function updStudentClass(id, newClassId, selectEl){
  const school = currentSchool(); const s = school.students.find(x=>x.id===id); if(!s) return;
  const to = school.classes.find(c=>c.id===newClassId), from = school.classes.find(c=>c.id===s.classId);
  if(!to || newClassId===s.classId){ if(selectEl) selectEl.value = s.classId||''; return; }
  const hasHistory = from && school.exams.some(e=>e.classId===from.id && (school.marks[e.id]||{})[s.id]);
  const msg = `Move ${s.name} from ${from?from.name:'no grade'} to ${to.name}?`
    + (hasHistory ? `\n\nTheir past results stay filed under ${from.name} and still appear on that grade's sheets and reports.` : '')
    + `\n\nFrom now on they are marked with ${to.name}.`;
  if(!confirm(msg)){ if(selectEl) selectEl.value = s.classId||''; return; }
  s.classId = newClassId; saveDB(DB);
  toast(`${s.name} moved to ${to.name}`); renderStudentRows();
}
function addStudent(){
  const adm = qs('#stuAdm').value.trim(), name = qs('#stuName').value.trim(), classId = qs('#stuClass').value;

  const parentPhone = qs('#stuPhone') ? qs('#stuPhone').value.trim() : '';
  const gender = normGender(qs('#stuGender') ? qs('#stuGender').value : '');
  if(!name||!classId){ toast('Enter at least the learner name and grade','err'); return; }
  const school = currentSchool();
  // Uniqueness only matters when an admission number was actually given — multiple
  // learners are allowed to have no admission number at the same time.
  if(adm && school.students.some(s=>s.adm===adm)){ toast('Admission number already exists','err'); return; }
  if(assessNo && school.students.some(s=>s.assessNo===assessNo)){ toast('Assessment number already exists','err'); return; }
  school.students.push({id:uid('stu_'), adm, assessNo, name: name.replace(/\s+/g,' '), classId, gender, parentPhone, parentPin: genParentPin()}); saveDB(DB); renderDOS();

// Lets HOI/DOS correct a learner's admission number directly from the Learners table
// (e.g. it was mistyped or a number gets assigned later) without removing and re-adding
// the learner — which would otherwise lose their marks history (marks are keyed on the
// learner's internal id, not the admission number, so this is safe).
function updStudentAdm(id, val, inputEl){
  const adm = val.trim();
  const school = currentSchool();
  const s = school.students.find(x=>x.id===id);
  if(!s) return;
  if(adm && school.students.some(x=>x.id!==id && x.adm===adm)){
    toast('Admission number already exists','err');
    if(inputEl) inputEl.value = s.adm||''; // revert the field to the last saved value
    return;
  }
  s.adm = adm; saveDB(DB); toast('Admission number updated');
}
// Same idea for the KNEC Assessment Number (used for KPSEA/KJSEA etc.): editable in place, and
// safe to change later because marks are keyed on the learner's internal id.
function updStudentAssessNo(id, val, inputEl){
  const an = val.trim();
  const school = currentSchool();
  const s = school.students.find(x=>x.id===id);
  if(!s) return;
  if(an && school.students.some(x=>x.id!==id && x.assessNo===an)){
    toast('Assessment number already exists','err');
    if(inputEl) inputEl.value = s.assessNo||'';
    return;
  }
  s.assessNo = an; saveDB(DB); toast(an ? 'Assessment number updated' : 'Assessment number cleared');
}
// Lets HOI/DOS set a specific Parent PIN by hand (e.g. the school wants something the
// parent will find memorable) instead of the random one generated at creation.
function updStudentPin(id, val, inputEl){
  const pin = val.trim();
  const school = currentSchool();
  const s = school.students.find(x=>x.id===id);
  if(!s) return;
  s.parentPin = pin; if(inputEl) inputEl.value = pin;
  saveDB(DB); toast(pin ? 'Parent PIN updated' : 'Parent PIN cleared — this learner cannot use the Parent Portal until a new PIN is set');
}
// Replaces a learner's PIN with a fresh random one — e.g. if it's been shared too widely,
// or the parent forgot it and the school wants to reissue rather than look up the old one.
// The old PIN stops working the moment this saves, so this should only be done right before
// handing the new one to the parent.
function regenStudentPin(id){
  const school = currentSchool();
  const s = school.students.find(x=>x.id===id);
  if(!s) return;
  if(!confirm(`Generate a new Parent PIN for ${s.name}? Their current PIN will stop working immediately.`)) return;
  s.parentPin = genParentPin();
  saveDB(DB); renderStudentRows();
  toast(`New Parent PIN for ${s.name}: ${s.parentPin}`);
}
// One-time cleanup for schools that had learners before the Parent PIN feature existed:
// fills in a random PIN for every learner who doesn't have one yet, without touching
// anyone who already has a PIN issued (so nothing already handed to a parent changes).
function fillMissingParentPins(){
  const school = currentSchool();
  const missing = school.students.filter(s=>!s.parentPin);
  if(!missing.length){ toast('Every learner already has a Parent PIN'); return; }
  if(!confirm(`Generate a Parent PIN for the ${missing.length} learner(s) who don't have one yet? You'll need to hand each one to that learner's parent.`)) return;
  missing.forEach(s=>{ s.parentPin = genParentPin(); });
  saveDB(DB); renderStudentRows();
  toast(`Generated ${missing.length} new Parent PIN(s)`);
}
function bulkAddStudents(){
  const classId = qs('#stuClass').value; const school = currentSchool();
  const lines = qs('#bulkStu').value.split('\n').map(l=>l.trim()).filter(Boolean);
  const hasAssessCol = !!(qs('#bulkHasAssess') && qs('#bulkHasAssess').checked);
  let added=0;
  lines.forEach(l=>{
    let adm='', name='', parentPhone='', gender='', assessNo='';
    if(l.includes(',')){
      const parts = l.split(',').map(x=>x.trim());
      // Optional 2nd column: KNEC Assessment No. (only when the tick-box is on, so existing formats are unaffected).
      if(hasAssessCol && parts.length>=3){ assessNo = parts[1]; parts.splice(1,1); }
      // A Boy/Girl (or M/F) cell anywhere after the first column is read as the gender.
      for(let k=1;k<parts.length;k++){ const gg = normGender(parts[k]); if(gg){ gender = gg; parts.splice(k,1); break; } }
      if(parts.length===1){ name = parts[0]; }
      else {
        adm = parts[0];
        // Name is everything between the admission no. and a trailing phone column (if any),
        // rejoined with commas so a name that itself contains a comma still survives intact.
        const nameParts = parts.length>2 ? parts.slice(1,-1) : parts.slice(1);
        name = nameParts.join(',').trim();
        parentPhone = parts.length>2 ? parts[parts.length-1].trim() : '';
      }
    } else {
      name = l; // no comma at all → treat the whole line as a name with no admission number
    }
    if(!name) return;
    if(adm && school.students.some(s=>s.adm===adm)) return; // skip duplicate admission numbers
    if(assessNo && school.students.some(s=>s.assessNo===assessNo)) assessNo = ''; // duplicate assessment no.: still add the learner, just without it
    school.students.push({id:uid('stu_'), adm, assessNo, name, classId, gender, parentPhone, parentPin: genParentPin()}); added++;
  });
  saveDB(DB); toast(added+' learners added'); renderDOS();
}
function delStudent(id){
  if(!confirm('Remove this learner?')) return;
  const school = currentSchool(); school.students = school.students.filter(s=>s.id!==id); saveDB(DB); renderDOS();
}

/* Per-exam management card: entry-closing period, results approval, and any
   pending teacher edit requests waiting on a DOS/HOI decision. */
// Builds the per-learner remarks-editing table for one exam — a personalized override
// stored in school.remarks[examId][sid]. Left blank, a learner's report falls back to the
// auto remark tied to whichever grading level their overall mean % lands in (see
// buildReportHTML/gradeFor) — so nothing needs to be typed until someone wants to add
// something specific to that child. Shared by the DOS/HOI's Exams tab and Class Teacher Tools.
function remarksTableHTML(school, examId){
  const exam = school.exams.find(e=>e.id===examId);
  if(!exam) return '<p class="small">Exam not found.</p>';
  const learners = studentsForExam(school, exam);
  if(!learners.length) return '<p class="small">No learners in this grade.</p>';
  const areas = areasForClass(school, exam.classId);
  const marksForExam = school.marks[examId] || {};
  return `<table><tr><th>Adm No.</th><th>Name</th><th>Auto Level</th><th>Remark for their report (leave blank to use the auto remark for their level)</th></tr>
  ${learners.map(s=>{
    let sumPct=0, n=0;
    areas.forEach(a=>{ const max=exam.maxMarksByArea[a.id]??100; const sc=(marksForExam[s.id]||{})[a.id]; if(sc!=null){ sumPct+=pctOf(sc,max); n++; } });
    const meanPct = areas.length ? sumPct/areas.length : 0;
    const g = gradeFor(school, meanPct, exam.classId);
    const custom = (school.remarks[examId]||{})[s.id] || '';
    return `<tr>
      <td>${s.adm?escapeHtml(s.adm):'—'}</td>
      <td style="text-align:left">${escapeHtml(s.name)}</td>
      <td>${n?raBadge(school,exam.classId,g.level):'—'}</td>
      <td><textarea rows="2" style="width:100%;min-width:220px" placeholder="${escapeHtml(g.remark)}" onchange="setLearnerRemark('${examId}','${s.id}',this.value)">${escapeHtml(custom)}</textarea></td>
    </tr>`;
  }).join('')}
  </table>`;
}
// Guard mirrors teacherDenied's shape, but writing a remark is treated as a base Class
// Teacher duty — available the moment a teacher is listed under classTeacherOf for that
// grade, independent of the separate canApproveResults/canApproveEditRequests/canManageEntry
// switches (those gate exam sign-off, not report-card remarks).
function setLearnerRemark(examId, sid, value){
  const school = currentSchool();
  const exam = school.exams.find(e=>e.id===examId);
  if(!exam) return;
  if(session && session.role==='teacher'){
    const t = currentTeacher();
    if(!t || !(t.classTeacherOf||[]).includes(exam.classId)){
      toast("You don't have access to that — ask your DOS/HOI","err");
      return;
    }
  }
  const text = value.trim();
  school.remarks[examId] = school.remarks[examId] || {};
  if(text) school.remarks[examId][sid] = text; else delete school.remarks[examId][sid];
  saveDB(DB);
}

function isExamClosed(e){
  if(e.closed) return true;
  if(e.closingDate && todayISO() > e.closingDate) return true;
  return false;
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function setExamClosingDate(id,val){
  const school = currentSchool(); const e = school.exams.find(x=>x.id===id);
  e.closingDate = val || ''; touchExam(e); saveDB(DB); renderDOS();
}
// Term-closing / next-term-opening dates shown on the printed report card. Purely
// informational — unlike closingDate above, these never affect entry locking.
function setExamTermDate(id, field, val){
  const school = currentSchool(); const e = school.exams.find(x=>x.id===id);
  if(!e) return;
  if(field==='termCloseDate') e.termCloseDate = val || '';
  else if(field==='nextTermDate') e.nextTermDate = val || '';
  touchExam(e); saveDB(DB);
}
// Total number of school days this term counted against — the denominator for every
// learner's attendance shown on their report card for this exam.
function setExamTotalDays(id, val){
  const school = currentSchool(); const e = school.exams.find(x=>x.id===id);
  if(!e) return;
  e.totalDays = Math.max(0, Number(val)||0); touchExam(e); saveDB(DB);
}
// Days a given learner was present for this exam's term. Stored separately from marks
// (school.attendance, not school.marks) since it isn't graded and shouldn't touch position/mean.
function setAttendance(examId, sid, val){
  const school = currentSchool(); const e = school.exams.find(x=>x.id===examId);
  if(!e) return;
  const days = Math.max(0, Math.min(e.totalDays||9999, Number(val)||0));
  school.attendance[examId] = school.attendance[examId] || {};
  if(val===''){ delete school.attendance[examId][sid]; } else { school.attendance[examId][sid] = days; }
  saveDB(DB);
}
function closeExamNow(id){
  const school = currentSchool(); const e = school.exams.find(x=>x.id===id);
  if(classTeacherDenied('canManageEntry', e.classId)) return;
  e.closed = true; touchExam(e); saveDB(DB); toast('Entry period closed for '+e.name); renderCurrentPortal();
}
// Reopening entry means the recorded marks are open to change again: any earlier approval no
// longer covers them, and requests still waiting on a decision are now moot (the teacher can
// edit directly) — leaving them pending could later overwrite fresher marks with stale values.
function supersedePendingRequests(e, note){
  (e.editRequests||[]).forEach(r=>{
    if(r.status==='pending'){ r.status='rejected'; r.note=note; r.decidedAt=new Date().toISOString(); r.decidedBy='System'; }
  });
}
function reopenExam(id){
  const school = currentSchool(); const e = school.exams.find(x=>x.id===id);
  if(classTeacherDenied('canManageEntry', e.classId)) return;
  e.closed = false; e.closingDate = '';
  if(e.resultsApproval==='approved'){ e.resultsApproval = 'pending'; e.approvedBy = ''; e.approvalAt = ''; }
  supersedePendingRequests(e, 'Entry was reopened — edit the mark directly.');
  touchExam(e); saveDB(DB); toast('Entry period reopened for '+e.name); renderCurrentPortal();
}
// Shows/hides this one exam in the Parent Portal, independent of its entry-closed state and
// its Results Approval — a DOS/HOI-only control (this exam card only ever renders in the DOS
// Exams tab), so a teacher granted other exam permissions still can't change what parents see.
function setExamParentVisible(id, visible){
  const school = currentSchool(); const e = school.exams.find(x=>x.id===id);
  if(!e) return;
  e.parentVisible = !!visible;
  touchExam(e); saveDB(DB);
  toast(visible ? 'This exam is now visible to parents' : 'This exam is now hidden from parents');
  renderCurrentPortal();
}
function dosDisplayName(school){
  const rec = (school.dos||[]).find(d=>d.id===(session&&session.userId));
  return (rec && rec.name) || school.hoiName || 'DOS/HOI';
}
// Name recorded against an approval/decision: the signed-in DOS/HOI's name, or a class
// teacher's name with a label, so it's always clear who actually acted — matters once
// class teachers can approve/disapprove results themselves, not just the DOS/HOI.
function approverDisplayName(school){
  if(session && session.role==='teacher'){
    const t = currentTeacher();
    return t ? t.name+' (Class Teacher)' : 'Class Teacher';
  }
  return dosDisplayName(school);
}
// Re-draws whichever portal is currently on screen after an action — a DOS/HOI session
// re-renders the DOS screen, a class-teacher session re-renders their own Teacher screen.
function renderCurrentPortal(){
  if(session && session.role==='teacher') renderTeacher(); else renderDOS();
}
// True only when a teacher session holds `perm` (canApproveResults / canApproveEditRequests /
// canManageEntry) AND is listed as Class Teacher for classId. False for a DOS/HOI/Admin/Parent
// session (they're never blocked by this) and false for any teacher who isn't that grade's
// class teacher, however capable they are for their own subject.
function classTeacherMay(perm, classId){
  if(!session || session.role!=='teacher') return true;
  const t = currentTeacher(); if(!t) return false;
  if(!Array.isArray(t.classTeacherOf) || !t.classTeacherOf.includes(classId)) return false;
  return t[perm]===true;
}
function classTeacherDenied(perm, classId){
  if(!session || session.role!=='teacher') return false;
  if(classTeacherMay(perm, classId)) return false;
  toast("You don't have access to that — ask your DOS/HOI","err");
  return true;
}
function approveExamResults(id){
  const school = currentSchool(); const e = school.exams.find(x=>x.id===id);
  if(classTeacherDenied('canApproveResults', e.classId)) return;
  if((e.editRequests||[]).some(r=>r.status==='pending')){ toast('Resolve the pending edit requests first','err'); return; }
  const c = examCompletion(school, e), missing = c.total - c.filled;
  const msg = (missing>0 ? `⚠ ${missing} mark(s) are still missing (${c.filled} of ${c.total} entered).\n\n` : '')
    + `Approve results for "${e.name}"?\n\nEntry will be closed so the approved marks are locked — teachers can then only send edit requests for you to approve.`;
  if(!confirm(msg)) return;
  e.resultsApproval = 'approved'; e.approvalNote = '';
  e.approvedBy = approverDisplayName(school); e.approvalAt = new Date().toISOString();
  e.closed = true;
  touchExam(e); saveDB(DB); toast('Results approved for '+e.name); renderCurrentPortal();
}
function disapproveExamResults(id){
  const school = currentSchool(); const e = school.exams.find(x=>x.id===id);
  if(classTeacherDenied('canApproveResults', e.classId)) return;
  const note = prompt(`Why are you disapproving "${e.name}"? Teachers will see this reason and entry will reopen so they can correct it:`);
  if(note===null) return;
  if(!note.trim()){ toast('Please give a short reason so teachers know what to fix','err'); return; }
  e.resultsApproval = 'disapproved'; e.approvalNote = note.trim();
  e.approvedBy = ''; e.approvalAt = new Date().toISOString();
  e.closed = false; e.closingDate = '';
  supersedePendingRequests(e, 'Results were disapproved and entry reopened — edit the mark directly.');
  touchExam(e); saveDB(DB);
  toast('Results disapproved — entry reopened for '+e.name); renderCurrentPortal();
}
function approveEditRequest(examId,reqId){
  const school = currentSchool(); const e = school.exams.find(x=>x.id===examId);
  if(classTeacherDenied('canApproveEditRequests', e.classId)) return;
  const req = (e.editRequests||[]).find(r=>r.id===reqId); if(!req || req.status!=='pending') return;
  school.marks[examId] = school.marks[examId] || {};
  school.marks[examId][req.sid] = school.marks[examId][req.sid] || {};
  school.marks[examId][req.sid][req.areaId] = req.newVal;
  req.status = 'approved'; req.decidedAt = new Date().toISOString(); req.decidedBy = approverDisplayName(school);
  // The marks changed, so any earlier results approval no longer covers them.
  if(e.resultsApproval==='approved'){ e.resultsApproval = 'pending'; e.approvedBy = ''; e.approvalAt = ''; }
  touchExam(e);
  saveDB(DB); pushMarkToCloud(school.code, examId, req.sid, req.areaId, req.newVal);
  toast('Edit approved & applied'); renderCurrentPortal();
}
function rejectEditRequest(examId,reqId){
  const school = currentSchool(); const e = school.exams.find(x=>x.id===examId);
  if(classTeacherDenied('canApproveEditRequests', e.classId)) return;
  const req = (e.editRequests||[]).find(r=>r.id===reqId); if(!req || req.status!=='pending') return;
  const note = prompt('Reason for rejecting (optional — the teacher will see it):');
  if(note===null) return;
  req.status = 'rejected'; req.note = note.trim(); req.decidedAt = new Date().toISOString(); req.decidedBy = approverDisplayName(school);
  touchExam(e); saveDB(DB); toast('Edit request rejected','err'); renderCurrentPortal();
}

  return areas.map(a=>`<div><label>${escapeHtml(a.name)}</label><input type="number" class="examMax" min="1" data-area="${a.id}" value="100"></div>`).join('')
    || '<p class="small">No learning areas assigned to this grade yet — add some in the Learning Areas tab.</p>';

function addExam(){
  const name = qs('#exName').value.trim(), term = qs('#exTerm').value, year = Number(qs('#exYear').value), classId = qs('#exClass').value;
  if(!name||!classId){ toast('Fill exam name & grade','err'); return; }
  const school = currentSchool();
  // A grade with no learning areas ticked yet would otherwise create an exam nobody can
  // ever enter a mark for — nothing downstream (marks grid, reports, sheets) has anything
  // to show, and it's easy to miss why until much later.
  if(!areasForClass(school, classId).length){ toast('This grade has no learning areas assigned yet — add some in the Learning Areas tab first','err'); return; }
  // Re-submitting the form (a slow connection, an accidental double-click) used to silently
  // create a second identical exam with its own empty marks — teachers then don't know which
  // one to enter into, and reports/analysis double-count the grade. Doesn't block a genuine
  // resit under the same name; just makes sure it's on purpose.
  const dup = school.exams.some(x=>x.classId===classId && x.term===term && x.year===year && x.name.trim().toLowerCase()===name.toLowerCase());
  if(dup && !confirm(`An exam named "${name}" already exists for this grade in ${term} ${year}.\n\nCreate another one anyway?`)) return;
  const maxMarksByArea = {};
  qsa('.examMax').forEach(inp=> maxMarksByArea[inp.dataset.area] = Math.max(1, Number(inp.value)||100));
  school.exams.push({id:uid('ex_'), name, term, year, classId, maxMarksByArea, date:new Date().toISOString(),
    closed:false, closingDate:'', editRequests:[], resultsApproval:'pending',
    termCloseDate:'', nextTermDate:'', totalDays:0, parentVisible:true});
  saveDB(DB); renderDOS();
}
// Corrects the exam's own name/term/year after creation — without this, fixing a typo meant
// deleting the exam (which also deletes every recorded mark for it) and starting over.
function renameExam(id,field,val){
  const school = currentSchool(); const e = school.exams.find(x=>x.id===id);
  if(field==='name'){
    const v = val.trim();
    if(!v){ toast('Exam name cannot be empty','err'); renderDOS(); return; }
    e.name = v;
  } else if(field==='term'){
    e.term = val;
  } else if(field==='year'){
    const y = Number(val);
    if(!y){ toast('Enter a valid year','err'); renderDOS(); return; }
    e.year = y;
  }
  touchExam(e); saveDB(DB); renderDOS();
}
// The fix for the "(editable by DOS/HOI in the Exams tab)" note shown next to Max Marks on
// every marks-entry and marks-review screen — until now there was nowhere to actually do
// that editing. Existing recorded scores are left exactly as entered; only the max they're
// scored/graded against changes, so lowering it can push a learner's % above 100 until their
// score is corrected too (the marks grid still caps new entries at the current max).
function updExamMaxMarks(examId,areaId,val){
  const school = currentSchool(); const e = school.exams.find(x=>x.id===examId);
  let max = Number(val);
  if(!max || max<1) max = 1;
  e.maxMarksByArea[areaId] = max;
  touchExam(e); saveDB(DB); renderDOS();
}
function delExam(id){
  const school = currentSchool(); const e = school.exams.find(x=>x.id===id);
  const warn = (e && e.resultsApproval==='approved') ? '\n\n⚠ This exam\'s results were already approved — deleting it permanently removes those official marks for every learner.' : '';
  if(!confirm('Delete this exam and its recorded marks?'+warn)) return;
  school.exams = school.exams.filter(x=>x.id!==id); delete school.marks[id]; saveDB(DB); renderDOS();
}
