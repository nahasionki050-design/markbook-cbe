// Sends real SMS via a Cloud Function (see GO_LIVE.md) that holds the Africa's Talking
// API key server-side. Each school pays for its own messages out of a prepaid credit
// wallet (1 credit = 1 SMS segment) topped up by the platform admin — see Admin → 💬 SMS
// Credits. Nothing here ever sees or stores the real API key.


/* ---------- SMS balance: server-owned, read-only in the browser ----------
   The wallet lives at schools/{code}/sms/credits in the shared platform database. Database
   rules let any signed-in client READ it but nobody WRITE it; only the Vercel function
   (Admin SDK) changes it — on send, refund, and admin top-up. school.smsCredits is just a
   display cache of that node. It is never pushed to or merged from the cloud school blob. */
let _smsDbPromise = null;
function platformSmsDb(){
  if(!hasPlatformConfig()) return Promise.reject(new Error('No shared database configured'));
  if(_smsDbPromise) return _smsDbPromise;
  _smsDbPromise = new Promise((resolve, reject)=>{
    loadFirebaseAuthSdk(()=>{
      try{
        const app = firebase.apps.find(a=>a.name==='cbcPlatformSms') || firebase.initializeApp(window.PLATFORM_FIREBASE_CONFIG, 'cbcPlatformSms');
        const auth = app.auth(), db = app.database();
        if(auth.currentUser){ resolve(db); return; }
        auth.signInAnonymously().then(()=>resolve(db)).catch(reject);
      }catch(e){ reject(e); }
    });
  }).catch(e=>{ _smsDbPromise = null; throw e; });
  return _smsDbPromise;
}
const smsBalWatch = {};   // schoolCode -> firebase ref being watched
const smsPinSet = {};     // schoolCode -> true/false, whether the admin has issued an SMS PIN (the PIN itself is never readable)
const smsPinMem = {};     // schoolCode -> PIN typed this session. Memory only: never saved, never synced; cleared on logout.
function paintSmsBalance(code, v){
  document.querySelectorAll('[data-smsbal="'+code+'"]').forEach(el=>{ el.textContent = v; });
  const price = DB.settings.smsPricePerCredit||0;
  document.querySelectorAll('[data-smskes="'+code+'"]').forEach(el=>{ el.textContent = price ? ' (≈ KES '+(v*price).toFixed(0)+')' : ''; });
  document.querySelectorAll('[data-smslow="'+code+'"]').forEach(el=>{ el.style.display = v < 20 ? '' : 'none'; });
}
function paintSmsPinStatus(code){
  const on = smsPinSet[code]===true;
  document.querySelectorAll('[data-smspin="'+code+'"]').forEach(el=>{ el.textContent = on ? '✅ Issued' : '⚠ Not issued'; });
  document.querySelectorAll('[data-smspinwarn="'+code+'"]').forEach(el=>{ el.style.display = on ? 'none' : ''; });
}
async function watchSmsBalances(codes){
  if(!hasSmsConfig()) return;
  let db;
  try{ db = await platformSmsDb(); }catch(e){ console.warn('SMS balance unavailable', e); return; }
  codes.forEach(code=>{
    if(smsBalWatch[code]) return;
    const ref = db.ref('schools/'+code+'/sms');
    smsBalWatch[code] = ref;
    ref.on('value', snap=>{
      const node = snap.val() || {};
      const v = Number(node.credits)||0;
      const sc = DB.schools[code];
      if(sc) sc.smsCredits = v;             // in-memory display cache only; deliberately not saved/pushed
      smsPinSet[code] = !!node.pinSet;
      paintSmsBalance(code, v); paintSmsPinStatus(code);
    }, err=>{ console.warn('SMS balance listener failed', err); delete smsBalWatch[code]; });
  });
}
// Admin-only: asks the server to add credit. Needs the cloud admin sign-in (same as Send Test SMS).
// topupId makes the call idempotent — approving the same request twice can never credit twice.
async function adminSmsCall(payload){
  const fbUser = (typeof fbAdminAuth!=='undefined' && fbAdminAuth && fbAdminAuth.currentUser) || null;
  if(!fbUser) throw new Error('Sign in with your synced cloud admin account first (Admin → ☁️ Cloud Admin Account). This can only be done through the server.');
  const idToken = await fbUser.getIdToken();
  const res = await fetch(window.PLATFORM_SMS_ENDPOINT, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(Object.assign({idToken}, payload))
  });
  let data = null; try{ data = await res.json(); }catch(_){}
  if(!res.ok || !data || !data.ok) throw new Error((data && data.error) || ('HTTP '+res.status));
  return data;
}
async function serverTopUp(code, credits, note, topupId){
  return adminSmsCall({purpose:'topup', schoolCode: code, credits, topupId, note: note||''});
}

/* ---------- Admin: pricing, payment instructions, top-ups, test SMS ---------- */
// The simplest possible payment method for schools in this context: no card/payment-
// gateway integration at all. The admin sets a price-per-credit and free-text payment
// instructions (typically an M-Pesa Paybill/Till number) here; a school pays that number
// directly and submits what they paid + their M-Pesa code from their own SMS tab; the
// admin approves it with one click, which credits the wallet and logs it. Everything
// below is scoped to the platform admin dashboard.
function tplSmsAdmin(){
  const schools = Object.values(DB.schools);
  setTimeout(()=>watchSmsBalances(schools.map(x=>x.code)), 0);   // live server-side balances
  const price = DB.settings.smsPricePerCredit||0;

  schools.forEach(s=>{ (s.smsTopupRequests||[]).forEach(r=>{ if(r.status==='pending') pending.push({school:s, req:r}); }); });
  pending.sort((a,b)=>a.req.ts-b.req.ts);
  return `
    <h2>💬 SMS Credits &amp; Payment</h2>
    <p class="small">Schools pay you directly (e.g. M-Pesa Paybill/Till) — there's no in-app card payment to set up. Set the price and payment instructions below; when a school tells you they've paid, approve their request to credit their wallet, or top up manually any time.</p>
    <div class="row">
      <div><label>Price per SMS Credit (KES)</label><input id="smsPriceKES" type="number" min="0" step="0.1" value="${price}"></div>
    </div>
    <label>Payment instructions shown to schools</label>
    <textarea id="smsPayInstructions" rows="3" placeholder="e.g. Pay via M-Pesa Paybill 400200, Account Number = your School Code. Then submit a Top-up Request from your SMS tab with the M-Pesa code.">${escapeHtml(DB.settings.smsPaymentInstructions||'')}</textarea>
    <div class="flexbtns">
      <button onclick="saveSmsAdminSettings()">💾 Save Pricing &amp; Instructions</button>
      ${hasSmsConfig()?`<button class="ghost" onclick="sendTestSmsPrompt()">📱 Send Test SMS</button>`:`<span class="small" style="align-self:center">⚠ Cloud Function not configured yet — see GO_LIVE.md, then this tab (and Test SMS) unlocks.</span>`}
    </div>
    <div id="smsAdminMsg"></div>
    ${pending.length?`
    <h3 style="margin-top:18px;color:var(--navy)">⏳ Pending Top-up Requests (${pending.length})</h3>
    <table><tr><th>School</th><th>When</th><th>Amount Paid</th><th>M-Pesa Code</th><th>Credits</th><th>Note</th><th>Action</th></tr>
    ${pending.map(({school:s,req:r})=>`<tr>
      <td>${escapeHtml(s.name)}<br><span class="small">${s.code}</span></td>
      <td>${new Date(r.ts).toLocaleString()}</td>
      <td>KES ${r.amountPaid}</td>
      <td>${escapeHtml(r.mpesaCode||'-')}</td>
      <td>${r.credits}</td>
      <td class="small">${escapeHtml(r.note||'')}</td>
      <td><button onclick="approveSmsTopupRequest('${s.code}','${r.id}')">✅ Approve</button> <button class="danger" onclick="rejectSmsTopupRequest('${s.code}','${r.id}')">✖ Reject</button></td>
    </tr>`).join('')}
    </table>`:''}
    <h3 style="margin-top:18px;color:var(--navy)">🏫 School Balances</h3>
    <table><tr><th>School</th><th>Balance</th><th>SMS PIN</th><th>Top Up</th><th>History</th></tr>
    ${schools.map(s=>`<tr>
      <td>${escapeHtml(s.name)}<br><span class="small">${s.code}</span></td>
      <td style="font-weight:700" data-smsbal="${s.code}">${s.smsCredits||0}</td>
      <td><span class="small" data-smspin="${s.code}">${smsPinSet[s.code]===true?'✅ Issued':smsPinSet[s.code]===false?'⚠ Not issued':'…'}</span><br><button class="ghost" onclick="issueSmsPin('${s.code}')">🔐 Issue / Reset PIN</button></td>
      <td>
        <button class="ghost" onclick="quickTopUpSms('${s.code}',50)">+50</button>
        <button class="ghost" onclick="quickTopUpSms('${s.code}',100)">+100</button>
        <button class="ghost" onclick="quickTopUpSms('${s.code}',500)">+500</button>
        <button class="ghost" onclick="customTopUpSms('${s.code}')">Custom…</button>
      </td>
      <td><button class="ghost" onclick="showSmsTopupHistory('${s.code}')">📜 View</button></td>
    </tr>`).join('') || '<tr><td colspan="5" class="small">No schools yet.</td></tr>'}
    </table>
    <div id="smsHistoryArea"></div>`;
}
function saveSmsAdminSettings(){
  const price = Number(qs('#smsPriceKES').value);
  if(isNaN(price)||price<0){ toast('Enter a valid price','err'); return; }
  DB.settings.smsPricePerCredit = price;
  DB.settings.smsPaymentInstructions = qs('#smsPayInstructions').value.trim();
  saveDB(DB);
  qs('#smsAdminMsg').innerHTML = '<div class="msg ok">SMS pricing &amp; payment instructions saved.</div>';
}
// Credit is changed ONLY by the server (purpose:'topup'); adminEditAndPush afterwards just
// records the human-readable history line on the school. topupId = idempotency key.
// The SMS PIN is what authorises a school to spend its credit. The server generates it, keeps only a
// scrambled (scrypt) copy where no browser can read it, and returns the real PIN exactly once — here.
async function issueSmsPin(code){
  const sc = DB.schools[code]; if(!sc) return;
  const had = smsPinSet[code]===true;
  if(!confirm(had ? `Issue a NEW SMS PIN for ${sc.name}? The current PIN stops working immediately.` : `Issue an SMS PIN for ${sc.name}?`)) return;
  try{
    const r = await adminSmsCall({purpose:'setpin', schoolCode: code});
    smsPinSet[code] = true; paintSmsPinStatus(code);
    const box = qs('#smsAdminMsg');
    if(box){
      box.innerHTML = `<div class="msg ok"><b>SMS PIN for ${escapeHtml(sc.name)} (${escapeHtml(code)}):</b> <span style="font-size:24px;letter-spacing:5px;font-weight:700;margin-left:8px">${escapeHtml(r.pin)}</span><br><span class="small">Shown only this once — the server keeps just a scrambled copy, so it can't be looked up later. Give it to the school's DOS/HOI only (not teachers or parents). If it's lost, issue a new one.</span></div>`;
      box.scrollIntoView({behavior:'smooth', block:'center'});
    }
  }catch(err){ toast('Could not issue PIN: '+String(err.message||err),'err'); }
}
async function applySmsTopup(code, credits, note, topupId, historyNote){
  try{
    await serverTopUp(code, credits, note, topupId);
  }catch(err){
    toast('Top-up failed: '+String(err.message||err),'err'); return false;
  }
  try{
    await adminEditAndPush(code, s=>{
      s.smsTopups = s.smsTopups||[];
      if(!s.smsTopups.some(t=>t.id===topupId)) s.smsTopups.push({id:topupId, ts:Date.now(), credits, note: historyNote});
    });
  }catch(e){ console.warn('Credit was added, but the history line could not be saved', e); }
  return true;
}
async function quickTopUpSms(code, credits){
  if(!confirm(`Add ${credits} credit(s) to this school's SMS balance?`)) return;
  if(await applySmsTopup(code, credits, 'Manual top-up by admin', uid('top_')+Date.now().toString(36), 'Manual top-up by admin')){
    toast(`+${credits} credit(s) added`); renderAdmin();
  }
}
async function customTopUpSms(code){
  const input = prompt('How many credits to add?');
  if(input==null) return;
  const credits = Number(input);
  if(!Number.isInteger(credits)||credits<=0){ toast('Enter a whole number greater than 0','err'); return; }
  const note = prompt('Optional note (e.g. M-Pesa code, amount paid):','') || '';
  if(await applySmsTopup(code, credits, note, uid('top_')+Date.now().toString(36), note)){
    toast(`+${credits} credit(s) added`); renderAdmin();
  }
}
function showSmsTopupHistory(code){
  const s = DB.schools[code]; if(!s) return;
  const rows = (s.smsTopups||[]).slice().reverse();
  qs('#smsHistoryArea').innerHTML = `<div class="card" style="background:#f7f9fc">
    <h2 style="margin-top:0">📜 Top-up History — ${escapeHtml(s.name)}</h2>
    <table><tr><th>When</th><th>Credits Added</th><th>Note</th></tr>
    ${rows.map(t=>`<tr><td>${new Date(t.ts).toLocaleString()}</td><td>+${t.credits}</td><td class="small">${escapeHtml(t.note||'')}</td></tr>`).join('') || '<tr><td colspan="3" class="small">No top-ups yet.</td></tr>'}
    </table>
  </div>`;
}
async function approveSmsTopupRequest(code, reqId){
  const school = DB.schools[code];
  const preview = school && (school.smsTopupRequests||[]).find(r=>r.id===reqId);
  if(!preview){ toast('Request not found','err'); return; }
  if(preview.status!=='pending'){ toast('That request was already handled','err'); return; }
  if(!Number.isInteger(preview.credits) || preview.credits<=0){ toast('This request has no valid credit amount — set a price per credit first, or top up manually.','err'); return; }
  if(!confirm(`Approve and add ${preview.credits} credit(s) to ${school.name}?`)) return;
  const note = `Approved request — M-Pesa ${preview.mpesaCode||'-'}, paid KES ${preview.amountPaid}`;

/* ---------- DOS/HOI + shared sending logic ---------- */
function normalizePhone(raw){
  let p = (raw||'').replace(/[^\d+]/g,'');
  if(!p) return '';
  if(p.startsWith('00')) p = '+'+p.slice(2);                       // 00254… → +254…
  if(p.startsWith('+')) return p;
  if(p.startsWith('0')) return '+254'+p.slice(1);                  // Kenyan local format → international
  if(p.startsWith('254')) return '+'+p;
  if(/^[71]\d{8}$/.test(p)) return '+254'+p;                       // 712345678 (leading 0 dropped)
  return p;
}
// Kenyan numbers must be +254 followed by 7xx/1xx and 8 more digits; other countries just
// need a plausible E.164 length. Stops typos ("0712 34567") from burning credits on dead numbers.
function isValidSmsPhone(n){
  if(!n || !n.startsWith('+')) return false;
  if(n.startsWith('+254')) return /^\+254[71]\d{8}$/.test(n);
  return /^\+\d{8,15}$/.test(n);
}
// Builds the send list: normalises + validates numbers, drops duplicates (same number AND same
// text — e.g. two siblings sharing one parent phone get one announcement, not two charges),
// and reports how many were skipped and why so the school isn't surprised.
function buildSmsRecipients(items){
  const seen = new Set(), out = []; let invalid = 0, dup = 0;
  items.forEach(it=>{
    const phone = normalizePhone(it.phone);
    if(!isValidSmsPhone(phone)){ invalid++; return; }
    const key = phone+'|'+it.message;
    if(seen.has(key)){ dup++; return; }
    seen.add(key); out.push({phone, message: it.message});
  });
  return {recipients: out, invalid, dup};
}

// Re-sends only to the numbers the server reported as failed last time, using the exact
// same per-recipient message text as the original batch (stored in recipientsSnapshot),
// so a retry never has to guess what a learner's result message said.
function retryFailedSms(logId){
  if(smsSending){ toast('A send is already in progress — please wait','err'); return; }
  const school = currentSchool();
  const log = (school.smsLog||[]).find(l=>l.id===logId);
  if(!log || !log.failedNumbers || !log.failedNumbers.length){ toast('Nothing to retry','err'); return; }
  if(!smsPinGate(/Results/.test(log.type)?'smsResultsMsg':'smsAnnounceMsg')) return;
  const failedSet = log.failedNumbers.map(normalizePhone);
  const retry = (log.recipientsSnapshot||[]).filter(r=>failedSet.includes(normalizePhone(r.phone)));
  if(!retry.length){ toast('Could not match the failed numbers to the original message list','err'); return; }
  const credits = retry.reduce((n,r)=>n+smsSegments(r.message),0);
  if(credits > (school.smsCredits||0)){ toast(`Not enough credit: need ${credits}, have ${school.smsCredits||0}`,'err'); return; }
  if(!confirm(`Retry sending to ${retry.length} failed recipient(s) for ${credits} credit(s)?`)) return;
  sendSmsBatch(school, retry, {type:'Retry: '+log.type.replace(/^Retry: /,''), audience: log.audience}, /Results/.test(log.type)?'smsResultsMsg':'smsAnnounceMsg');
}

// Builds one short results text for a single learner — same underlying numbers as the
// printed report card (see buildReportHTML), just condensed to SMS length.
function learnerResultSummary(school, sid, examId){
  const exam = school.exams.find(e=>e.id===examId); if(!exam) return null;
  const student = school.students.find(s=>s.id===sid); if(!student) return null;
  const areas = areasForClass(school, exam.classId);
  const marksForExam = school.marks[examId] || {};
  let sumPct=0;
  areas.forEach(a=>{ const max=exam.maxMarksByArea[a.id]??100; const score=(marksForExam[sid]||{})[a.id]; if(score!=null) sumPct+=pctOf(score,max); });
  const meanPct = areas.length ? sumPct/areas.length : 0;
  const overall = gradeFor(school, meanPct, exam.classId);
  const learners = studentsForExam(school, exam);
  const totals = learners.map(s=>{ let t=0; areas.forEach(a=>{ const sc=(marksForExam[s.id]||{})[a.id]; if(sc!=null) t+=sc; }); return {id:s.id,t}; }).sort((a,b)=>b.t-a.t);
  const position = totals.findIndex(x=>x.id===sid)+1;
  const text = `Dear Parent, ${student.name}'s results for ${exam.name} (${exam.term} ${exam.year}): Mean ${meanPct.toFixed(1)}%, Grade ${overall.level}, Position ${position}/${learners.length}. - ${school.name}`;
  return text;
}

// Posts to the Cloud Function, which checks/deducts the school's real credit balance
// server-side (so a tampered client value can't be used to send SMS for free) and
// returns the authoritative new balance, which we then store locally.
// Safeguards: one send at a time (no double-tap double-billing), a 65s timeout, non-JSON
// error pages handled, a timeout is logged as "unknown outcome" (NOT as a clean failure) so the
// school checks before resending, and the log keeps only the failed recipients (not every
// message) so the synced school record doesn't balloon.
let smsSending = false;
const SMS_LOG_MAX = 100;
function pushSmsLog(school, entry){
  school.smsLog.push(entry);
  if(school.smsLog.length > SMS_LOG_MAX) school.smsLog = school.smsLog.slice(-SMS_LOG_MAX);
}
// Returns the 6-digit PIN typed in the SMS tab (or remembered this session), or shows a message and returns null.
function smsPinGate(msgElId){
  const school = currentSchool();
  const typed = qs('#smsPin') ? qs('#smsPin').value.trim() : '';
  const pin = typed || (school && smsPinMem[school.code]) || '';
  if(!/^\d{6}$/.test(pin)){
    const el = qs('#'+msgElId);
    if(el) el.innerHTML = '<div class="msg err">Enter your 6-digit School SMS PIN in the box at the top of this tab first. Ask the platform administrator if your school has not been given one.</div>';
    else toast('Enter your 6-digit School SMS PIN first','err');
    return null;
  }
  if(school) smsPinMem[school.code] = pin;
  return pin;
}
async function sendSmsBatch(school, recipients, meta, msgElId){
  if(smsSending) return;
  const smsPin = smsPinGate(msgElId); if(!smsPin) return;
  smsSending = true;
  const msgEl = qs('#'+msgElId);
  document.querySelectorAll('button[onclick^="sendResultsSms"],button[onclick^="sendAnnouncementSms"],button[onclick^="retryFailedSms"]').forEach(b=>b.disabled=true);
  if(msgEl) msgEl.innerHTML = '<p class="small">Sending… please don\'t close this page.</p>';
  const ctrl = new AbortController();
  const timer = setTimeout(()=>ctrl.abort(), 65000);
  try{
    const res = await fetch(window.PLATFORM_SMS_ENDPOINT, {
      method:'POST', headers:{'Content-Type':'application/json'}, signal: ctrl.signal,
      body: JSON.stringify({schoolCode: school.code, smsPin, recipients})
    });
    let data = null;
    try{ data = await res.json(); }catch(_){ data = null; }
    if(!data || !res.ok || !data.ok){
      const errText = (data && data.error) || ('Server error (HTTP '+res.status+')');
      if(/PIN/i.test(errText)) delete smsPinMem[school.code];   // don't keep a PIN the server rejected
      pushSmsLog(school, {id:uid('sms_'), ts:Date.now(), type:meta.type, audience:meta.audience, recipients:recipients.length, credits:0, ok:false, error:errText});
      saveDB(DB);

      return;
    }
    if(typeof data.newBalance==='number') school.smsCredits = data.newBalance;
    const failedNumbers = (data.failedNumbers||[]).map(normalizePhone);
    const failedRecipients = recipients.filter(r=>failedNumbers.includes(normalizePhone(r.phone)));
    pushSmsLog(school, {id:uid('sms_'), ts:Date.now(), type:meta.type, audience:meta.audience, recipients:recipients.length, credits:data.creditsUsed||0, ok:true, sent:data.sent, failed:data.failed, failedNumbers, recipientsSnapshot:failedRecipients});
    saveDB(DB);
    toast(`Sent to ${data.sent==null?recipients.length:data.sent} parent(s)${data.failed?`, ${data.failed} failed`:''}`);
    if(session && session.role==='finance'){ if(msgEl) msgEl.innerHTML=`<div class="msg ok">Sent to ${data.sent==null?recipients.length:data.sent} parent(s)${data.failed?`, ${data.failed} failed`:''}.</div>`; } else renderDOS();
  }catch(err){
    const timedOut = err && err.name==='AbortError';
    const errText = timedOut
      ? 'No reply from the SMS service after 65s — some messages MAY have been sent. Check the balance and your log before resending.'
      : 'Could not reach the SMS service: '+String(err.message||err);
    pushSmsLog(school, {id:uid('sms_'), ts:Date.now(), type:meta.type, audience:meta.audience, recipients:recipients.length, credits:0, ok:false, error:errText});
    saveDB(DB);
    if(msgEl) msgEl.innerHTML = `<div class="msg err">${escapeHtml(errText)}</div>`;
  }finally{
    clearTimeout(timer);
    smsSending = false;
    document.querySelectorAll('button[onclick^="sendResultsSms"],button[onclick^="sendAnnouncementSms"],button[onclick^="retryFailedSms"]').forEach(b=>b.disabled=false);
  }
}

/* ============================= INIT ============================= */
resetInactivityTimer(); // arm the 15-minute timeout right away if a session survived a page refresh
route();
</script>
