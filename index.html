<head>

<title>ASION ANALYTICS — Learner Assessment &amp; Reporting Platform</title>
<style>
:root{
  --navy:#123a63; --navy2:#0d2c4d; --gold:#d9a441; --gold2:#c78f2e; --bg:#f2f5f8; --card:#fff;
  --ee:#1f8a4c; --me:#2f7fd1; --ae:#e0a020; --be:#d1473f; --border:#dfe6ee;
  --font:'Inter','Segoe UI',Arial,sans-serif;
  --font-brand:'Sora','Inter','Segoe UI',Arial,sans-serif;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{margin:0;font-family:var(--font);background:var(--bg);color:#1c2b3a;-webkit-font-smoothing:antialiased;}
::selection{background:var(--gold);color:#3a2a06;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:#e7edf5;}
::-webkit-scrollbar-thumb{background:#aebdd0;border-radius:8px;}
::-webkit-scrollbar-thumb:hover{background:var(--navy);}
a{color:var(--navy);}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px;}
header.topbar{background:linear-gradient(100deg,var(--navy),var(--navy2) 70%);color:#fff;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;box-shadow:0 2px 10px rgba(9,30,55,.25);position:sticky;top:0;z-index:50;}
header.topbar h1{font-size:19px;margin:0;font-weight:800;letter-spacing:.4px;display:flex;align-items:center;gap:10px;font-family:var(--font-brand);text-transform:uppercase;}
.brand-mark{width:30px;height:30px;border-radius:8px;flex:none;background:linear-gradient(135deg,var(--gold),var(--gold2));display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.25);}
.brand-mark svg{width:18px;height:18px;display:block;}
.brand-wordmark{background:linear-gradient(100deg,#fff 30%,#f3d8a3 75%);-webkit-background-clip:text;background-clip:text;color:transparent;}
header.topbar .who{font-size:13px;opacity:.92;}
.container{max-width:1200px;margin:0 auto;padding:16px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:0 2px 10px rgba(18,58,99,.06);transition:box-shadow .15s ease;}
.card h2{margin-top:0;font-size:17px;color:var(--navy);border-bottom:2px solid var(--gold);padding-bottom:6px;font-weight:700;}
.row{display:flex;gap:10px;flex-wrap:wrap;}
.row>*{flex:1;min-width:160px;}
label{font-size:12px;font-weight:600;color:#456;display:block;margin-bottom:3px;}
input,select,textarea{width:100%;padding:8px 9px;border:1px solid #c5d0dc;border-radius:7px;font-size:14px;background:#fff;font-family:var(--font);transition:border-color .15s ease,box-shadow .15s ease;}
input:focus,select:focus,textarea:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(18,58,99,.12);outline:none;}
button{background:var(--navy);color:#fff;border:none;padding:9px 16px;border-radius:7px;cursor:pointer;font-size:13px;font-weight:700;font-family:var(--font);transition:background .15s ease,transform .1s ease,box-shadow .15s ease;box-shadow:0 1px 2px rgba(18,58,99,.15);}
button:hover{background:var(--navy2);box-shadow:0 3px 8px rgba(18,58,99,.25);transform:translateY(-1px);}
button:active{transform:translateY(0);box-shadow:0 1px 2px rgba(18,58,99,.2);}
button:disabled{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none;}
button.gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#3a2a06;}
button.gold:hover{background:linear-gradient(135deg,var(--gold2),var(--gold));}
button.danger{background:#b23b3b;}
button.danger:hover{background:#962f2f;}
button.ghost{background:#eef2f7;color:var(--navy);border:1px solid var(--border);box-shadow:none;}
button.ghost:hover{background:#e2eaf4;box-shadow:none;}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.tabs button{background:#e7edf5;color:var(--navy);box-shadow:none;font-weight:600;}
.tabs button:hover{background:#dbe5f1;}
.tabs button.active{background:var(--navy);color:#fff;box-shadow:0 2px 6px rgba(18,58,99,.3);}
table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{border:1px solid #c9d3de;padding:6px 7px;text-align:center;}
th{background:#e7edf5;color:var(--navy);font-weight:700;}
tr:nth-child(even) td{background:#fafcfe;}
tr:hover td{background:#eef4fb;}
.badge{background:#6b7c8f;display:inline-block;padding:3px 11px;border-radius:10px;font-size:12px;font-weight:700;color:#fff;letter-spacing:.3px;box-shadow:0 1px 2px rgba(0,0,0,.12);border:1px solid rgba(0,0,0,.35);}
.EE{background:var(--ee);} .ME{background:var(--me);} .AE{background:var(--ae);} .BE{background:var(--be);}
/* Performance-level badges show the level code exactly as typed in the Grading table
   (e.g. "EE1", "ME2") — no forced tick/cross glyph. A distinct border style still rides
   on top of the color by rank, so the four bands stay tellable apart even on a printer
   with no color cartridge (two similarly-dark colors can print as near-identical gray).
   .lvl-badge is added only to real performance-level badges, not the reused EE/AE/BE
   status-color classes elsewhere (Active/Suspended/Approved etc.), which already carry
   their own emoji. lvl-0..lvl-3 give raBadge() (custom, inline-colored per school grading
   table) the same border treatment by rank rather than code. Any icon shown before the
   level text comes from that level's own editable "Icon" field (see .lvl-icon-input) and
   is plain text in the badge itself, not CSS content — so it's whatever the school set,
   or nothing at all. */
.lvl-badge{border-width:2px;border-color:rgba(0,0,0,.55);}
.EE.lvl-badge,.lvl-badge.lvl-0{border-style:solid;}
.ME.lvl-badge,.lvl-badge.lvl-1{border-style:double;border-width:3px;}
.AE.lvl-badge,.lvl-badge.lvl-2{border-style:dashed;}
.BE.lvl-badge,.lvl-badge.lvl-3{border-style:dotted;}
.lvl-icon-input{width:100%;text-align:center;font-size:15px;padding:6px 4px;}
.lvl-color-input{width:100%;height:34px;padding:2px;cursor:pointer;}
.lvl-preview{display:flex;justify-content:center;padding-top:2px;}
.small{font-size:12px;color:#5a6b7c;}
.flexbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
.linkbox{background:#eef4fb;border:1px dashed var(--navy);padding:8px;border-radius:7px;font-size:12px;word-break:break-all;}
.login-wrap{max-width:420px;margin:48px auto;}
.brand-hero{text-align:center;margin-bottom:18px;}
.brand-hero .brand-icon{width:72px;height:72px;border-radius:20px;background:linear-gradient(135deg,var(--navy),var(--navy2));display:flex;align-items:center;justify-content:center;margin:0 auto 14px;box-shadow:0 8px 20px rgba(18,58,99,.3);}
.brand-hero .brand-icon svg{width:38px;height:38px;display:block;}
.brand-hero h1{margin:0;font-size:26px;color:var(--navy);font-weight:800;letter-spacing:.6px;font-family:var(--font-brand);text-transform:uppercase;background:linear-gradient(100deg,var(--navy) 30%,var(--gold2) 90%);-webkit-background-clip:text;background-clip:text;color:transparent;}
.brand-hero p{margin:6px 0 0;font-size:13px;color:#5a6b7c;letter-spacing:.3px;}
.app-footer{text-align:center;font-size:11px;color:#8a9bad;margin-top:22px;line-height:1.6;}
.center{text-align:center;}
.msg{padding:8px 10px;border-radius:7px;font-size:13px;margin:8px 0;}
.msg.ok{background:#e3f5e8;color:#1f6a3a;}
.msg.err{background:#fbe6e6;color:#9c2c2c;}
.school-code{font-size:22px;letter-spacing:3px;font-weight:800;color:var(--navy);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:700px){.grid2{grid-template-columns:1fr;}.rc-info{grid-template-columns:1fr;}.rc-sigrow{grid-template-columns:1fr;}}
.report-card{border:1.5px solid var(--navy);border-radius:12px;overflow:hidden;background:#fff;max-width:840px;margin:0 auto 18px;box-shadow:0 4px 18px rgba(18,58,99,.1);}
.rc-topband{height:6px;background:linear-gradient(90deg,var(--gold) 0%,var(--navy) 55%,var(--navy2) 100%);}
.rc-body{padding:20px 26px 18px;}
.report-header{text-align:center;border-bottom:3px double var(--navy);padding-bottom:10px;margin-bottom:14px;}
.report-header h2{margin:2px 0;color:var(--navy);}
.report-card .report-header{border-bottom:2px solid var(--gold);padding-bottom:9px;margin-bottom:12px;}
.report-card .report-header h2{font-size:24px;font-weight:800;letter-spacing:.3px;}
.report-card .report-header p{font-size:14px;margin:3px 0;}
.rc-doctitle{font-size:14px;color:var(--navy2);font-weight:700;letter-spacing:.5px;text-transform:uppercase;margin:3px 0;}
.rc-logo{display:block;max-width:100%;max-height:64px;margin:0 auto 6px;}
.rc-motto{font-size:12.5px;color:#5a6b7c;font-style:italic;margin:0 0 4px;}
.rc-code{font-size:12px;color:#8a9bad;letter-spacing:.8px;}
.rc-info{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;margin-bottom:14px;}
.rc-info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;background:#f5f8fc;border:1px solid var(--border);border-radius:10px;padding:12px 16px;font-size:14px;align-content:center;line-height:1.5;}
.rc-info-grid b{color:var(--navy);}
.rc-overall-box{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border:1px solid var(--navy);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
.rc-overall-box .rc-grade{font-size:28px;font-weight:800;letter-spacing:.5px;}
.rc-overall-box .rc-sub{font-size:13px;opacity:.92;margin-top:4px;}
table.rc-table{font-size:14px;}
table.rc-table th{background:var(--navy);color:#fff;font-size:13px;text-transform:uppercase;letter-spacing:.2px;border-color:var(--navy2);padding:9px 8px;}
table.rc-table td{padding:9px 8px;}
table.rc-table tr.rc-total td{background:#fdf6e5;font-weight:800;border-top:2px solid var(--gold);}
.rc-remark{margin-top:12px;background:#fbf8ef;border-left:4px solid var(--gold);border-radius:0 8px 8px 0;padding:10px 14px;font-size:14px;line-height:1.5;}
.rc-chartwrap{margin-top:16px;}
.rc-chartwrap canvas{display:block;width:100%;height:auto;}
.rc-chart-label{font-size:14px;font-weight:700;color:var(--navy);display:block;margin-bottom:6px;}
.rc-sigrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;margin-top:28px;}
.sig-line{border-top:1px solid #333;margin-top:42px;padding-top:6px;font-size:14px;text-align:center;}
.rc-sigrow .sig-line{border-top:1px dotted #8a9bad;margin-top:0;}
.rc-sig-img{display:block;max-width:100%;max-height:46px;margin:0 auto 2px;}
.sig-pad-wrap{border:1.5px dashed var(--navy);border-radius:8px;background:#fafcfe;display:inline-block;max-width:100%;}
#hoiSigPad{display:block;max-width:100%;touch-action:none;cursor:crosshair;border-radius:8px;}
.rc-footer{text-align:center;font-size:11px;color:#a9b6c4;margin-top:12px;letter-spacing:.3px;}
.rc-meta{font-size:13px;color:#456;margin-top:10px;display:flex;flex-wrap:wrap;gap:4px 18px;}
.rc-meta b{color:var(--navy);}
.rc-key{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11.5px;color:#5a6b7c;border-top:1px dashed var(--border);padding-top:8px;}
.rc-key b{color:var(--navy);}
.chip{display:inline-block;background:#e7edf5;padding:3px 9px;border-radius:12px;font-size:11px;margin:2px;font-weight:600;color:var(--navy);}
canvas{max-width:100%;}
.close-x{float:right;cursor:pointer;font-weight:800;color:#b23b3b;}
@keyframes storageBannerIn{from{transform:translateY(-100%);}to{transform:translateY(0);}}
.storage-warning{background:#7a2323;color:#fff;text-align:center;font-size:12px;padding:6px 12px;animation:storageBannerIn .25s ease;}
@media print{
  /* Forces backgrounds/colors to still be sent to the printer even when the browser's own
     "background graphics" print option is off — otherwise a badge or the navy grade box
     prints as pure white and its white text disappears entirely. This doesn't make a
     black-and-white/grayscale printer output color; it just guarantees the shaded boxes
     and their light text stay visible (as gray fills) instead of vanishing. */
  *{-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important;color-adjust:exact !important;}
  /* Only the generated report/sheet (.print-only-block) should ever hit paper — everything
     else (topbar, tabs, nav/header cards, form controls, history tables) is UI chrome and is
     marked .no-print so it never eats page space or shifts the report onto a later page. */
  header.topbar,.tabs,.no-print,.card>h2 + .no-print{display:none !important;}
  body{background:#fff;font-size:11px;}
  .container{max-width:100%;padding:0;}
  /* NOTE: page breaks belong on .print-only-block only (below) — a generic .card rule here
     previously forced a break after EVERY card (nav bars, picker cards, even the remark box
     nested inside a report), which is what produced blank leading pages and multi-page
     single reports. Cards just get their screen chrome stripped for print. */
  .card{border:none;box-shadow:none;padding:0;margin:0;}
  .print-only-block{page-break-after:always; break-after:page;}
  /* ...but not after the very last one, or a trailing blank page gets printed. */
  .print-only-block:last-of-type{page-break-after:auto; break-after:auto;}
  /* The Assessment Sheets page keeps the Class Assessment Sheet, Cumulative Sheet and
     Blank Class List as three separate previews on screen at once (each has its own
     "Print" button), so more than one could be sitting in the page at the same time.
     Without this, clicking Print on any one of them would print EVERY generated sheet
     together (e.g. the blank manual-marking sheet tacked onto the assessment results) —
     printSection() in the script tags whichever one the user wants as the one to keep and
     marks every OTHER .print-only-block .print-hide-temp for the duration of the print,
     so only the sheet actually being printed goes to paper; the others simply stay on
     screen exactly as before, untouched. */
  .print-hide-temp{display:none !important;}
  @page{size:A4;margin:8mm;}
  /* The learner report card is scaled to guarantee it always lands on exactly one page
     (see fitReportCardsToPage() in the script) — transform-origin top-left plus a fixed
     wrapper height is what makes that scaling reliable in print.
     It's also given the FULL printable page height (297mm - 2*8mm margin) and laid out as
     a flex column so a short report (few learning areas) stretches to fill the page instead
     of leaving a big blank gap at the bottom — the auto-margins on .rc-chartwrap/.rc-sigrow
     soak up any spare space as breathing room rather than as dead space below the content.
     A report with too much content still shrinks to fit via fitReportCardsToPage(); this
     flex layout only ever adds space, it never causes overflow. */
  .report-card{page-break-inside:avoid;break-inside:avoid;border-width:1px;transform-origin:top left;
    height:281mm;display:flex;flex-direction:column;box-sizing:border-box;}
  .report-card .rc-body{flex:1;display:flex;flex-direction:column;box-sizing:border-box;}
  .rc-body{padding:11px 14px 10px;}
  .report-card table{font-size:11px;}
  .report-card th,.report-card td{padding:3.5px 5px;}
  .report-card .report-header h2{font-size:18px;margin:1px 0;}
  .report-card .report-header p{margin:1px 0;font-size:12px;}
  .rc-doctitle{font-size:11.5px;}
  .rc-logo{max-height:40px;margin-bottom:3px;}
  .rc-motto{font-size:10px;margin-bottom:2px;}
  .rc-info-grid{font-size:12px;padding:7px 11px;}
  .rc-overall-box .rc-grade{font-size:19px;}
  .rc-overall-box .rc-sub{font-size:10.5px;}
  .report-card canvas{display:block;width:100% !important;max-width:100%;max-height:120px;height:120px !important;}
  .rc-remark{font-size:11.5px;padding:6px 9px;}
  .rc-chart-label{font-size:12px;}
  /* margin-top:auto turns these into flexible spacers inside the .rc-body flex column: any
     unused page height (short reports with few learning areas) gets split between the gap
     above the chart and the gap above the signature block, instead of sitting as one dead
     blank strip below the footer. Content that already fills the page just gets its normal
     small gap, same as before. */
  .rc-chartwrap{margin-top:auto;}
  .rc-sigrow{margin-top:auto;}
  .rc-sigrow .sig-line{padding-top:3px;font-size:11.5px;}
  .rc-sig-img{max-height:32px;}
  .rc-meta{font-size:10.5px;margin-top:5px;}
  .rc-key{font-size:9.5px;margin-top:6px;padding-top:5px;}
  .rc-footer{margin-top:6px;}
  .report-card .grid2{gap:6px;}
  .report-card .card{page-break-inside:avoid;}
}
.ra-table{font-size:12px;}
.ra-table th,.ra-table td{padding:5px 4px;}
.ra-best td{background:#fdf6e5 !important;font-weight:700;}
.ra-table td.ra-top{background:#e3f4e9 !important;font-weight:700;}
@media print{.ra-table{font-size:10.5px;}.ra-sec{break-inside:avoid;page-break-inside:avoid;}}
.hidden{display:none !important;}
</style>
</head>
<body>
<div id="storageWarning" class="no-print"></div>
<header class="topbar">
  <h1><span class="brand-mark"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M22 66 L38 34 L50 56 L62 30 L78 66" stroke="#123a63" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="brand-wordmark">Asion Analytics</span></h1>
  <div class="who no-print" id="whoBar"></div>
</header>
<div class="container" id="app"></div>

<!-- Platform-wide shared database config (one free Firebase project for this whole
     deployment). This is what lets a School Code / DOS / Teacher login link resolve
     automatically on ANY device, the moment the admin creates the school on theirs —
     instead of "School code not found" until that specific browser has seen it before.
     See firebase-config.js and README.md for one-time setup (~5 minutes, free). -->
<script src="firebase-config.js"></script>
<script>
const APP_VERSION = '1.1.0';
// The Admin/Owner tab is completely hidden from the login screen and unreachable
// (even by URL) unless the page is opened with ?key=<this value> in the address bar.
// This is what stops a random visitor from ever seeing "Admin/Owner" or being able to
// set the admin password themselves — CHANGE THIS to your own secret before deploying,
// then bookmark your admin link as: yoursite.netlify.app/?role=admin&key=YOUR_SECRET
// Note: since this is a static site, anyone who views page source can find this value —
// it stops casual/opportunistic access and search-engine discovery, not a determined
// attacker inspecting the code. Treat it like a hidden door, not a lock.
const ADMIN_ACCESS_KEY = 'nmVoCBopKpciLvsmCD9EuXTk';
// Same idea as ADMIN_ACCESS_KEY, one level down: the DOS/HOI and Teacher login links
// no longer say "role=dos" / "role=teacher" in plain sight — instead each carries an
// opaque ?p= key from these two constants. A person staring at (or editing) the URL
// sees only a random-looking string, not the word "dos" or "teacher", so there's
// nothing obvious to guess or swap to land on a different portal's form. This is the
// same "hidden door, not a lock" model as ADMIN_ACCESS_KEY above — actual access still
// requires the real per-school username & password; this only keeps the *form itself*
// (and the fact that other portals exist) out of sight. CHANGE THESE before deploying,
// same as ADMIN_ACCESS_KEY.
const DOS_ACCESS_KEY = 'LUg35O6eNUautNpN8PsphJIM';
const TEACHER_ACCESS_KEY = 'HreuYy1Wap0C9cEWzrrDg4y2';
/* ============================= DATA LAYER ============================= */
const DB_KEY = 'cbc_markbook_db_v1';
// Wraps localStorage so a school running in a browser that blocks it (private/incognito
// mode on some browsers, storage disabled by policy, storage full) gets a clear warning
// and an in-memory fallback for the rest of the session, instead of the app silently
// failing to save or throwing on first use.
let storageOK = true;
const memoryStore = {};
function storageGet(key){
  try{ return localStorage.getItem(key); }
  catch(e){ storageOK=false; return Object.prototype.hasOwnProperty.call(memoryStore,key) ? memoryStore[key] : null; }
}
function storageSet(key, value){
  try{ localStorage.setItem(key, value); }
  catch(e){ storageOK=false; memoryStore[key]=value; }
  if(!storageOK) showStorageWarning();
}
function showStorageWarning(){
  const el = document.getElementById('storageWarning');
  if(el && !el.innerHTML){
    el.innerHTML = "<div class=\"storage-warning\">⚠ This browser is blocking local storage, so changes will NOT be saved after you close this tab. Try a normal (non-private) browser window, or check your browser's storage/cookie settings.</div>";
  }
}
function loadDB(){
  let raw = storageGet(DB_KEY);
  if(!raw){
    const fresh = { adminPassword: null, adminSync: null, settings:{trialDays:14}, schools: {} };
    storageSet(DB_KEY, JSON.stringify(fresh));
    return fresh;
  }
  return migrateDB(JSON.parse(raw));
}
// Brings a database object (freshly loaded, or just imported from a backup file) up to
// the current data shape. Safe to call repeatedly — every step is a no-op once already
// migrated, so this doubles as the single source of truth for "what does a valid DB look
// like" whether the data came from this browser's storage or an older backup file.
// Ensures a single school object has every field the templates expect, regardless of
// where it came from (a fresh create, an older backup file, or a cloud snapshot that
// replaced the whole local record). Missing an object/array field here is what makes a
// tab like Classes or Learners silently render blank — the template throws partway
// through building its HTML, so the tab's content area is just left empty. Safe to call
// repeatedly; every line is a no-op once the field already exists.
function ensureSchoolShape(s){
  if(!s) return s;
  if(!Array.isArray(s.classes)) s.classes = [];
  if(!Array.isArray(s.students)) s.students = [];
  if(!Array.isArray(s.teachers)) s.teachers = [];
  if(!Array.isArray(s.exams)) s.exams = [];
  if(!Array.isArray(s.learningAreas)) s.learningAreas = defaultAreas();
  if(!Array.isArray(s.gradingSystem)) s.gradingSystem = defaultGrading();
  if(!Array.isArray(s.dos)) s.dos = [];
  if(!s.classTeachers || typeof s.classTeachers!=='object') s.classTeachers = {};
  if(!s.marks || typeof s.marks!=='object') s.marks = {};
  // Attendance: s.attendance[examId][studentId] = days present. Keyed the same way as
  // marks so it survives class/exam edits the same way, but kept in its own object since
  // it isn't a score and shouldn't feed into grading/positions.
  if(!s.attendance || typeof s.attendance!=='object') s.attendance = {};
  if(typeof s.hoiSignature !== 'string') s.hoiSignature = '';
  if(typeof s.logo !== 'string') s.logo = '';
  if(typeof s.motto !== 'string') s.motto = '';
  if(typeof s.regNo !== 'string') s.regNo = '';
  // Every reader of school.teachers assumes t.assignments is an array (Teachers &
  // Permissions, marks entry, report cards all do t.assignments.some/.map/.filter
  // with no guard). A teacher record missing that field — e.g. one that round-tripped
  // through a cloud merge mid-edit — used to crash every one of those screens silently.
  // Sanitizing shape here, at the one choke point every load/migrate/merge passes
  // through, protects all of them at once.
  s.teachers.forEach(t=>{
    if(!Array.isArray(t.assignments)) t.assignments = [];
    if(typeof t.canPrint !== 'boolean') t.canPrint = true;
    // canPrintAssess governs a teacher's access to the Assessment Sheets (class sheet /
    // cumulative sheet) tab, separately from canPrint which only covers learner report
    // cards. Defaults to false so a DOS/HOI must deliberately grant it.
    if(typeof t.canPrintAssess !== 'boolean') t.canPrintAssess = false;
    // classTeacherOf: the grade(s) this teacher is designated Class Teacher for — separate
    // from the free-text "Class Teacher" name shown on report cards (school.classTeachers),
    // and separate from subject/learning-area assignments above. A teacher can be Class
    // Teacher for a grade without teaching any learning area in it, and vice versa.
    if(!Array.isArray(t.classTeacherOf)) t.classTeacherOf = [];
    // Class-teacher permissions: each only takes effect for a grade listed in
    // classTeacherOf, and only offloads work — the DOS/HOI can always act directly
    // regardless of what's granted here. All default to false; a DOS/HOI must
    // deliberately grant them.
    if(typeof t.canApproveResults !== 'boolean') t.canApproveResults = false; // approve/disapprove exam results
    if(typeof t.canApproveEditRequests !== 'boolean') t.canApproveEditRequests = false; // decide other teachers' pending edit requests
    if(typeof t.canManageEntry !== 'boolean') t.canManageEntry = false; // open/close the entry period
  });
  // Same idea for exams: every mark-entry and report screen does exam.maxMarksByArea[id]
  // with no guard, which throws outright if maxMarksByArea is missing entirely.
  s.exams.forEach(e=>{
    if(!e.maxMarksByArea || typeof e.maxMarksByArea !== 'object') e.maxMarksByArea = {};
    // Entry-closing period: once closed (manually or past closingDate), teachers can no
    // longer save marks directly for this exam — their changes queue up in editRequests
    // for the DOS/HOI to approve or reject. DOS/HOI can always edit directly regardless.
    if(typeof e.closed !== 'boolean') e.closed = false;
    if(typeof e.closingDate !== 'string') e.closingDate = '';
    if(!Array.isArray(e.editRequests)) e.editRequests = [];
    // Report-card dates and attendance: shown on the printed report if filled in, left off
    // otherwise. Not tied to the entry-closing period above — a school can set them any time.
    if(typeof e.termCloseDate !== 'string') e.termCloseDate = '';
    if(typeof e.nextTermDate !== 'string') e.nextTermDate = '';
    if(typeof e.totalDays !== 'number') e.totalDays = 0;
    // Results approval: DOS/HOI sign-off on the marks recorded for this exam, separate
    // from the entry-closing lock above. Resets to 'pending' whenever marks change after
    // being approved, so a stale approval can never cover edited data.
    if(e.resultsApproval !== 'approved' && e.resultsApproval !== 'disapproved') e.resultsApproval = 'pending';
    // Who approved/when, the DOS/HOI's reason when disapproved, and stateAt: a timestamp
    // bumped on every close/reopen/approve/disapprove so two devices can agree on which
    // version of the approval state is newer (see mergeExamStates).
    if(typeof e.approvalNote !== 'string') e.approvalNote = '';
    if(typeof e.approvedBy !== 'string') e.approvedBy = '';
    if(typeof e.approvalAt !== 'string') e.approvalAt = '';
    if(typeof e.stateAt !== 'number') e.stateAt = 0;
    // Parent visibility: on by default (once results are otherwise released) — DOS/HOI can
    // hide a specific exam from the Parent Portal without touching its approval state, e.g.
    // a mock exam that shouldn't reach parents at all, or one still being double-checked.
    if(typeof e.parentVisible !== 'boolean') e.parentVisible = true;
  });
  // Off by default: when on, results reach parents / teacher-printed reports only once approved.
  if(typeof s.requireApproval !== 'boolean') s.requireApproval = false;
  // On by default: the master switch for the Parent Portal on this school. When a DOS/HOI
  // turns it off, every parent is locked out of logging in (existing parent sessions are
  // force-logged-out too, same as a suspended school) until it's turned back on — separate
  // from and on top of the per-exam parentVisible toggle above.
  if(typeof s.parentPortalEnabled !== 'boolean') s.parentPortalEnabled = true;
  return s;
}
function migrateDB(db){
  if(!db.settings) db.settings = {trialDays:14};
  if(!db.settings.trialDays) db.settings.trialDays = 14;
  if(db.adminSync===undefined) db.adminSync = null; // older backups/devices never had cloud admin sync
  // migrate older schools that don't yet have status/trial fields
  Object.values(db.schools||{}).forEach(s=>{
    ensureSchoolShape(s);
    if(!s.status){
      s.status = 'active'; // pre-existing schools before this feature keep working uninterrupted
      s.createdAt = s.createdAt || Date.now();
      s.trialDays = s.trialDays || db.settings.trialDays;
      s.trialEndsAt = s.trialEndsAt || (s.createdAt + s.trialDays*24*60*60*1000);
    }
    // migrate older schools that don't yet have contact-details fields
    if(s.address==null) s.address = '';
    if(s.email==null) s.email = '';
    if(s.phone==null) s.phone = '';
    // A school that has never touched Multi-Device Sync at all (not even to turn it off)
    // gets defaulted onto the deployment's shared project, if one is configured, so it
    // becomes reachable from other devices automatically. A school that explicitly turned
    // sync off (syncConfig.enabled===false already present) is left alone on purpose.
    if(s.syncConfig===undefined && hasPlatformConfig()){
      s.syncConfig = {enabled:true, config: window.PLATFORM_FIREBASE_CONFIG};
    }
    // One-time: a learning area used to apply to EVERY class as long as none of the
    // per-class ticks in Learning Areas were checked — which is exactly how a subject a
    // class never actually takes could end up counted in that class's assessment sheet
    // and Mean %/overall level. Areas now only apply to classes explicitly ticked (see
    // areasForClass), so this materializes each existing, never-ticked area's old "every
    // class" behaviour into an explicit list of the classes that existed at the time —
    // preserving today's reports exactly as they are — and marks it `_scoped` so it's
    // only ever done once per area. It's deliberately skipped for a school with no
    // classes yet (nothing to materialize onto), and retried on a later load once classes
    // exist, so a brand-new school's default subjects still "just work" out of the box.
    // Any area added from now on starts pre-scoped with nothing ticked — see addArea() —
    // so going forward, an untouched tick box really does mean "not assigned here".
    (s.learningAreas||[]).forEach(a=>{
      if(!Array.isArray(a.classIds)) a.classIds = [];
      if(!a._scoped && s.classes.length){
        if(a.classIds.length===0) a.classIds = s.classes.map(c=>c.id);
        a._scoped = true;
      }
    });
    // migrate students to have a stable internal id, separate from admission number.
    // Admission number is now optional and no longer guaranteed unique, so it can no
    // longer safely be used as the key marks/reports are stored against — every learner
    // now has their own generated id for that, and admission number is purely a
    // (still-editable, still-usually-unique) display field.
    let idAssigned = false;
    const admToId = {};
    (s.students||[]).forEach(st=>{
      if(!st.id){ st.id = uid('stu_'); idAssigned = true; }
      if(st.adm) admToId[st.adm] = st.id;
    });
    if(idAssigned){
      // remap any marks recorded under the OLD key (admission number) onto the new id
      Object.keys(s.marks||{}).forEach(examId=>{
        const examMarks = s.marks[examId], remapped = {};
        Object.keys(examMarks).forEach(key=>{ remapped[admToId[key] || key] = examMarks[key]; });
        s.marks[examId] = remapped;
      });
    }
  });
  return db;
}
function saveDB(db, opts){
  if(!opts || !opts.skipCloud){
    // Stamp the active school as "just edited" BEFORE pushing/storing, so that if a
    // cloud echo of an earlier push arrives while more edits are still in flight (e.g.
    // adding a second teacher right after the first), the echo's older timestamp can
    // never be mistaken for newer and silently overwrite this fresher local change.
    const activeSchool = (session && (session.role==='dos'||session.role==='teacher')) ? db.schools[session.schoolCode] : null;
    if(activeSchool) activeSchool._updatedAt = Date.now();
  }
  storageSet(DB_KEY, JSON.stringify(db));
  if(!opts || !opts.skipCloud){ scheduleCloudPush(); scheduleAdminCloudPush(); }
}
let DB = loadDB();

/* ============================= MULTI-DEVICE CLOUD SYNC =============================
   Lets a teacher enter marks on their own phone and have them appear automatically in
   the DOS/HOI's combined class assessment sheet (and vice versa), using a free Firebase
   Realtime Database as the shared relay. Nothing about this is required — a school that
   never sets it up keeps working exactly as before, fully offline, on a single device.

   Design:
   - Marks are written to individual leaf paths (schools/{code}/marks/{exam}/{student}/{area}).
     Firebase merges leaf writes from different devices automatically, so two teachers
     marking different subjects for the same exam never overwrite each other — there is
     no custom merge logic needed for marks.
   - Everything else about a school (classes, students, teachers, exams, grading, etc.) is
     pushed as one JSON blob, debounced, stamped with an _updatedAt timestamp; whichever
     device has the newer stamp wins when two copies disagree.
   - SECURITY NOTE (told to the user in the Sync settings panel too): Firebase's own
     "test mode" rules make the whole database open to anyone with the project's URL.
     This app scopes its own reads/writes to schools/{code}, but that is a structural
     convention, not real access control — a Firebase config is not a secret credential,
     and without Firebase Auth, anyone who obtains the school code and config can read or
     write that school's node. Treat it like a shared spreadsheet link, use a fresh
     project per deployment, and tighten the database's rules from the Firebase console
     when possible instead of relying on this app alone.
     initSync() now signs the app in anonymously before any read/write, so a rule of
     "auth != null" can be set in the Firebase console to turn away requests that carry no
     Firebase auth at all (a bare REST/URL fetch). Two things only you can do in the
     Firebase console — this file cannot do them for you:
       1. Authentication → Sign-in method → enable the "Anonymous" provider.
       2. Realtime Database → Rules → paste:
          {
            "rules": {
              "schools": { "$code": { ".read": "auth != null", ".write": "auth != null" } },
              "admins":  { "$uid":  { ".read": "auth != null && auth.uid === $uid",
                                       ".write": "auth != null && auth.uid === $uid" } }
            }
          }
          — then Publish. Do step 1 before step 2 (or before redeploying this file) so
          sync doesn't fail for every school in the gap between them; if it does fail
          briefly, the app already degrades to local-only/offline mode rather than
          breaking, exactly as it does with no internet connection.
     This blocks casual, no-effort scraping of the raw database (a plain URL in a
     browser), but it is NOT the same as restricting a visitor to only their own child's
     record — anyone using the Parent Portal authenticates the same anonymous way a
     genuine parent does, so "signed in or not" is as fine-grained as a rules-only setup
     can get. Verifying a specific name+admission-number match server-side, so a parent
     can only ever be handed their own child's data, needs a small backend (a Cloud
     Function) that this static, backend-less app doesn't have — a further step if you
     want that stronger guarantee. */
let firebaseApp = null, fbDb = null;
const syncState = { enabled:false, connectedCode:null, pushTimer:null, marksReady:false, dataReady:false, marksListenerRef:null, dataListenerRef:null, sdkLoading:null };

function loadFirebaseSdk(cb){
  if(window.firebase && window.firebase.database){ cb(); return; }
  if(syncState.sdkLoading){ syncState.sdkLoading.then(cb); return; }
  syncState.sdkLoading = new Promise((resolve, reject)=>{
    const s1 = document.createElement('script');
    s1.src = 'https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js';
    s1.onload = ()=>{
      const s2 = document.createElement('script');
      s2.src = 'https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js';
      s2.onload = resolve;
      s2.onerror = reject;
      document.head.appendChild(s2);
    };
    s1.onerror = reject;
    document.head.appendChild(s1);
  });
  syncState.sdkLoading.then(cb).catch(()=>toast('Could not reach the sync service — check your internet connection.','err'));
}
// Signs the app itself in (anonymously) before it ever touches the database, so a rule
// of ".read"/".write": "auth != null" on the Firebase console side can turn away a bare
// URL/REST request that carries no Firebase auth token at all. This is a real but partial
// improvement: it stops casual, no-effort scraping of the raw database, but it can't
// verify WHICH learner a visitor is — anyone who runs this app still anonymously
// authenticates the same way a genuine parent does, so a rule can restrict "signed in or
// not" but not "only your own child's record" without a server-side check (e.g. a Cloud
// Function) that this static, backend-less app doesn't have. Pair this with the Database
// Rules change described where initSync is documented in the file's header comment.
function initSync(config){
  return new Promise((resolve, reject)=>{
    loadFirebaseAuthSdk(()=>{
      try{
        const existing = firebase.apps.find(a=>a.name==='cbcSync');
        if(existing && firebaseApp && JSON.stringify(firebaseApp.options)!==JSON.stringify(config)){ existing.delete().catch(()=>{}); firebaseApp=null; }
        firebaseApp = firebase.apps.find(a=>a.name==='cbcSync') || firebase.initializeApp(config, 'cbcSync');
        fbDb = firebaseApp.database();
        const auth = firebaseApp.auth();
        if(auth.currentUser){ resolve(fbDb); return; }
        auth.signInAnonymously().then(()=>resolve(fbDb)).catch(reject);
      }catch(e){ reject(e); }
    });
  });
}
function parseFirebaseConfigText(text){
  try{ const j = JSON.parse(text); if(j && typeof j==='object') return j; }catch(e){}
  try{
    let t = text.trim().replace(/^\s*(export\s+)?(const|var|let)\s+\w+\s*=\s*/,'').replace(/;\s*$/,'');
    const obj = Function('"use strict"; return (' + t + ');')();
    if(obj && typeof obj==='object') return obj;
  }catch(e){}
  return null;
}
function encodeSyncCode(config){ return btoa(unescape(encodeURIComponent(JSON.stringify(config)))); }
function decodeSyncCode(code){ try{ return JSON.parse(decodeURIComponent(escape(atob(code)))); }catch(e){ return null; } }

function schoolDataRef(code){ return fbDb.ref('schools/'+code+'/data'); }
function schoolMarksRef(code){ return fbDb.ref('schools/'+code+'/marks'); }
function markLeafRef(code, examId, sid, areaId){ return fbDb.ref('schools/'+code+'/marks/'+examId+'/'+sid+'/'+areaId); }

/* ============================= PARENT PORTAL: MINIMAL-DATA LOOKUP =============================
   bootstrapFromCloudIfNeeded() (used by DOS/HOI and Teacher logins) intentionally pulls the
   WHOLE school node — every learner, every teacher's and DOS/HOI's login, every class — down
   to the device and saves it into DB/localStorage. That's correct for staff, who are meant to
   hold that data on their own device. It is NOT correct for a parent: a parent proves they
   know one child's name + admission number, and the school's introduction of a public-facing
   Parent Portal means the visitor is, by definition, a member of the public rather than
   vetted school staff — so a parent login must never cause the rest of the school's data
   (other learners' marks, staff usernames/passwords, other classes) to land on that parent's
   own device, on screen or off it, even transiently in memory, and certainly not persisted.
   These two functions keep the parent flow on a separate, narrow path instead of reusing the
   staff bootstrap:
   - parentCloudLookup() reads the school's data straight from Firebase into a throwaway local
     variable — never assigned into the shared DB object — purely to find the matching learner.
   - buildParentSafeSchool() then throws away everything except that one learner's own class:
     that class only (not the school's other classes), only that class's exams and marks (not
     other classes'), only the names of teachers actually assigned to that class (their
     login credentials are dropped, and any assignments they hold to other classes are dropped
     too), and no DOS/HOI accounts at all. This is what actually goes into parentSchoolData —
     the only data structure a parent session reads from — and it is what's used whether the
     lookup came from the cloud just now or (offline, no sync configured) from a local DB that
     already had the full school in it from a prior staff login on this device.
   Residual risk worth knowing about even after this: Firebase's default "test mode" rules (see
   the SECURITY NOTE above initSync) let anyone who has the project's config read the *entire*
   raw schools/{code} node directly, bypassing this app's UI and this filtering entirely — a
   Parent Portal makes the school code far more widely known than when only staff had it, so
   this is the point at which tightening the Firebase Realtime Database rules in the Firebase
   console (restricting reads on schools/{code} to authenticated staff, not just relying on the
   path convention) stops being optional. That change has to be made in the Firebase console
   for this project — it cannot be enforced from inside this HTML file. */
async function parentCloudLookup(code, config){
  await initSync(config);
  const [dataSnap, marksSnap] = await Promise.all([
    schoolDataRef(code).once('value'),
    schoolMarksRef(code).once('value')
  ]);
  const remote = dataSnap.val();
  if(!remote) return null;
  return ensureSchoolShape(Object.assign({}, remote, {marks: marksSnap.val()||{}}));
}
function buildParentSafeSchool(fullSchool, student){
  const cls = fullSchool.classes.find(c=>c.id===student.classId);
  // Exams for the learner's current grade, plus any past exam they actually sat (e.g. before being moved
  // or promoted). Parents never receive unreleased exams (when approval is required) or the staff-only
  // edit-request log.
  const sat = e => !!((fullSchool.marks[e.id]||{})[student.id]);
  const exams = fullSchool.exams.filter(e=>(e.classId===student.classId || sat(e)) && examVisibleToParent(fullSchool,e))
    .map(e=>Object.assign({}, e, {editRequests: [], approvalNote: ''}));
  const examIds = new Set(exams.map(e=>e.id));
  const gradeIds = new Set([student.classId, ...exams.map(e=>e.classId)]);
  const marks = {};
  examIds.forEach(id=>{ if(fullSchool.marks[id]) marks[id] = fullSchool.marks[id]; });
  // Classmates' marks are needed (unnamed, via id) to compute this learner's position — but nothing
  // beyond id/name/adm/classId about them leaves the school.
  const students = fullSchool.students.filter(s=>s.id===student.id || s.classId===student.classId || [...examIds].some(id=>(fullSchool.marks[id]||{})[s.id]))
    .map(s=>({id:s.id, name:s.name, adm:s.adm, classId:s.classId}));
  const teachers = fullSchool.teachers
    .filter(t=>t.assignments.some(a=>gradeIds.has(a.classId)))
    .map(t=>({id:t.id, name:t.name, assignments:t.assignments.filter(a=>gradeIds.has(a.classId))}));
  const classTeachers = {}; gradeIds.forEach(id=>{ if(fullSchool.classTeachers[id]) classTeachers[id] = fullSchool.classTeachers[id]; });
  // Attendance: only this one learner's own days-present, and only for exams already in
  // scope above — never a classmate's, since attendance isn't needed to compute position.
  const attendance = {};
  examIds.forEach(id=>{
    const days = (fullSchool.attendance[id]||{})[student.id];
    if(days!=null) attendance[id] = {[student.id]: days};
  });
  return ensureSchoolShape({
    name: fullSchool.name, code: fullSchool.code, address: fullSchool.address,
    phone: fullSchool.phone, email: fullSchool.email, hoiName: fullSchool.hoiName, hoiSignature: fullSchool.hoiSignature,
    logo: fullSchool.logo, motto: fullSchool.motto, regNo: fullSchool.regNo,
    status: fullSchool.status, trialEndsAt: fullSchool.trialEndsAt,
    gradingSystem: fullSchool.gradingSystem, learningAreas: fullSchool.learningAreas,
    classes: fullSchool.classes.filter(c=>gradeIds.has(c.id)),
    classTeachers,
    exams, marks, students, teachers, dos: [], attendance
  });
}

function nonMarksSnapshot(school){
  // Stamp _updatedAt only if this school has never been stamped at all (e.g. a brand-new
  // school pushed by the admin, which never went through saveDB's edit-time stamp). Do NOT
  // re-stamp on every push: saveDB() already set _updatedAt at the moment of the edit, and
  // that is the value that must be sent to Firebase. If we re-stamp here with a fresh
  // Date.now() at push time instead, the echo of our OWN write comes back with a timestamp
  // newer than what's sitting in local memory, and mergeDataFromCloud() mistakes it for a
  // genuine remote change — firing a spurious "updated from another device" toast and a
  // full re-render on every single local edit (and, if a second edit lands in the gap
  // before that echo arrives, letting the echo's stale snapshot clobber it).
  if(!school._updatedAt) school._updatedAt = Date.now();
  const clone = JSON.parse(JSON.stringify(school));
  delete clone.marks;
  return clone;
}
function scheduleCloudPush(){
  if(!syncState.enabled) return;
  const school = (session && (session.role==='dos'||session.role==='teacher')) ? DB.schools[session.schoolCode] : null;
  if(!school || !school.syncConfig || !school.syncConfig.enabled || !fbDb) return;
  clearTimeout(syncState.pushTimer);
  syncState.pushTimer = setTimeout(()=>{
    schoolDataRef(school.code).set(nonMarksSnapshot(school)).catch(e=>console.warn('Cloud sync push failed', e));
  }, 300);
}
function pushMarkToCloud(code, examId, sid, areaId, val){
  if(!syncState.enabled || !fbDb) return;
  markLeafRef(code, examId, sid, areaId).set(val).catch(e=>console.warn('Mark sync failed', e));
}

/* ============================= PLATFORM-WIDE AUTO DISCOVERY =============================
   Reuses the exact same Multi-Device Sync mechanism above, but points it at ONE shared
   Firebase project for the whole deployment (window.PLATFORM_FIREBASE_CONFIG, from
   firebase-config.js) instead of a project each school pastes in by hand. This is what
   makes "School code not found" resolve automatically: the admin's device pushes a new
   school's (non-marks) data to schools/{code}/data on the shared project the moment it's
   created or edited, and resolveLoginSyncConfig() below falls back to that same project
   whenever a device sees a school code it has never met before, so DOS/HOI and Teacher
   links just work on a brand-new device without anyone manually setting up sync.
   If the deployment never configures a shared project, everything still works exactly
   as before — single-device only, unless a school sets up its own Multi-Device Sync. */
function hasPlatformConfig(){ return !!(window.PLATFORM_FIREBASE_CONFIG && window.PLATFORM_FIREBASE_CONFIG.apiKey && window.PLATFORM_FIREBASE_CONFIG.databaseURL); }
// Fire-and-forget: pushes one school's current (non-marks) data to the shared project.
// Used by admin actions (create/suspend/activate/delete/reset password/etc.) which don't
// go through the DOS/teacher session's own scheduleCloudPush().
function pushSchoolDataToPlatform(code){
  const school = DB.schools[code]; if(!school) return;
  // This runs for admin-driven edits (create/suspend/activate/delete/reset password,
  // edit trial, etc.), which never pass through a DOS/teacher session's saveDB stamp
  // (see saveDB above — it only bumps _updatedAt for the active dos/teacher session's
  // own school). Without a fresh stamp here, nonMarksSnapshot() would resend the OLD
  // timestamp alongside the NEW status, and a DOS/HOI or Teacher device whose local copy
  // happens to carry a newer timestamp (from its own last edit) would treat the admin's
  // suspend/activate/edit as stale and silently ignore it — which is exactly how a
  // suspended school could keep letting people log in. Stamping it fresh here guarantees
  // an admin action always wins.
  school._updatedAt = Date.now();
  saveDB(DB, {skipCloud:true});
  const snapshot = nonMarksSnapshot(school);
  // Push to EVERY project this school's data could be read from: the deployment's shared
  // platform project (if configured), AND — separately — the school's own private
  // Firebase project if it set up its own Multi-Device Sync instead of (or in addition
  // to) the shared one. Without this second leg, an admin action taken on a school that
  // opted into its own private project would only ever update the admin's local copy and
  // would never actually reach that school's own devices.
  const targets = [];
  if(hasPlatformConfig()) targets.push(window.PLATFORM_FIREBASE_CONFIG);
  const ownConfig = school.syncConfig && school.syncConfig.config;
  if(ownConfig && (!hasPlatformConfig() || JSON.stringify(ownConfig)!==JSON.stringify(window.PLATFORM_FIREBASE_CONFIG))){
    targets.push(ownConfig);
  }
  if(!targets.length) return;
  (async ()=>{
    for(const config of targets){
      try{
        await initSync(config);
        await schoolDataRef(code).set(snapshot);
      }catch(e){ console.warn('Directory push to a sync target failed', e); }
    }
  })();
}
// Fire-and-forget: removes a school's entry from every project it could be resolved
// from — the shared platform project (if configured) and, if the school had set up its
// own private Firebase project, that one too. Pass the school's syncConfig.config
// (captured BEFORE deleting the school locally) as ownConfig so a private-project school
// is fully cleaned up, not just removed from the shared directory.
function removeSchoolFromPlatform(code, ownConfig){
  const targets = [];
  if(hasPlatformConfig()) targets.push(window.PLATFORM_FIREBASE_CONFIG);
  if(ownConfig && (!hasPlatformConfig() || JSON.stringify(ownConfig)!==JSON.stringify(window.PLATFORM_FIREBASE_CONFIG))){
    targets.push(ownConfig);
  }
  if(!targets.length) return;
  (async ()=>{
    for(const config of targets){
      try{
        await initSync(config);
        await schoolDataRef(code).remove();
        await schoolMarksRef(code).remove();
      }catch(e){ console.warn('Remove from a sync target failed', e); }
    }
  })();
}
// Fetches the freshest non-marks snapshot for one school directly from whichever
// sync target(s) apply, WITHOUT touching local storage. Checks both the shared
// platform project (if configured) and the school's own private project (if it set
// one up) and returns whichever copy has the newer _updatedAt. Returns null if the
// school isn't using sync at all, or nothing was reachable.
async function fetchRemoteSchoolData(code){
  const school = DB.schools[code];
  const targets = [];
  if(hasPlatformConfig()) targets.push(window.PLATFORM_FIREBASE_CONFIG);
  const ownConfig = school && school.syncConfig && school.syncConfig.config;
  if(ownConfig && (!hasPlatformConfig() || JSON.stringify(ownConfig)!==JSON.stringify(window.PLATFORM_FIREBASE_CONFIG))){
    targets.push(ownConfig);
  }
  let best = null;
  for(const config of targets){
    try{
      await initSync(config);
      const snap = await schoolDataRef(code).once('value');
      const remote = snap.val();
      if(remote && (!best || (remote._updatedAt||0) > (best._updatedAt||0))) best = remote;
    }catch(e){ console.warn('Fetching latest school data from a sync target failed', e); }
  }
  return best;
}
// Pulls the freshest copy of a school's data (classes, students, teachers, exams,
// grading, etc.) from the cloud into local storage, if the cloud copy is newer than
// what this device is holding. Returns true if local storage was updated.
//
// WHY THIS EXISTS: the admin dashboard never attaches a live listener to a school's
// data node the way a DOS/teacher session does (see ensureSyncConnected, only called
// for session.role 'dos'/'teacher') — so an admin device's local copy of a school can
// silently go stale (e.g. missing learners the DOS added on their own device). Admin
// actions like Suspend re-push the school's local object stamped with a brand-new
// timestamp so it "wins" over the school's own device (see pushSchoolDataToPlatform).
// Pushing a STALE local copy with a winning timestamp is exactly what overwrites and
// deletes real, newer data — so every admin edit must call this first.
async function refreshSchoolFromCloud(code){
  const remote = await fetchRemoteSchoolData(code);
  if(!remote) return false;
  const local = DB.schools[code];
  if(local && (local._updatedAt||0) >= (remote._updatedAt||0)) return false; // local already at least as fresh
  const marks = local ? local.marks : {};
  const syncConfig = local ? local.syncConfig : null;
  DB.schools[code] = ensureSchoolShape(Object.assign({}, remote, {marks: marks||{}, syncConfig}));
  saveDB(DB, {skipCloud:true});
  return true;
}
// Wraps a one-field (or few-field) admin edit — activate, suspend, reset password,
// edit trial, etc. Refreshes from the cloud FIRST so the edit, and the re-push that
// follows it, build on the school's actual current data instead of whatever stale
// snapshot this admin device happened to be holding. `mutate` receives the freshened
// school object and should apply the admin's change to it directly.
async function adminEditAndPush(code, mutate){
  await refreshSchoolFromCloud(code);
  const school = DB.schools[code];
  if(!school) return null;
  mutate(school);
  saveDB(DB);
  pushSchoolDataToPlatform(code);
  return school;
}
// Refreshes every school's data from the cloud (see refreshSchoolFromCloud) and
// re-renders the admin dashboard if anything changed, so learner/class counts shown
// to the admin reflect what's actually on each school's own device(s) rather than a
// stale local cache. `silent` suppresses the "already up to date" toast — used for
// the automatic background refresh on admin login, as opposed to a manual click.
async function refreshAllSchoolsFromCloud(silent){
  const codes = Object.keys(DB.schools);
  let anyUpdated = false;
  for(const code of codes){
    try{ if(await refreshSchoolFromCloud(code)) anyUpdated = true; }
    catch(e){ console.warn('Refresh failed for', code, e); }
  }
  if(anyUpdated){ if(session && session.role==='admin') renderAdmin(); if(!silent) toast('School data refreshed from cloud'); }
  else if(!silent) toast('Already up to date');
}
// Re-renders just enough to reflect a cloud update, without discarding whatever the
// user currently has open or interrupting anyone actively typing. Two teachers (or a
// teacher and the HOI/DOS) can be entering marks for the same class — sometimes even the
// same learning area — at the same time, and the old approach of tearing down and
// rebuilding the whole marks table on every remote change made the grid visibly
// "shake"/flicker and could yank focus (and any unsaved keystroke) out of whichever cell
// someone was mid-edit in. patchMarksGrid() below updates only the cells that actually
// changed, in place, and always skips the cell the user is currently focused on — so a
// colleague's save just quietly appears next to the row they're on, instead of disturbing
// the sheet. A full reload only happens when patching isn't safe (nothing loaded yet, or
// the roster itself changed under us).
function softRefresh(){
  if(!session) return;
  if(session.role==='teacher'){
    // The DOS/HOI may have changed this teacher's assignments or permissions — redraw at once.
    const _t = currentTeacher();
    if(!_t){ logout(); setTimeout(()=>toast('Your teacher account is no longer available','err'),50); return; }
    if(teacherSig(currentSchool(), _t)!==_teacherSig){ renderTeacher(); toast('Your access was updated by the DOS/HOI'); return; }
    try{ renderTeacherApprovals(); }catch(e){}
    softRefreshMarksGrid('#marksGridArea', ()=>({examId: qs('#tExam')&&qs('#tExam').value, areaId: qs('#tArea')&&qs('#tArea').value, classId: qs('#tClass')&&qs('#tClass').value}), loadMarksGrid);
  } else if(session.role==='dos'){
    if(dosTab==='marks'){
      softRefreshMarksGrid('#dosMarksGridArea', ()=>({examId: qs('#dmExam')&&qs('#dmExam').value, areaId: qs('#dmArea')&&qs('#dmArea').value, classId: qs('#dmClass')&&qs('#dmClass').value}), loadDosMarksGrid);
    } else {
      renderDOS();
    }
  }
}
function softRefreshMarksGrid(containerSel, readSelection, fullReloadFn){
  const container = qs(containerSel);
  const {examId, areaId, classId} = readSelection();
  if(!container || !container.innerHTML.trim() || !examId || !areaId || !classId){
    // Nothing loaded (or nothing selected yet) — no sheet on screen to disturb either way.
    if(containerSel==='#marksGridArea'){ try{ renderTeacherHistory(); }catch(e){} }
    return;
  }
  const school = currentSchool();
  const exam = school.exams.find(e=>e.id===examId);
  const inputs = container.querySelectorAll('.markInput');
  const learners = studentsInClass(school, classId);
  if(!exam || inputs.length !== learners.length){
    // The roster or exam changed under us (a learner was added/removed elsewhere) — a
    // patch can't safely add/remove rows, so fall back to a full reload just this once.
    try{ fullReloadFn(); }catch(e){}
    return;
  }
  const max = exam.maxMarksByArea[areaId] ?? 100;
  const marksForExam = school.marks[examId] || {};
  inputs.forEach(input=>{
    if(document.activeElement===input) return; // never touch the cell someone is actively typing into
    const sid = input.dataset.sid;
    const score = (marksForExam[sid]||{})[areaId];
    const newVal = score==null ? '' : String(score);
    if(input.value === newVal) return; // already showing the current value — leave it alone
    input.value = newVal;
    const pctCell = container.querySelector('.pctCell-'+sid);
    const lvlCell = container.querySelector('.lvlCell-'+sid);
    if(score!=null){
      const pct = pctOf(score,max);
      if(pctCell) pctCell.textContent = pct.toFixed(1)+'%';
      if(lvlCell) lvlCell.innerHTML = levelBadge(school,pct,classId);
    } else {
      if(pctCell) pctCell.textContent = '-';
      if(lvlCell) lvlCell.innerHTML = '-';
    }
  });
}
// Plain JSON.stringify(a) !== JSON.stringify(b) is not a safe way to detect a real change:
// Firebase can return an object's keys in a different order than they were inserted
// locally (it tends to sort them), so the exact same marks data round-tripping back from
// the DOS/HOI's own save could stringify differently and look "changed" even though
// nothing actually changed — triggering a pointless reload after every single score.
// This compares by value instead of by key order.
function deepEqual(a,b){
  if(a===b) return true;
  if(typeof a!=='object'||typeof b!=='object'||a===null||b===null) return false;
  const ka=Object.keys(a), kb=Object.keys(b);
  if(ka.length!==kb.length) return false;
  for(const k of ka){ if(!deepEqual(a[k], b[k])) return false; }
  return true;
}
/* Exam approval helpers ---------------------------------------------------------- */
function touchExam(e){ e.stateAt = Date.now(); }
// Is this exam's result allowed out to parents / teacher-printed reports?
function examReleased(school, e){ return !school.requireApproval || e.resultsApproval==='approved'; }
// Whether THIS exam should reach the Parent Portal specifically — everything examReleased()
// already requires (results out of approval-hold), PLUS the exam's own parentVisible flag
// (a DOS/HOI can hide one exam from parents, e.g. a mock, without touching its approval
// state or hiding it from teachers/reports) AND the school-wide portal switch. Only ever
// used for what a parent session can see — teacher/DOS views keep using examReleased().
function examVisibleToParent(school, e){
  return school.parentPortalEnabled!==false && e.parentVisible!==false && examReleased(school, e);
}
// How many marks are entered vs expected (every learner x every learning area of the class).
function examCompletion(school, e){
  const learners = studentsInClass(school, e.classId), areas = areasForClass(school, e.classId);
  const mk = school.marks[e.id] || {};
  let filled = 0;
  learners.forEach(l=>areas.forEach(a=>{ const v=(mk[l.id]||{})[a.id]; if(v!=null && v!=='') filled++; }));
  return {filled, total: learners.length*areas.length};
}
// Two devices can change the same exam at once (a teacher submits an edit request while the
// DOS/HOI approves). The school blob syncs last-write-wins, which could silently drop the
// loser's change, so exam approval state is folded together instead: edit requests are
// unioned by id (a decision beats "pending"), and the newer stateAt wins for the exam-level
// state. Folds `other` into `base`; returns true if `base` changed.
function mergeExamStates(base, other){
  let changed = false;
  (base.exams||[]).forEach(be=>{
    const oe = (other.exams||[]).find(x=>x.id===be.id); if(!oe) return;
    be.editRequests = be.editRequests || [];
    (oe.editRequests||[]).forEach(r=>{
      const i = be.editRequests.findIndex(x=>x.id===r.id);
      if(i<0){ be.editRequests.push(r); changed = true; }
      else if(be.editRequests[i].status==='pending' && r.status!=='pending'){ be.editRequests[i] = r; changed = true; }
    });
    if((oe.stateAt||0) > (be.stateAt||0)){
      ['closed','closingDate','resultsApproval','approvalNote','approvedBy','approvalAt','stateAt','termCloseDate','nextTermDate','totalDays'].forEach(k=>{ be[k] = oe[k]; });
      changed = true;
    }
  });
  return changed;
}
function mergeMarksFromCloud(code, remote){
  const school = DB.schools[code]; if(!school) return;
  const incoming = remote || {};
  const changed = !deepEqual(school.marks||{}, incoming);
  if(changed){
    school.marks = incoming;
    saveDB(DB, {skipCloud:true});
    if(syncState.marksReady){ toast('🔄 Marks updated from another device'); softRefresh(); }
  }
  syncState.marksReady = true;
}
function mergeDataFromCloud(code, remote){
  if(!remote){ syncState.dataReady = true; return; }
  const local = DB.schools[code];
  const localTime = local ? (local._updatedAt||0) : -1;
  const remoteTime = remote._updatedAt || 0;
  if(!local || remoteTime > localTime){
    const marks = local ? local.marks : {};
    const merged = ensureSchoolShape(Object.assign({}, remote, {marks: marks||{}}));
    // Keep any edit request / approval change made on THIS device that the incoming copy hasn't seen yet.
    const keptLocal = local ? mergeExamStates(merged, local) : false;
    DB.schools[code] = merged;
    saveDB(DB, keptLocal ? undefined : {skipCloud:true});
    if(syncState.dataReady){ toast('🔄 School data updated from another device'); softRefresh(); }
  } else if(local && localTime > remoteTime){
    if(mergeExamStates(local, remote)) saveDB(DB, {skipCloud:true});
    scheduleCloudPush();
  }
  syncState.dataReady = true;
  enforceAccessForActiveSession(code);
}
function withTimeout(promise, ms, label){
  return new Promise((resolve, reject)=>{
    const t = setTimeout(()=>reject(new Error((label||'Operation')+' timed out after '+ms+'ms')), ms);
    promise.then(v=>{ clearTimeout(t); resolve(v); }, e=>{ clearTimeout(t); reject(e); });
  });
}
// Disables the login button and swaps its label while a login is in flight, so a slow
// network can't be mistaken for a stuck app and a person can't double-submit (which
// would fire two overlapping sync connections). Restores the original label on end;
// harmless no-op once the login screen itself has already been replaced by route().
function setLoginBusy(busy, text){
  const b = qs('#loginBtn'); if(!b) return;
  if(busy){
    if(!b.dataset.origLabel) b.dataset.origLabel = b.textContent;
    b.disabled = true;
    b.textContent = text || 'Please wait…';
  } else {
    b.disabled = false;
    if(b.dataset.origLabel) b.textContent = b.dataset.origLabel;
  }
}
async function bootstrapFromCloudIfNeeded(code, config){
  if(!config) return;
  try{
    await initSync(config);
    const [dataSnap, marksSnap] = await Promise.all([
      schoolDataRef(code).once('value'),
      schoolMarksRef(code).once('value')
    ]);
    const remote = dataSnap.val();
    const remoteMarks = marksSnap.val();
    if(remote){
      const local = DB.schools[code];
      const localTime = local ? (local._updatedAt||0) : -1;
      if(!local || (remote._updatedAt||0) >= localTime){
        DB.schools[code] = ensureSchoolShape(Object.assign({}, remote, {marks: remoteMarks||{}, syncConfig:{enabled:true, config}}));
      } else {
        local.marks = remoteMarks || local.marks;
        ensureSchoolShape(local);
      }
    } else if(DB.schools[code]){
      DB.schools[code].marks = remoteMarks || DB.schools[code].marks;
      ensureSchoolShape(DB.schools[code]);
    }
    if(DB.schools[code]){ DB.schools[code].syncConfig = {enabled:true, config}; saveDB(DB, {skipCloud:true}); }
  }catch(e){ console.warn('Cloud bootstrap failed (offline, or bad config?)', e); }
}
function attachLiveListeners(school){
  if(!syncState.enabled || !fbDb) return;
  detachLiveListeners();
  syncState.marksReady=false; syncState.dataReady=false;
  syncState.marksListenerRef = schoolMarksRef(school.code);
  syncState.marksListenerRef.on('value', snap=>mergeMarksFromCloud(school.code, snap.val()));
  syncState.dataListenerRef = schoolDataRef(school.code);
  syncState.dataListenerRef.on('value', snap=>mergeDataFromCloud(school.code, snap.val()));
}
function detachLiveListeners(){
  if(syncState.marksListenerRef){ syncState.marksListenerRef.off(); syncState.marksListenerRef=null; }
  if(syncState.dataListenerRef){ syncState.dataListenerRef.off(); syncState.dataListenerRef=null; }
}
function ensureSyncConnected(school){
  if(!school || !school.syncConfig || !school.syncConfig.enabled){ updateSyncBadge(null); return; }
  if(syncState.connectedCode===school.code && fbDb){ updateSyncBadge(true); return; }
  syncState.enabled = true;
  updateSyncBadge('connecting');
  initSync(school.syncConfig.config).then(()=>{
    syncState.connectedCode = school.code;
    attachLiveListeners(school);
    updateSyncBadge(true);
  }).catch(()=>updateSyncBadge(false));
}
function updateSyncBadge(state){
  const el = qs('#syncBadge'); if(!el) return;
  if(state===true) el.innerHTML = '&nbsp;|&nbsp;<span title="Multi-device sync is on">🟢 Synced</span>';
  else if(state==='connecting') el.innerHTML = '&nbsp;|&nbsp;<span title="Connecting…">🔄 Connecting…</span>';
  else if(state===false) el.innerHTML = '&nbsp;|&nbsp;<span title="Could not reach the sync service">🔴 Sync offline</span>';
  else el.innerHTML = '';
}

/* ============================= ADMIN CLOUD ACCOUNT SYNC =============================
   Lets the platform admin log in with the SAME password on every device, and have every
   school they've created show up automatically on a new device — instead of manually
   re-typing the admin password everywhere, or emailing yourself a backup file each time.
   Entirely optional and additive: an admin who never sets this up keeps the plain
   per-device password exactly as before.

   Design:
   - Uses real Firebase Authentication (email + password) for the admin's identity,
     instead of this app storing/comparing the password itself. Firebase checks the
     password server-side and never exposes it to the client, so — unlike the plain
     per-device admin password above, and unlike the school Multi-Device Sync config,
     which is just a shared convention — this is genuine, server-enforced security: only
     someone who actually knows the password can sign in as this account, and (with the
     database rule shown in the Cloud Admin Account panel) only that signed-in account can
     ever read or write its own admins/{uid} node.
   - Everything about the admin EXCEPT the local per-device password (schools + platform
     settings) is pushed as one JSON blob to admins/{uid}/data, stamped with _updatedAt;
     newer timestamp wins on merge — the same pattern used for school sync above.
   - What this does NOT (and structurally cannot, from a client-only app) prevent: someone
     who has the Firebase config trying to register their OWN separate cloud admin account
     on the same project. That is just normal email/password sign-up, and that account
     would only ever get its own empty, isolated node — never access to this one. The
     Cloud Admin Account panel explains this and shows the database rule + Firebase
     console setting that close that gap as far as this app is able to. */
let fbAdminApp = null, fbAdminAuth = null, fbAdminDb = null;
const adminSyncState = { pushTimer:null, dataListenerRef:null, ready:false };

function loadFirebaseAuthSdk(cb){
  loadFirebaseSdk(()=>{
    if(window.firebase && window.firebase.auth){ cb(); return; }
    const s3 = document.createElement('script');
    s3.src = 'https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js';
    s3.onload = cb;
    s3.onerror = ()=>toast('Could not reach the sync service — check your internet connection.','err');
    document.head.appendChild(s3);
  });
}
function initAdminCloud(config){
  return new Promise((resolve, reject)=>{
    loadFirebaseAuthSdk(()=>{
      try{
        const existing = firebase.apps.find(a=>a.name==='cbcAdmin');
        if(existing && fbAdminApp && JSON.stringify(fbAdminApp.options)!==JSON.stringify(config)){ existing.delete().catch(()=>{}); fbAdminApp=null; }
        fbAdminApp = firebase.apps.find(a=>a.name==='cbcAdmin') || firebase.initializeApp(config, 'cbcAdmin');
        fbAdminAuth = fbAdminApp.auth();
        fbAdminDb = fbAdminApp.database();
        resolve();
      }catch(e){ reject(e); }
    });
  });
}
function adminDataRef(uidVal){ return fbAdminDb.ref('admins/'+uidVal+'/data'); }
function adminCloudSnapshot(){ return { schools: DB.schools, settings: DB.settings, _updatedAt: Date.now() }; }
function scheduleAdminCloudPush(){
  if(!DB.adminSync || !DB.adminSync.enabled || !fbAdminDb) return;
  clearTimeout(adminSyncState.pushTimer);
  adminSyncState.pushTimer = setTimeout(()=>{
    const snap = adminCloudSnapshot();
    adminDataRef(DB.adminSync.uid).set(snap).then(()=>{
      DB.adminSync.lastSyncedAt = snap._updatedAt;
      saveDB(DB, {skipCloud:true});
    }).catch(e=>console.warn('Admin cloud push failed', e));
  }, 900);
}
function mergeAdminDataFromCloud(remote){
  if(!remote){ adminSyncState.ready = true; return; }
  const localTime = (DB.adminSync && DB.adminSync.lastSyncedAt) || 0;
  const remoteTime = remote._updatedAt || 0;
  if(remoteTime > localTime){
    DB.schools = remote.schools || {};
    if(remote.settings) DB.settings = remote.settings;
    DB.adminSync.lastSyncedAt = remoteTime;
    saveDB(DB, {skipCloud:true});
    if(adminSyncState.ready){ toast('🔄 Admin data updated from another device'); if(session && session.role==='admin') renderAdmin(); }
  } else if(remoteTime < localTime){
    scheduleAdminCloudPush();
  }
  adminSyncState.ready = true;
}
function attachAdminLiveListener(){
  detachAdminLiveListener();
  if(!DB.adminSync || !DB.adminSync.enabled || !fbAdminDb) return;
  adminSyncState.ready = false;
  adminSyncState.dataListenerRef = adminDataRef(DB.adminSync.uid);
  adminSyncState.dataListenerRef.on('value', snap=>mergeAdminDataFromCloud(snap.val()));
}
function detachAdminLiveListener(){
  if(adminSyncState.dataListenerRef){ adminSyncState.dataListenerRef.off(); adminSyncState.dataListenerRef=null; }
}
function ensureAdminSyncConnected(){
  if(!DB.adminSync || !DB.adminSync.enabled){ updateSyncBadge(null); return; }
  updateSyncBadge('connecting');
  initAdminCloud(DB.adminSync.config).then(()=>{
    attachAdminLiveListener();
    updateSyncBadge(true);
  }).catch(()=>updateSyncBadge(false));
}
async function createAdminCloudAccount(config, email, password){
  await initAdminCloud(config);
  const cred = await fbAdminAuth.createUserWithEmailAndPassword(email, password);
  const uidVal = cred.user.uid;
  DB.adminSync = {enabled:true, config, email, uid:uidVal, lastSyncedAt:0};
  saveDB(DB, {skipCloud:true});
  const snap = adminCloudSnapshot();
  await adminDataRef(uidVal).set(snap);
  DB.adminSync.lastSyncedAt = snap._updatedAt;
  saveDB(DB, {skipCloud:true});
  attachAdminLiveListener();
  return uidVal;
}
async function signInAdminCloud(config, email, password){
  await initAdminCloud(config);
  const cred = await fbAdminAuth.signInWithEmailAndPassword(email, password);
  const uidVal = cred.user.uid;
  const keepTime = (DB.adminSync && DB.adminSync.uid===uidVal) ? DB.adminSync.lastSyncedAt : 0;
  DB.adminSync = {enabled:true, config, email, uid:uidVal, lastSyncedAt: keepTime||0};
  saveDB(DB, {skipCloud:true});
  const dataSnap = await adminDataRef(uidVal).once('value');
  mergeAdminDataFromCloud(dataSnap.val());
  attachAdminLiveListener();
  return uidVal;
}
function unlinkAdminCloud(){
  if(!confirm("Unlink this device from your cloud admin account? Your admin password and every school already saved on THIS device are kept — only automatic cross-device syncing stops.")) return;
  detachAdminLiveListener();
  if(DB.adminSync) DB.adminSync.enabled = false;
  saveDB(DB, {skipCloud:true});
  updateSyncBadge(null);
  renderAdmin();
}
async function changeAdminCloudPassword(curPw, newPw){
  const cred = firebase.auth.EmailAuthProvider.credential(DB.adminSync.email, curPw);
  await fbAdminAuth.currentUser.reauthenticateWithCredential(cred);
  await fbAdminAuth.currentUser.updatePassword(newPw);
}

function uid(prefix){ return prefix + Math.random().toString(36).slice(2,9); }
function gen8DigitCode(){
  let code;
  do{ code = String(Math.floor(10000000 + Math.random()*90000000)); }
  while(DB.schools[code]);
  return code;
}

function defaultGrading(){
  return [
    {level:'EE', label:'Exceeding Expectation', min:80, max:100, points:4, remark:'Excellent work, keep soaring high!'},
    {level:'ME', label:'Meeting Expectation', min:60, max:79, points:3, remark:'Good performance, aim higher next term.'},
    {level:'AE', label:'Approaching Expectation', min:40, max:59, points:2, remark:'Fair effort, more practice needed.'},
    {level:'BE', label:'Below Expectation', min:0, max:39, points:1, remark:'Needs serious improvement and support.'}
  ];
}
function defaultAreas(){
  return ['Mathematics','English','Kiswahili','Science & Technology','Social Studies','Creative Arts','Agriculture','CRE','Physical Education']
    .map(n=>({id:uid('la_'), name:n, classIds: []}));
}
function newSchool(name, dosUsername, dosPassword, hoiName, address, email, phone){
  const code = gen8DigitCode();
  const now = Date.now();
  const trialDays = DB.settings.trialDays || 14;
  DB.schools[code] = {
    code, name,
    hoiName: hoiName || 'Head of Institution',
    hoiSignature: '', // data URL of the HOI's saved signature, drawn once and reused on every report
    logo: '', // data URL of the school badge/crest, shown on every printed report and sheet header
    motto: '', regNo: '', // school motto and NEMIS/registration number, shown under the school name
    address: address || '', email: email || '', phone: phone || '',
    status: 'trial', // 'trial' | 'active' | 'suspended'
    createdAt: now,
    trialDays: trialDays,
    trialEndsAt: now + trialDays*24*60*60*1000,
    gradingSystem: defaultGrading(),
    learningAreas: defaultAreas(),
    classes: [],
    students: [],
    teachers: [],
    dos: [{id:uid('dos_'), name:'DOS/HOI', username: dosUsername, password: dosPassword || 'hoi123'}],
    exams: [],
    marks: {}, // examId -> { adm -> {areaId: score} }
    classTeachers: {}, // classId -> teacher name
    // Default every new school onto the deployment's shared project (if configured) so
    // its DOS/HOI and Teacher links resolve automatically on any device, with no manual
    // Multi-Device Sync setup needed. The school can still switch to its own private
    // Firebase project later from "My Account", or turn sync off entirely.
    syncConfig: hasPlatformConfig() ? {enabled:true, config: window.PLATFORM_FIREBASE_CONFIG} : null
  };
  saveDB(DB);
  pushSchoolDataToPlatform(code);
  return code;
}
/* ============================= ACCESS / SUBSCRIPTION CONTROL ============================= */
function schoolAccessStatus(school){
  if(!school) return {ok:false, msg:'This portal is not available. Please contact your school administrator.'};
  if(school.status==='suspended') return {ok:false, msg:'Access to this portal is currently unavailable. Please contact your school administrator.'};
  if(school.status==='trial' && Date.now() > school.trialEndsAt) return {ok:false, msg:'The trial period for this portal has ended. Please contact your school administrator to restore access.'};
  return {ok:true};
}
function schoolStatusLabel(s){
  if(s.status==='suspended') return '<span class="badge BE">Suspended</span>';
  if(s.status==='active') return '<span class="badge EE">Active</span>';
  const daysLeft = Math.ceil((s.trialEndsAt-Date.now())/86400000);
  if(daysLeft<=0) return '<span class="badge BE">Trial Expired</span>';
  return `<span class="badge AE">Trial: ${daysLeft}d left</span>`;
}

/* ============================= SESSION ============================= */
let session = JSON.parse(sessionStorage.getItem('cbc_session')||'null');
// Holds the trimmed, single-learner view a parent session works from (see
// buildParentSafeSchool below). Deliberately a plain in-memory variable, never written
// to DB/localStorage: a parent's own device should end this session holding nothing
// more than what was on screen. It does not survive a page refresh on purpose — route()
// below sends a parent back to the login form if it's missing, so a reload never tries
// to silently serve stale data and never needs the full school pulled again unless the
// parent actively re-identifies their child.
let parentSchoolData = null;
function setSession(s){ session = s; sessionStorage.setItem('cbc_session', JSON.stringify(s)); resetInactivityTimer(); }
function logout(){ session=null; parentSchoolData=null; sessionStorage.removeItem('cbc_session'); syncState.enabled=false; syncState.connectedCode=null; detachLiveListeners(); detachAdminLiveListener(); clearTimeout(inactivityTimer); route(); }

function currentSchool(){ return session && session.schoolCode ? DB.schools[session.schoolCode] : null; }

/* ============================= INACTIVITY AUTO-LOGOUT =============================
   Any signed-in session (Admin, DOS/HOI, or Teacher) is signed out automatically after
   15 minutes with no mouse/keyboard/touch/scroll activity — both for security on shared
   school computers and so a suspended/expired account isn't left logged in indefinitely. */
const INACTIVITY_LIMIT_MS = 15*60*1000;
let inactivityTimer = null;
function resetInactivityTimer(){
  clearTimeout(inactivityTimer);
  if(!session) return;
  inactivityTimer = setTimeout(()=>{
    if(session){
      logout();
      setTimeout(()=>toast('You were signed out after 15 minutes of inactivity.','err'), 50);
    }
  }, INACTIVITY_LIMIT_MS);
}
['mousemove','mousedown','keydown','scroll','touchstart','click'].forEach(evt=>{
  window.addEventListener(evt, resetInactivityTimer, {passive:true});
});
// Also re-arm whenever the tab regains focus/visibility, in case timers were throttled
// while the tab was backgrounded.
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) resetInactivityTimer(); });

/* ============================= LIVE ACCESS ENFORCEMENT =============================
   Suspending a school (or letting a trial expire) should lock out anyone already signed
   in on that school immediately — not just block their *next* login. When synced school
   data changes (see mergeDataFromCloud below), this checks whether the currently active
   DOS/HOI or Teacher session on this device still has access, and force-logs them out
   right away if not. */
function enforceAccessForActiveSession(code){
