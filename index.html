/* ============================= TEACHER VIEW ============================= */
/* --- Teacher access scope ---------------------------------------------------------
   A teacher only ever gets: (1) the class + learning-area combinations the DOS/HOI has
   assigned to them, and (2) the extra screens the DOS/HOI has switched on for them
   (canPrint = learner reports, canPrintAssess = assessment sheets / previous exams,
   canPostAssignments = sending printable assignments to the Parent Portal).
   Enforced here at function level — not just by hiding buttons — so every screen, sheet
   and save re-checks it. All helpers are inert for DOS/HOI, Admin and Parent sessions. */
let _teacherSig = '';
function currentTeacher(){
  if(!session || session.role!=='teacher') return null;
  const sc = currentSchool();
  return sc ? (sc.teachers.find(x=>x.id===session.userId)||null) : null;
}
function canEdit(){ if(!session||session.role!=='finance') return true; const fi=currentFinance(); return !(fi&&fi.level==='view'); }
function noEdit(){ toast('View-only account — you can view and print, but not change records','err'); }
function currentFinance(){
  if(!session || session.role!=='finance') return null;
  const sc = currentSchool();
  return sc ? (sc.finance.find(x=>x.id===session.userId)||null) : null;
}
// Learning areas this teacher is assigned to in one class (must still be valid for that class).
function teacherAreaIds(school, t, classId){
  const valid = new Set(areasForClass(school, classId).map(a=>a.id));
  return [...new Set(t.assignments.filter(a=>a.classId===classId).map(a=>a.areaId))].filter(id=>valid.has(id));
}
// Classes the teacher is assigned to (only ones that still exist and still have an assigned area).
function teacherClassIds(school, t){
  return [...new Set(t.assignments.map(a=>a.classId))]
    .filter(cid=>school.classes.some(c=>c.id===cid) && teacherAreaIds(school,t,cid).length);
}
// Learning areas a viewer may see for a class: everyone else sees all, a teacher only their own.
function visibleAreas(school, classId){
  const all = areasForClass(school, classId);
  if(!session || session.role!=='teacher') return all;
  const t = currentTeacher(); if(!t) return [];
  const ids = new Set(teacherAreaIds(school, t, classId));
  return all.filter(a=>ids.has(a.id));
}
// perm: null | 'canPrint' | 'canPrintAssess' | 'canPostAssignments'. areaId optional (checks that exact assignment).
function teacherMay(perm, classId, areaId){
  const t = currentTeacher(); if(!t) return false;
  const school = currentSchool();
  if(classId && !teacherAreaIds(school,t,classId).length) return false;
  if(areaId && !teacherAreaIds(school,t,classId).includes(areaId)) return false;
  return perm ? t[perm]===true : true;
}
// True (after telling the teacher) when a teacher session is NOT allowed; false for everyone else.
function teacherDenied(perm, classId, areaId){
  if(!session || session.role!=='teacher') return false;
  if(teacherMay(perm, classId, areaId)) return false;
  toast("You don't have access to that — ask your DOS/HOI","err");
  return true;
}
// Fingerprint of everything that decides what a teacher may see, so a live change made by
// the DOS/HOI (new/removed assignment, permission on/off) re-draws the teacher's screen.
function teacherSig(school, t){
  return JSON.stringify([teacherClassIds(school,t).map(cid=>[cid, teacherAreaIds(school,t,cid).sort()]), !!t.canPrint, !!t.canPrintAssess, !!t.canPostAssignments,
    (t.classTeacherOf||[]).slice().sort(), !!t.canApproveResults, !!t.canApproveEditRequests, !!t.canManageEntry]);
}

// Class Teacher Tools: shown to a teacher for any grade(s) listed in their classTeacherOf,
// independent of whether they're also assigned a learning area there. Deliberately mirrors
// (a scoped-down copy of) the DOS/HOI's own exam-management card in tplExamCard, rather than
// reusing it directly, so DOS-only controls (delete exam, closing-date field) never appear
// here and each button only renders when this specific teacher holds that specific permission.
function tplClassTeacherExams(school, t){
  const classes = (t.classTeacherOf||[]).filter(cid=>school.classes.some(c=>c.id===cid));
  if(!classes.length) return '';
  const classNames = classes.map(cid=>escapeHtml(school.classes.find(c=>c.id===cid).name)).join(', ');
  const exams = school.exams.filter(e=>classes.includes(e.classId)).slice().reverse();
  return `<div class="card no-print"><h2>📋 Class Teacher Tools</h2>
  <p class="small">Class teacher for: <b>${classNames}</b></p>
  ${exams.length ? exams.map(e=>tplClassTeacherExamCard(school,e,t)).join('') : '<p class="small">No exams recorded yet for your grade(s).</p>'}
  </div>`;
}
function tplClassTeacherExamCard(school, e, t){
  const cls = school.classes.find(c=>c.id===e.classId);
  const closed = isExamClosed(e);
  const pending = (e.editRequests||[]).filter(r=>r.status==='pending');
  const approvalBadge = e.resultsApproval==='approved' ? '<span class="badge EE">✅ Approved</span>'
    : e.resultsApproval==='disapproved' ? '<span class="badge BE">❌ Disapproved</span>'
    : '<span class="badge AE">⏳ Pending Review</span>';
  const hasSignoffTools = t.canApproveResults || t.canApproveEditRequests || t.canManageEntry;
  return `<div class="card" style="background:#f6f9fc;margin-bottom:10px">
  <h3 style="margin:0 0 6px;font-size:15px;color:var(--navy)">${escapeHtml(e.name)} <span class="small">— ${e.term} ${e.year} — ${cls?escapeHtml(cls.name):'-'}</span></h3>
  ${hasSignoffTools ? `<p class="small" style="margin:0 0 4px"><b>Entry:</b> ${closed?'<span class="badge BE">🔒 Closed</span>':'<span class="badge EE">🔓 Open</span>'} &nbsp; <b>Results:</b> ${approvalBadge}</p>
  ${e.resultsApproval==='approved' && e.approvedBy ? `<p class="small" style="margin:0 0 4px">Approved by ${escapeHtml(e.approvedBy)}${e.approvalAt?' on '+new Date(e.approvalAt).toLocaleDateString():''}</p>` : ''}
  ${e.resultsApproval==='disapproved' && e.approvalNote ? `<p class="small" style="margin:0 0 4px;color:#9c2c2c"><b>Reason:</b> ${escapeHtml(e.approvalNote)}</p>` : ''}
  ${t.canManageEntry ? `<div class="flexbtns">${closed?`<button class="ghost" onclick="reopenExam('${e.id}')">🔓 Reopen Entry</button>`:`<button class="ghost" onclick="closeExamNow('${e.id}')">🔒 Close Entry Now</button>`}</div>` : ''}
  ${t.canApproveResults ? `<div class="flexbtns" style="margin-top:6px">
    <button onclick="approveExamResults('${e.id}')">✅ Approve Results</button>
    <button class="danger" onclick="disapproveExamResults('${e.id}')">❌ Disapprove</button>
  </div>` : ''}
  ${t.canApproveEditRequests && pending.length ? `<div style="margin-top:8px">
    <p class="small" style="margin:0 0 4px"><b>⏳ Pending Edit Requests (${pending.length})</b></p>
    <table><tr><th>Teacher</th><th>Learner</th><th>Learning Area</th><th>Current</th><th>Requested</th><th>Actions</th></tr>
    ${pending.map(r=>{
      const stu = school.students.find(s=>s.id===r.sid);
      const area = school.learningAreas.find(a=>a.id===r.areaId);
      const current = ((school.marks[e.id]||{})[r.sid]||{})[r.areaId];
      return `<tr><td>${escapeHtml(r.teacherName)}</td><td>${stu?escapeHtml(stu.name):'-'}</td><td>${area?escapeHtml(area.name):'-'}</td>
      <td>${current??'-'}</td><td><b>${r.newVal}</b></td>
      <td><button onclick="approveEditRequest('${e.id}','${r.id}')">✅</button> <button class="danger" onclick="rejectEditRequest('${e.id}','${r.id}')">✕</button></td></tr>`;
    }).join('')}
    </table>
  </div>` : ''}` : ''}
  <details style="margin-top:8px">
    <summary class="small" style="cursor:pointer">📝 Personalize Report Remarks</summary>
    <p class="small" style="margin-top:6px">By default every report uses the auto remark tied to that learner's grading level. Type
    something here to override it for just this learner, just this exam — available to you as Class Teacher regardless of the
    permissions above.</p>
    ${remarksTableHTML(school, e.id)}
  </details>
  </div>`;
}
function renderTeacher(){
  const school = currentSchool();
  const t = currentTeacher();
  if(!t){ logout(); setTimeout(()=>toast('Your teacher account is no longer available','err'),50); return; }
  const myClasses = teacherClassIds(school, t);
  _teacherSig = teacherSig(school, t);
  const chips = myClasses.map(cid=>{
    const c = school.classes.find(x=>x.id===cid);
    return teacherAreaIds(school,t,cid).map(aid=>{
      const ar = school.learningAreas.find(x=>x.id===aid);
      return `<span class="chip">${escapeHtml(c.name)} · ${ar?escapeHtml(ar.name):''}</span>`;
    }).join(' ');
  }).join(' ');
  const classTeacherNames = (t.classTeacherOf||[]).map(cid=>{const c=school.classes.find(x=>x.id===cid);return c?c.name:'';}).filter(Boolean);
  const welcome = `<div class="card no-print"><h2>👩‍🏫 Welcome, ${escapeHtml(t.name)}</h2>
  <p class="small">Your assigned Grade / Learning Area combinations:</p>
  ${chips || '<span class="small">No assignments yet — contact your DOS/HOI.</span>'}
  <p class="small" style="margin-top:8px">Access: ✏️ Enter marks${t.canPrint?' · 📄 Reports':''}${t.canPrintAssess?' · 🖨 Assessment sheets':''}${t.canPostAssignments?' · 📎 Assignments':''}${classTeacherNames.length?` · 📋 Class Teacher — ${classTeacherNames.map(escapeHtml).join(', ')}`:''}</p>
  </div>`;
  const acct = tplTeacherAccount(t);
  const ctTools = tplClassTeacherExams(school, t);
  if(!myClasses.length){ app.innerHTML = welcome + acct + ctTools; return; }
  const dash = `<div class="card"><h2>🏠 My Dashboard</h2>
  <p class="small no-print">Snapshot of your own assigned grade(s)/learning area(s) — mean, top learner, and a stream comparison where you teach the same subject in more than one grade.</p>
  <div class="row no-print">
    <div><label>Term</label><select id="tdashTerm" onchange="runTeacherDashboard()"></select></div>
    <div><label>Year</label><input id="tdashYear" type="number"></div>
  </div>
  <div id="tdashArea"></div></div>`;
  const classOpts = myClasses.map(cid=>{const c=school.classes.find(x=>x.id===cid);return `<option value="${cid}">${escapeHtml(c.name)}</option>`;}).join('');
  const P = {
    marks: `  <div class="card"><h2 class="no-print">✏️ Enter Marks</h2>
  <div class="row no-print">
    <div><label>Grade</label><select id="tClass" onchange="renderTeacherAreaOptions()">${classOpts}</select></div>
    <div><label>Learning Area</label><select id="tArea"></select></div>
    <div><label>Exam</label><select id="tExam"></select></div>
  </div>
  <div class="flexbtns no-print"><button onclick="loadMarksGrid()">Load Marks Sheet</button></div>
  <div id="marksGridArea"></div>
  </div>
`,
    approvals: `  <div class="card no-print"><h2>⏳ Approval Status</h2>
  <p class="small">Changes made after entry closes need DOS/HOI approval — track them here.</p>
  <div id="teacherApprovals"></div></div>
`,
    reports: `  ${t.canPrint ? `<div class="card"><h2 class="no-print">📄 Print Learner Reports</h2>
  <p class="small no-print">Reports show only your assigned learning area(s) — mean, points and position are based on those.</p>
  <div class="row no-print">
    <div><label>Grade</label><select id="trepClass" onchange="fillTeacherRepExams();fillTeacherRepLearners()">${classOpts}</select></div>
    <div><label>Exam</label><select id="trepExam" onchange="fillTeacherRepLearners()">${school.exams.filter(e=>e.classId===myClasses[0] && examReleased(school,e)).map(e=>`<option value="${e.id}">${escapeHtml(e.name)} (${e.term} ${e.year})</option>`).join('') || '<option value="">No approved exams for this grade</option>'}</select></div>
    <div><label>Learner</label><select id="trepLearner"></select></div>
    ${genderPickerHTML('trepGender')}
  </div>
  <div class="flexbtns no-print">
    <button onclick="generateTeacherReport(qs('#trepLearner').value, qs('#trepExam').value)">Generate Individual Report</button>
    <button class="ghost" onclick="generateAllTeacherReports(qs('#trepClass').value, qs('#trepExam').value)">Generate All (Whole Grade)</button>
  </div>
  <div id="treportArea"></div>
  </div>` : ''}
`,
    assess: `  ${t.canPrintAssess ? tplTeacherAssessPicker(school, myClasses) : ''}
`,
    history: `  ${t.canPrintAssess ? `<div class="card"><h2 class="no-print">🖨 Grade List of Previous Exams</h2><div id="teacherHistory"></div></div>` : ''}
`,
    assignments: `  ${t.canPostAssignments ? tplTeacherAssignments(school, myClasses) : ''}`
  };
  const menu = [
    {group:'Overview', items:[['dashboard','🏠 Dashboard']]},
    {group:'Marks', items:[['marks','✏️ Enter Marks'],['approvals','⏳ Approval Status']]}
  ];
  const res = [];
  if(t.canPrint) res.push(['reports','📄 Learner Reports']);
  if(t.canPrintAssess){ res.push(['assess','🖨 Assessment Sheets']); res.push(['history','🗂 Previous Exams']); }
  if(res.length) menu.push({group:'Results &amp; reports', items:res});
  const more = [];
  if(t.canPostAssignments) more.push(['assignments','📎 Assignments']);
  if(ctTools) more.push(['classteacher','📋 Class Teacher Tools']);
  if(more.length) menu.push({group:'Class work', items:more});
  menu.push({group:'My account', items:[['account','🔑 My Account']]});
  if(!menu.some(g=>g.items.some(i=>i[0]===teacherTab))) teacherTab = 'dashboard';
  const quick = [['marks','✏️ Enter Marks']];
  if(t.canPrint) quick.push(['reports','📄 Reports']);
  if(t.canPostAssignments) quick.push(['assignments','📎 Assignments']);
  quick.push(['approvals','⏳ Approval Status']);
  const content = {
    dashboard: welcome + portalQuick('gotoTeacherTab', quick) + dash,
    marks: P.marks, approvals: P.approvals, reports: P.reports, assess: P.assess,
    history: P.history, assignments: P.assignments, classteacher: ctTools, account: acct
  }[teacherTab] || '';
  app.innerHTML = portalShell({menu, tab:teacherTab, goto:'gotoTeacherTab', side:t.name, headName:t.name, headSub:school.name}) + `<div id="dosContent">${content}</div>`;
  dosSyncBarOffset();
  if(teacherTab==='dashboard'){ initTeacherDashboardControls(); runTeacherDashboard(); }
  if(teacherTab==='marks') renderTeacherAreaOptions();
  if(teacherTab==='approvals') renderTeacherApprovals();
  if(teacherTab==='history') renderTeacherHistory();
  if(teacherTab==='reports'){ fillTeacherRepExams(); fillTeacherRepLearners(); }
}
// Assessment Sheets for a teacher: same View/Print sheets the DOS/HOI has (Class
// Assessment Sheet, Cumulative End-Term Sheet, Blank Class List), but the Class/Exam
// dropdowns are scoped to only the classes this teacher is assigned to — gated on the
// t.canPrintAssess permission a DOS/HOI grants in Teachers & Permissions.
function tplTeacherAssessPicker(school, myClasses){
  const classOpts = myClasses.map(cid=>{const c=school.classes.find(x=>x.id===cid);return c?`<option value="${cid}">${escapeHtml(c.name)}</option>`:'';}).join('');
  const examOpts = school.exams.filter(e=>myClasses.includes(e.classId)).map(e=>{const c=school.classes.find(x=>x.id===e.classId);return `<option value="${e.id}">${escapeHtml(e.name)} - ${c?escapeHtml(c.name):''} (${e.term} ${e.year})</option>`;}).join('') || '<option value="">No exams</option>';
  return `<div class="card"><h2 class="no-print">🖨 Assessment Sheets</h2>
  <p class="small no-print">Sheets show only your assigned learning area(s) — total, mean and position are based on those.</p>
  <div class="row no-print">
    <div><label>Exam</label><select id="asExam">${examOpts}</select></div>
    ${genderPickerHTML('asGender')}<div style="align-self:flex-end"><button onclick="viewClassAssessment(qs('#asExam').value)">View / Print Sheet</button></div>
  </div>
  <div id="assessArea"></div>
  <div class="card" style="margin-top:14px"><h2 class="no-print">📊 Cumulative End-Term Sheet</h2>
  <div class="row no-print">
    <div><label>Grade</label><select id="cumClass">${classOpts}</select></div>
    <div><label>Term</label><select id="cumTerm"><option>Term 1</option><option>Term 2</option><option>Term 3</option></select></div>
    <div><label>Year</label><input id="cumYear" type="number" value="${new Date().getFullYear()}"></div>
    ${genderPickerHTML('cumGender')}<div style="align-self:flex-end"><button onclick="viewCumulative()">Generate Cumulative Sheet</button></div>
  </div>
  <div id="cumArea"></div></div>
  <div class="card" style="margin-top:14px"><h2 class="no-print">🧾 Blank Grade List (Manual Marking Sheet)</h2>
  <div class="row no-print">
    <div><label>Grade</label><select id="blankClass">${classOpts}</select></div>
    ${genderPickerHTML('blankGender')}<div style="align-self:flex-end"><button onclick="viewBlankClassList(qs('#blankClass').value)">Generate Blank Grade List</button></div>
  </div>
  <div id="blankListArea"></div>
  </div>
  </div>`;
}
// Assignments for a teacher: same underlying school.assignments data and add/toggle/
// delete/print functions the DOS/HOI uses (see ASSIGNMENTS section below) — only the
// Grade dropdown and the visible list are scoped to this teacher's own assigned grade(s),
// gated on the t.canPostAssignments permission a DOS/HOI grants in Teachers & Permissions.
function tplTeacherAssignments(school, myClasses){
  const list = school.assignments.filter(a=>myClasses.includes(a.classId)).sort((a,b)=>b.postedAt-a.postedAt);
  const classOpts = myClasses.map(cid=>{const c=school.classes.find(x=>x.id===cid);return c?`<option value="${cid}">${escapeHtml(c.name)}</option>`:'';}).join('');
  return `<div class="card"><h2 class="no-print">📎 Assignments</h2>
  <p class="small no-print">Send a printable assignment/homework sheet to the Parent Portal, for your assigned grade(s).</p>
  <div class="row no-print">
    <div><label>Grade</label><select id="asgClass">${classOpts}</select></div>
    <div><label>Title</label><input id="asgTitle" placeholder="e.g. Week 4 Mathematics Homework"></div>
    <div><label>Due date (optional)</label><input id="asgDue" type="date"></div>
  </div>
  <div class="row no-print">
    <div style="flex:1"><label>Instructions (this is what gets printed)</label><textarea id="asgBody" rows="5" placeholder="Type the assignment instructions here…"></textarea></div>
  </div>
  <div class="row no-print">
    <div><label>Attach an image (optional — e.g. a photo/scan of a worksheet, under 2MB)</label><input type="file" accept="image/*" id="asgFile"></div>
    <div style="align-self:flex-end"><label><input type="checkbox" id="asgVisible" checked> Visible to parents immediately</label></div>
  </div>
  <div id="asgMsg"></div>
  <div class="flexbtns no-print"><button onclick="addAssignment()">➕ Send Assignment</button></div>
  ${list.length? `<table style="margin-top:14px"><tr><th>Title</th><th>Grade</th><th>Due</th><th>Posted</th><th>Visible to Parents</th><th>Actions</th></tr>
  ${list.map(a=>{
    const cls = school.classes.find(c=>c.id===a.classId);
    return `<tr>
      <td style="text-align:left">${escapeHtml(a.title)}</td>
      <td>${cls?escapeHtml(cls.name):'—'}</td>
      <td>${a.dueDate?escapeHtml(a.dueDate):'—'}</td>
      <td>${new Date(a.postedAt).toLocaleDateString()}</td>
      <td><label><input type="checkbox" ${a.visible?'checked':''} onchange="toggleAssignmentVisible('${a.id}')"> ${a.visible?'Visible':'Hidden'}</label></td>
      <td><button class="ghost" onclick="printAssignmentDos('${a.id}')">🖨 Print</button> <button class="danger" onclick="deleteAssignment('${a.id}')">✕ Delete</button></td>
    </tr>`;
  }).join('')}
  </table>` : '<p class="small">No assignments sent yet.</p>'}
  <div id="asgPrintArea"></div>
  </div>`;
}
function fillTeacherRepLearners(){
  if(!qs('#trepClass')) return;
  const school = currentSchool(); const classId = qs('#trepClass').value;
  const ex = school.exams.find(e=>qs('#trepExam') && e.id===qs('#trepExam').value);
  const list = (ex && ex.classId===classId) ? studentsForExam(school, ex) : studentsInClass(school, classId);
  qs('#trepLearner').innerHTML = list.map(s=>`<option value="${s.id}">${escapeHtml(s.name)}${s.adm?' ('+escapeHtml(s.adm)+')':''}</option>`).join('');
}
// Scopes the Exam dropdown to whichever class is currently selected (same fix as the
// DOS Reports page) — a teacher assigned to more than one class could otherwise pick
// Class A here while an exam from Class B stayed selected underneath, producing a
// blank report.
function fillTeacherRepExams(){
  if(!qs('#trepClass')) return;
  const school = currentSchool(); const classId = qs('#trepClass').value;
  const exams = school.exams.filter(e=>e.classId===classId && examReleased(school,e));
  qs('#trepExam').innerHTML = exams.map(e=>`<option value="${e.id}">${escapeHtml(e.name)} (${e.term} ${e.year})</option>`).join('') || `<option value="">${school.requireApproval?'No approved exams for this grade':'No exams for this grade'}</option>`;
}
function generateTeacherReport(sid, examId){
  if(!sid||!examId){ toast('Select learner & exam','err'); return; }
  const school = currentSchool();
  const stu = school.students.find(x=>x.id===sid);
  if(!stu || teacherDenied('canPrint', stu.classId)) return;
  const _ex = school.exams.find(x=>x.id===examId);
  if(!_ex || !examReleased(school,_ex)){ toast('Results for this exam have not been approved yet','err'); return; }
  const r = buildReportHTML(school, sid, examId);
  qs('#treportArea').innerHTML = r.html + `<div class="flexbtns no-print"><button class="gold" onclick="window.print()">🖨 Print This Report</button></div>`;
  drawProgressChart(r.chartId, r.historyPoints);
}
function generateAllTeacherReports(classId, examId){
  if(!classId||!examId){ toast('Select grade & exam','err'); return; }
  if(teacherDenied('canPrint', classId)) return;
  const school = currentSchool();
  const _ex = school.exams.find(x=>x.id===examId);
  if(!_ex || !examReleased(school,_ex)){ toast('Results for this exam have not been approved yet','err'); return; }
  const learners = applyGenderMode(studentsForExam(school, _ex), genderMode('trepGender'));
  const reports = learners.map(s=>buildReportHTML(school,s.id,examId));
  qs('#treportArea').innerHTML = reports.map(r=>r.html).join('') +
   `<div class="flexbtns no-print"><button class="gold" onclick="window.print()">🖨 Print All Reports</button></div>`;
  reports.forEach(r=>drawProgressChart(r.chartId, r.historyPoints));
}
function renderTeacherAreaOptions(){
  if(!qs('#tClass')) return;
  const school = currentSchool(); const t = school.teachers.find(x=>x.id===session.userId);
  const classId = qs('#tClass').value;
  const validIds = new Set(areasForClass(school,classId).map(a=>a.id));
  const areas = [...new Set(t.assignments.filter(a=>a.classId===classId).map(a=>a.areaId))].filter(aid=>validIds.has(aid));
  qs('#tArea').innerHTML = areas.map(aid=>{const a=school.learningAreas.find(x=>x.id===aid);return `<option value="${aid}">${escapeHtml(a.name)}</option>`;}).join('');
  const exams = school.exams.filter(e=>e.classId===classId);
  qs('#tExam').innerHTML = exams.map(e=>`<option value="${e.id}">${escapeHtml(e.name)} (${e.term} ${e.year})</option>`).join('') || '<option value="">No exams for this grade</option>';
}
function loadMarksGrid(){
  const school = currentSchool();
  const classId = qs('#tClass').value, areaId = qs('#tArea').value, examId = qs('#tExam').value;
  if(!examId){ toast('No exam selected/available','err'); return; }
  const exam = school.exams.find(e=>e.id===examId);
  if(!exam || exam.classId!==classId || teacherDenied(null, classId, areaId)) return;
  const max = exam.maxMarksByArea[areaId] ?? 100;
  const learners = studentsInClass(school, classId);
  school.marks[examId] = school.marks[examId] || {};
  const closed = isExamClosed(exam);
  const myPending = (exam.editRequests||[]).filter(r=>r.status==='pending' && r.areaId===areaId && r.teacherId===session.userId).length;
  const myPend = {}; (exam.editRequests||[]).filter(r=>r.status==='pending' && r.areaId===areaId && r.teacherId===session.userId).forEach(r=>{ myPend[r.sid]=r.newVal; });
  qs('#marksGridArea').innerHTML = `
  <p class="small no-print">Max marks for this learning area in this exam: <b>${max}</b> (editable by DOS/HOI in Exams tab)</p>
  ${closed ? `<div class="msg err no-print">🔒 Entry is closed for this exam. Any change you make below is sent to the DOS/HOI as a request and only applies once approved.${myPending?` You have ${myPending} request(s) awaiting approval for this learning area.`:''}</div>` : ''}
  <div class="print-only-block">
  <table><tr><th>Adm No.</th>${assessTh(hasAssessNo(learners))}<th>Name</th><th>Score (out of ${max})</th><th>%</th><th>Level</th></tr>
  ${learners.map(s=>{
    const score = (school.marks[examId][s.id]||{})[areaId];
    return `<tr><td>${s.adm?escapeHtml(s.adm):'<span class="small">—</span>'}</td>${assessTd(s,hasAssessNo(learners))}<td>${escapeHtml(s.name)}</td>
    <td><input type="number" min="0" max="${max}" value="${score??''}" data-sid="${s.id}" class="markInput" onchange="saveMark('${examId}','${areaId}',this)">${myPend[s.id]!=null?`<div class="reqTag small">⏳ ${myPend[s.id]} awaiting approval</div>`:''}</td>
    <td class="pctCell-${s.id}">${score!=null?pctOf(score,max).toFixed(1)+'%':'-'}</td>
    <td class="lvlCell-${s.id}">${score!=null?levelBadge(school,pctOf(score,max),classId):'-'}</td></tr>`;
  }).join('') || `<tr><td colspan="${5+(hasAssessNo(learners)?1:0)}" class="small">No learners in this grade.</td></tr>`}
  </table>
  </div>
  <div class="flexbtns no-print"><button class="gold" onclick="window.print()">🖨 Print This Sheet</button></div>`;
}
// Small "awaiting approval" note under a mark box while a change waits on the DOS/HOI.
function setReqTag(input, val){
  let tag = input.parentNode.querySelector('.reqTag');
  if(val==null){ if(tag) tag.remove(); return; }
  if(!tag){ tag = document.createElement('div'); tag.className = 'reqTag small'; input.parentNode.appendChild(tag); }
  tag.textContent = '⏳ '+val+' awaiting approval';
}
// Colours a level badge by its rank in the class's own grading table (best→worst), not by
// matching its code against the four CBC defaults — so a school that renames or adds levels
// in the Grading tab still gets a correctly coloured badge everywhere, not a plain grey one.
function levelBadge(school,pct,classId){
  const g = gradeFor(school,pct,classId);
  return raBadge(school,classId,g.level);
}
function saveMark(examId,areaId,input){
  const school = currentSchool();
  const exam = school.exams.find(e=>e.id===examId);
  const sid = input.dataset.sid; const max = exam.maxMarksByArea[areaId] ?? 100;
  // A teacher can only save marks for a class + learning area assigned to them.
  if(session.role==='teacher' && teacherDenied(null, exam.classId, areaId)){
    input.value = ((school.marks[examId]||{})[sid]||{})[areaId] ?? '';
    return;
  }
  let val = Number(input.value);
  if(val>max){ val=max; input.value=max; toast('Score capped at max marks','err'); }
  if(val<0){ val=0; input.value=0; }
  // A teacher (not DOS/HOI) editing an exam whose entry period is closed can't save
  // directly — the change queues as a pending edit request for the DOS/HOI to approve
  // or reject. The DOS/HOI can always edit directly, closed or not.
  if(session.role==='teacher' && isExamClosed(exam)){
    const priorVal = ((school.marks[examId][sid]||{})[areaId]);
    input.value = priorVal ?? '';
    const t = school.teachers.find(x=>x.id===session.userId);
    exam.editRequests = exam.editRequests || [];
    const samePending = exam.editRequests.find(r=>r.status==='pending' && r.teacherId===t.id && r.sid===sid && r.areaId===areaId);
    if(val===priorVal){
      // Changing a cell back to its recorded mark withdraws that teacher's own waiting request.
      if(samePending){ exam.editRequests = exam.editRequests.filter(r=>r!==samePending); touchExam(exam); saveDB(DB); setReqTag(input,null); renderTeacherApprovals(); toast('Your pending request was withdrawn'); }
      return;
    }
    if(samePending){ samePending.newVal = val; samePending.requestedAt = new Date().toISOString(); }
    else exam.editRequests.push({id:uid('req_'), teacherId:t.id, teacherName:t.name, sid, areaId, newVal:val, status:'pending', requestedAt:new Date().toISOString()});
    touchExam(exam);
    saveDB(DB);
    setReqTag(input, val);
    renderTeacherApprovals();
    toast('Entry is closed for this exam — your change was sent to the DOS/HOI for approval','err');
    return;
  }
  school.marks[examId][sid] = school.marks[examId][sid] || {};
  school.marks[examId][sid][areaId] = val;
  // Marks changed after a results approval — the approval no longer covers the current
  // data, so it must be reviewed again before it can be treated as final.
  if(exam.resultsApproval==='approved'){ exam.resultsApproval = 'pending'; exam.approvedBy = ''; exam.approvalAt = ''; touchExam(exam); }
  saveDB(DB);
  pushMarkToCloud(school.code, examId, sid, areaId, val);
  const pct = pctOf(val,max);
  document.querySelector('.pctCell-'+sid).textContent = pct.toFixed(1)+'%';
  document.querySelector('.lvlCell-'+sid).innerHTML = levelBadge(school,pct,exam.classId);
}
// Approval Status: only exams in this teacher's assigned classes that are closed (or were
// disapproved and reopened) or that hold one of THIS teacher's edit requests, and only this
// teacher's own requests for their own assigned learning areas. Needs no extra permission.
function renderTeacherApprovals(){
  const host = qs('#teacherApprovals'); if(!host) return;
  const school = currentSchool(); const t = currentTeacher(); if(!t) return;
  const myClasses = teacherClassIds(school, t);
  const myReqs = e => (e.editRequests||[]).filter(r=>r.teacherId===t.id && teacherAreaIds(school,t,e.classId).includes(r.areaId));
  const exams = school.exams.filter(e=>myClasses.includes(e.classId) && (isExamClosed(e) || e.resultsApproval==='disapproved' || myReqs(e).length));
  if(!exams.length){ host.innerHTML = '<p class="small">Nothing here yet — exams appear once their entry period is closed.</p>'; return; }
  const stBadge = st => st==='approved' ? '<span class="badge EE">✅ Approved</span>' : st==='rejected' ? '<span class="badge BE">❌ Rejected</span>' : '<span class="badge AE">⏳ Pending</span>';
  const resBadge = e => e.resultsApproval==='approved' ? `<span class="badge EE">✅ Approved</span>${e.approvedBy?`<div class="small">by ${escapeHtml(e.approvedBy)}${e.approvalAt?' · '+new Date(e.approvalAt).toLocaleDateString():''}</div>`:''}`
    : e.resultsApproval==='disapproved' ? `<span class="badge BE">❌ Disapproved — entry reopened, please correct</span>${e.approvalNote?`<div class="small"><b>Reason:</b> ${escapeHtml(e.approvalNote)}</div>`:''}`
    : '<span class="badge AE">⏳ Pending DOS/HOI review</span>';
  const rows = [];
  exams.forEach(e=>myReqs(e).forEach(r=>rows.push({e,r})));
  rows.sort((a,b)=>String(b.r.requestedAt||'').localeCompare(String(a.r.requestedAt||'')));
  const pendingN = rows.filter(x=>x.r.status==='pending').length;
  host.innerHTML = `
  <table><tr><th>Exam</th><th>Grade</th><th>Entry</th><th>Results Approval</th><th>My Requests</th></tr>
  ${exams.map(e=>{
    const c = school.classes.find(x=>x.id===e.classId); const rq = myReqs(e);
    const cnt = st => rq.filter(r=>r.status===st).length;
    return `<tr><td>${escapeHtml(e.name)} <span class="small">${e.term} ${e.year}</span></td><td>${c?escapeHtml(c.name):'-'}</td>
    <td>${isExamClosed(e)?'<span class="badge BE">🔒 Closed</span>':'<span class="badge EE">🔓 Open</span>'}</td>
    <td>${resBadge(e)}</td>
    <td>${rq.length ? `${cnt('pending')} pending · ${cnt('approved')} approved · ${cnt('rejected')} rejected` : '<span class="small">none</span>'}</td></tr>`;}).join('')}
  </table>
  ${rows.length ? `<p class="small" style="margin:12px 0 4px"><b>My edit requests</b>${pendingN?` — ${pendingN} awaiting approval`:''}</p>
  <table><tr><th>Exam</th><th>Learner</th><th>Learning Area</th><th>Current</th><th>Requested</th><th>Status</th><th>Sent</th></tr>
  ${rows.map(({e,r})=>{
    const stu = school.students.find(x=>x.id===r.sid), area = school.learningAreas.find(x=>x.id===r.areaId);
    const cur = ((school.marks[e.id]||{})[r.sid]||{})[r.areaId];
    return `<tr><td>${escapeHtml(e.name)}</td><td>${stu?escapeHtml(stu.name):'-'}</td><td>${area?escapeHtml(area.name):'-'}</td>
    <td>${cur??'-'}</td><td><b>${r.newVal}</b></td><td>${stBadge(r.status)}${r.note?`<div class="small">${escapeHtml(r.note)}</div>`:''}</td><td class="small">${r.requestedAt?new Date(r.requestedAt).toLocaleDateString():'-'}</td></tr>`;}).join('')}
  </table>` : ''}`;
}

// Prints only the sheet inside containerId, even if other generated sheets (e.g. the
// Class Assessment Sheet, Cumulative Sheet, or Blank Class List all live on the same
// page) are also currently showing on screen. Temporarily hides every OTHER
// .print-only-block for the print, then restores them right after — nothing on screen
// changes except for the brief moment the print dialog is open.
function printSection(containerId){
  const target = qs('#'+containerId);
  if(!target) return;
  const others = [...document.querySelectorAll('.print-only-block')].filter(b=>!target.contains(b));
  others.forEach(b=>b.classList.add('print-hide-temp'));
  const restore = ()=>{ others.forEach(b=>b.classList.remove('print-hide-temp')); window.removeEventListener('afterprint', restore); };
  window.addEventListener('afterprint', restore);
  window.print();
  restore(); // covers browsers where print() blocks until the dialog closes; harmless to call twice
}
function viewClassAssessment(examId, targetId){
  if(!examId) return;
  const school = currentSchool();
  const exam = school.exams.find(e=>e.id===examId);
  if(!exam) return;
  if(teacherDenied('canPrintAssess', exam.classId)) return;
  const scoped = !!(session && session.role==='teacher');
  const cls = school.classes.find(c=>c.id===exam.classId);
  const learners = studentsForExam(school, exam);
  const areas = visibleAreas(school, exam.classId);
  const marksForExam = school.marks[examId] || {};
  const classTeacher = school.classTeachers[exam.classId] || 'Not Set';
  // compute totals & positions
  let rows = learners.map(s=>{
    let total=0, totalPts=0, maxTotal=0;
    const cells = areas.map(a=>{
      const max = exam.maxMarksByArea[a.id] ?? 100;
      const score = (marksForExam[s.id]||{})[a.id];
      maxTotal += max;
      if(score!=null){ total+=score; const pct=pctOf(score,max); const g=gradeFor(school,pct,exam.classId); totalPts+=g.points; }
      return {score,max};
    });
    const meanPct = cells.reduce((s,c)=>s+ (c.score!=null?pctOf(c.score,c.max):0),0)/(areas.length||1);
    return {s, cells, total, totalPts, meanPct};
  });
  rows.sort((a,b)=>b.total-a.total);
  rows.forEach((r,i)=>{ r.position = i+1; if(i>0 && rows[i-1].total===r.total) r.position = rows[i-1].position; });
  // Positions above are class positions; the gender choice below only decides who is printed.
  const gm = genderMode('asGender');
  const allRows = rows;
  rows = applyGenderMode(rows, gm, r=>r.s);
  // Class/subject average row: the average % scored in each learning area, across only the
  // learners who have a score recorded for it — so a subject nobody has marked yet shows '-'
  // instead of a misleading 0.
  const subjAvg = areas.map((a,i)=>{
    const vals = rows.map(r=>r.cells[i].score!=null?pctOf(r.cells[i].score,r.cells[i].max):null).filter(v=>v!=null);
    return vals.length? vals.reduce((s,v)=>s+v,0)/vals.length : null;
  });
  const classMeanPct = rows.length? rows.reduce((s,r)=>s+r.meanPct,0)/rows.length : 0;
  const classMeanG = gradeFor(school,classMeanPct,exam.classId);
  const keyTable = gradingFor(school, exam.classId);
  const gradingKey = keyTable.length ? `<div class="rc-key">${keyTable.map(k=>`<span><b>${escapeHtml(k.level)}</b> = ${escapeHtml(k.label)}</span>`).join('')}</div>` : '';
  const target = (targetId && qs('#'+targetId)) || qs('#assessArea') || qs('#histViewArea');
  const printId = target.id;
  const an = hasAssessNo(rows, r=>r.s);
  target.innerHTML = `
  <div class="print-only-block">
  <div class="report-header">${schoolHeaderTop(school)}${schoolContactLine(school)}<p>${escapeHtml(exam.name)} — ${exam.term} ${exam.year} — ${escapeHtml(cls.name)}</p><p class="small">Grade Assessment Sheet</p>${genderNote(gm)}<p class="small">Class Teacher: ${escapeHtml(classTeacher)}</p>${scoped?'<p class="small">Assigned learning area(s) only — total, mean and position are based on these.</p>':''}${school.requireApproval?`<p class="small">Status: ${exam.resultsApproval==='approved'?'✅ Approved by DOS/HOI':'⚠ Provisional — not yet approved'}</p>`:''}</div>
  <table><tr><th>Pos</th><th>Adm No.</th>${assessTh(an)}<th>Name</th><th>Sex</th>${areas.map(a=>`<th>${escapeHtml(a.name)}</th>`).join('')}<th>Total</th><th>Total Pts</th><th>Mean %</th><th>Level</th></tr>
  ${groupedRowsHTML(rows, gm, 8+areas.length+(an?1:0), r=>r.s, r=>{
    const g = gradeFor(school,r.meanPct,exam.classId);
    return `<tr><td>${r.position}</td><td>${r.s.adm?escapeHtml(r.s.adm):'—'}</td>${assessTd(r.s,an)}<td>${escapeHtml(r.s.name)}</td><td>${r.s.gender==='M'?'M':r.s.gender==='F'?'F':''}</td>
    ${r.cells.map(c=>`<td>${c.score??'-'}</td>`).join('')}
    <td>${r.total}</td><td>${r.totalPts}</td><td>${r.meanPct.toFixed(1)}%</td><td>${raBadge(school,exam.classId,g.level)}</td></tr>`;
  })}
  <tr class="rc-total"><td colspan="${4+(an?1:0)}" style="text-align:left">${gm==='M'?'BOYS AVERAGE':gm==='F'?'GIRLS AVERAGE':'CLASS AVERAGE'}</td>
  ${subjAvg.map(v=>`<td>${v!=null?v.toFixed(1)+'%':'-'}</td>`).join('')}
  <td>-</td><td>-</td><td>${classMeanPct.toFixed(1)}%</td><td>${raBadge(school,exam.classId,classMeanG.level)}</td></tr>
  </table>
  ${genderSummaryHTML(school, exam.classId, allRows)}
  ${gradingKey}
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:22px">
    ${sigBox('Class Teacher: '+escapeHtml(classTeacher))}
    ${sigBox('DOS/HOI: '+escapeHtml(school.hoiName), hoiSigImg(school))}
  </div>
  <div class="rc-footer">Generated by EduTrack CBC &nbsp;·&nbsp; ${new Date().toLocaleDateString()}</div>
  <div class="flexbtns no-print"><button class="gold" onclick="printSection('${printId}')">🖨 Print</button></div>
  </div>`;

function viewCumulative(){
  const school = currentSchool();
  const classId = qs('#cumClass').value, term = qs('#cumTerm').value, year = Number(qs('#cumYear').value);
  if(teacherDenied('canPrintAssess', classId)) return;
  const scoped = !!(session && session.role==='teacher');
  const exams = school.exams.filter(e=>e.classId===classId && e.term===term && e.year===year);
  const learners = unionStudents(exams.flatMap(ex=>studentsForExam(school, ex)));
  const areas = visibleAreas(school, classId);
  const cls = school.classes.find(c=>c.id===classId);
  if(exams.length===0){ qs('#cumArea').innerHTML = '<p class="small">No exams recorded for this term/year yet.</p>'; return; }
  let rows = learners.map(s=>{
    let grandTotalPct=0, grandTotalPts=0;
    const cells = areas.map(a=>{
      let sumPct=0, n=0;
      exams.forEach(ex=>{
        const max = ex.maxMarksByArea[a.id] ?? 100;
        const score = (school.marks[ex.id]||{})[s.id]?.[a.id];
        if(score!=null){ sumPct += pctOf(score,max); n++; }
      });
      const avgPct = n? sumPct/n : null;
      if(avgPct!=null){ grandTotalPct += avgPct; grandTotalPts += gradeFor(school,avgPct,classId).points; }
      return avgPct;
    });
    // Mean is taken over ALL learning areas for this grade (missing ones count as 0), so overall
    // performance reflects the learner's general standing rather than only the area(s) marked so far.
    const meanPct = areas.length? grandTotalPct/areas.length : 0;
    return {s, cells, meanPct, grandTotalPts};
  });
  rows.sort((a,b)=>b.meanPct-a.meanPct);

  <table><tr><th>Pos</th><th>Adm No.</th>${assessTh(an)}<th>Name</th><th>Sex</th>${areas.map(a=>`<th>${escapeHtml(a.name)} (avg %)</th>`).join('')}<th>Mean %</th><th>Total Pts</th><th>Level</th></tr>
  ${groupedRowsHTML(rows, gm, 7+areas.length+(an?1:0), r=>r.s, r=>{const g=gradeFor(school,r.meanPct,classId);return `<tr><td>${r.position}</td><td>${r.s.adm?escapeHtml(r.s.adm):'—'}</td>${assessTd(r.s,an)}<td>${escapeHtml(r.s.name)}</td><td>${r.s.gender==='M'?'M':r.s.gender==='F'?'F':''}</td>
    ${r.cells.map(c=>`<td>${c!=null?Math.round(c):'-'}</td>`).join('')}
    <td>${Math.round(r.meanPct)}%</td><td>${r.grandTotalPts}</td><td>${raBadge(school,classId,g.level)}</td></tr>`;})}
  <tr class="rc-total"><td colspan="${4+(an?1:0)}" style="text-align:left">${gm==='M'?'BOYS AVERAGE':gm==='F'?'GIRLS AVERAGE':'CLASS AVERAGE'}</td>

/* ============================= RESULTS ANALYSIS (DOS/HOI) ============================= */
// Streams of one grade are grouped by the text up to and including the first number in the class
// name ("Grade 6 Blue" and "Grade 6 Red" -> "Grade 6"). A class name with no number stands alone.
function raGradeLabel(name){ const m=(name||'').match(/^(.*?\d+)/); return (m?m[1]:(name||'')).replace(/\s+/g,' ').trim(); }
function raRank(rows,key,rk){ rows.sort((a,b)=>b[key]-a[key]); rows.forEach((r,i)=>{ r[rk]=(i>0 && rows[i-1][key].toFixed(2)===r[key].toFixed(2))?rows[i-1][rk]:i+1; }); }
// Badge coloured by the level's position in the class's own (possibly edited) grading table.
// lvl-0..lvl-3 mirror the EE/ME/AE/BE icon+border treatment above by rank (best→worst),
// since a custom grading table may use different level codes than the CBC defaults.
function raBadge(school,classId,level){
  const cols=['#1f8a4c','#2f7fd1','#e0a020','#d1473f'];
  const sorted=gradingFor(school,classId).slice().sort((a,b)=>b.points-a.points);
  const i=sorted.findIndex(g=>g.level===level);
  const row=i>=0?sorted[i]:null;
  const color=(row&&row.color)?row.color:(i>=0&&i<4?cols[i]:'#6b7c8f');
  const icon=(row&&row.icon)?escapeHtml(row.icon)+' ':'';
  return `<span class="badge lvl-badge ${i>=0&&i<4?'lvl-'+i:''}" style="background:${color}">${icon}${escapeHtml(level)}</span>`;
}
function tplResultsAnalysis(school){
  return `<div class="card"><h2 class="no-print">📈 Results Analysis</h2>
  <p class="small no-print">Ranks every grade by its mean score, names the best grade, and compares streams of the same grade (e.g. Grade 6 Blue vs Grade 6 Red — grades are grouped by the grade number in their name).</p>
  <div class="row no-print">
    <div><label>Term</label><select id="raTerm" onchange="raFillExams()"><option>Term 1</option><option>Term 2</option><option>Term 3</option></select></div>
    <div><label>Year</label><input id="raYear" type="number" value="${new Date().getFullYear()}" onchange="raFillExams()"></div>
    <div><label>Assessment</label><select id="raExam"></select></div>
    <div style="align-self:flex-end"><button onclick="runResultsAnalysis()">Generate Analysis</button></div>
  </div>
  <div id="raArea"></div></div>`;
}
function raFillExams(){
  const school=currentSchool(), term=qs('#raTerm').value, year=Number(qs('#raYear').value);
  const names=[...new Set(school.exams.filter(e=>e.term===term && e.year===year).map(e=>e.name))];
  qs('#raExam').innerHTML='<option value="">All exams in the term (average)</option>'+names.map(n=>`<option value="${escapeHtml(n)}">${escapeHtml(n)}</option>`).join('');
}
function raCompute(school,term,year,exName){
  const stats=[];
  school.classes.forEach(cls=>{
    const exams=school.exams.filter(e=>e.classId===cls.id && e.term===term && e.year===year && (!exName || e.name===exName));
    const areas=areasForClass(school,cls.id), learners=unionStudents(exams.flatMap(ex=>studentsForExam(school,ex)));
    if(!exams.length || !areas.length) return;
    const sub=areas.map(()=>({sum:0,n:0})), lrn=[], lv={};
    learners.forEach(s=>{
      let any=false, tot=0;
      areas.forEach((a,i)=>{
        let sp=0, n=0;
        exams.forEach(ex=>{ const sc=(school.marks[ex.id]||{})[s.id]?.[a.id]; if(sc!=null){ sp+=pctOf(sc,ex.maxMarksByArea[a.id]??100); n++; } });
        if(n){ any=true; tot+=sp/n; sub[i].sum+=sp/n; sub[i].n++; }
      });
      if(!any) return; // learners with no marks are not counted; missing areas count as 0, like the Cumulative Sheet
      const m=tot/areas.length, l=gradeFor(school,m,cls.id).level;
      lrn.push({s,mean:m,lv:l}); lv[l]=(lv[l]||0)+1;
    });
    if(!lrn.length) return;
    const sumMeans=lrn.reduce((x,l)=>x+l.mean,0), mean=sumMeans/lrn.length;
    const tbl=gradingFor(school,cls.id).slice().sort((a,b)=>b.points-a.points), top=tbl.slice(0,2).map(g=>g.level);
    stats.push({cls, glabel:raGradeLabel(cls.name), enrolled:learners.length, assessed:lrn.length, sumMeans, mean, lrn, lv,
      tableLevels:tbl.map(g=>g.level), top, meet:top.reduce((n,l)=>n+(lv[l]||0),0),
      areas:areas.map((a,i)=>({name:a.name, avg:sub[i].n?sub[i].sum/sub[i].n:null})), level:gradeFor(school,mean,cls.id)});
  });
  return stats;
}
function runResultsAnalysis(){
  const school=currentSchool(), term=qs('#raTerm').value, year=Number(qs('#raYear').value), exName=qs('#raExam').value;
  const stats=raCompute(school,term,year,exName), target=qs('#raArea');
  if(!stats.length){ target.innerHTML='<p class="small">No marks recorded for this term/assessment yet.</p>'; return; }
  const ranked=stats.slice(); raRank(ranked,'mean','rank');
  const best=ranked.filter(r=>r.rank===1);
  const nAll=stats.reduce((s,r)=>s+r.assessed,0), schoolMean=stats.reduce((s,r)=>s+r.sumMeans,0)/nAll;
  // previous term (Term 1 -> Term 3 of last year) for the change column
  const pt=Number(term.slice(-1)), prev={};
  raCompute(school, pt>1?'Term '+(pt-1):'Term 3', pt>1?year:year-1, exName).forEach(r=>{ prev[r.cls.id]=r.mean; });
  const chg=r=>{ const p=prev[r.cls.id]; if(p==null) return '—'; const d=r.mean-p; return `<b style="color:${d>=0?'#1f8a4c':'#d1473f'}">${d>=0?'▲':'▼'} ${Math.abs(d).toFixed(1)}</b>`; };
  // subjects across the school
  const subj={};
  stats.forEach(r=>r.areas.forEach(a=>{ if(a.avg==null) return; const o=subj[a.name]=subj[a.name]||{sum:0,n:0,rows:[]}; o.sum+=a.avg*r.assessed; o.n+=r.assessed; o.rows.push({c:r.cls.name,v:a.avg}); }));
  const subjects=Object.entries(subj).map(([name,o])=>{ const rows=o.rows.slice().sort((a,b)=>b.v-a.v); return {name, mean:o.sum/o.n, best:rows[0], low:rows[rows.length-1], one:rows.length===1}; }).sort((a,b)=>b.mean-a.mean);
  // level distribution
  const levels=[]; stats.forEach(r=>gradingFor(school,r.cls.id).forEach(g=>{ if(!levels.includes(g.level)) levels.push(g.level); }));
  const meets=r=>r.meet, sameTop=stats.every(r=>r.top.join()===stats[0].top.join()), topLbl=sameTop?stats[0].top.map(escapeHtml).join(' + '):'Top 2 levels', cell=(n,t)=>`${n} (${(n/t*100).toFixed(0)}%)`;
  const totLv={}; stats.forEach(r=>levels.forEach(l=>{ totLv[l]=(totLv[l]||0)+(r.lv[l]||0); }));
  // learners
  const all=stats.flatMap(r=>r.lrn.map(l=>({s:l.s,mean:l.mean,lv:l.lv,c:r.cls.name,cid:r.cls.id})));
  raRank(all,'mean','rank');
  const H=t=>`<h3 style="color:var(--navy);margin:0 0 6px">${t}</h3>`;
  const streamHtml=Object.values(stats.reduce((g,r)=>{ const k=r.glabel.toLowerCase(); (g[k]=g[k]||[]).push(r); return g; },{})).filter(g=>g.length>1).map(g=>{
    const rows=g.slice(); raRank(rows,'mean','grank');
    const subs=[...new Set(rows.flatMap(r=>r.areas.map(a=>a.name)))];
    const get=(r,n)=>{ const a=r.areas.find(x=>x.name===n); return a?a.avg:null; };
    const topSub=subs.map(n=>Math.max(...rows.map(r=>{ const v=get(r,n); return v==null?-1:v; })));
    const gMean=rows.reduce((s,r)=>s+r.sumMeans,0)/rows.reduce((s,r)=>s+r.assessed,0);
    const gap=rows[0].mean-rows[rows.length-1].mean;
    return `<div class="ra-sec">${H(escapeHtml(g[0].glabel)+' — Stream Comparison')}
    <table class="ra-table"><tr><th>Rank</th><th>Stream</th><th>Learners</th><th>Mean %</th><th>Level</th>${subs.map(n=>`<th>${escapeHtml(n)} (%)</th>`).join('')}</tr>
    ${rows.map(r=>`<tr class="${r.grank===1?'ra-best':''}"><td>${r.grank}</td><td style="text-align:left">${escapeHtml(r.cls.name)}</td><td>${r.assessed}</td><td><b>${r.mean.toFixed(1)}%</b></td><td>${raBadge(school,r.cls.id,r.level.level)}</td>${subs.map((n,i)=>{ const v=get(r,n); return `<td class="${v!=null&&v===topSub[i]?'ra-top':''}">${v!=null?v.toFixed(1):'-'}</td>`; }).join('')}</tr>`).join('')}
    <tr class="rc-total"><td colspan="3">Grade mean (all streams)</td><td>${gMean.toFixed(1)}%</td><td colspan="${1+subs.length}"></td></tr></table>
    <p class="small">Best stream: <b>${rows.filter(r=>r.grank===1).map(r=>escapeHtml(r.cls.name)).join(', ')}</b> &nbsp;|&nbsp; Gap between top and lowest stream: ${gap.toFixed(1)} points &nbsp;|&nbsp; Green cells = best stream in that learning area.</p></div>`;
  }).join('');
  target.innerHTML=`
  <div class="print-only-block">
  <div class="report-header">${schoolHeaderTop(school)}${schoolContactLine(school)}<p>Results Analysis — ${term} ${year}</p><p class="small">${exName?escapeHtml(exName):'Average of all exams in the term'}</p></div>
  <div class="rc-remark">🏆 <b>Best grade:</b> ${best.map(r=>escapeHtml(r.cls.name)).join(', ')} — ${best[0].mean.toFixed(1)}% (${best[0].level.level}) &nbsp;|&nbsp; <b>School mean:</b> ${schoolMean.toFixed(1)}% &nbsp;|&nbsp; <b>Meeting expectation or above (${topLbl}):</b> ${(stats.reduce((s,r)=>s+meets(r),0)/nAll*100).toFixed(0)}%<br>
  📚 <b>Strongest learning area:</b> ${escapeHtml(subjects[0].name)} (${subjects[0].mean.toFixed(1)}%) &nbsp;|&nbsp; <b>Weakest learning area:</b> ${escapeHtml(subjects[subjects.length-1].name)} (${subjects[subjects.length-1].mean.toFixed(1)}%)</div>
  <div class="ra-sec" style="margin-top:14px">${H('Grade Ranking')}
  <table class="ra-table"><tr><th>Rank</th><th>Grade</th><th>Grade Teacher</th><th>Learners Assessed</th><th>Mean %</th><th>Level</th><th>Change vs previous term</th></tr>
  ${ranked.map(r=>`<tr class="${r.rank===1?'ra-best':''}"><td>${r.rank}</td><td style="text-align:left">${escapeHtml(r.cls.name)}</td><td>${escapeHtml((school.classTeachers||{})[r.cls.id]||'—')}</td><td>${r.assessed} of ${r.enrolled}</td><td><b>${r.mean.toFixed(1)}%</b></td><td>${raBadge(school,r.cls.id,r.level.level)}</td><td>${chg(r)}</td></tr>`).join('')}
  </table></div>
  ${streamHtml}
  <div class="ra-sec" style="margin-top:14px">${H('Performance Level Distribution')}
  <table class="ra-table"><tr><th>Grade</th>${levels.map(l=>`<th>${escapeHtml(l)}</th>`).join('')}<th>${topLbl}</th></tr>
  ${ranked.map(r=>`<tr><td style="text-align:left">${escapeHtml(r.cls.name)}</td>${levels.map(l=>`<td>${r.tableLevels.includes(l)?cell(r.lv[l]||0,r.assessed):'—'}</td>`).join('')}<td><b>${(meets(r)/r.assessed*100).toFixed(0)}%</b></td></tr>`).join('')}
  <tr class="rc-total"><td>Whole school</td>${levels.map(l=>`<td>${cell(totLv[l]||0,nAll)}</td>`).join('')}<td>${(stats.reduce((s,r)=>s+meets(r),0)/nAll*100).toFixed(0)}%</td></tr></table></div>
  <div class="ra-sec" style="margin-top:14px">${H('Learning Area Performance (whole school)')}
  <table class="ra-table"><tr><th>Rank</th><th>Learning Area</th><th>School Mean %</th><th>Best Grade</th><th>Lowest Grade</th></tr>
  ${subjects.map((x,i)=>`<tr><td>${i+1}</td><td style="text-align:left">${escapeHtml(x.name)}</td><td><b>${x.mean.toFixed(1)}%</b></td><td>${escapeHtml(x.best.c)} (${x.best.v.toFixed(1)}%)</td><td>${x.one?'—':escapeHtml(x.low.c)+' ('+x.low.v.toFixed(1)+'%)'}</td></tr>`).join('')}
  </table></div>
  <div class="ra-sec" style="margin-top:14px">${H('Top 10 Learners (whole school)')}
  <table class="ra-table"><tr><th>Rank</th><th>Adm No.</th>${assessTh(hasAssessNo(all.slice(0,10), l=>l.s))}<th>Name</th><th>Grade</th><th>Mean %</th><th>Level</th></tr>
  ${all.slice(0,10).map(l=>`<tr><td>${l.rank}</td><td>${l.s.adm?escapeHtml(l.s.adm):'—'}</td>${assessTd(l.s,hasAssessNo(all.slice(0,10), x=>x.s))}<td style="text-align:left">${escapeHtml(l.s.name)}</td><td>${escapeHtml(l.c)}</td><td><b>${l.mean.toFixed(1)}%</b></td><td>${raBadge(school,l.cid,l.lv)}</td></tr>`).join('')}
  </table></div>
  <div class="ra-sec" style="margin-top:14px">${H('Top 3 Learners per Grade')}
  <table class="ra-table"><tr><th>Grade</th><th>1st</th><th>2nd</th><th>3rd</th></tr>
  ${ranked.map(r=>{ const t=r.lrn.slice().sort((a,b)=>b.mean-a.mean); return `<tr><td style="text-align:left">${escapeHtml(r.cls.name)}</td>${[0,1,2].map(i=>`<td>${t[i]?escapeHtml(t[i].s.name)+' — '+t[i].mean.toFixed(1)+'%':'—'}</td>`).join('')}</tr>`; }).join('')}
  </table></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:22px">${sigBox('Head of Institution: '+escapeHtml(school.hoiName||''), hoiSigImg(school))}${sigBox('Date', '<span class="sig-date">'+new Date().toLocaleDateString()+'</span>')}</div>
  <div class="flexbtns no-print"><button class="gold" onclick="printSection('raArea')">🖨 Print</button></div>
  </div>`;
}

/* ============================= DASHBOARD (landing page) ============================= */
// Shown first, before the DOS/HOI taps into any menu tab. Auto-computes the snapshot
// for the most recent term/year that actually has marks entered — no picking required —
// but still lets them switch term/year if they want an older snapshot.
function latestDataTermYear(school){
  const combos = {};
  school.exams.forEach(e=>{
    if(school.marks[e.id] && Object.keys(school.marks[e.id]).length) combos[e.year+'|'+e.term] = {year:e.year, term:e.term};
  });
  const list = Object.values(combos);
  if(!list.length) return null;
  const tn = t=>Number(t.slice(-1));
  list.sort((a,b)=> b.year-a.year || tn(b.term)-tn(a.term));
  return list[0];
}
function tplDashboard(school){

/* ============================= TEACHER DASHBOARD (own grades/areas only) ============================= */
function teacherLatestTermYear(school, myClasses){
  const combos = {};
  school.exams.forEach(e=>{
    if(!myClasses.includes(e.classId)) return;
    if(school.marks[e.id] && Object.keys(school.marks[e.id]).length) combos[e.year+'|'+e.term] = {year:e.year, term:e.term};
  });
  const list = Object.values(combos);
  if(!list.length) return null;
  const tn = x=>Number(x.slice(-1));
  list.sort((a,b)=> b.year-a.year || tn(b.term)-tn(a.term));
  return list[0];
}
function initTeacherDashboardControls(){
  const school = currentSchool(), t = currentTeacher(), myClasses = teacherClassIds(school, t);
  const latest = teacherLatestTermYear(school, myClasses), now = new Date().getFullYear();
  const term = latest ? latest.term : 'Term 1', year = latest ? latest.year : now;
  const sel = qs('#tdashTerm'); if(!sel) return;
  sel.innerHTML = ['Term 1','Term 2','Term 3'].map(x=>`<option ${x===term?'selected':''}>${x}</option>`).join('');
  qs('#tdashYear').value = year;
}
function runTeacherDashboard(){
  const target = qs('#tdashArea'); if(!target) return;
  const school = currentSchool(), t = currentTeacher();
  const term = qs('#tdashTerm').value, year = Number(qs('#tdashYear').value);
  const myClasses = teacherClassIds(school, t);
  const rows = [];
  myClasses.forEach(cid=>{
    const cls = school.classes.find(c=>c.id===cid);
    teacherAreaIds(school, t, cid).forEach(aid=>{
      const area = school.learningAreas.find(a=>a.id===aid);
      const exams = school.exams.filter(e=>e.classId===cid && e.term===term && e.year===year);
      if(!exams.length || !area) return;
      const learners = unionStudents(exams.flatMap(ex=>studentsForExam(school, ex)));
      const scores = [];
      learners.forEach(s=>{
        let sp=0, n=0;
        exams.forEach(ex=>{ const sc=(school.marks[ex.id]||{})[s.id]?.[aid]; if(sc!=null){ sp+=pctOf(sc, ex.maxMarksByArea[aid]??100); n++; } });
        if(n) scores.push({s, pct: sp/n});
      });
      if(!scores.length) return;

  ${rows.slice().sort((a,b)=>b.mean-a.mean).map(r=>`<tr><td style="text-align:left">${escapeHtml(r.cls.name)}</td><td style="text-align:left">${escapeHtml(r.area.name)}</td><td>${r.assessed} of ${r.enrolled}</td><td><b>${r.mean.toFixed(1)}%</b></td><td style="text-align:left">${r.winners.map(w=>escapeHtml(w.s.name)+' ('+w.pct.toFixed(1)+'%)').join(', ')}</td></tr>`).join('')}
  </table></div>
  ${Object.entries(byArea).filter(([,g])=>g.length>1).map(([name,g])=>{
    const sorted = g.slice().sort((a,b)=>b.mean-a.mean);
    return `<div class="ra-sec" style="margin-top:16px"><h3 style="color:var(--navy);margin:0 0 6px">${escapeHtml(name)} — Stream Comparison</h3>

  }).join('')}`;
}

// Tiny CSV reader — handles quoted fields (so a note with a comma in it doesn't split a
// row wrong) without pulling in a library for three plain columns.
function parseSimpleCSV(text){
  const rows = []; let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){ if(text[i+1]==='"'){ field+='"'; i++; } else inQuotes=false; }
      else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field=''; }
      else if(c === '\r'){ /* ignore, \n handles the row break */ }
      else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r=>r.some(c=>String(c).trim()!==''));
}
function applyFeesCsv(){
  if(!canEdit()){ noEdit(); return; }
  const school = currentSchool();
  const examId = qs('#ffExam') && qs('#ffExam').value;
  const exam = school.exams.find(e=>e.id===examId);
  const msgEl = qs('#ffImportMsg');
  const fileInput = qs('#ffCsvFile');
  const file = fileInput && fileInput.files[0];
  if(!exam){ msgEl.innerHTML = '<div class="msg err">Pick a Grade and Exam/Term first.</div>'; return; }
  if(!file){ msgEl.innerHTML = '<div class="msg err">Choose a CSV file first.</div>'; return; }
  const reader = new FileReader();
  reader.onload = function(e){
    const rows = parseSimpleCSV(String(e.target.result||''));
    if(rows.length < 2){ msgEl.innerHTML = '<div class="msg err">That file has no data rows (just a header, or empty).</div>'; return; }
    const header = rows[0].map(h=>String(h).trim().toLowerCase());
    let admIdx = header.findIndex(h=>h.includes('adm'));
    let balIdx = header.findIndex(h=>h.includes('balance')||h.includes('arrear'));
    let nextIdx = header.findIndex(h=>h.includes('next'));
    if(admIdx<0 && header.length>=3){ admIdx=0; balIdx=1; nextIdx=2; } // no recognizable header — assume fixed column order
    if(admIdx<0){ msgEl.innerHTML = '<div class="msg err">Could not find an "Admission No" column in the header row.</div>'; return; }
    const learners = studentsForExam(school, exam);
    const byAdm = {}; learners.forEach(s=>{ if(s.adm) byAdm[String(s.adm).trim().toLowerCase()] = s; });
    let matched = 0; const unmatched = [];
    if(!school.fees[examId]) school.fees[examId] = {};
    const fi = currentFinance();
    for(let i=1;i<rows.length;i++){
      const r = rows[i];
      const adm = String(r[admIdx]||'').trim();
      if(!adm) continue;
      const s = byAdm[adm.toLowerCase()];
      if(!s){ unmatched.push(adm); continue; }
      const balance = balIdx>=0 ? Number(String(r[balIdx]||'').replace(/[^0-9.\-]/g,'')) : null;
      const nextTermFee = nextIdx>=0 ? Number(String(r[nextIdx]||'').replace(/[^0-9.\-]/g,'')) : null;
      school.fees[examId][s.id] = {
        balance: isNaN(balance) ? null : balance,
        nextTermFee: isNaN(nextTermFee) ? null : nextTermFee,
        updatedAt: Date.now(), updatedBy: fi ? fi.name : 'DOS/HOI'
      };
      matched++;
    }
    saveDB(DB);
    msgEl.innerHTML = `<div class="msg ok">Applied to ${matched} learner(s).${unmatched.length ? ` ${unmatched.length} admission number(s) didn't match anyone in this grade: ${unmatched.slice(0,10).map(escapeHtml).join(', ')}${unmatched.length>10?', …':''}` : ''}</div>`;
    fileInput.value = '';
    loadFinanceFeesSummary();
  };
  reader.onerror = function(){ msgEl.innerHTML = '<div class="msg err">Could not read that file.</div>'; };
  reader.readAsText(file);
}

function inRange(d,f,t){ return d>=f && d<=t; }
function collectionsData(){
  const school = currentSchool(); const f = qs('#colFrom').value, t = qs('#colTo').value;
  const pays = school.payments.filter(p=>!p.void && inRange(p.date,f,t)).sort((a,b)=>a.date<b.date?-1:1);
  const exps = school.expenses.filter(e=>!e.void && inRange(e.date,f,t));
  const byMethod = {}; pays.forEach(p=>byMethod[p.method]=(byMethod[p.method]||0)+p.amount);
  const income = pays.reduce((a,p)=>a+p.amount,0), spent = exps.reduce((a,e)=>a+e.amount,0);
  return {school,f,t,pays,exps,byMethod,income,spent};
}

function saveFeeStructure(quiet){
  if(!canEdit()){ noEdit(); return; }

function compTotal(st){ return ((st&&st.items)||[]).filter(i=>!i.optional).reduce((t,i)=>t+i.amount,0); }
function invoiceLines(st, r){
  const lines = [{name:'Tuition', amount:st.amount}];
  (st.items||[]).filter(i=>!i.optional).forEach(i=>lines.push({name:i.name, amount:i.amount}));
  (r.extras||[]).forEach(n=>{ const it=(st.items||[]).find(i=>i.optional && i.name===n); if(it) lines.push({name:it.name, amount:it.amount}); });
  return lines;
}
function generateInvoices(){
  if(!canEdit()){ noEdit(); return; }
  if(!saveFeeStructure(true)) return;
  const {school, exam, recs, learners} = feeCtx(); const st = school.feeStructure[exam.id];
  const todo = learners.filter(l=>(recs[l.id]||{}).billed==null);
  if(!todo.length){ qs('#fsMsg').innerHTML='<div class="msg">Every learner in this grade is already invoiced for this term.</div>'; return; }
  const total = todo.reduce((t,l)=>t+invoiceLines(st, recs[l.id]||{}).reduce((a,x)=>a+x.amount,0),0);
  if(!confirm(`Invoice ${todo.length} learner(s) for ${exam.name}, total KES ${total.toLocaleString()}? Existing balances are kept and the fees are added on top.`)) return;
  const fi = currentFinance(); if(!school.fees[exam.id]) school.fees[exam.id] = {};
  todo.forEach(l=>{ const r = school.fees[exam.id][l.id] || (school.fees[exam.id][l.id] = {}); r.openingBalance = Number(r.balance)||0; r.lines = invoiceLines(st, r); r.billed = r.lines.reduce((a,x)=>a+x.amount,0); r.balance = r.openingBalance + r.billed; r.updatedAt = Date.now(); r.updatedBy = fi?fi.name:'School Admin'; });

function addFeeItem(){

  if(!exam){ toast('Pick a grade and exam first','err'); return; }

  if(st.items.some(i=>i.name.toLowerCase()===name.toLowerCase())){ toast('That item already exists','err'); return; }

  qs('#fiName').value=''; qs('#fiAmt').value=''; toast('Item added'); refreshStructure();
}
function removeFeeItem(i){
  if(!canEdit()){ noEdit(); return; }
  const {school, exam} = feeCtx(); const st = school.feeStructure[exam.id]; if(!st||!st.items[i]) return;

function assignExtra(add){
  if(!canEdit()){ noEdit(); return; }
  const {school, exam} = feeCtx(); const sid = qs('#optLearner').value, name = qs('#optItem').value;
  const st = exam && school.feeStructure[exam.id]; const it = st && (st.items||[]).find(i=>i.optional && i.name===name);
  if(!sid||!it){ toast('Pick a learner and an optional item','err'); return; }
  if(!school.fees[exam.id]) school.fees[exam.id] = {};
  const r = school.fees[exam.id][sid] || (school.fees[exam.id][sid] = {}); r.extras = r.extras||[];
  const has = r.extras.includes(name);
  if(add && has){ toast('Already assigned','err'); return; }
  if(!add && !has){ toast('Not assigned to this learner','err'); return; }
  const billed = r.billed!=null; r.lines = r.lines||[];
  if(add){ r.extras.push(name); if(billed){ r.lines.push({name, amount:it.amount}); r.billed += it.amount; r.balance = (Number(r.balance)||0) + it.amount; } }
  else { r.extras = r.extras.filter(x=>x!==name); if(billed){ const k = r.lines.findIndex(x=>x.name===name); if(k>-1) r.lines.splice(k,1); r.billed -= it.amount; r.balance = (Number(r.balance)||0) - it.amount; } }
  r.updatedAt = Date.now(); saveDB(DB);
  toast(billed ? (add?'Assigned and charged to balance':'Removed and credited back') : (add?'Assigned — charged when invoiced':'Removed')); loadFinanceFeesSummary();
}

function applyDiscount(){
  if(!canEdit()){ noEdit(); return; }
  const {school, exam} = feeCtx(); const sid = qs('#discLearner').value, amt = Number(qs('#discAmt').value), reason = qs('#discReason').value.trim();
  if(!exam||!sid){ toast('Pick a learner','err'); return; }
  if(!(amt>0)||!reason){ toast('Enter an amount and a reason','err'); return; }
  if(!school.fees[exam.id]) school.fees[exam.id] = {};
  const r = school.fees[exam.id][sid] || (school.fees[exam.id][sid] = {});
  r.balance = (Number(r.balance)||0) - amt; r.discount = (Number(r.discount)||0) + amt; r.updatedAt = Date.now();
  const fi = currentFinance();
  school.feeAdjust.push({id:uid('adj_'), examId:exam.id, studentId:sid, amount:amt, reason, date:today10(), by:fi?fi.name:'School Admin', ts:Date.now()});
  saveDB(DB); qs('#discAmt').value=''; qs('#discReason').value=''; toast('Discount applied'); loadFinanceFeesSummary();
}
function voidAdjust(id){
  if(!canEdit()){ noEdit(); return; }
  const school = currentSchool(); const a = school.feeAdjust.find(x=>x.id===id); if(!a||a.void||!confirm('Void this discount? The amount is added back to the learner\'s balance.')) return;
  const r = (school.fees[a.examId]||{})[a.studentId]; if(r){ r.balance = (Number(r.balance)||0) + a.amount; r.discount = Math.max(0,(Number(r.discount)||0) - a.amount); }
  a.void = true; saveDB(DB); toast('Discount voided'); loadFinanceFeesSummary();
}
function smsPayConfirm(pay){
  const school = currentSchool(), st = school.students.find(x=>x.id===pay.studentId)||{}, el = qs('#payMsg');
  const msg = `Received KES ${pay.amount.toLocaleString()} for ${st.name} on ${pay.date}. Receipt ${pay.receiptNo}. Balance: KES ${pay.balanceAfter.toLocaleString()}. - ${school.name}`;
  const built = buildSmsRecipients([{phone:st.parentPhone, message:msg}]);
  const note = t=>{ el.innerHTML = `<div class="msg err">Payment saved. ${t}</div>`; };
  if(!built.recipients.length){ note('SMS not sent: this learner has no valid parent phone number.'); return; }
  if(!hasSmsConfig()){ note('SMS is not set up on this deployment.'); return; }
  if(!smsPinGate('payMsg')) return;
  if(smsSegments(msg) > (school.smsCredits||0)){ note('SMS not sent: not enough SMS credit.'); return; }
  sendSmsBatch(school, built.recipients, {type:'Payment Confirmation', audience: st.name||'Parent'}, 'payMsg');
}

function dlBlob(name, text, type){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type})); a.download=name; document.body.appendChild(a); a.click(); a.remove(); }
function backupFinance(){
  const sc = currentSchool();
  dlBlob(`finance-backup-${sc.code}-${today10()}.json`, JSON.stringify({app:'EduTrack finance backup', version:1, school:sc.code, name:sc.name, exportedAt:new Date().toISOString(), fees:sc.fees, payments:sc.payments, expenses:sc.expenses, feeAdjust:sc.feeAdjust, feeStructure:sc.feeStructure, payInstructions:sc.payInstructions}), 'application/json');
  toast('Backup downloaded');

function restoreFinance(input){
  if(!canEdit()){ noEdit(); input.value=''; return; }
  const f = input.files && input.files[0]; if(!f) return; const sc = currentSchool(), out = qs('#archMsg');
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const d = JSON.parse(r.result);
      if(d.app!=='EduTrack finance backup') throw new Error('This is not a finance backup file.');
      if(d.school!==sc.code) throw new Error('This backup belongs to a different school ('+(d.name||d.school)+').');
      if(!confirm(`Restore backup from ${new Date(d.exportedAt).toLocaleString()}?\n\nThis REPLACES all current fee balances, payments, expenses, discounts and fee structures.`)) { input.value=''; return; }
      sc.fees = d.fees||{}; sc.payments = d.payments||[]; sc.expenses = d.expenses||[]; sc.feeAdjust = d.feeAdjust||[]; sc.feeStructure = d.feeStructure||{}; sc.payInstructions = d.payInstructions||'';

function closingData(){
  const sc = currentSchool(); const key = qs('#clTerm').value; if(!key) return null;
  const f = qs('#clFrom').value, t = qs('#clTo').value;
  const exams = sc.exams.filter(e=>String(e.term)+' '+String(e.year)===key);
  const rows = exams.map(e=>{
    const recs = sc.fees[e.id]||{}, ls = studentsForExam(sc, e);
    const billed = ls.reduce((a,l)=>a+(Number((recs[l.id]||{}).billed)||0),0);
    const disc = sc.feeAdjust.filter(a=>!a.void && a.examId===e.id).reduce((a,x)=>a+x.amount,0);
    const paid = sc.payments.filter(p=>!p.void && p.examId===e.id).reduce((a,p)=>a+p.amount,0);
    const owing = ls.filter(l=>Number((recs[l.id]||{}).balance)>0);
    return {cls:((sc.classes.find(c=>c.id===e.classId)||{}).name)||e.name, n:ls.length, billed, disc, paid, out:owing.reduce((a,l)=>a+Number(recs[l.id].balance),0), owing:owing.length};
  });
  const ids = new Set(exams.map(e=>e.id)); const byMethod = {};
  sc.payments.filter(p=>!p.void && ids.has(p.examId)).forEach(p=>byMethod[p.method]=(byMethod[p.method]||0)+p.amount);
  const exps = sc.expenses.filter(e=>!e.void && inRange(e.date,f,t)), byCat = {}; exps.forEach(e=>byCat[e.category]=(byCat[e.category]||0)+e.amount);
  const top = []; exams.forEach(e=>{ const recs = sc.fees[e.id]||{}; studentsForExam(sc,e).forEach(l=>{ const b=Number((recs[l.id]||{}).balance); if(b>0) top.push({name:l.name, adm:l.adm||'', cls:(sc.classes.find(c=>c.id===e.classId)||{}).name||'', b}); }); });
  top.sort((a,b)=>b.b-a.b);
  return {sc, key, f, t, rows, byMethod, byCat, top:top.slice(0,10), spent:exps.reduce((a,e)=>a+e.amount,0)};
}

// Draws one learner's performance-trend line chart onto its canvas.
// Called explicitly after the report HTML has been inserted into the DOM
// (see generateReport/generateAllReports) since scripts set via innerHTML don't run.
function drawProgressChart(chartId, data){
  const c = document.getElementById(chartId); if(!c) return;
  const ctx = c.getContext('2d');
  ctx.clearRect(0,0,c.width,c.height);
  ctx.strokeStyle='#123a63'; ctx.lineWidth=1; ctx.strokeRect(0,0,c.width,c.height);
  if(!data || data.length===0){ ctx.fillStyle='#555'; ctx.font='14px Arial'; ctx.fillText('No historical data yet',16,c.height/2); return; }
  const padL=54,padB=40,padT=16,w=c.width-padL-16,h=c.height-padT-padB;
  // Gridlines and axis labels use a mid-gray dark enough to survive black-and-white/
  // grayscale printing (the previous very light tint was fine on a color screen but
  // printed as good as invisible on paper).
  ctx.strokeStyle='#123a63'; ctx.fillStyle='#123a63'; ctx.font='12px Arial';
  for(let g=0; g<=4; g++){ const y=padT+h-h*(g/4); ctx.fillText((g*25)+'%', 4, y+4); ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(c.width-8,y); ctx.strokeStyle='#a9b6c4'; ctx.lineWidth=1; ctx.stroke(); }
  // The trend line itself is drawn in navy rather than gold: navy keeps strong contrast
  // against white paper whether the report prints in color or in plain black-and-white,
  // while the gold shade used elsewhere as an accent gets too pale once desaturated.
  ctx.beginPath(); ctx.strokeStyle='#123a63'; ctx.lineWidth=3;
  data.forEach((d,i)=>{ const x=padL + (data.length>1? (w*i/(data.length-1)) : w/2); const y=padT+h-h*(d.pct/100);
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); });
  ctx.stroke();
  data.forEach((d,i)=>{ const x=padL + (data.length>1? (w*i/(data.length-1)) : w/2); const y=padT+h-h*(d.pct/100);
    ctx.beginPath(); ctx.arc(x,y,5,0,7); ctx.fillStyle='#d9a441'; ctx.fill(); ctx.lineWidth=1.5; ctx.strokeStyle='#123a63'; ctx.stroke();
    ctx.save(); ctx.translate(x,c.height-10); ctx.fillStyle='#123a63'; ctx.font='11px Arial'; ctx.textAlign='center'; ctx.fillText(d.label, 0, 0); ctx.restore();
  });
}
/* ============================= PRINT: FIT REPORT CARD TO ONE PAGE =============================
   Guarantees a learner report always lands on exactly one A4 page, however many learning
   areas a school has configured. Right before printing, this measures each .report-card's
   actual rendered height against the printable page height and, if it's even slightly too
   tall, shrinks it with CSS zoom — which (unlike transform:scale) causes a real reflow, so
   nothing gets clipped, cut off, or spills a sliver onto a second page. Resets back to normal
   size again once printing is done, so on-screen viewing is unaffected. */
function fitReportCardsToPage(){
  const mmToPx = mm => mm * 96/25.4;
  // A small safety buffer (2mm) below the true printable height, so a report that lands
  // right on the edge (rounding, font metrics, etc.) still shrinks a hair rather than
  // spilling onto a second, otherwise-empty page.
  const pageHeightPx = mmToPx(279.4) - mmToPx(8)*2 - mmToPx(2);
  document.querySelectorAll('.report-card').forEach(el=>{
    el.style.zoom = 1;
    const h = el.scrollHeight;
    if(h > pageHeightPx){
      const ratio = Math.max(0.55, pageHeightPx / h); // never shrink past ~55% — stays legible
      el.style.zoom = ratio;
    }
  });
}
window.addEventListener('beforeprint', fitReportCardsToPage);
window.addEventListener('afterprint', ()=>{
  document.querySelectorAll('.report-card').forEach(el=>{ el.style.zoom = 1; });
});

// functions below are shared by both, gated by permission rather than by role. (Reuses
// the existing renderCurrentPortal() defined above, near the Class Teacher Tools.)
function addAssignment(){
  const school = currentSchool();
  const classId = qs('#asgClass').value;
  const title = qs('#asgTitle').value.trim();
  const dueDate = qs('#asgDue').value;
  const instructions = qs('#asgBody').value.trim();
  const visible = qs('#asgVisible').checked;
  const msgEl = qs('#asgMsg');
  if(!classId){ msgEl.innerHTML = '<div class="msg err">Choose a grade first.</div>'; return; }
  if(teacherDenied('canPostAssignments', classId)) return;
  if(!title){ msgEl.innerHTML = '<div class="msg err">Give the assignment a title.</div>'; return; }
  if(!instructions){ msgEl.innerHTML = '<div class="msg err">Add the assignment instructions — this is what parents will see and print.</div>'; return; }
  const finish = (attachment)=>{
    school.assignments.unshift({ id: uid('asg_'), classId, title, instructions, dueDate, attachment: attachment||'', postedAt: Date.now(), visible });
    saveDB(DB);
    toast(visible ? 'Assignment sent — visible to parents now.' : 'Assignment saved as hidden — toggle it on when ready.');
    renderCurrentPortal();
  };
  const file = qs('#asgFile').files && qs('#asgFile').files[0];
  if(file){
    if(!file.type.startsWith('image/')){ msgEl.innerHTML = '<div class="msg err">Attachment must be an image file.</div>'; return; }
    if(file.size > 2*1024*1024){ msgEl.innerHTML = '<div class="msg err">Image is too large — please use one under 2MB.</div>'; return; }
    const reader = new FileReader();
    reader.onload = ()=>finish(reader.result);
    reader.onerror = ()=>{ msgEl.innerHTML = '<div class="msg err">Could not read that image — please try another file.</div>'; };
    reader.readAsDataURL(file);
  } else finish('');
}
