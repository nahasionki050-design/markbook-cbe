function isExamClosed(e){
  if(e.closed) return true;
  if(e.closingDate && todayISO() > e.closingDate) return true;
  return false;
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function setExamClosingDate(id,val){
  const school = currentSchool(); const e = school.exams.find(x=>x.id===id);
  e.closingDate = val || ''; touchExam(e); saveDB(DB); renderDOS();
}
// Term-closing / next-term-opening dates shown on the printed report card. Purely
// informational — unlike closingDate above, these never affect entry locking.
function setExamTermDate(id, field, val){
  const school = currentSchool(); const e = school.exams.find(x=>x.id===id);
  if(!e) return;
  if(field==='termCloseDate') e.termCloseDate = val || '';
  else if(field==='nextTermDate') e.nextTermDate = val || '';
  touchExam(e); saveDB(DB);
}
// Total number of school days this term counted against — the denominator for every
// learner's attendance shown on their report card for this exam.
function setExamTotalDays(id, val){
  const school = currentSchool(); const e = school.exams.find(x=>x.id===id);
  if(!e) return;
  e.totalDays = Math.max(0, Number(val)||0); touchExam(e); saveDB(DB);
}
// Days a given learner was present for this exam's term. Stored separately from marks
// (school.attendance, not school.marks) since it isn't graded and shouldn't touch position/mean.
function setAttendance(examId, sid, val){
  const school = currentSchool(); const e = school.exams.find(x=>x.id===examId);
  if(!e) return;
  const days = Math.max(0, Math.min(e.totalDays||9999, Number(val)||0));
  school.attendance[examId] = school.attendance[examId] || {};
  if(val===''){ delete school.attendance[examId][sid]; } else { school.attendance[examId][sid] = days; }
  saveDB(DB);
}
function closeExamNow(id){
  const school = currentSchool(); const e = school.exams.find(x=>x.id===id);
  if(classTeacherDenied('canManageEntry', e.classId)) return;
  e.closed = true; touchExam(e); saveDB(DB); toast('Entry period closed for '+e.name); renderCurrentPortal();
}
// Reopening entry means the recorded marks are open to change again: any earlier approval no
// longer covers them, and requests still waiting on a decision are now moot (the teacher can
// edit directly) — leaving them pending could later overwrite fresher marks with stale values.
function supersedePendingRequests(e, note){
  (e.editRequests||[]).forEach(r=>{
    if(r.status==='pending'){ r.status='rejected'; r.note=note; r.decidedAt=new Date().toISOString(); r.decidedBy='System'; }
  });
}
function reopenExam(id){
  const school = currentSchool(); const e = school.exams.find(x=>x.id===id);
  if(classTeacherDenied('canManageEntry', e.classId)) return;
  e.closed = false; e.closingDate = '';
  if(e.resultsApproval==='approved'){ e.resultsApproval = 'pending'; e.approvedBy = ''; e.approvalAt = ''; }
  supersedePendingRequests(e, 'Entry was reopened — edit the mark directly.');
  touchExam(e); saveDB(DB); toast('Entry period reopened for '+e.name); renderCurrentPortal();
}
// Shows/hides this one exam in the Parent Portal, independent of its entry-closed state and
// its Results Approval — a DOS/HOI-only control (this exam card only ever renders in the DOS
// Exams tab), so a teacher granted other exam permissions still can't change what parents see.
function setExamParentVisible(id, visible){
  const school = currentSchool(); const e = school.exams.find(x=>x.id===id);
  if(!e) return;
  e.parentVisible = !!visible;
  touchExam(e); saveDB(DB);
  toast(visible ? 'This exam is now visible to parents' : 'This exam is now hidden from parents');
  renderCurrentPortal();
}
function dosDisplayName(school){
  const rec = (school.dos||[]).find(d=>d.id===(session&&session.userId));
  return (rec && rec.name) || school.hoiName || 'DOS/HOI';
}
// Name recorded against an approval/decision: the signed-in DOS/HOI's name, or a class
// teacher's name with a label, so it's always clear who actually acted — matters once
// class teachers can approve/disapprove results themselves, not just the DOS/HOI.
function approverDisplayName(school){
  if(session && session.role==='teacher'){
    const t = currentTeacher();
    return t ? t.name+' (Class Teacher)' : 'Class Teacher';
  }
  return dosDisplayName(school);
}
// Re-draws whichever portal is currently on screen after an action — a DOS/HOI session
// re-renders the DOS screen, a class-teacher session re-renders their own Teacher screen.
function renderCurrentPortal(){
  if(session && session.role==='teacher') renderTeacher(); else renderDOS();
}
// True only when a teacher session holds `perm` (canApproveResults / canApproveEditRequests /
// canManageEntry) AND is listed as Class Teacher for classId. False for a DOS/HOI/Admin/Parent
// session (they're never blocked by this) and false for any teacher who isn't that grade's
// class teacher, however capable they are for their own subject.
function classTeacherMay(perm, classId){
  if(!session || session.role!=='teacher') return true;
  const t = currentTeacher(); if(!t) return false;
  if(!Array.isArray(t.classTeacherOf) || !t.classTeacherOf.includes(classId)) return false;
  return t[perm]===true;
}
function classTeacherDenied(perm, classId){
  if(!session || session.role!=='teacher') return false;
  if(classTeacherMay(perm, classId)) return false;
  toast("You don't have access to that — ask your DOS/HOI","err");
  return true;
}
function approveExamResults(id){
  const school = currentSchool(); const e = school.exams.find(x=>x.id===id);
  if(classTeacherDenied('canApproveResults', e.classId)) return;
  if((e.editRequests||[]).some(r=>r.status==='pending')){ toast('Resolve the pending edit requests first','err'); return; }
  const c = examCompletion(school, e), missing = c.total - c.filled;
  const msg = (missing>0 ? `⚠ ${missing} mark(s) are still missing (${c.filled} of ${c.total} entered).\n\n` : '')
    + `Approve results for "${e.name}"?\n\nEntry will be closed so the approved marks are locked — teachers can then only send edit requests for you to approve.`;
  if(!confirm(msg)) return;
  e.resultsApproval = 'approved'; e.approvalNote = '';
  e.approvedBy = approverDisplayName(school); e.approvalAt = new Date().toISOString();
  e.closed = true;
  touchExam(e); saveDB(DB); toast('Results approved for '+e.name); renderCurrentPortal();
}
function disapproveExamResults(id){
  const school = currentSchool(); const e = school.exams.find(x=>x.id===id);
  if(classTeacherDenied('canApproveResults', e.classId)) return;
  const note = prompt(`Why are you disapproving "${e.name}"? Teachers will see this reason and entry will reopen so they can correct it:`);
  if(note===null) return;
  if(!note.trim()){ toast('Please give a short reason so teachers know what to fix','err'); return; }
  e.resultsApproval = 'disapproved'; e.approvalNote = note.trim();
  e.approvedBy = ''; e.approvalAt = new Date().toISOString();
  e.closed = false; e.closingDate = '';
  supersedePendingRequests(e, 'Results were disapproved and entry reopened — edit the mark directly.');
  touchExam(e); saveDB(DB);
  toast('Results disapproved — entry reopened for '+e.name); renderCurrentPortal();
}
function approveEditRequest(examId,reqId){
  const school = currentSchool(); const e = school.exams.find(x=>x.id===examId);
  if(classTeacherDenied('canApproveEditRequests', e.classId)) return;
  const req = (e.editRequests||[]).find(r=>r.id===reqId); if(!req || req.status!=='pending') return;
  school.marks[examId] = school.marks[examId] || {};
  school.marks[examId][req.sid] = school.marks[examId][req.sid] || {};
  school.marks[examId][req.sid][req.areaId] = req.newVal;
  req.status = 'approved'; req.decidedAt = new Date().toISOString(); req.decidedBy = approverDisplayName(school);
  // The marks changed, so any earlier results approval no longer covers them.
  if(e.resultsApproval==='approved'){ e.resultsApproval = 'pending'; e.approvedBy = ''; e.approvalAt = ''; }
  touchExam(e);
  saveDB(DB); pushMarkToCloud(school.code, examId, req.sid, req.areaId, req.newVal);
  toast('Edit approved & applied'); renderCurrentPortal();
}
function rejectEditRequest(examId,reqId){
  const school = currentSchool(); const e = school.exams.find(x=>x.id===examId);
  if(classTeacherDenied('canApproveEditRequests', e.classId)) return;
  const req = (e.editRequests||[]).find(r=>r.id===reqId); if(!req || req.status!=='pending') return;
  const note = prompt('Reason for rejecting (optional — the teacher will see it):');
  if(note===null) return;
  req.status = 'rejected'; req.note = note.trim(); req.decidedAt = new Date().toISOString(); req.decidedBy = approverDisplayName(school);
  touchExam(e); saveDB(DB); toast('Edit request rejected','err'); renderCurrentPortal();
}
function renderExamAreaInputsHTML(school, classId){
  const areas = classId ? areasForClass(school, classId) : school.learningAreas;
  return areas.map(a=>`<div><label>${escapeHtml(a.name)}</label><input type="number" class="examMax" min="1" data-area="${a.id}" value="100"></div>`).join('')
    || '<p class="small">No learning areas assigned to this grade yet — add some in the Learning Areas tab.</p>';
}
function renderExamAreaInputs(){
  const school = currentSchool(); const classId = qs('#exClass').value;
  qs('#examAreaInputs').innerHTML = renderExamAreaInputsHTML(school, classId);
}
function addExam(){
  const name = qs('#exName').value.trim(), term = qs('#exTerm').value, year = Number(qs('#exYear').value), classId = qs('#exClass').value;
  if(!name||!classId){ toast('Fill exam name & grade','err'); return; }
  const school = currentSchool();
  // A grade with no learning areas ticked yet would otherwise create an exam nobody can
  // ever enter a mark for — nothing downstream (marks grid, reports, sheets) has anything
  // to show, and it's easy to miss why until much later.
  if(!areasForClass(school, classId).length){ toast('This grade has no learning areas assigned yet — add some in the Learning Areas tab first','err'); return; }
  // Re-submitting the form (a slow connection, an accidental double-click) used to silently
  // create a second identical exam with its own empty marks — teachers then don't know which
  // one to enter into, and reports/analysis double-count the grade. Doesn't block a genuine
  // resit under the same name; just makes sure it's on purpose.
  const dup = school.exams.some(x=>x.classId===classId && x.term===term && x.year===year && x.name.trim().toLowerCase()===name.toLowerCase());
  if(dup && !confirm(`An exam named "${name}" already exists for this grade in ${term} ${year}.\n\nCreate another one anyway?`)) return;
  const maxMarksByArea = {};
  qsa('.examMax').forEach(inp=> maxMarksByArea[inp.dataset.area] = Math.max(1, Number(inp.value)||100));
  school.exams.push({id:uid('ex_'), name, term, year, classId, maxMarksByArea, date:new Date().toISOString(),
    closed:false, closingDate:'', editRequests:[], resultsApproval:'pending',
    termCloseDate:'', nextTermDate:'', totalDays:0, parentVisible:true});
  saveDB(DB); renderDOS();
}
// Corrects the exam's own name/term/year after creation — without this, fixing a typo meant
// deleting the exam (which also deletes every recorded mark for it) and starting over.
function renameExam(id,field,val){
  const school = currentSchool(); const e = school.exams.find(x=>x.id===id);
  if(field==='name'){
    const v = val.trim();
    if(!v){ toast('Exam name cannot be empty','err'); renderDOS(); return; }
    e.name = v;
  } else if(field==='term'){
    e.term = val;
  } else if(field==='year'){
    const y = Number(val);
    if(!y){ toast('Enter a valid year','err'); renderDOS(); return; }
    e.year = y;
  }
  touchExam(e); saveDB(DB); renderDOS();
}
// The fix for the "(editable by DOS/HOI in the Exams tab)" note shown next to Max Marks on
// every marks-entry and marks-review screen — until now there was nowhere to actually do
// that editing. Existing recorded scores are left exactly as entered; only the max they're
// scored/graded against changes, so lowering it can push a learner's % above 100 until their
// score is corrected too (the marks grid still caps new entries at the current max).
function updExamMaxMarks(examId,areaId,val){
  const school = currentSchool(); const e = school.exams.find(x=>x.id===examId);
  let max = Number(val);
  if(!max || max<1) max = 1;
  e.maxMarksByArea[areaId] = max;
  touchExam(e); saveDB(DB); renderDOS();
}
function delExam(id){
  const school = currentSchool(); const e = school.exams.find(x=>x.id===id);
  const warn = (e && e.resultsApproval==='approved') ? '\n\n⚠ This exam\'s results were already approved — deleting it permanently removes those official marks for every learner.' : '';
  if(!confirm('Delete this exam and its recorded marks?'+warn)) return;
  school.exams = school.exams.filter(x=>x.id!==id); delete school.marks[id]; saveDB(DB); renderDOS();
}

function toggleClassTeacherOf(tid,classId,checked){
  const t = currentSchool().teachers.find(x=>x.id===tid);
  if(!Array.isArray(t.classTeacherOf)) t.classTeacherOf = [];
  if(checked){ if(!t.classTeacherOf.includes(classId)) t.classTeacherOf.push(classId); }
  else t.classTeacherOf = t.classTeacherOf.filter(id=>id!==classId);
  saveDB(DB); renderDOS();
}
function addTeacher(){
  const name=qs('#teName').value.trim(), username=qs('#teUser').value.trim();
  let password=qs('#tePass').value.trim();
  const email=qs('#teEmail').value.trim(), phone=qs('#tePhone').value.trim();
  const gender=(qs('#teGender')||{}).value||'', farFromSchool=!!(qs('#teFar')||{}).checked;
  if(!name||!username){ toast('Fill in name & username','err'); return; }
  if(!password) password = 'tea123';
  const school = currentSchool();
  if(school.teachers.some(t=>t.username===username)){ toast('That username is already taken','err'); return; }
  school.teachers.push({id:uid('t_'), name, username, password, email, phone, gender, farFromSchool, assignments:[], canPrint:true, canPrintAssess:false, canPostAssignments:false, canAddQuestions:true,
    classTeacherOf:[], canApproveResults:false, canApproveEditRequests:false, canManageEntry:false});
  saveDB(DB); toast(`Teacher added. Password: ${password}`); renderDOS();
}
// Gender and farFromSchool are edited inline from the Teachers table, same pattern as
// setTeacherContact — only these two are used by the Duty Rota generator.
function setTeacherField(tid, field, value){
  const t = currentSchool().teachers.find(x=>x.id===tid);

  t[field] = value;
  saveDB(DB);

}
// Lets the DOS/HOI (from this table) or the teacher themselves (from My Account, once
// logged in) keep a registered email/phone on file — the only thing "Forgot password?"
// on the login screen checks against before it will send that teacher a reset code.
function setTeacherContact(tid, field, value){
  const t = currentSchool().teachers.find(x=>x.id===tid);
  if(!t) return;
  t[field] = value.trim();
  saveDB(DB);
  toast('Saved');
}
function assignTeacher(tid,val){
  if(!val) return;
  const [classId,areaId] = val.split('|');
  const school = currentSchool(); const t = school.teachers.find(x=>x.id===tid);
  if(!t.assignments.some(a=>a.classId===classId&&a.areaId===areaId)) t.assignments.push({classId,areaId});
  saveDB(DB); renderDOS();
}
function unassignTeacher(tid,classId,areaId){
  const school = currentSchool(); const t = school.teachers.find(x=>x.id===tid);
  t.assignments = t.assignments.filter(a=>!(a.classId===classId&&a.areaId===areaId));
  saveDB(DB); renderDOS();
}
function toggleTeacherPerm(tid,perm,val){
  const t = currentSchool().teachers.find(x=>x.id===tid); t[perm]=val; saveDB(DB);
}
function delTeacher(tid){
  if(!confirm('Remove this teacher?')) return;
  const school = currentSchool(); school.teachers = school.teachers.filter(t=>t.id!==tid); saveDB(DB); renderDOS();
}

/* --- Class Teacher on-screen signatures ---
   school.classTeacherSigs[classId] = {img (cropped PNG data URL), name (teacher it was signed for),
   tid (teacher account id, if signed from the teacher's own login), at (ISO time)}.
   Stamped on the "Class/Grade Teacher" line of report cards, assessment sheets and cumulative
   sheets. A signature belongs to a person, so it is only printed while the grade's class teacher
   is still that same person; if the name is changed it stops printing until they sign again. */
const ctNorm = v=>String(v||'').trim().toLowerCase().replace(/\s+/g,' ');
function ctSigValid(school, classId){
  const g = (school.classTeacherSigs||{})[classId]; if(!g || !g.img) return false;
  if(ctNorm(g.name) && ctNorm(g.name)===ctNorm((school.classTeachers||{})[classId])) return true;
  const t = g.tid && (school.teachers||[]).find(x=>x.id===g.tid);
  return !!(t && (t.classTeacherOf||[]).includes(classId));
}
function ctSigImg(school, classId){
  return ctSigValid(school, classId) ? `<img src="${school.classTeacherSigs[classId].img}" alt="Class teacher signature">` : '';
}
function ctRow(school, c, mine){
  const g=(school.classTeacherSigs||{})[c.id], nm=(school.classTeachers||{})[c.id]||'', ok=ctSigValid(school,c.id);
  const status = !g ? '<span class="small">Not signed yet</span>'
    : ok ? `<span style="color:#1f8a4c;font-weight:700">✔ Signed</span> <span class="small">${g.at?new Date(g.at).toLocaleDateString():''}</span>`
    : `<span style="color:#d1473f;font-weight:700">⚠ Signed by ${escapeHtml(g.name||'someone else')}</span> <span class="small">— not printed; class teacher is now ${escapeHtml(nm||'not set')}. Please sign again.</span>`;
  return `<tr><td style="text-align:left"><b>${escapeHtml(c.name)}</b></td><td style="text-align:left">${nm?escapeHtml(nm):'<span class="small">No class teacher set (Grades tab)</span>'}</td>
  <td>${g&&g.img?`<img src="${g.img}" alt="" style="max-height:34px;max-width:110px;background:#fff">`:'—'}</td><td style="text-align:left">${status}</td>
  <td>${nm||mine?`<button class="ghost" onclick="ctOpenSign('${c.id}')">✍️ ${g?'Re-sign':'Sign'}</button>`:''}${g?` <button class="danger ghost" onclick="ctRemoveSig('${c.id}')">✕</button>`:''}</td></tr>`;
}
function tplClassTeacherSigs(school){
  const cls=school.classes||[];
  return `<div class="card"><h2>✍️ Class Teacher Signatures</h2>
  <p class="small">Hand the phone or tablet to each class teacher so they can sign on the screen. The signature is cropped automatically and printed on the Class/Grade Teacher line of that grade's report cards, assessment sheets and cumulative sheets. Class teachers can also sign for themselves under <b>My Account</b> when they log in. Only the named class teacher should sign — a signature is only printed while the grade's class teacher is still the same person.</p>
  ${cls.length?`<div style="overflow-x:auto"><table class="ra-table"><tr><th>Grade</th><th>Class Teacher</th><th>Signature</th><th>Status</th><th>Action</th></tr>${cls.map(c=>ctRow(school,c,false)).join('')}</table></div>`:'<p class="small">Add grades first (Grades tab).</p>'}
  </div>`;
}
let ctSigState = {classId:null,drawing:false,lx:0,ly:0};
function ctOpenSign(classId){
  const school=currentSchool(), c=school.classes.find(x=>x.id===classId); if(!c) return;
  const nm=(school.classTeachers||{})[classId]||'', t=(session&&session.role==='teacher')?currentTeacher():null, who=t&&(t.classTeacherOf||[]).includes(classId)?t.name:nm;
  ctSigState.classId=classId;
  const ov=document.createElement('div'); ov.className='ct-ov'; ov.id='ctOv';
  ov.innerHTML=`<div class="ct-box"><h3 style="margin:0 0 4px;color:var(--navy)">✍️ Class Teacher Signature</h3>
  <p class="small" style="margin:0 0 8px"><b>${escapeHtml(c.name)}</b> — ${escapeHtml(who||'class teacher')}. Sign in the box with your finger or mouse.</p>
  <div class="sig-pad-wrap"><canvas id="ctSigPad" width="600" height="180"></canvas></div>
  <label style="display:flex;gap:8px;align-items:flex-start;margin:10px 0;font-weight:400"><input type="checkbox" id="ctSigOk" style="width:auto;margin-top:3px"><span class="small">I am ${escapeHtml(who||'the class teacher')} and I agree this signature may be printed on this grade's reports and sheets.</span></label>
  <div class="flexbtns"><button class="gold" onclick="ctSaveSig()">💾 Save Signature</button><button class="ghost" onclick="ctClearPad()">🧹 Clear</button><button class="ghost" onclick="ctCloseSign()">Cancel</button></div>
  <div id="ctSigMsg"></div></div>`;
  document.body.appendChild(ov);
  const canvas=qs('#ctSigPad'), ctx=canvas.getContext('2d');
  ctx.lineWidth=2.4; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#123a63';
  const pos=e=>{ const r=canvas.getBoundingClientRect(), t=e.touches&&e.touches[0], x=t?t.clientX:e.clientX, y=t?t.clientY:e.clientY; return {x:(x-r.left)*(canvas.width/r.width), y:(y-r.top)*(canvas.height/r.height)}; };
  const st=e=>{ e.preventDefault(); ctSigState.drawing=true; const q=pos(e); ctSigState.lx=q.x; ctSigState.ly=q.y; ctx.beginPath(); ctx.arc(q.x,q.y,1.2,0,Math.PI*2); ctx.fillStyle='#123a63'; ctx.fill(); };
  const mv=e=>{ if(!ctSigState.drawing) return; e.preventDefault(); const q=pos(e); ctx.beginPath(); ctx.moveTo(ctSigState.lx,ctSigState.ly); ctx.lineTo(q.x,q.y); ctx.stroke(); ctSigState.lx=q.x; ctSigState.ly=q.y; };
  const en=()=>{ ctSigState.drawing=false; };
  canvas.onmousedown=st; canvas.onmousemove=mv; canvas.onmouseup=en; canvas.onmouseleave=en; canvas.ontouchstart=st; canvas.ontouchmove=mv; canvas.ontouchend=en;
}
function ctClearPad(){ const c=qs('#ctSigPad'); if(c) c.getContext('2d').clearRect(0,0,c.width,c.height); }
function ctCloseSign(){ const o=qs('#ctOv'); if(o) o.remove(); ctSigState.classId=null; }
function ctSaveSig(){
  const canvas=qs('#ctSigPad'); if(!canvas) return;
  const msg=h=>{ qs('#ctSigMsg').innerHTML=h; };
  const blank=!canvas.getContext('2d').getImageData(0,0,canvas.width,canvas.height).data.some((v,i)=>i%4===3&&v!==0);
  if(blank){ msg('<div class="msg err">Please sign in the box first.</div>'); return; }
  if(!qs('#ctSigOk').checked){ msg('<div class="msg err">Please tick the confirmation box.</div>'); return; }
  const school=currentSchool(), classId=ctSigState.classId; if(!classId) return;
  const t=(session&&session.role==='teacher')?currentTeacher():null, mine=t&&(t.classTeacherOf||[]).includes(classId);
  const name=mine?t.name:((school.classTeachers||{})[classId]||'');
  if(mine && !ctNorm((school.classTeachers||{})[classId])) school.classTeachers[classId]=t.name; // keep the printed name in step
  trimSignature(canvas.toDataURL('image/png'), out=>{
    school.classTeacherSigs[classId]={img:out,name:name,tid:mine?t.id:'',at:new Date().toISOString()};
    saveDB(DB); ctCloseSign(); toast('Class teacher signature saved — it will now print on this grade\'s reports and sheets');
    if(session&&session.role==='teacher') renderTeacher(); else renderDOS();
  });
}
function ctRemoveSig(classId){
  if(!confirm('Remove this class teacher signature? That grade goes back to a plain signature line.')) return;
  const school=currentSchool(); delete school.classTeacherSigs[classId]; saveDB(DB);
  if(session&&session.role==='teacher') renderTeacher(); else renderDOS();
}
function tplMyClassSignatures(school,t){
  const mine=(school.classes||[]).filter(c=>(t.classTeacherOf||[]).includes(c.id)); if(!mine.length) return '';
  return `<div class="card no-print"><h2>✍️ My Signature</h2>
  <p class="small">You are class teacher for the grade(s) below. Sign once here and it prints on your grade's report cards and assessment sheets.</p>
  <div style="overflow-x:auto"><table class="ra-table"><tr><th>Grade</th><th>Class Teacher</th><th>Signature</th><th>Status</th><th>Action</th></tr>${mine.map(c=>ctRow(school,c,true)).join('')}</table></div></div>`;
}
function saveMyTeacherContact(){
  const t = currentTeacher(); if(!t) return;
  t.email = qs('#myTEmail').value.trim();
  t.phone = qs('#myTPhone').value.trim();
  saveDB(DB);
  qs('#tAcctMsg').innerHTML = '<div class="msg ok">Contact details saved.</div>';
}
function changeTeacherPassword(){
  const t = currentTeacher();
  const cur = qs('#curTPw').value, nw = qs('#newTPw').value, conf = qs('#confTPw').value;
  if(!t){ qs('#tAcctMsg').innerHTML='<div class="msg err">Account not found.</div>'; return; }
  if(t.password !== cur){ qs('#tAcctMsg').innerHTML='<div class="msg err">Current password is incorrect.</div>'; return; }
  if(!nw || nw.length<4){ qs('#tAcctMsg').innerHTML='<div class="msg err">New password must be at least 4 characters.</div>'; return; }
  if(nw !== conf){ qs('#tAcctMsg').innerHTML='<div class="msg err">New password and confirmation do not match.</div>'; return; }
  t.password = nw; saveDB(DB);
  qs('#tAcctMsg').innerHTML='<div class="msg ok">Password updated.</div>';
  qs('#curTPw').value=''; qs('#newTPw').value=''; qs('#confTPw').value='';
}
function resetTeacherPassword(tid){
  const school = currentSchool();
  const t = school.teachers.find(x=>x.id===tid);
  const custom = prompt("Enter a new password for "+t.name+" (username: "+t.username+"). Leave blank to auto-generate one:");
  if(custom===null) return;
  const newPw = custom.trim() || Math.random().toString(36).slice(2,8);
  t.password = newPw; saveDB(DB);
  toast(t.name+"'s new password: "+newPw);
  alert(t.name+" (username: "+t.username+") — new password: "+newPw+"\n\nShare this with them directly.");
}

/* ============================= SCHOOL ADMIN PORTAL =============================
   Top-level school account: creates the DOS/HOI and Finance accounts and hands out the
   portal links. DOS creates teachers; Finance handles fees + SMS credit. */
let sadminTab = 'dashboard';
function gotoSadminTab(k){ sadminTab = k; document.body.classList.remove('dos-menu-open'); renderSadmin(); window.scrollTo(0,0); }
function rerenderRole(){ if(session && session.role==='sadmin') renderSadmin(); else if(session && session.role==='finance') renderFinance(); else renderDOS(); }
function portalUrl(code, key, extra){ return location.origin + location.pathname + `?school=${code}` + (key?`&p=${key}`:'') + (extra||''); }
function renderSadmin(){
  const school = currentSchool(); const me = school.sadmins.find(x=>x.id===session.userId);

/* ============================= TEACHER VIEW ============================= */
/* --- Teacher access scope ---------------------------------------------------------
   A teacher only ever gets: (1) the class + learning-area combinations the DOS/HOI has
   assigned to them, and (2) the extra screens the DOS/HOI has switched on for them
   (canPrint = learner reports, canPrintAssess = assessment sheets / previous exams,
   canPostAssignments = sending printable assignments to the Parent Portal).
   Enforced here at function level — not just by hiding buttons — so every screen, sheet
   and save re-checks it. All helpers are inert for DOS/HOI, Admin and Parent sessions. */
let _teacherSig = '';
function currentTeacher(){
  if(!session || session.role!=='teacher') return null;
  const sc = currentSchool();
  return sc ? (sc.teachers.find(x=>x.id===session.userId)||null) : null;
}
function canEdit(){ if(!session||session.role!=='finance') return true; const fi=currentFinance(); return !(fi&&fi.level==='view'); }
function noEdit(){ toast('View-only account — you can view and print, but not change records','err'); }
function currentFinance(){
  if(!session || session.role!=='finance') return null;
  const sc = currentSchool();
  return sc ? (sc.finance.find(x=>x.id===session.userId)||null) : null;
}
// Learning areas this teacher is assigned to in one class (must still be valid for that class).
function teacherAreaIds(school, t, classId){
  const valid = new Set(areasForClass(school, classId).map(a=>a.id));
  return [...new Set(t.assignments.filter(a=>a.classId===classId).map(a=>a.areaId))].filter(id=>valid.has(id));
}
// Classes the teacher is assigned to (only ones that still exist and still have an assigned area).
function teacherClassIds(school, t){
  return [...new Set(t.assignments.map(a=>a.classId))]
    .filter(cid=>school.classes.some(c=>c.id===cid) && teacherAreaIds(school,t,cid).length);
}
// Learning areas a viewer may see for a class: everyone else sees all, a teacher only their own.
function visibleAreas(school, classId){
  const all = areasForClass(school, classId);
  if(!session || session.role!=='teacher') return all;
  const t = currentTeacher(); if(!t) return [];
  const ids = new Set(teacherAreaIds(school, t, classId));
  return all.filter(a=>ids.has(a.id));
}
// perm: null | 'canPrint' | 'canPrintAssess' | 'canPostAssignments'. areaId optional (checks that exact assignment).
function teacherMay(perm, classId, areaId){
  const t = currentTeacher(); if(!t) return false;
  const school = currentSchool();
  if(classId && !teacherAreaIds(school,t,classId).length) return false;
  if(areaId && !teacherAreaIds(school,t,classId).includes(areaId)) return false;
  return perm ? t[perm]===true : true;
}
// True (after telling the teacher) when a teacher session is NOT allowed; false for everyone else.
function teacherDenied(perm, classId, areaId){
  if(!session || session.role!=='teacher') return false;
  if(teacherMay(perm, classId, areaId)) return false;
  toast("You don't have access to that — ask your DOS/HOI","err");
  return true;
}
// Fingerprint of everything that decides what a teacher may see, so a live change made by
// the DOS/HOI (new/removed assignment, permission on/off) re-draws the teacher's screen.
function teacherSig(school, t){
  return JSON.stringify([teacherClassIds(school,t).map(cid=>[cid, teacherAreaIds(school,t,cid).sort()]), !!t.canPrint, !!t.canPrintAssess, !!t.canPostAssignments, t.canAddQuestions!==false,
    (t.classTeacherOf||[]).slice().sort(), !!t.canApproveResults, !!t.canApproveEditRequests, !!t.canManageEntry]);
}

// Class Teacher Tools: shown to a teacher for any grade(s) listed in their classTeacherOf,
// independent of whether they're also assigned a learning area there. Deliberately mirrors
// (a scoped-down copy of) the DOS/HOI's own exam-management card in tplExamCard, rather than
// reusing it directly, so DOS-only controls (delete exam, closing-date field) never appear
// here and each button only renders when this specific teacher holds that specific permission.
function tplClassTeacherExams(school, t){
  const classes = (t.classTeacherOf||[]).filter(cid=>school.classes.some(c=>c.id===cid));
  if(!classes.length) return '';
  const classNames = classes.map(cid=>escapeHtml(school.classes.find(c=>c.id===cid).name)).join(', ');
  const exams = school.exams.filter(e=>classes.includes(e.classId)).slice().reverse();
  return `<div class="card no-print"><h2>📋 Class Teacher Tools</h2>
  <p class="small">Class teacher for: <b>${classNames}</b></p>
  ${exams.length ? exams.map(e=>tplClassTeacherExamCard(school,e,t)).join('') : '<p class="small">No exams recorded yet for your grade(s).</p>'}
  </div>`;
}
function tplClassTeacherExamCard(school, e, t){
  const cls = school.classes.find(c=>c.id===e.classId);
  const closed = isExamClosed(e);
  const pending = (e.editRequests||[]).filter(r=>r.status==='pending');
  const approvalBadge = e.resultsApproval==='approved' ? '<span class="badge EE">✅ Approved</span>'
    : e.resultsApproval==='disapproved' ? '<span class="badge BE">❌ Disapproved</span>'
    : '<span class="badge AE">⏳ Pending Review</span>';
  const hasSignoffTools = t.canApproveResults || t.canApproveEditRequests || t.canManageEntry;
  return `<div class="card" style="background:#f6f9fc;margin-bottom:10px">
  <h3 style="margin:0 0 6px;font-size:15px;color:var(--navy)">${escapeHtml(e.name)} <span class="small">— ${e.term} ${e.year} — ${cls?escapeHtml(cls.name):'-'}</span></h3>
  ${hasSignoffTools ? `<p class="small" style="margin:0 0 4px"><b>Entry:</b> ${closed?'<span class="badge BE">🔒 Closed</span>':'<span class="badge EE">🔓 Open</span>'} &nbsp; <b>Results:</b> ${approvalBadge}</p>
  ${e.resultsApproval==='approved' && e.approvedBy ? `<p class="small" style="margin:0 0 4px">Approved by ${escapeHtml(e.approvedBy)}${e.approvalAt?' on '+new Date(e.approvalAt).toLocaleDateString():''}</p>` : ''}
  ${e.resultsApproval==='disapproved' && e.approvalNote ? `<p class="small" style="margin:0 0 4px;color:#9c2c2c"><b>Reason:</b> ${escapeHtml(e.approvalNote)}</p>` : ''}
  ${t.canManageEntry ? `<div class="flexbtns">${closed?`<button class="ghost" onclick="reopenExam('${e.id}')">🔓 Reopen Entry</button>`:`<button class="ghost" onclick="closeExamNow('${e.id}')">🔒 Close Entry Now</button>`}</div>` : ''}
  ${t.canApproveResults ? `<div class="flexbtns" style="margin-top:6px">
    <button onclick="approveExamResults('${e.id}')">✅ Approve Results</button>
    <button class="danger" onclick="disapproveExamResults('${e.id}')">❌ Disapprove</button>
  </div>` : ''}
  ${t.canApproveEditRequests && pending.length ? `<div style="margin-top:8px">
    <p class="small" style="margin:0 0 4px"><b>⏳ Pending Edit Requests (${pending.length})</b></p>
    <table><tr><th>Teacher</th><th>Learner</th><th>Learning Area</th><th>Current</th><th>Requested</th><th>Actions</th></tr>
    ${pending.map(r=>{
      const stu = school.students.find(s=>s.id===r.sid);
      const area = school.learningAreas.find(a=>a.id===r.areaId);
      const current = ((school.marks[e.id]||{})[r.sid]||{})[r.areaId];
      return `<tr><td>${escapeHtml(r.teacherName)}</td><td>${stu?escapeHtml(stu.name):'-'}</td><td>${area?escapeHtml(area.name):'-'}</td>
      <td>${current??'-'}</td><td><b>${r.newVal}</b></td>
      <td><button onclick="approveEditRequest('${e.id}','${r.id}')">✅</button> <button class="danger" onclick="rejectEditRequest('${e.id}','${r.id}')">✕</button></td></tr>`;
    }).join('')}
    </table>
  </div>` : ''}` : ''}
  <details style="margin-top:8px">
    <summary class="small" style="cursor:pointer">📝 Personalize Report Remarks</summary>
    <p class="small" style="margin-top:6px">By default every report uses the auto remark tied to that learner's grading level. Type
    something here to override it for just this learner, just this exam — available to you as Class Teacher regardless of the
    permissions above.</p>
    ${remarksTableHTML(school, e.id)}
  </details>
  </div>`;
}
function renderTeacher(){
  const school = currentSchool();
  const t = currentTeacher();
  if(!t){ logout(); setTimeout(()=>toast('Your teacher account is no longer available','err'),50); return; }
  const myClasses = teacherClassIds(school, t);
  _teacherSig = teacherSig(school, t);
  const chips = myClasses.map(cid=>{
    const c = school.classes.find(x=>x.id===cid);

    <td class="pctCell-${s.id}">${score!=null?pctOf(score,max).toFixed(1)+'%':'-'}</td>

// Small "awaiting approval" note under a mark box while a change waits on the DOS/HOI.
function setReqTag(input, val){
  let tag = input.parentNode.querySelector('.reqTag');
  if(val==null){ if(tag) tag.remove(); return; }
  if(!tag){ tag = document.createElement('div'); tag.className = 'reqTag small'; input.parentNode.appendChild(tag); }
  tag.textContent = '⏳ '+val+' awaiting approval';
}
// Colours a level badge by its rank in the class's own grading table (best→worst), not by
// matching its code against the four CBC defaults — so a school that renames or adds levels
// in the Grading tab still gets a correctly coloured badge everywhere, not a plain grey one.
function levelBadge(school,pct,classId){
  const g = gradeFor(school,pct,classId);
  return raBadge(school,classId,g.level);
}
function saveMark(examId,areaId,input){
  const school = currentSchool();
  const exam = school.exams.find(e=>e.id===examId);
  const sid = input.dataset.sid; const max = exam.maxMarksByArea[areaId] ?? 100;
  // A teacher can only save marks for a class + learning area assigned to them.
  if(session.role==='teacher' && teacherDenied(null, exam.classId, areaId)){
    input.value = ((school.marks[examId]||{})[sid]||{})[areaId] ?? '';
    return;
  }
  // An emptied box means "no mark yet" — not a score of 0 (Enter-driven entry makes backspacing a box common).
  if(String(input.value).trim()==='' && !(session.role==='teacher' && isExamClosed(exam))){
    if(((school.marks[examId]||{})[sid]||{})[areaId]!=null){
      delete school.marks[examId][sid][areaId];
      if(exam.resultsApproval==='approved'){ exam.resultsApproval = 'pending'; exam.approvedBy = ''; exam.approvalAt = ''; touchExam(exam); }
      saveDB(DB); pushMarkToCloud(school.code, examId, sid, areaId, null);
      const pc=document.querySelector('.pctCell-'+sid), lc=document.querySelector('.lvlCell-'+sid); if(pc) pc.textContent='-'; if(lc) lc.textContent='-';
    }
    return;
  }
  let val = Number(input.value);
  if(val>max){ val=max; input.value=max; toast('Score capped at max marks','err'); }
  if(val<0){ val=0; input.value=0; }
  // A teacher (not DOS/HOI) editing an exam whose entry period is closed can't save
  // directly — the change queues as a pending edit request for the DOS/HOI to approve
  // or reject. The DOS/HOI can always edit directly, closed or not.
  if(session.role==='teacher' && isExamClosed(exam)){
    const priorVal = ((school.marks[examId][sid]||{})[areaId]);
    input.value = priorVal ?? '';
    const t = school.teachers.find(x=>x.id===session.userId);
    exam.editRequests = exam.editRequests || [];
    const samePending = exam.editRequests.find(r=>r.status==='pending' && r.teacherId===t.id && r.sid===sid && r.areaId===areaId);
    if(val===priorVal){
      // Changing a cell back to its recorded mark withdraws that teacher's own waiting request.
      if(samePending){ exam.editRequests = exam.editRequests.filter(r=>r!==samePending); touchExam(exam); saveDB(DB); setReqTag(input,null); renderTeacherApprovals(); toast('Your pending request was withdrawn'); }
      return;
    }
    if(samePending){ samePending.newVal = val; samePending.requestedAt = new Date().toISOString(); }
    else exam.editRequests.push({id:uid('req_'), teacherId:t.id, teacherName:t.name, sid, areaId, newVal:val, status:'pending', requestedAt:new Date().toISOString()});
    touchExam(exam);
    saveDB(DB);
    setReqTag(input, val);
    renderTeacherApprovals();
    toast('Entry is closed for this exam — your change was sent to the DOS/HOI for approval','err');
    return;
  }
  school.marks[examId][sid] = school.marks[examId][sid] || {};
  school.marks[examId][sid][areaId] = val;
  // Marks changed after a results approval — the approval no longer covers the current
  // data, so it must be reviewed again before it can be treated as final.
  if(exam.resultsApproval==='approved'){ exam.resultsApproval = 'pending'; exam.approvedBy = ''; exam.approvalAt = ''; touchExam(exam); }
  saveDB(DB);
  pushMarkToCloud(school.code, examId, sid, areaId, val);
  const pct = pctOf(val,max);
  document.querySelector('.pctCell-'+sid).textContent = pct.toFixed(1)+'%';
  document.querySelector('.lvlCell-'+sid).innerHTML = levelBadge(school,pct,exam.classId);
}
// Approval Status: only exams in this teacher's assigned classes that are closed (or were
// disapproved and reopened) or that hold one of THIS teacher's edit requests, and only this
// teacher's own requests for their own assigned learning areas. Needs no extra permission.
function renderTeacherApprovals(){
  const host = qs('#teacherApprovals'); if(!host) return;
  const school = currentSchool(); const t = currentTeacher(); if(!t) return;
  const myClasses = teacherClassIds(school, t);
  const myReqs = e => (e.editRequests||[]).filter(r=>r.teacherId===t.id && teacherAreaIds(school,t,e.classId).includes(r.areaId));
  const exams = school.exams.filter(e=>myClasses.includes(e.classId) && (isExamClosed(e) || e.resultsApproval==='disapproved' || myReqs(e).length));
  if(!exams.length){ host.innerHTML = '<p class="small">Nothing here yet — exams appear once their entry period is closed.</p>'; return; }
  const stBadge = st => st==='approved' ? '<span class="badge EE">✅ Approved</span>' : st==='rejected' ? '<span class="badge BE">❌ Rejected</span>' : '<span class="badge AE">⏳ Pending</span>';
  const resBadge = e => e.resultsApproval==='approved' ? `<span class="badge EE">✅ Approved</span>${e.approvedBy?`<div class="small">by ${escapeHtml(e.approvedBy)}${e.approvalAt?' · '+new Date(e.approvalAt).toLocaleDateString():''}</div>`:''}`
    : e.resultsApproval==='disapproved' ? `<span class="badge BE">❌ Disapproved — entry reopened, please correct</span>${e.approvalNote?`<div class="small"><b>Reason:</b> ${escapeHtml(e.approvalNote)}</div>`:''}`

// Prints only the sheet inside containerId, even if other generated sheets (e.g. the
// Class Assessment Sheet, Cumulative Sheet, or Blank Class List all live on the same
// page) are also currently showing on screen. Temporarily hides every OTHER
// .print-only-block for the print, then restores them right after — nothing on screen
// changes except for the brief moment the print dialog is open.
function printSection(containerId){
  const target = qs('#'+containerId);
  if(!target) return;
  const others = [...document.querySelectorAll('.print-only-block')].filter(b=>!target.contains(b));
  others.forEach(b=>b.classList.add('print-hide-temp'));
  const restore = ()=>{ others.forEach(b=>b.classList.remove('print-hide-temp')); window.removeEventListener('afterprint', restore); };
  window.addEventListener('afterprint', restore);
  window.print();
  restore(); // covers browsers where print() blocks until the dialog closes; harmless to call twice
}

// Streams of one grade are grouped by the text up to and including the first number in the class
// name ("Grade 6 Blue" and "Grade 6 Red" -> "Grade 6"). A class name with no number stands alone.
function raGradeLabel(name){ const m=(name||'').match(/^(.*?\d+)/); return (m?m[1]:(name||'')).replace(/\s+/g,' ').trim(); }
function raRank(rows,key,rk){ rows.sort((a,b)=>b[key]-a[key]); rows.forEach((r,i)=>{ r[rk]=(i>0 && rows[i-1][key].toFixed(2)===r[key].toFixed(2))?rows[i-1][rk]:i+1; }); }
// Badge coloured by the level's position in the class's own (possibly edited) grading table.
// lvl-0..lvl-3 mirror the EE/ME/AE/BE icon+border treatment above by rank (best→worst),
// since a custom grading table may use different level codes than the CBC defaults.
function raBadge(school,classId,level){
  const cols=['#1f8a4c','#2f7fd1','#e0a020','#d1473f'];
  const sorted=gradingFor(school,classId).slice().sort((a,b)=>b.points-a.points);
  const i=sorted.findIndex(g=>g.level===level);
  const row=i>=0?sorted[i]:null;
  const color=(row&&row.color)?row.color:(i>=0&&i<4?cols[i]:'#6b7c8f');
  const icon=(row&&row.icon)?escapeHtml(row.icon)+' ':'';
  return `<span class="badge lvl-badge ${i>=0&&i<4?'lvl-'+i:''}" style="background:${color}">${icon}${escapeHtml(level)}</span>`;
}

function raFillExams(){
  const school=currentSchool(), term=qs('#raTerm').value, year=Number(qs('#raYear').value);
  const names=[...new Set(school.exams.filter(e=>e.term===term && e.year===year).map(e=>e.name))];

}
function raSD(a){ if(!a||!a.length) return 0; const m=a.reduce((t,x)=>t+x,0)/a.length; return Math.sqrt(a.reduce((t,x)=>t+(x-m)*(x-m),0)/a.length); }
function raMedian(a){ if(!a.length) return 0; const b=a.slice().sort((x,y)=>x-y), h=Math.floor(b.length/2); return b.length%2?b[h]:(b[h-1]+b[h])/2; }
function raCompute(school,term,year,exName){
  const stats=[];
  school.classes.forEach(cls=>{
    const exams=school.exams.filter(e=>e.classId===cls.id && e.term===term && e.year===year && (!exName || e.name===exName));
    const areas=areasForClass(school,cls.id), learners=unionStudents(exams.flatMap(ex=>studentsForExam(school,ex)));
    if(!exams.length || !areas.length) return;
    const sub=areas.map(()=>({sum:0,n:0,v:[]})), lrn=[], lv={};
    learners.forEach(s=>{
      let any=false, tot=0;
      areas.forEach((a,i)=>{
        let sp=0, n=0;
        exams.forEach(ex=>{ const sc=(school.marks[ex.id]||{})[s.id]?.[a.id]; if(sc!=null){ sp+=pctOf(sc,ex.maxMarksByArea[a.id]??100); n++; } });
        if(n){ any=true; tot+=sp/n; sub[i].sum+=sp/n; sub[i].n++; sub[i].v.push(sp/n); }

// Shown first, before the DOS/HOI taps into any menu tab. Auto-computes the snapshot
// for the most recent term/year that actually has marks entered — no picking required —
// but still lets them switch term/year if they want an older snapshot.
function latestDataTermYear(school){
  const combos = {};
  school.exams.forEach(e=>{
    if(school.marks[e.id] && Object.keys(school.marks[e.id]).length) combos[e.year+'|'+e.term] = {year:e.year, term:e.term};
  });
  const list = Object.values(combos);
  if(!list.length) return null;
  const tn = t=>Number(t.slice(-1));
  list.sort((a,b)=> b.year-a.year || tn(b.term)-tn(a.term));
  return list[0];
}

/* ============================= TEACHER DASHBOARD (own grades/areas only) ============================= */
function teacherLatestTermYear(school, myClasses){
  const combos = {};
  school.exams.forEach(e=>{
    if(!myClasses.includes(e.classId)) return;
    if(school.marks[e.id] && Object.keys(school.marks[e.id]).length) combos[e.year+'|'+e.term] = {year:e.year, term:e.term};
  });
  const list = Object.values(combos);
  if(!list.length) return null;
  const tn = x=>Number(x.slice(-1));
  list.sort((a,b)=> b.year-a.year || tn(b.term)-tn(a.term));
  return list[0];
}
function initTeacherDashboardControls(){
  const school = currentSchool(), t = currentTeacher(), myClasses = teacherClassIds(school, t);
  const latest = teacherLatestTermYear(school, myClasses), now = new Date().getFullYear();
  const term = latest ? latest.term : 'Term 1', year = latest ? latest.year : now;
  const sel = qs('#tdashTerm'); if(!sel) return;
  sel.innerHTML = ['Term 1','Term 2','Term 3'].map(x=>`<option ${x===term?'selected':''}>${x}</option>`).join('');
  qs('#tdashYear').value = year;
}
function runTeacherDashboard(){
  const target = qs('#tdashArea'); if(!target) return;
  const school = currentSchool(), t = currentTeacher();
  const term = qs('#tdashTerm').value, year = Number(qs('#tdashYear').value);
  const myClasses = teacherClassIds(school, t);
  const rows = [];
  myClasses.forEach(cid=>{
    const cls = school.classes.find(c=>c.id===cid);
    teacherAreaIds(school, t, cid).forEach(aid=>{
      const area = school.learningAreas.find(a=>a.id===aid);
      const exams = school.exams.filter(e=>e.classId===cid && e.term===term && e.year===year);
      if(!exams.length || !area) return;
      const learners = unionStudents(exams.flatMap(ex=>studentsForExam(school, ex)));
      const scores = [];
      learners.forEach(s=>{
        let sp=0, n=0;
        exams.forEach(ex=>{ const sc=(school.marks[ex.id]||{})[s.id]?.[aid]; if(sc!=null){ sp+=pctOf(sc, ex.maxMarksByArea[aid]??100); n++; } });
        if(n) scores.push({s, pct: sp/n});
      });
      if(!scores.length) return;
      const mean = scores.reduce((x,y)=>x+y.pct,0)/scores.length;
      const sorted = scores.slice().sort((a,b)=>b.pct-a.pct), topPct = sorted[0].pct;
      rows.push({cls, area, mean, assessed:scores.length, enrolled:learners.length, winners: sorted.filter(x=>x.pct===topPct)});
    });
  });
  if(!rows.length){ target.innerHTML = `<p class="small">No marks recorded yet for ${term} ${year} in your assigned grade(s)/learning area(s).</p>`; return; }
  const overallMean = rows.reduce((s,r)=>s+r.mean*r.assessed,0)/rows.reduce((s,r)=>s+r.assessed,0);
  const byArea = {}; rows.forEach(r=>{ (byArea[r.area.name]=byArea[r.area.name]||[]).push(r); });
  target.innerHTML = `
  <div class="dash-stats">
    <div class="dash-card"><div class="dash-num">${overallMean.toFixed(1)}%</div><div class="dash-lbl">Your Overall Mean</div></div>
    <div class="dash-card"><div class="dash-num">${rows.length}</div><div class="dash-lbl">Grade × Subject combos</div></div>
    <div class="dash-card"><div class="dash-num">${rows.reduce((s,r)=>s+r.assessed,0)}</div><div class="dash-lbl">Learners Assessed</div></div>
  </div>
  <div class="ra-sec" style="margin-top:16px"><h3 style="color:var(--navy);margin:0 0 6px">Your Grades &amp; Subjects</h3>
  <table class="ra-table"><tr><th>Grade</th><th>Learning Area</th><th>Assessed</th><th>Mean %</th><th>Top Learner(s)</th></tr>
  ${rows.slice().sort((a,b)=>b.mean-a.mean).map(r=>`<tr><td style="text-align:left">${escapeHtml(r.cls.name)}</td><td style="text-align:left">${escapeHtml(r.area.name)}</td><td>${r.assessed} of ${r.enrolled}</td><td><b>${r.mean.toFixed(1)}%</b></td><td style="text-align:left">${r.winners.map(w=>escapeHtml(w.s.name)+' ('+w.pct.toFixed(1)+'%)').join(', ')}</td></tr>`).join('')}
  </table></div>
  ${Object.entries(byArea).filter(([,g])=>g.length>1).map(([name,g])=>{
    const sorted = g.slice().sort((a,b)=>b.mean-a.mean);
    return `<div class="ra-sec" style="margin-top:16px"><h3 style="color:var(--navy);margin:0 0 6px">${escapeHtml(name)} — Stream Comparison</h3>
    <table class="ra-table"><tr><th>Rank</th><th>Grade</th><th>Mean %</th></tr>
    ${sorted.map((r,i)=>`<tr class="${i===0?'ra-best':''}"><td>${i+1}</td><td style="text-align:left">${escapeHtml(r.cls.name)}</td><td><b>${r.mean.toFixed(1)}%</b></td></tr>`).join('')}
    </table></div>`;
  }).join('')}`;
}
/* ============================= FINANCE PORTAL ============================= */
/* A Finance session gets its own small portal: bulk-import fee balances/next-term fees via
   CSV (matched to learners by admission number, scoped to one Grade + Exam/Term at a time —
   the same pairing report cards are already generated against), a summary table to check
   the result, full read access to report forms (reusing tplReportsPicker, same as DOS/HOI —
   not scoped down the way a teacher's view is), and a My Account card. It never touches
   marks entry, grading, or anything else a DOS/HOI or Teacher can do. */
let finTab = 'dashboard';
function termNo(t){ const m=/(\d)/.exec(String(t.term||'')); return m?Number(m[1]):0; }
function feeTermCmp(a,b){ return (Number(a.year)-Number(b.year)) || (termNo(a)-termNo(b)); }
function finExams(school){ return (school.exams||[]).concat(school.feeTerms||[]); }
function periodLabel(e){ return e.feeTerm ? `${e.term} ${e.year} - term fees` : `${e.name} (${e.term} ${e.year})`; }
// Newest fee term first, then the grade's exams (older exam-based fee records stay reachable).
function finPeriodsForClass(school, cid){ return (school.feeTerms||[]).filter(t=>t.classId===cid).sort(feeTermCmp).reverse().concat((school.exams||[]).filter(e=>e.classId===cid)); }
function latestFeePeriod(school, cid){ const f=(school.feeTerms||[]).filter(t=>t.classId===cid).sort(feeTermCmp); if(f.length) return f[f.length-1]; const x=(school.exams||[]).filter(e=>e.classId===cid); return x[x.length-1]||null; }
// The period just before term/year for a grade (used to carry balances and the fee structure forward).
function prevFeePeriod(school, cid, term, year){
  const ref={term, year}; const c=finExams(school).filter(e=>e.classId===cid && feeTermCmp(e,ref)<0);
  c.sort((a,b)=>feeTermCmp(a,b) || ((a.feeTerm?1:0)-(b.feeTerm?1:0))); return c[c.length-1]||null;
}
function parentFeePeriods(school){ return (school.feeTerms||[]).slice().sort(feeTermCmp).reverse().concat((school.exams||[]).slice().reverse()); }
const finState = {classId:null, examId:null};
function gotoFinTab(k){ finTab = k; document.body.classList.remove('dos-menu-open'); renderFinance(); window.scrollTo(0,0); }
function financeCtxRow(school){
  const cid = (school.classes.find(c=>c.id===finState.classId)||school.classes[0]).id;
  const exams = finPeriodsForClass(school, cid);
  const eid = exams.some(e=>e.id===finState.examId) ? finState.examId : (exams[0]||{}).id;
  finState.classId = cid; finState.examId = eid;
  return `<div class="row"><div><label>Grade</label><select id="ffClass" onchange="fillFinanceExams()">${school.classes.map(c=>`<option value="${c.id}" ${c.id===cid?'selected':''}>${escapeHtml(c.name)}</option>`).join('')}</select></div>
  <div><label>Fee term / Exam</label><select id="ffExam" onchange="loadFinanceFeesSummary()">${exams.map(e=>`<option value="${e.id}" ${e.id===eid?'selected':''}>${escapeHtml(periodLabel(e))}</option>`).join('') || '<option value="">No fee term yet - create one under Fee Structure</option>'}</select></div></div>`;
}

/* ---- Finance learners: the DOS/HOI adds learners (they appear here automatically); deleting them there does NOT delete them here. ---- */
function financeLearnersHTML(school){
  const cid = (school.classes.find(c=>c.id===finState.classId)||school.classes[0]).id; finState.classId = cid;
  const hid = school.finHidden||{}; const ret = new Set((school.finRetained||[]).map(s=>s.id));
  const active = new Set(school.students.map(s=>s.id));
  const list = finRaw(school).filter(s=>s.classId===cid).sort(admOrName);
  const rows = list.map(s=>{
    const gone = !active.has(s.id), h = !!hid[s.id];
    const tag = h ? '<span class="small">Removed by Finance</span>' : gone ? '<span class="small" style="color:#b45309">Removed by DOS/HOI — kept for Finance</span>' : '<span class="small">Active</span>';
    const act = !canEdit() ? '' : h ? `<button class="ghost" onclick="finRestoreLearner('${s.id}')">Restore</button>` : `<button class="danger" onclick="finRemoveLearner('${s.id}')">✕ Remove from Finance</button>`;
    return `<tr${h?' style="opacity:.55"':''}><td>${s.adm?escapeHtml(s.adm):'—'}</td><td>${escapeHtml(s.name)}</td><td>${tag}</td><td>${act}</td></tr>`;
  }).join('') || '<tr><td colspan="4" class="small">No learners in this grade.</td></tr>';
  return `<div class="card"><h2>👥 Finance Learners</h2>
  <p class="small">Learners added by the DOS/HOI appear here automatically. If the DOS/HOI later deletes a learner, they <b>stay here</b> with their fees, balances and receipts until Finance removes them. Removing here never affects the DOS/HOI lists, and payment history is kept.</p>
  <div class="row"><div><label>Grade</label><select onchange="finState.classId=this.value;renderFinance()">${school.classes.map(c=>`<option value="${c.id}" ${c.id===cid?'selected':''}>${escapeHtml(c.name)}</option>`).join('')}</select></div></div>
  <div style="overflow-x:auto"><table><thead><tr><th>Adm No</th><th>Name</th><th>Status</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}
function finRemoveLearner(id){
  if(!canEdit()){ noEdit(); return; }
  const school = currentSchool(); const s = finRaw(school).find(x=>x.id===id); if(!s) return;
  if(!confirm(`Remove ${s.name} from the Finance Portal? Their payment history is kept, and the DOS/HOI lists are not affected.`)) return;
  school.finHidden[id] = true; saveDB(DB); renderFinance();
}
function finRestoreLearner(id){
  if(!canEdit()){ noEdit(); return; }
  const school = currentSchool(); delete school.finHidden[id]; saveDB(DB); renderFinance();
}

const MIG_MON = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];

function migNorm(s){ return String(s==null?'':s).toLowerCase().replace(/[^a-z0-9]/g,''); }

function migFindClass(school, name){ const k = migClassKey(name); if(!k) return null; return school.classes.find(c=>migClassKey(c.name)===k) || null; }
function migNum(v){ let t = String(v==null?'':v).trim(); if(!t) return NaN; let neg = /^\(.*\)$/.test(t) || /^-/.test(t) || /cr$/i.test(t); t = t.replace(/[^0-9.]/g,''); if(!t) return NaN; const n = Number(t); return isNaN(n) ? NaN : (neg ? -n : n); }

  if((m=/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/.exec(v))) return migIso(+m[1],+m[2],+m[3]);
  if((m=/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/.exec(v))){ let a=+m[1], b=+m[2], y=+m[3]; if(y<100) y+=2000; return mdy ? migIso(y,a,b) : migIso(y,b,a); }

}
function migTerm(v){ const m = /([123])/.exec(String(v||'')); return m ? 'Term '+m[1] : null; }
function migMethod(v){

function migParse(text){
  text = String(text||'').replace(/^\uFEFF/,'');

  const cnt = ch => first.split(ch).length-1;

  const rows = []; let row = [], f = '', q = false;

    const c = text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=c; }
    else if(c==='"' && f==='') q = true;

    else if(c==='\r'){ }

  }
  if(f.length || row.length){ row.push(f); rows.push(row); }

function migCsv(rows){ return rows.map(r=>r.map(c=>{ c = String(c==null?'':c); return /[",\n]/.test(c) ? '"'+c.replace(/"/g,'""')+'"' : c; }).join(',')).join('\r\n'); }
function migAutoMap(header, fields){
  const H = header.map(migNorm), used = new Set(), map = {};

}

/* ---------- planning (dry run: never changes data) ---------- */
function migPlan(){

  const gIdx = {}; S.fields.forEach(f=>{ gIdx[f.k] = mig.map[f.k]; });

  const all = finRaw(school), byAdm = {}; all.forEach(s=>{ if(s.adm) byAdm[migNorm(s.adm)] = s; });
  const err = (i,why)=>P.errors.push({i,why}), skip = (i,why)=>P.skipped.push({i,why});
  const termOf = (clsId, term, year)=> (school.feeTerms||[]).find(t=>t.classId===clsId && t.term===term && Number(t.year)===Number(year));
  const seen = new Set(); const newTerms = new Set(); const newGrades = new Set();
  const clsOfStudent = s => school.classes.find(c=>c.id===s.classId) || null;
  mig.rows.forEach((r,i)=>{
    if(mig.set==='learners'){
      const adm=g(r,'adm'), name=g(r,'name'), gr=g(r,'grade');
      if(!adm) return err(i,'Missing admission number');
      const key = migNorm(adm); if(seen.has(key)) return err(i,'Admission number appears twice in this file'); seen.add(key);
      const ex = byAdm[key]; let cls = null;
      if(ex && !o.update) cls = clsOfStudent(ex);
      if(!cls && !gr && ex) cls = clsOfStudent(ex);
      if(!cls && !gr) return err(i,'Missing grade');
      if(!cls && gr){ cls = migFindClass(school, gr); if(!cls){ if(o.mkGrades) newGrades.add(migClassKey(gr)); else return err(i,'Grade "'+gr+'" not found (tick "create missing grades" or fix the name)'); } }
      if(!ex && !mig.opts.mkLearners) return skip(i,'Not in the system and "create missing learners" is off');
      if(!ex && !name) return err(i,'Missing learner name');
      let bal = null, next = null; const bt = g(r,'balance'), nt = g(r,'next');
      if(bt!==''){ bal = migNum(bt); if(isNaN(bal)) return err(i,'Balance "'+bt+'" is not a number'); }
      if(nt!==''){ next = migNum(nt); if(isNaN(next)) return err(i,'Next term fee "'+nt+'" is not a number'); }
      if(bal!=null || next!=null){
        const c2 = cls || (ex && clsOfStudent(ex));
        const ft = c2 && termOf(c2.id, o.term, o.year), rec = ft && (school.fees[ft.id]||{})[ex && ex.id];
        if(rec && rec.balance!=null && rec.balance!=='' && !o.overwrite){ if(bal!=null) P.sum.kept = (P.sum.kept||0)+1; bal = null; next = null; }
      }
      if(ex && bal==null && next==null && !o.update) return skip(i,'Already in the system — nothing new to import');
      P.sum[ex?'existing':'newLearners'] = (P.sum[ex?'existing':'newLearners']||0)+1;
      if(bal!=null) P.sum.bal = (P.sum.bal||0)+1;
      P.ready.push({i, adm, name, gr, classId: cls?cls.id:null, ex: ex?ex.id:null, phone:g(r,'phone'), gender:g(r,'gender'), bal, next});
    }

      const gr=g(r,'grade'), item=g(r,'item'), at=g(r,'amount');

      const amt = migNum(at); if(isNaN(amt) || amt<=0) return err(i,'Amount "'+at+'" is not a positive number');
      let cls = migFindClass(school, gr);
      if(!cls){ if(o.mkGrades) newGrades.add(migClassKey(gr)); else return err(i,'Grade "'+gr+'" not found'); }

function migSnapRec(school, log, ftId, sid){
  const f = log.prev.fees; if(!f[ftId]) f[ftId] = {};
  if(!(sid in f[ftId])){ const r = (school.fees[ftId]||{})[sid]; f[ftId][sid] = r ? JSON.parse(JSON.stringify(r)) : null; }
}
function migEnsureTerm(school, log, cls, term, year){
  let ft = (school.feeTerms||[]).find(t=>t.classId===cls.id && t.term===term && Number(t.year)===Number(year));
  if(!ft){ const res = makeFeeTerm(school, cls, term, Number(year), '', '', false, false); ft = res.ft; log.created.feeTerms.push(ft.id); }
  return ft;
}

}
function migApply(P){

        if(!school.fees[ft.id]) school.fees[ft.id] = {};
        const rec = school.fees[ft.id][op.sid] || (school.fees[ft.id][op.sid] = {});
        rec.balance = (Number(rec.balance)||0) - op.amt; pay.balanceAfter = rec.balance; rec.updatedAt = Date.now(); rec.updatedBy = by;
      }
      school.payments.push(pay); log.created.payments.push(pay.id);
    });
  }
  else if(P.set==='expenses'){
    P.ready.forEach((op,k)=>{
      const e = {id:uid('exp_'), date:op.date, category:op.cat, amount:op.amt, desc:op.desc, by, ts:(Date.parse(op.date+'T12:00:00')||Date.now())+k, imported:true};
      school.expenses.push(e); log.created.expenses.push(e.id);
    });
  }
  if(!Array.isArray(school.migrations)) school.migrations = [];
  school.migrations.push(log); saveDB(DB);
  return log;
}
function migUndo(id){
  if(!canEdit()){ noEdit(); return; }
  const school = currentSchool(), L = school.migrations||[];
  const last = [...L].reverse().find(x=>!x.undone);
  if(!last || last.id!==id){ toast('Only the most recent import can be undone. Undo the newer one first.','err'); return; }
  if(!confirm('Undo "'+last.label+'" ('+last.count+' row(s), '+new Date(last.ts).toLocaleString()+')?\n\nEverything that import added or changed is reverted. Anything you entered by hand since may also be affected if it touched the same learners.')) return;
  const c = last.created;
  school.payments = school.payments.filter(p=>!c.payments.includes(p.id));
  school.expenses = school.expenses.filter(e=>!c.expenses.includes(e.id));
  Object.keys(last.prev.fees).forEach(ft=>{ Object.keys(last.prev.fees[ft]).forEach(sid=>{ const p = last.prev.fees[ft][sid]; if(!school.fees[ft]) school.fees[ft] = {}; if(p) school.fees[ft][sid] = p; else delete school.fees[ft][sid]; }); });
  Object.keys(last.prev.structure).forEach(ft=>{ const p = last.prev.structure[ft]; if(p) school.feeStructure[ft] = p; else delete school.feeStructure[ft]; });
  c.feeTerms.forEach(ft=>{ school.feeTerms = school.feeTerms.filter(t=>t.id!==ft); delete school.fees[ft]; delete school.feeStructure[ft]; delete school.feePublish[ft]; });
  Object.keys(last.prev.students).forEach(sid=>{ const i = school.students.findIndex(s=>s.id===sid); if(i>=0) school.students[i] = last.prev.students[sid]; });
  school.students = school.students.filter(s=>!c.students.includes(s.id));
  school.classes = school.classes.filter(k=>!c.classes.includes(k.id) || school.students.some(s=>s.classId===k.id) || school.exams.some(e=>e.classId===k.id));
  (last.unhid||[]).forEach(sid=>{ school.finHidden[sid] = true; });
  last.undone = true; saveDB(DB); toast('Import undone'); renderFinance();
}

// Tiny CSV reader — handles quoted fields (so a note with a comma in it doesn't split a
// row wrong) without pulling in a library for three plain columns.
function parseSimpleCSV(text){
  const rows = []; let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){ if(text[i+1]==='"'){ field+='"'; i++; } else inQuotes=false; }
      else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field=''; }
      else if(c === '\r'){ /* ignore, \n handles the row break */ }
      else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r=>r.some(c=>String(c).trim()!==''));
}
function applyFeesCsv(){
  if(!canEdit()){ noEdit(); return; }
  const school = currentSchool();
  const examId = qs('#ffExam') && qs('#ffExam').value;
  const exam = finExams(school).find(e=>e.id===examId);
  const msgEl = qs('#ffImportMsg');
  const fileInput = qs('#ffCsvFile');
  const file = fileInput && fileInput.files[0];
  if(!exam){ msgEl.innerHTML = '<div class="msg err">Pick a Grade and Exam/Term first.</div>'; return; }
  if(!file){ msgEl.innerHTML = '<div class="msg err">Choose a CSV file first.</div>'; return; }
  const reader = new FileReader();
  reader.onload = function(e){
    const rows = parseSimpleCSV(String(e.target.result||''));
    if(rows.length < 2){ msgEl.innerHTML = '<div class="msg err">That file has no data rows (just a header, or empty).</div>'; return; }
    const header = rows[0].map(h=>String(h).trim().toLowerCase());
    let admIdx = header.findIndex(h=>h.includes('adm'));
    let balIdx = header.findIndex(h=>h.includes('balance')||h.includes('arrear'));
    let nextIdx = header.findIndex(h=>h.includes('next'));
    if(admIdx<0 && header.length>=3){ admIdx=0; balIdx=1; nextIdx=2; } // no recognizable header — assume fixed column order
    if(admIdx<0){ msgEl.innerHTML = '<div class="msg err">Could not find an "Admission No" column in the header row.</div>'; return; }
    const learners = finLearners(school, exam);
    const byAdm = {}; learners.forEach(s=>{ if(s.adm) byAdm[String(s.adm).trim().toLowerCase()] = s; });
    let matched = 0; const unmatched = [];
    if(!school.fees[examId]) school.fees[examId] = {};
    const fi = currentFinance();
    for(let i=1;i<rows.length;i++){
      const r = rows[i];
      const adm = String(r[admIdx]||'').trim();
      if(!adm) continue;
      const s = byAdm[adm.toLowerCase()];
      if(!s){ unmatched.push(adm); continue; }
      const balance = balIdx>=0 ? Number(String(r[balIdx]||'').replace(/[^0-9.\-]/g,'')) : null;
      const nextTermFee = nextIdx>=0 ? Number(String(r[nextIdx]||'').replace(/[^0-9.\-]/g,'')) : null;
      const cur = school.fees[examId][s.id] || (school.fees[examId][s.id] = {});
      if(balIdx>=0) cur.balance = isNaN(balance) ? null : balance;
      if(nextIdx>=0){ cur.nextTermFee = isNaN(nextTermFee) ? null : nextTermFee; cur.nextManual = cur.nextTermFee!=null; }
      cur.updatedAt = Date.now(); cur.updatedBy = fi ? fi.name : 'DOS/HOI';
      matched++;
    }
    saveDB(DB);
    msgEl.innerHTML = `<div class="msg ok">Applied to ${matched} learner(s).${unmatched.length ? ` ${unmatched.length} admission number(s) didn't match anyone in this grade: ${unmatched.slice(0,10).map(escapeHtml).join(', ')}${unmatched.length>10?', …':''}` : ''}</div>`;
    fileInput.value = '';
    loadFinanceFeesSummary();
  };
  reader.onerror = function(){ msgEl.innerHTML = '<div class="msg err">Could not read that file.</div>'; };
  reader.readAsText(file);
}

function saveFeeStructure(quiet){
  if(!canEdit()){ noEdit(); return; }
  const {school, exam} = feeCtx(); const amt = Number(qs('#fsAmt').value);
  if(!exam){ toast('Pick a grade and exam first','err'); return false; }
  if(!(amt>0)){ toast('Enter the term fee','err'); return false; }
  school.feeStructure[exam.id] = Object.assign({items:[]}, school.feeStructure[exam.id], {amount:amt, nextAmount:Number((qs('#fsNext')||{}).value)||0, updatedAt:Date.now()}); autoNextFees(exam); saveDB(DB);
  if(!quiet) toast('Fee saved'); refreshStructure(); return true;
}
function nextFeeFor(st, r){
  const base = (st.nextAmount>0 ? st.nextAmount : st.amount)||0;
  const ex = ((r&&r.extras)||[]).reduce((t,n)=>{ const it=(st.items||[]).find(i=>i.optional && !i.once && i.name===n); return t+(it?it.amount:0); },0);
  return base + (st.items||[]).filter(i=>!i.optional && !i.once).reduce((t,i)=>t+i.amount,0) + ex;   // 'this term only' items don't roll into next term
}
// Fills each learner's Next Term Fee from the fee structure (tuition + compulsory items + the learner's own
// optional items). Fees the finance officer edited by hand (nextManual) are left alone unless force is true.
function autoNextFees(exam, force){
  const school = currentSchool(); const st = school.feeStructure[exam.id]; if(!st || !(st.amount>0)) return 0;
  if(!school.fees[exam.id]) school.fees[exam.id] = {}; let n = 0;
  finLearners(school, exam).forEach(l=>{
    const r = school.fees[exam.id][l.id] || (school.fees[exam.id][l.id] = {});
    if(r.nextManual && !force) return;
    const v = nextFeeFor(st, r); if(r.nextTermFee!==v){ r.nextTermFee = v; r.updatedAt = Date.now(); n++; }
    if(force) r.nextManual = false;
  });
  return n;
}
function autoFillNext(){
  if(!canEdit()){ noEdit(); return; }
  const {school, exam, recs, learners} = feeCtx(); const st = exam && school.feeStructure[exam.id];
  if(!st || !(st.amount>0)){ toast('Save the tuition fee for this grade first','err'); return; }
  const force = !!qs('#fsOverwrite').checked, manual = learners.filter(l=>(recs[l.id]||{}).nextManual).length;
  if(!confirm(`Set next-term fees for ${learners.length} learner(s)?${manual?(force?` This will OVERWRITE ${manual} manually edited fee(s).`:` ${manual} manually edited fee(s) will be kept.`):''}`)) return;
  const n = autoNextFees(exam, force); saveDB(DB); toast(`Next-term fee updated for ${n} learner(s)`); loadFinanceFeesSummary();
}
function resetNextFee(examId, sid){
  if(!canEdit()){ noEdit(); return; }
  const school = currentSchool(); const r = (school.fees[examId]||{})[sid]; const exam = finExams(school).find(e=>e.id===examId); if(!r||!exam) return;
  r.nextManual = false; autoNextFees(exam); saveDB(DB); toast('Reset to automatic'); loadFinanceFeesSummary();
}
function compTotal(st){ return ((st&&st.items)||[]).filter(i=>!i.optional).reduce((t,i)=>t+i.amount,0); }
function invoiceLines(st, r){
  const lines = [{name:'Tuition', amount:st.amount}];
  (st.items||[]).filter(i=>!i.optional).forEach(i=>lines.push({name:i.name, amount:i.amount}));
  (r.extras||[]).forEach(n=>{ const it=(st.items||[]).find(i=>i.optional && i.name===n); if(it) lines.push({name:it.name, amount:it.amount}); });
  (r.charges||[]).forEach(c=>lines.push({name:c.name, amount:c.amount, chargeId:c.id}));   // one-off extra charges
  return lines;
}
function generateInvoices(){
  if(!canEdit()){ noEdit(); return; }
  if(!saveFeeStructure(true)) return;
  const {school, exam, recs, learners} = feeCtx(); const st = school.feeStructure[exam.id];
  const todo = learners.filter(l=>(recs[l.id]||{}).billed==null);
  if(!todo.length){ qs('#fsMsg').innerHTML='<div class="msg">Every learner in this grade is already invoiced for this term.</div>'; return; }
  const total = todo.reduce((t,l)=>t+invoiceLines(st, recs[l.id]||{}).reduce((a,x)=>a+x.amount,0),0);
  if(!confirm(`Invoice ${todo.length} learner(s) for ${exam.name}, total KES ${total.toLocaleString()}? Existing balances are kept and the fees are added on top.`)) return;
  const fi = currentFinance(); if(!school.fees[exam.id]) school.fees[exam.id] = {};
  todo.forEach(l=>{ const r = school.fees[exam.id][l.id] || (school.fees[exam.id][l.id] = {}); r.openingBalance = Number(r.balance)||0; r.lines = invoiceLines(st, r); r.billed = r.lines.reduce((a,x)=>a+x.amount,0); r.balance = r.openingBalance + r.billed; r.updatedAt = Date.now(); r.updatedBy = fi?fi.name:'School Admin'; });
  saveDB(DB); toast(`${todo.length} invoice(s) generated`); loadFinanceFeesSummary();
  qs('#fsMsg').innerHTML=`<div class="msg ok">Invoiced ${todo.length} learner(s), total KES ${total.toLocaleString()}. Use <b>Print All Invoices</b> to hand them out.</div>`;
}
function addFeeItem(){
  if(!canEdit()){ noEdit(); return; }
  const {school, exam} = feeCtx(); const name = qs('#fiName').value.trim(), amt = Number(qs('#fiAmt').value);
  if(!exam){ toast('Pick a grade and exam first','err'); return; }
  if(!name||!(amt>0)){ toast('Enter an item name and amount','err'); return; }
  const st = school.feeStructure[exam.id] || (school.feeStructure[exam.id] = {amount:0, items:[]}); st.items = st.items||[];
  if(st.items.some(i=>i.name.toLowerCase()===name.toLowerCase())){ toast('That item already exists','err'); return; }
  st.items.push({name, amount:amt, optional: qs('#fiType').value==='1', once: !!(qs('#fiOnce')||{}).checked});
  if(!Array.isArray(school.feeCatalog)) school.feeCatalog = []; if(!school.feeCatalog.some(x=>x.toLowerCase()===name.toLowerCase())) school.feeCatalog.push(name);
  if(st.amount>0) autoNextFees(exam); saveDB(DB);
  qs('#fiName').value=''; qs('#fiAmt').value=''; if(qs('#fiOnce')) qs('#fiOnce').checked=false; toast('Item added'); refreshStructure();
}
function removeFeeItem(i){
  if(!canEdit()){ noEdit(); return; }
  const {school, exam} = feeCtx(); const st = school.feeStructure[exam.id]; if(!st||!st.items[i]) return;
  if(!confirm('Remove this item? Invoices already generated are NOT changed.')) return;
  const n = st.items[i].name; st.items.splice(i,1);
  Object.values(school.fees[exam.id]||{}).forEach(r=>{ if(r.extras) r.extras = r.extras.filter(x=>x!==n); });
  if(st.amount>0) autoNextFees(exam); saveDB(DB); loadFinanceFeesSummary();
}

function feeItemSuggestions(school){
  const base = ['Boarding','Meals / Lunch','Transport','Uniform','Activity','Exam fee','Library','Games / Sports','Development','School trip','Medical','Remedial tuition'];
  const seen = new Set(), out = [];

}

// Adds/removes one optional item for one learner; returns 0 (no change), 1 (changed) or 2 (changed an already-generated invoice).
function applyExtra(school, exam, it, sid, add){
  if(!school.fees[exam.id]) school.fees[exam.id] = {};
  const r = school.fees[exam.id][sid] || (school.fees[exam.id][sid] = {}); r.extras = r.extras||[];
  const has = r.extras.includes(it.name); if(add===has) return 0;
  const billed = r.billed!=null; r.lines = r.lines||[];
  if(add){ r.extras.push(it.name); if(billed){ r.lines.push({name:it.name, amount:it.amount}); r.billed += it.amount; r.balance = (Number(r.balance)||0) + it.amount; } }
  else { r.extras = r.extras.filter(x=>x!==it.name); if(billed){ const k = r.lines.findIndex(x=>x.name===it.name); if(k>-1) r.lines.splice(k,1); r.billed -= it.amount; r.balance = (Number(r.balance)||0) - it.amount; } }
  r.updatedAt = Date.now(); return billed ? 2 : 1;
}
function assignExtraMany(add){
  if(!canEdit()){ noEdit(); return; }
  const {school, exam} = feeCtx(); const name = (qs('#optItem')||{}).value;
  const st = exam && school.feeStructure[exam.id]; const it = st && (st.items||[]).find(i=>i.optional && i.name===name);
  if(!it){ toast('Add an optional item first, then choose it here','err'); return; }
  const ids = [...document.querySelectorAll('.optChk:checked')].map(x=>x.value);
  if(!ids.length){ toast('Tick the learners first','err'); return; }
  if(ids.length>1 && !confirm(`${add?'Assign':'Remove'} "${name}" (KES ${it.amount.toLocaleString()} per learner) ${add?'to':'from'} ${ids.length} learner(s)?`)) return;
  let changed = 0, live = 0; ids.forEach(id=>{ const res = applyExtra(school, exam, it, id, add); if(res) changed++; if(res===2) live++; });
  if(!changed){ toast(add?'Those learners already have it':'None of them had it','err'); return; }
  if(st.amount>0) autoNextFees(exam); saveDB(DB);
  toast(`${name}: ${changed} learner(s) ${add?'assigned':'removed'}${live?` -- ${live} invoiced balance(s) ${add?'increased':'reduced'}`:''}`); loadFinanceFeesSummary();
}
function assignExtra(add){
  if(!canEdit()){ noEdit(); return; }
  const {school, exam} = feeCtx(); const sid = qs('#optLearner').value, name = qs('#optItem').value;
  const st = exam && school.feeStructure[exam.id]; const it = st && (st.items||[]).find(i=>i.optional && i.name===name);
  if(!sid||!it){ toast('Pick a learner and an optional item','err'); return; }
  if(!school.fees[exam.id]) school.fees[exam.id] = {};
  const r = school.fees[exam.id][sid] || (school.fees[exam.id][sid] = {}); r.extras = r.extras||[];
  const has = r.extras.includes(name);
  if(add && has){ toast('Already assigned','err'); return; }
  if(!add && !has){ toast('Not assigned to this learner','err'); return; }
  const billed = r.billed!=null; r.lines = r.lines||[];
  if(add){ r.extras.push(name); if(billed){ r.lines.push({name, amount:it.amount}); r.billed += it.amount; r.balance = (Number(r.balance)||0) + it.amount; } }
  else { r.extras = r.extras.filter(x=>x!==name); if(billed){ const k = r.lines.findIndex(x=>x.name===name); if(k>-1) r.lines.splice(k,1); r.billed -= it.amount; r.balance = (Number(r.balance)||0) - it.amount; } }
  r.updatedAt = Date.now(); if(st.amount>0) autoNextFees(exam); saveDB(DB);
  toast(billed ? (add?'Assigned and charged to balance':'Removed and credited back') : (add?'Assigned — charged when invoiced':'Removed')); loadFinanceFeesSummary();
}

function reverseInvoices(){
  if(!canEdit()){ noEdit(); return; }
  const {school, exam, recs, learners} = feeCtx(); if(!exam){ toast('Pick a grade and exam first','err'); return; }
  const list = learners.filter(l=>(recs[l.id]||{}).billed!=null);
  if(!list.length){ toast('No invoices to reverse for this grade','err'); return; }
  if(!confirm(`Reverse invoices for ${list.length} learner(s)? Each learner's balance goes down by what was billed (payments and discounts stay). You can then fix the fee and generate again.`)) return;
  list.forEach(l=>{ const r = recs[l.id]; r.balance = (Number(r.balance)||0) - r.billed; delete r.billed; delete r.lines; delete r.openingBalance; r.updatedAt = Date.now(); });
  saveDB(DB); toast('Invoices reversed'); loadFinanceFeesSummary();

// Creates one grade's fee term (skipped, returns null, if it already exists), optionally copying the previous
// term's fee structure and carrying each learner's balance / optional services over.
function makeFeeTerm(school, c, term, year, close, open, carry, copy){
  if((school.feeTerms||[]).some(t=>t.classId===c.id && t.term===term && Number(t.year)===Number(year))) return null;
  const fi = currentFinance(); let carried = 0;
  const prev = prevFeePeriod(school, c.id, term, year);
  const ft = {id:uid('ft_'), feeTerm:true, classId:c.id, name:'Term fees', term, year:Number(year), termCloseDate:close||'', nextTermDate:open||'', createdAt:Date.now()};
  school.feeTerms.push(ft);
  if(prev){
    const ps = school.feeStructure[prev.id];
    if(copy && ps && ps.amount>0) school.feeStructure[ft.id] = {amount:ps.amount, nextAmount:ps.nextAmount||0, items:JSON.parse(JSON.stringify((ps.items||[]).filter(i=>!i.once))), updatedAt:Date.now()};
    if(carry){
      const pr = school.fees[prev.id]||{}, out = {}; const hasItems = school.feeStructure[ft.id];
      finLearners(school, ft).forEach(l=>{ const r = pr[l.id]; const hasBal = r && r.balance!=null && r.balance!==''; if(r && (hasBal || (r.extras||[]).length)){ out[l.id] = {updatedAt:Date.now(), updatedBy:fi?fi.name:'DOS/HOI'}; if(hasBal) out[l.id].balance = Number(r.balance)||0; if(hasItems){ const ex = (r.extras||[]).filter(n=>(school.feeStructure[ft.id].items||[]).some(i=>i.name===n)); if(ex.length) out[l.id].extras = ex; } carried++; } });
      if(Object.keys(out).length) school.fees[ft.id] = out;
    }
    if(school.feeStructure[ft.id]) autoNextFees(ft);
  }
  return {ft, carried};
}

function applyFeeToAllGrades(){

  const others = school.classes.filter(c=>c.id!==exam.classId);

  const create = plan.filter(x=>!x.ex).length, replace = plan.filter(x=>x.ex && (school.feeStructure[x.ex.id]||{}).amount>0).length;

    + (replace?`\n${replace} grade(s) already have a fee set -- it will be REPLACED.`:'')

function nextTermInfo(exam){

// Itemised next-term charges. Uses the fee structure when there is one; if the finance officer hand-edited a
// learner's next-term fee, an adjustment line keeps the items adding up to exactly what Fee Balances shows.
function nextInvoiceLines(st, r){
  const total = Number(r.nextTermFee)||0; const lines = [];
  if(st && st.amount>0){
    lines.push({name:'Tuition', amount:(st.nextAmount>0?st.nextAmount:st.amount)});
    (st.items||[]).filter(i=>!i.optional && !i.once).forEach(i=>lines.push({name:i.name, amount:i.amount}));
    (r.extras||[]).forEach(n=>{ const it=(st.items||[]).find(i=>i.optional && !i.once && i.name===n); if(it) lines.push({name:it.name+' (optional service)', amount:it.amount}); });
    const sum = lines.reduce((a,x)=>a+x.amount,0);
    if(sum!==total) lines.push({name:'Adjustment set by the finance office', amount:total-sum});
  } else if(total) lines.push({name:'Next term fees', amount:total});
  return lines;
}

function printNextTermInvoices(onlySid){
