    <td>${r.total}</td><td>${r.totalPts}</td><td>${r.meanPct.toFixed(1)}%</td><td>${raBadge(school,exam.classId,g.level)}</td></tr>`;
  }).join('')}
  <tr class="rc-total"><td colspan="3" style="text-align:left">CLASS AVERAGE</td>
  ${subjAvg.map(v=>`<td>${v!=null?v.toFixed(1)+'%':'-'}</td>`).join('')}
  <td>-</td><td>-</td><td>${classMeanPct.toFixed(1)}%</td><td>${raBadge(school,exam.classId,classMeanG.level)}</td></tr>
  </table>
  ${gradingKey}
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:30px">
    <div class="sig-line">Class Teacher: ${escapeHtml(classTeacher)}</div>
    <div class="sig-line">${school.hoiSignature?`<img class="rc-sig-img" src="${school.hoiSignature}" alt="HOI signature">`:''}DOS/HOI: ${escapeHtml(school.hoiName)}</div>
  </div>
  <div class="flexbtns no-print"><button class="gold" onclick="printSection('${printId}')">🖨 Print</button></div>
  </div>`;
}
function viewCumulative(){
  const school = currentSchool();
  const classId = qs('#cumClass').value, term = qs('#cumTerm').value, year = Number(qs('#cumYear').value);
  if(teacherDenied('canPrintAssess', classId)) return;
  const scoped = !!(session && session.role==='teacher');
  const exams = school.exams.filter(e=>e.classId===classId && e.term===term && e.year===year);
  const learners = unionStudents(exams.flatMap(ex=>studentsForExam(school, ex)));
  const areas = visibleAreas(school, classId);
  const cls = school.classes.find(c=>c.id===classId);
  if(exams.length===0){ qs('#cumArea').innerHTML = '<p class="small">No exams recorded for this term/year yet.</p>'; return; }
  const rows = learners.map(s=>{
    let grandTotalPct=0, grandTotalPts=0;
    const cells = areas.map(a=>{
      let sumPct=0, n=0;
      exams.forEach(ex=>{
        const max = ex.maxMarksByArea[a.id] ?? 100;
        const score = (school.marks[ex.id]||{})[s.id]?.[a.id];
        if(score!=null){ sumPct += pctOf(score,max); n++; }
      });
      const avgPct = n? sumPct/n : null;
      if(avgPct!=null){ grandTotalPct += avgPct; grandTotalPts += gradeFor(school,avgPct,classId).points; }
      return avgPct;
    });
    // Mean is taken over ALL learning areas for this grade (missing ones count as 0), so overall
    // performance reflects the learner's general standing rather than only the area(s) marked so far.
    const meanPct = areas.length? grandTotalPct/areas.length : 0;
    return {s, cells, meanPct, grandTotalPts};
  });
  rows.sort((a,b)=>b.meanPct-a.meanPct);
  rows.forEach((r,i)=>{ r.position=i+1; if(i>0 && rows[i-1].meanPct===r.meanPct) r.position=rows[i-1].position; });
  const classTeacher = school.classTeachers[classId] || 'Not Set';
  const subjAvg = areas.map((a,i)=>{
    const vals = rows.map(r=>r.cells[i]).filter(v=>v!=null);
    return vals.length? vals.reduce((s,v)=>s+v,0)/vals.length : null;
  });
  const classMeanPct = rows.length? rows.reduce((s,r)=>s+r.meanPct,0)/rows.length : 0;
  const classMeanG = gradeFor(school,classMeanPct,classId);
  const keyTable = gradingFor(school, classId);
  const gradingKey = keyTable.length ? `<div class="rc-key">${keyTable.map(k=>`<span><b>${escapeHtml(k.level)}</b> = ${escapeHtml(k.label)}</span>`).join('')}</div>` : '';
  qs('#cumArea').innerHTML = `
  <div class="print-only-block">
  <div class="report-header">${schoolHeaderTop(school)}${schoolContactLine(school)}<p>Cumulative Assessment — ${term} ${year} — ${escapeHtml(cls.name)}</p><p class="small">Based on ${exams.length} exam(s): ${exams.map(e=>escapeHtml(e.name)).join(', ')}</p><p class="small">Class Teacher: ${escapeHtml(classTeacher)}</p>${scoped?'<p class="small">Assigned learning area(s) only — mean, points and position are based on these.</p>':''}${school.requireApproval && exams.some(e=>e.resultsApproval!=='approved')?'<p class="small">⚠ Provisional — includes exam(s) not yet approved.</p>':''}</div>
  <table><tr><th>Pos</th><th>Adm No.</th><th>Name</th>${areas.map(a=>`<th>${escapeHtml(a.name)} (avg %)</th>`).join('')}<th>Mean %</th><th>Total Pts</th><th>Level</th></tr>
  ${rows.map(r=>{const g=gradeFor(school,r.meanPct,classId);return `<tr><td>${r.position}</td><td>${r.s.adm?escapeHtml(r.s.adm):'—'}</td><td>${escapeHtml(r.s.name)}</td>
    ${r.cells.map(c=>`<td>${c!=null?c.toFixed(1):'-'}</td>`).join('')}
    <td>${r.meanPct.toFixed(1)}%</td><td>${r.grandTotalPts}</td><td>${raBadge(school,classId,g.level)}</td></tr>`;}).join('')}
  <tr class="rc-total"><td colspan="3" style="text-align:left">CLASS AVERAGE</td>
  ${subjAvg.map(v=>`<td>${v!=null?v.toFixed(1):'-'}</td>`).join('')}
  <td>${classMeanPct.toFixed(1)}%</td><td>-</td><td>${raBadge(school,classId,classMeanG.level)}</td></tr>
  </table>
  ${gradingKey}
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:30px">
    <div class="sig-line">Class Teacher: ${escapeHtml(classTeacher)}</div>
    <div class="sig-line">${school.hoiSignature?`<img class="rc-sig-img" src="${school.hoiSignature}" alt="HOI signature">`:''}DOS/HOI: ${escapeHtml(school.hoiName)}</div>
  </div>
  <div class="flexbtns no-print"><button class="gold" onclick="printSection('cumArea')">🖨 Print</button></div>
  </div>`;

/* ============================= RESULTS ANALYSIS (DOS/HOI) ============================= */
// Streams of one grade are grouped by the text up to and including the first number in the class
// name ("Grade 6 Blue" and "Grade 6 Red" -> "Grade 6"). A class name with no number stands alone.
function raGradeLabel(name){ const m=(name||'').match(/^(.*?\d+)/); return (m?m[1]:(name||'')).replace(/\s+/g,' ').trim(); }
function raRank(rows,key,rk){ rows.sort((a,b)=>b[key]-a[key]); rows.forEach((r,i)=>{ r[rk]=(i>0 && rows[i-1][key].toFixed(2)===r[key].toFixed(2))?rows[i-1][rk]:i+1; }); }
// Badge coloured by the level's position in the class's own (possibly edited) grading table.
// lvl-0..lvl-3 mirror the EE/ME/AE/BE icon+border treatment above by rank (best→worst),
// since a custom grading table may use different level codes than the CBC defaults.
function raBadge(school,classId,level){
  const cols=['#1f8a4c','#2f7fd1','#e0a020','#d1473f'];
  const sorted=gradingFor(school,classId).slice().sort((a,b)=>b.points-a.points);
  const i=sorted.findIndex(g=>g.level===level);
  const row=i>=0?sorted[i]:null;
  const color=(row&&row.color)?row.color:(i>=0&&i<4?cols[i]:'#6b7c8f');
  const icon=(row&&row.icon)?escapeHtml(row.icon)+' ':'';
  return `<span class="badge lvl-badge ${i>=0&&i<4?'lvl-'+i:''}" style="background:${color}">${icon}${escapeHtml(level)}</span>`;
}
function tplResultsAnalysis(school){
  return `<div class="card"><h2 class="no-print">📈 Results Analysis</h2>
  <p class="small no-print">Ranks every grade by its mean score, names the best grade, and compares streams of the same grade (e.g. Grade 6 Blue vs Grade 6 Red — grades are grouped by the grade number in their name).</p>
  <div class="row no-print">
    <div><label>Term</label><select id="raTerm" onchange="raFillExams()"><option>Term 1</option><option>Term 2</option><option>Term 3</option></select></div>
    <div><label>Year</label><input id="raYear" type="number" value="${new Date().getFullYear()}" onchange="raFillExams()"></div>
    <div><label>Assessment</label><select id="raExam"></select></div>
    <div style="align-self:flex-end"><button onclick="runResultsAnalysis()">Generate Analysis</button></div>
  </div>
  <div id="raArea"></div></div>`;
}
function raFillExams(){
  const school=currentSchool(), term=qs('#raTerm').value, year=Number(qs('#raYear').value);
  const names=[...new Set(school.exams.filter(e=>e.term===term && e.year===year).map(e=>e.name))];
  qs('#raExam').innerHTML='<option value="">All exams in the term (average)</option>'+names.map(n=>`<option value="${escapeHtml(n)}">${escapeHtml(n)}</option>`).join('');
}
function raCompute(school,term,year,exName){
  const stats=[];
  school.classes.forEach(cls=>{
    const exams=school.exams.filter(e=>e.classId===cls.id && e.term===term && e.year===year && (!exName || e.name===exName));
    const areas=areasForClass(school,cls.id), learners=unionStudents(exams.flatMap(ex=>studentsForExam(school,ex)));
    if(!exams.length || !areas.length) return;
    const sub=areas.map(()=>({sum:0,n:0})), lrn=[], lv={};
    learners.forEach(s=>{
      let any=false, tot=0;
      areas.forEach((a,i)=>{
        let sp=0, n=0;
        exams.forEach(ex=>{ const sc=(school.marks[ex.id]||{})[s.id]?.[a.id]; if(sc!=null){ sp+=pctOf(sc,ex.maxMarksByArea[a.id]??100); n++; } });
        if(n){ any=true; tot+=sp/n; sub[i].sum+=sp/n; sub[i].n++; }
      });
      if(!any) return; // learners with no marks are not counted; missing areas count as 0, like the Cumulative Sheet
      const m=tot/areas.length, l=gradeFor(school,m,cls.id).level;
      lrn.push({s,mean:m,lv:l}); lv[l]=(lv[l]||0)+1;
    });
    if(!lrn.length) return;
    const sumMeans=lrn.reduce((x,l)=>x+l.mean,0), mean=sumMeans/lrn.length;
    const tbl=gradingFor(school,cls.id).slice().sort((a,b)=>b.points-a.points), top=tbl.slice(0,2).map(g=>g.level);
    stats.push({cls, glabel:raGradeLabel(cls.name), enrolled:learners.length, assessed:lrn.length, sumMeans, mean, lrn, lv,
      tableLevels:tbl.map(g=>g.level), top, meet:top.reduce((n,l)=>n+(lv[l]||0),0),
      areas:areas.map((a,i)=>({name:a.name, avg:sub[i].n?sub[i].sum/sub[i].n:null})), level:gradeFor(school,mean,cls.id)});
  });
  return stats;
}
function runResultsAnalysis(){
  const school=currentSchool(), term=qs('#raTerm').value, year=Number(qs('#raYear').value), exName=qs('#raExam').value;
  const stats=raCompute(school,term,year,exName), target=qs('#raArea');
  if(!stats.length){ target.innerHTML='<p class="small">No marks recorded for this term/assessment yet.</p>'; return; }
  const ranked=stats.slice(); raRank(ranked,'mean','rank');
  const best=ranked.filter(r=>r.rank===1);
  const nAll=stats.reduce((s,r)=>s+r.assessed,0), schoolMean=stats.reduce((s,r)=>s+r.sumMeans,0)/nAll;
  // previous term (Term 1 -> Term 3 of last year) for the change column
  const pt=Number(term.slice(-1)), prev={};
  raCompute(school, pt>1?'Term '+(pt-1):'Term 3', pt>1?year:year-1, exName).forEach(r=>{ prev[r.cls.id]=r.mean; });
  const chg=r=>{ const p=prev[r.cls.id]; if(p==null) return '—'; const d=r.mean-p; return `<b style="color:${d>=0?'#1f8a4c':'#d1473f'}">${d>=0?'▲':'▼'} ${Math.abs(d).toFixed(1)}</b>`; };
  // subjects across the school
  const subj={};
  stats.forEach(r=>r.areas.forEach(a=>{ if(a.avg==null) return; const o=subj[a.name]=subj[a.name]||{sum:0,n:0,rows:[]}; o.sum+=a.avg*r.assessed; o.n+=r.assessed; o.rows.push({c:r.cls.name,v:a.avg}); }));
  const subjects=Object.entries(subj).map(([name,o])=>{ const rows=o.rows.slice().sort((a,b)=>b.v-a.v); return {name, mean:o.sum/o.n, best:rows[0], low:rows[rows.length-1], one:rows.length===1}; }).sort((a,b)=>b.mean-a.mean);
  // level distribution
  const levels=[]; stats.forEach(r=>gradingFor(school,r.cls.id).forEach(g=>{ if(!levels.includes(g.level)) levels.push(g.level); }));
  const meets=r=>r.meet, sameTop=stats.every(r=>r.top.join()===stats[0].top.join()), topLbl=sameTop?stats[0].top.map(escapeHtml).join(' + '):'Top 2 levels', cell=(n,t)=>`${n} (${(n/t*100).toFixed(0)}%)`;
  const totLv={}; stats.forEach(r=>levels.forEach(l=>{ totLv[l]=(totLv[l]||0)+(r.lv[l]||0); }));
  // learners
  const all=stats.flatMap(r=>r.lrn.map(l=>({s:l.s,mean:l.mean,lv:l.lv,c:r.cls.name,cid:r.cls.id})));
  raRank(all,'mean','rank');
  const H=t=>`<h3 style="color:var(--navy);margin:0 0 6px">${t}</h3>`;
  const streamHtml=Object.values(stats.reduce((g,r)=>{ const k=r.glabel.toLowerCase(); (g[k]=g[k]||[]).push(r); return g; },{})).filter(g=>g.length>1).map(g=>{
    const rows=g.slice(); raRank(rows,'mean','grank');
    const subs=[...new Set(rows.flatMap(r=>r.areas.map(a=>a.name)))];
    const get=(r,n)=>{ const a=r.areas.find(x=>x.name===n); return a?a.avg:null; };
    const topSub=subs.map(n=>Math.max(...rows.map(r=>{ const v=get(r,n); return v==null?-1:v; })));
    const gMean=rows.reduce((s,r)=>s+r.sumMeans,0)/rows.reduce((s,r)=>s+r.assessed,0);
    const gap=rows[0].mean-rows[rows.length-1].mean;
    return `<div class="ra-sec">${H(escapeHtml(g[0].glabel)+' — Stream Comparison')}
    <table class="ra-table"><tr><th>Rank</th><th>Stream</th><th>Learners</th><th>Mean %</th><th>Level</th>${subs.map(n=>`<th>${escapeHtml(n)} (%)</th>`).join('')}</tr>
    ${rows.map(r=>`<tr class="${r.grank===1?'ra-best':''}"><td>${r.grank}</td><td style="text-align:left">${escapeHtml(r.cls.name)}</td><td>${r.assessed}</td><td><b>${r.mean.toFixed(1)}%</b></td><td>${raBadge(school,r.cls.id,r.level.level)}</td>${subs.map((n,i)=>{ const v=get(r,n); return `<td class="${v!=null&&v===topSub[i]?'ra-top':''}">${v!=null?v.toFixed(1):'-'}</td>`; }).join('')}</tr>`).join('')}
    <tr class="rc-total"><td colspan="3">Grade mean (all streams)</td><td>${gMean.toFixed(1)}%</td><td colspan="${1+subs.length}"></td></tr></table>
    <p class="small">Best stream: <b>${rows.filter(r=>r.grank===1).map(r=>escapeHtml(r.cls.name)).join(', ')}</b> &nbsp;|&nbsp; Gap between top and lowest stream: ${gap.toFixed(1)} points &nbsp;|&nbsp; Green cells = best stream in that learning area.</p></div>`;
  }).join('');
  target.innerHTML=`
  <div class="print-only-block">
  <div class="report-header">${schoolHeaderTop(school)}${schoolContactLine(school)}<p>Results Analysis — ${term} ${year}</p><p class="small">${exName?escapeHtml(exName):'Average of all exams in the term'}</p></div>
  <div class="rc-remark">🏆 <b>Best grade:</b> ${best.map(r=>escapeHtml(r.cls.name)).join(', ')} — ${best[0].mean.toFixed(1)}% (${best[0].level.level}) &nbsp;|&nbsp; <b>School mean:</b> ${schoolMean.toFixed(1)}% &nbsp;|&nbsp; <b>Meeting expectation or above (${topLbl}):</b> ${(stats.reduce((s,r)=>s+meets(r),0)/nAll*100).toFixed(0)}%<br>
  📚 <b>Strongest learning area:</b> ${escapeHtml(subjects[0].name)} (${subjects[0].mean.toFixed(1)}%) &nbsp;|&nbsp; <b>Weakest learning area:</b> ${escapeHtml(subjects[subjects.length-1].name)} (${subjects[subjects.length-1].mean.toFixed(1)}%)</div>
  <div class="ra-sec" style="margin-top:14px">${H('Grade Ranking')}
  <table class="ra-table"><tr><th>Rank</th><th>Grade</th><th>Grade Teacher</th><th>Learners Assessed</th><th>Mean %</th><th>Level</th><th>Change vs previous term</th></tr>
  ${ranked.map(r=>`<tr class="${r.rank===1?'ra-best':''}"><td>${r.rank}</td><td style="text-align:left">${escapeHtml(r.cls.name)}</td><td>${escapeHtml((school.classTeachers||{})[r.cls.id]||'—')}</td><td>${r.assessed} of ${r.enrolled}</td><td><b>${r.mean.toFixed(1)}%</b></td><td>${raBadge(school,r.cls.id,r.level.level)}</td><td>${chg(r)}</td></tr>`).join('')}
  </table></div>
  ${streamHtml}
  <div class="ra-sec" style="margin-top:14px">${H('Performance Level Distribution')}
  <table class="ra-table"><tr><th>Grade</th>${levels.map(l=>`<th>${escapeHtml(l)}</th>`).join('')}<th>${topLbl}</th></tr>
  ${ranked.map(r=>`<tr><td style="text-align:left">${escapeHtml(r.cls.name)}</td>${levels.map(l=>`<td>${r.tableLevels.includes(l)?cell(r.lv[l]||0,r.assessed):'—'}</td>`).join('')}<td><b>${(meets(r)/r.assessed*100).toFixed(0)}%</b></td></tr>`).join('')}
  <tr class="rc-total"><td>Whole school</td>${levels.map(l=>`<td>${cell(totLv[l]||0,nAll)}</td>`).join('')}<td>${(stats.reduce((s,r)=>s+meets(r),0)/nAll*100).toFixed(0)}%</td></tr></table></div>
  <div class="ra-sec" style="margin-top:14px">${H('Learning Area Performance (whole school)')}
  <table class="ra-table"><tr><th>Rank</th><th>Learning Area</th><th>School Mean %</th><th>Best Grade</th><th>Lowest Grade</th></tr>
  ${subjects.map((x,i)=>`<tr><td>${i+1}</td><td style="text-align:left">${escapeHtml(x.name)}</td><td><b>${x.mean.toFixed(1)}%</b></td><td>${escapeHtml(x.best.c)} (${x.best.v.toFixed(1)}%)</td><td>${x.one?'—':escapeHtml(x.low.c)+' ('+x.low.v.toFixed(1)+'%)'}</td></tr>`).join('')}
  </table></div>
  <div class="ra-sec" style="margin-top:14px">${H('Top 10 Learners (whole school)')}
  <table class="ra-table"><tr><th>Rank</th><th>Adm No.</th><th>Name</th><th>Grade</th><th>Mean %</th><th>Level</th></tr>
  ${all.slice(0,10).map(l=>`<tr><td>${l.rank}</td><td>${l.s.adm?escapeHtml(l.s.adm):'—'}</td><td style="text-align:left">${escapeHtml(l.s.name)}</td><td>${escapeHtml(l.c)}</td><td><b>${l.mean.toFixed(1)}%</b></td><td>${raBadge(school,l.cid,l.lv)}</td></tr>`).join('')}
  </table></div>
  <div class="ra-sec" style="margin-top:14px">${H('Top 3 Learners per Grade')}
  <table class="ra-table"><tr><th>Grade</th><th>1st</th><th>2nd</th><th>3rd</th></tr>
  ${ranked.map(r=>{ const t=r.lrn.slice().sort((a,b)=>b.mean-a.mean); return `<tr><td style="text-align:left">${escapeHtml(r.cls.name)}</td>${[0,1,2].map(i=>`<td>${t[i]?escapeHtml(t[i].s.name)+' — '+t[i].mean.toFixed(1)+'%':'—'}</td>`).join('')}</tr>`; }).join('')}
  </table></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:30px"><div class="sig-line">Head of Institution: ${escapeHtml(school.hoiName||'')}</div><div class="sig-line">Signature &amp; Date</div></div>
  <div class="flexbtns no-print"><button class="gold" onclick="printSection('raArea')">🖨 Print</button></div>
  </div>`;
}

function tplReportsPicker(school){
  const firstClassId = school.classes[0].id;
  return `<div class="card"><h2 class="no-print">📄 Individual / Whole-Grade Report Cards</h2>
  <div class="row no-print">
    <div><label>Grade</label><select id="repClass" onchange="fillRepExams();fillRepLearners()">${school.classes.map(c=>`<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('')}</select></div>
    <div><label>Exam / Term</label><select id="repExam" onchange="fillRepLearners()">${school.exams.filter(e=>e.classId===firstClassId).map(e=>`<option value="${e.id}">${escapeHtml(e.name)} (${e.term} ${e.year})</option>`).join('') || '<option value="">No exams for this grade</option>'}</select></div>
    <div><label>Learner</label><select id="repLearner"></select></div>
  </div>
  <div class="flexbtns no-print">
    <button onclick="generateReport(qs('#repLearner').value, qs('#repExam').value)">Generate Individual Report</button>
    <button class="ghost" onclick="generateAllReports(qs('#repClass').value, qs('#repExam').value)">Generate All (Whole Grade)</button>
  </div>
  <div id="reportArea"></div></div>`;
}
function fillRepLearners(){
  const school = currentSchool(); const classId = qs('#repClass').value;
  const ex = school.exams.find(e=>qs('#repExam') && e.id===qs('#repExam').value);
  const list = (ex && ex.classId===classId) ? studentsForExam(school, ex) : studentsInClass(school, classId);
  qs('#repLearner').innerHTML = list.map(s=>`<option value="${s.id}">${escapeHtml(s.name)}${s.adm?' ('+escapeHtml(s.adm)+')':''}</option>`).join('');
}
// Keeps the Exam dropdown scoped to whichever class is currently selected — mirroring
// dosRenderExamOptions() on the Marks entry page. Without this, the Exam list showed
// every exam from every class in the school, so picking a class here could leave an
// exam from a DIFFERENT class selected underneath, and Generate would silently produce
// an empty/blank report for that class's learners (no marks exist under that exam id).
function fillRepExams(){
  const school = currentSchool(); const classId = qs('#repClass').value;
  const exams = school.exams.filter(e=>e.classId===classId);
  qs('#repExam').innerHTML = exams.map(e=>`<option value="${e.id}">${escapeHtml(e.name)} (${e.term} ${e.year})</option>`).join('') || '<option value="">No exams for this grade</option>';
}
function buildReportHTML(school, sid, examId){
  const student = school.students.find(s=>s.id===sid);
  const exam = school.exams.find(e=>e.id===examId);
  const cls = school.classes.find(c=>c.id===exam.classId);
  const scoped = !!(session && session.role==='teacher');
  const areas = visibleAreas(school, exam.classId);
  const marksForExam = school.marks[examId] || {};
  let totalScore=0, totalPts=0, sumPct=0, n=0;
  const subjectRows = areas.map(a=>{
    const max = exam.maxMarksByArea[a.id] ?? 100;
    const score = (marksForExam[sid]||{})[a.id];
    let g=null, pct=null;
    if(score!=null){ pct=pctOf(score,max); g=gradeFor(school,pct,exam.classId); totalScore+=score; totalPts+=g.points; sumPct+=pct; n++; }
    // teacher for this area/class
    const teacher = school.teachers.find(t=>t.assignments.some(x=>x.classId===exam.classId && x.areaId===a.id));
    return {name:a.name, score, max, pct, g, teacher: teacher?teacher.name:'-'};
  });
  // Overall performance is averaged across EVERY learning area assigned to the learner's grade — not just
  // the ones marked so far — so a single strong subject can't make an otherwise-unassessed learner look
  // like they are exceeding expectations overall. Unmarked areas count as 0 in this average until entered.
  const meanPct = areas.length? sumPct/areas.length : 0;
  const allMarked = n===areas.length && areas.length>0;
  const overallGrade = gradeFor(school,meanPct,exam.classId);
  // class position for this exam
  const learners = studentsForExam(school, exam);
  const totals = learners.map(s=>{
    let t=0; areas.forEach(a=>{ const sc=(marksForExam[s.id]||{})[a.id]; if(sc!=null) t+=sc; });
    return {id:s.id, t};
  }).sort((a,b)=>b.t-a.t);
  let position = totals.findIndex(x=>x.id===sid)+1;
  const classTeacher = school.classTeachers[exam.classId] || 'Not Set';
  // history across all exams/years for this learner (for chart)
  const historyExams = school.exams.filter(e=> (school.marks[e.id]||{})[sid])
    .sort((a,b)=> a.year-b.year || a.term.localeCompare(b.term));
  const historyPoints = historyExams.map(e=>{
    const mk = school.marks[e.id][sid];
    let s=0,mx=0; areas.forEach(a=>{ const sc=mk[a.id]; const mmax=e.maxMarksByArea[a.id]??100; if(sc!=null){s+=sc; mx+=mmax;} });
    return {label:e.name+' ('+e.term.slice(-1)+"/'"+String(e.year).slice(-2)+')', pct: mx? s/mx*100:0};
  });
  const remark = overallGrade.remark;
  const chartId = 'chart_'+sid.replace(/\W/g,'');
  // Attendance and term dates are purely informational and only shown once a DOS/HOI has
  // actually filled them in (Exams tab) — an unset totalDays or missing days-present record
  // just leaves that part off the report rather than printing "0 of 0" or a blank date.
  const daysPresent = (school.attendance[examId]||{})[sid];
  const attendanceLine = (exam.totalDays && daysPresent!=null)
    ? `<div><b>Attendance:</b> ${daysPresent} of ${exam.totalDays} days (${Math.round(daysPresent/exam.totalDays*100)}%)</div>` : '';
  const closeLine = exam.termCloseDate ? `<div><b>Term Closes:</b> ${new Date(exam.termCloseDate).toLocaleDateString()}</div>` : '';
  const nextTermLine = exam.nextTermDate ? `<div><b>Next Term Opens:</b> ${new Date(exam.nextTermDate).toLocaleDateString()}</div>` : '';
  const metaLine = (attendanceLine || closeLine || nextTermLine) ? `<div class="rc-meta">${attendanceLine}${closeLine}${nextTermLine}</div>` : '';
  // Grading key legend — the class's own custom scale if it has one, else the school default —
  // so EE/ME/AE/BE (or whatever levels a school has renamed them to) are explained right on
  // the report rather than assumed knowledge for parents.
  const keyTable = gradingFor(school, exam.classId);
  const gradingKey = keyTable.length ? `<div class="rc-key">${keyTable.map(k=>`<span><b>${escapeHtml(k.level)}</b> = ${escapeHtml(k.label)}</span>`).join('')}</div>` : '';
  const html = `
  <div class="report-card print-only-block">
    <div class="rc-topband"></div>
    <div class="rc-body">
    <div class="report-header">
      ${schoolHeaderTop(school)}
      ${schoolContactLine(school)}
      <p class="rc-doctitle">Learner Progress Report</p>
      <p class="small">${escapeHtml(exam.name)} &nbsp;·&nbsp; ${exam.term} ${exam.year}</p>
      <p class="rc-code">School Code: ${school.code}</p>
    </div>
    <div class="rc-info">
      <div class="rc-info-grid">
        <div><b>Name:</b> ${escapeHtml(student.name)}</div>
        <div><b>Adm. No.:</b> ${student.adm ? escapeHtml(student.adm) : 'Not assigned'}</div>
        <div><b>Grade:</b> ${escapeHtml(cls.name)}</div>
        <div><b>Position:</b> ${position} of ${learners.length}</div>
      </div>
      <div class="rc-overall-box">
        <div class="rc-grade">${overallGrade.level}</div>
        <div class="rc-sub">${meanPct.toFixed(1)}% Mean &nbsp;·&nbsp; ${totalPts} Pts</div>
      </div>
    </div>
    <table class="rc-table"><tr><th>Learning Area</th><th>Marks</th><th>%</th><th>Level</th><th>Points</th><th>Teacher</th></tr>
    ${subjectRows.map(r=>`<tr><td style="text-align:left">${escapeHtml(r.name)}</td><td>${r.score??'-'}/${r.max}</td><td>${r.pct!=null?r.pct.toFixed(1)+'%':'-'}</td>
    <td>${r.g?raBadge(school,cls.id,r.g.level):'-'}</td><td>${r.g?r.g.points:'-'}</td><td>${escapeHtml(r.teacher)}</td></tr>`).join('')}
    <tr class="rc-total"><td style="text-align:left">TOTAL / MEAN</td><td>${totalScore}</td><td>${meanPct.toFixed(1)}%</td>
    <td>${raBadge(school,cls.id,overallGrade.level)}</td><td>${totalPts}</td><td>-</td></tr>
    </table>
    ${(!allMarked && !scoped) ? `<p class="small" style="color:#9c2c2c">⚠ Assessment incomplete: only ${n} of ${areas.length} learning area(s) marked so far. The Mean % and overall level above already reflect this — they are based on general performance across ALL learning areas for this grade, so they will read low/blank until every learning area is entered.</p>` : ''}
    ${scoped ? `<p class="small">Learning Area report — shows only the learning area(s) assigned to the issuing teacher. Mean, points and position are based on these only.</p>` : ''}
    <div class="rc-chartwrap"><span class="rc-chart-label">Performance Trend</span>
    <canvas id="${chartId}" width="760" height="340"></canvas></div>
    <div class="rc-remark"><b>Grade Teacher's Remark:</b> ${escapeHtml(remark)}</div>
    ${metaLine}
    <div class="rc-sigrow">
      <div class="sig-line">Grade Teacher: ${escapeHtml(classTeacher)}</div>
      <div class="sig-line">${school.hoiSignature?`<img class="rc-sig-img" src="${school.hoiSignature}" alt="HOI signature">`:''}Head of Institution: ${escapeHtml(school.hoiName)}</div>
      <div class="sig-line">Parent / Guardian Signature</div>
    </div>
    ${gradingKey}
    <div class="rc-footer">Generated by Asion Analytics &nbsp;·&nbsp; ${new Date().toLocaleDateString()}</div>
    </div>
  </div>`;
  // Returned alongside the HTML (instead of an inline <script> tag) because content
  // inserted via innerHTML never executes embedded <script> tags — the chart must be
  // drawn afterwards, once the canvas is actually in the DOM. See drawProgressChart().
  return {html, chartId, historyPoints};
}
// Draws one learner's performance-trend line chart onto its canvas.
// Called explicitly after the report HTML has been inserted into the DOM
// (see generateReport/generateAllReports) since scripts set via innerHTML don't run.
function drawProgressChart(chartId, data){
  const c = document.getElementById(chartId); if(!c) return;
  const ctx = c.getContext('2d');
  ctx.clearRect(0,0,c.width,c.height);
  ctx.strokeStyle='#123a63'; ctx.lineWidth=1; ctx.strokeRect(0,0,c.width,c.height);
  if(!data || data.length===0){ ctx.fillStyle='#555'; ctx.font='14px Arial'; ctx.fillText('No historical data yet',16,c.height/2); return; }
  const padL=54,padB=40,padT=16,w=c.width-padL-16,h=c.height-padT-padB;
  // Gridlines and axis labels use a mid-gray dark enough to survive black-and-white/
  // grayscale printing (the previous very light tint was fine on a color screen but
  // printed as good as invisible on paper).
  ctx.strokeStyle='#123a63'; ctx.fillStyle='#123a63'; ctx.font='12px Arial';
  for(let g=0; g<=4; g++){ const y=padT+h-h*(g/4); ctx.fillText((g*25)+'%', 4, y+4); ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(c.width-8,y); ctx.strokeStyle='#a9b6c4'; ctx.lineWidth=1; ctx.stroke(); }
  // The trend line itself is drawn in navy rather than gold: navy keeps strong contrast
  // against white paper whether the report prints in color or in plain black-and-white,
  // while the gold shade used elsewhere as an accent gets too pale once desaturated.
  ctx.beginPath(); ctx.strokeStyle='#123a63'; ctx.lineWidth=3;
  data.forEach((d,i)=>{ const x=padL + (data.length>1? (w*i/(data.length-1)) : w/2); const y=padT+h-h*(d.pct/100);
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); });
  ctx.stroke();
  data.forEach((d,i)=>{ const x=padL + (data.length>1? (w*i/(data.length-1)) : w/2); const y=padT+h-h*(d.pct/100);
    ctx.beginPath(); ctx.arc(x,y,5,0,7); ctx.fillStyle='#d9a441'; ctx.fill(); ctx.lineWidth=1.5; ctx.strokeStyle='#123a63'; ctx.stroke();
    ctx.save(); ctx.translate(x,c.height-10); ctx.fillStyle='#123a63'; ctx.font='11px Arial'; ctx.textAlign='center'; ctx.fillText(d.label, 0, 0); ctx.restore();
  });
}
/* ============================= PRINT: FIT REPORT CARD TO ONE PAGE =============================
   Guarantees a learner report always lands on exactly one A4 page, however many learning
   areas a school has configured. Right before printing, this measures each .report-card's
   actual rendered height against the printable page height and, if it's even slightly too
   tall, shrinks it with CSS zoom — which (unlike transform:scale) causes a real reflow, so
   nothing gets clipped, cut off, or spills a sliver onto a second page. Resets back to normal
   size again once printing is done, so on-screen viewing is unaffected. */
function fitReportCardsToPage(){
  const mmToPx = mm => mm * 96/25.4;
  const pageHeightPx = mmToPx(297) - mmToPx(8)*2; // A4 height minus the 8mm @page margins
  document.querySelectorAll('.report-card').forEach(el=>{
    el.style.zoom = 1;
    const h = el.scrollHeight;
    if(h > pageHeightPx){
      const ratio = Math.max(0.55, pageHeightPx / h); // never shrink past ~55% — stays legible
      el.style.zoom = ratio;
    }
  });
}
window.addEventListener('beforeprint', fitReportCardsToPage);
window.addEventListener('afterprint', ()=>{
  document.querySelectorAll('.report-card').forEach(el=>{ el.style.zoom = 1; });
});
/* ============================= PARENT PORTAL VIEW =============================
   Deliberately its own small, self-contained view: unlike renderDOS()/renderTeacher(),
   it has no tabs, no learner list, no other class or exam management UI — just the one
   logged-in learner's own report(s). There is no code path from here into any other
   learner's data, another class, or the DOS/Teacher/Admin screens. */
function renderParent(){
  const school = parentSchoolData;
  const student = school && school.students.find(s=>s.id===session.studentId);
  if(!school || !student){
    logout();
    setTimeout(()=>toast('Learner record not found — please log in again.','err'), 50);
    return;
  }
  const cls = school.classes.find(c=>c.id===student.classId);
  const exams = school.exams.slice().reverse(); // already limited to this learner's own exams by buildParentSafeSchool
  app.innerHTML = `
  <div class="card">
    <h2>👋 ${escapeHtml(student.name)}</h2>
    <p class="small">${cls?escapeHtml(cls.name):'Grade not set'} &nbsp;·&nbsp; ${escapeHtml(school.name)} &nbsp;·&nbsp; Admission No: ${escapeHtml(student.adm||'-')}</p>
    <div class="row">
      <div><label>Exam / Term</label>
        <select id="pExam" onchange="viewParentReport()">
          ${exams.map(e=>`<option value="${e.id}">${escapeHtml(e.name)} (${e.term} ${e.year})</option>`).join('') || '<option value="">No reports available yet</option>'}
        </select>
      </div>
    </div>
  </div>
  <div id="reportArea"></div>`;
  if(exams.length) viewParentReport();
}
function viewParentReport(){
  const school = parentSchoolData;
  const examId = qs('#pExam').value;
  if(!examId){ qs('#reportArea').innerHTML = '<p class="small">No report has been published for this learner yet.</p>'; return; }
  const r = buildReportHTML(school, session.studentId, examId);
  qs('#reportArea').innerHTML = r.html + `<div class="flexbtns no-print"><button class="gold" onclick="window.print()">🖨 Print This Report</button></div>`;
  drawProgressChart(r.chartId, r.historyPoints);
}
function confirmUnapproved(school, examId){
  const e = school.exams.find(x=>x.id===examId);
  if(e && !examReleased(school, e)) return confirm(`Results for "${e.name}" have not been approved yet.\n\nGenerate reports anyway?`);
  return true;
}
function generateReport(sid, examId){
  if(!sid||!examId){ toast('Select learner & exam','err'); return; }
  const school = currentSchool();
  if(!confirmUnapproved(school, examId)) return;
  const r = buildReportHTML(school, sid, examId);
  qs('#reportArea').innerHTML = r.html + `<div class="flexbtns no-print"><button class="gold" onclick="window.print()">🖨 Print This Report</button></div>`;
  drawProgressChart(r.chartId, r.historyPoints);
}
function generateAllReports(classId, examId){
  if(!classId||!examId){ toast('Select grade & exam','err'); return; }
  const school = currentSchool();
  if(!confirmUnapproved(school, examId)) return;
  const _exm = school.exams.find(x=>x.id===examId);
  const learners = _exm ? studentsForExam(school, _exm) : studentsInClass(school, classId);
  const reports = learners.map(s=>buildReportHTML(school,s.id,examId));
  qs('#reportArea').innerHTML = reports.map(r=>r.html).join('') +
   `<div class="flexbtns no-print"><button class="gold" onclick="window.print()">🖨 Print All Reports</button></div>`;
  reports.forEach(r=>drawProgressChart(r.chartId, r.historyPoints));
}

/* ============================= EXAM HISTORY ============================= */
function tplHistory(school){
  return `<div class="card"><h2>🗂 Saved Exam History (All Grades)</h2>
  <p class="small">Delete an exam here to permanently remove it and every learner's recorded marks for it — e.g. a duplicate or a test entry made by mistake.</p>
  <table><tr><th>Exam</th><th>Grade</th><th>Term/Year</th><th>Date Created</th><th>Entry</th><th>Approval</th><th>Marks Entered</th><th></th></tr>
  ${school.exams.slice().reverse().map(e=>{
    const c = school.classes.find(x=>x.id===e.classId);
    const closed = isExamClosed(e);
    const entryBadge = closed ? '<span class="badge BE">🔒 Closed</span>' : '<span class="badge EE">🔓 Open</span>';
    const approvalBadge = e.resultsApproval==='approved' ? '<span class="badge EE">✅ Approved</span>'
      : e.resultsApproval==='disapproved' ? '<span class="badge BE">❌ Disapproved</span>'
      : '<span class="badge AE">⏳ Pending</span>';
    const comp = examCompletion(school, e);
    const marksCell = comp.total ? `${comp.filled} of ${comp.total}${comp.filled<comp.total?' <span class="small">(incomplete)</span>':''}` : '<span class="small">-</span>';
    return `<tr><td>${escapeHtml(e.name)}</td><td>${c?escapeHtml(c.name):'-'}</td><td>${e.term} ${e.year}</td><td>${new Date(e.date).toLocaleDateString()}</td>
    <td>${entryBadge}</td><td>${approvalBadge}</td><td>${marksCell}</td>
    <td><button class="ghost" onclick="dosTab='assess';renderDOS();setTimeout(()=>{qs('#asExam').value='${e.id}';viewClassAssessment('${e.id}')},50)">View</button> <button class="danger" onclick="delExam('${e.id}')">✕ Delete</button></td></tr>`;
  }).join('') || '<tr><td colspan="8" class="small">No exams recorded yet.</td></tr>'}
  </table></div>`;
}

/* ============================= INIT ============================= */
resetInactivityTimer(); // arm the 15-minute timeout right away if a session survived a page refresh
route();
</script>
