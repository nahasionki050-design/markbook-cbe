function applyDiscount(){
  if(!canEdit()){ noEdit(); return; }
  const {school, exam} = feeCtx(); const sid = qs('#discLearner').value, amt = Number(qs('#discAmt').value), reason = qs('#discReason').value.trim();
  if(!exam||!sid){ toast('Pick a learner','err'); return; }
  if(!(amt>0)||!reason){ toast('Enter an amount and a reason','err'); return; }
  if(!school.fees[exam.id]) school.fees[exam.id] = {};
  const r = school.fees[exam.id][sid] || (school.fees[exam.id][sid] = {});
  r.balance = (Number(r.balance)||0) - amt; r.discount = (Number(r.discount)||0) + amt; r.updatedAt = Date.now();
  const fi = currentFinance();
  school.feeAdjust.push({id:uid('adj_'), examId:exam.id, studentId:sid, amount:amt, reason, date:today10(), by:fi?fi.name:'School Admin', ts:Date.now()});
  saveDB(DB); qs('#discAmt').value=''; qs('#discReason').value=''; toast('Discount applied'); loadFinanceFeesSummary();
}
function voidAdjust(id){
  if(!canEdit()){ noEdit(); return; }
  const school = currentSchool(); const a = school.feeAdjust.find(x=>x.id===id); if(!a||a.void||!confirm('Void this discount? The amount is added back to the learner\'s balance.')) return;
  const r = (school.fees[a.examId]||{})[a.studentId]; if(r){ r.balance = (Number(r.balance)||0) + a.amount; r.discount = Math.max(0,(Number(r.discount)||0) - a.amount); }
  a.void = true; saveDB(DB); toast('Discount voided'); loadFinanceFeesSummary();
}
function smsPayConfirm(pay){
  const school = currentSchool(), st = finRaw(school).find(x=>x.id===pay.studentId)||{}, el = qs('#payMsg');
  const msg = `Received KES ${pay.amount.toLocaleString()} for ${st.name} on ${pay.date}. Receipt ${pay.receiptNo}. Balance: KES ${pay.balanceAfter.toLocaleString()}. - ${school.name}`;
  const built = buildSmsRecipients([{phone:st.parentPhone, message:msg}]);
  const note = t=>{ el.innerHTML = `<div class="msg err">Payment saved. ${t}</div>`; };

}

function dlBlob(name, text, type){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type})); a.download=name; document.body.appendChild(a); a.click(); a.remove(); }

function restoreFinance(input){

function closingData(){

    const billed = ls.reduce((a,l)=>a+(Number((recs[l.id]||{}).billed)||0),0);
    const disc = sc.feeAdjust.filter(a=>!a.void && a.examId===e.id).reduce((a,x)=>a+x.amount,0);
    const paid = sc.payments.filter(p=>!p.void && p.examId===e.id).reduce((a,p)=>a+p.amount,0);
    const owing = ls.filter(l=>Number((recs[l.id]||{}).balance)>0);
    return {cls:((sc.classes.find(c=>c.id===e.classId)||{}).name)||e.name, n:ls.length, billed, disc, paid, out:owing.reduce((a,l)=>a+Number(recs[l.id].balance),0), owing:owing.length};

  const exps = sc.expenses.filter(e=>!e.void && inRange(e.date,f,t)), byCat = {}; exps.forEach(e=>byCat[e.category]=(byCat[e.category]||0)+e.amount);

function buildReportHTML(school, sid, examId){
  const student = school.students.find(s=>s.id===sid);
  const exam = school.exams.find(e=>e.id===examId);
  const cls = school.classes.find(c=>c.id===exam.classId) || {id:exam.classId, name:'—'};
  const scoped = !!(session && session.role==='teacher');
  const areas = visibleAreas(school, exam.classId);
  const marksForExam = school.marks[examId] || {};
  let totalScore=0, totalPts=0, sumPct=0, n=0;
  const subjectRows = areas.map(a=>{
    const max = exam.maxMarksByArea[a.id] ?? 100;
    const score = (marksForExam[sid]||{})[a.id];
    let g=null, pct=null;
    if(score!=null){ pct=pctOf(score,max); g=gradeFor(school,pct,exam.classId); totalScore+=score; totalPts+=g.points; sumPct+=pct; n++; }
    // teacher for this area/class
    const teacher = school.teachers.find(t=>(t.assignments||[]).some(x=>x.classId===exam.classId && x.areaId===a.id));
    return {name:a.name, score, max, pct, g, teacher: teacher?teacher.name:'-'};
  });
  // Overall performance is averaged across EVERY learning area assigned to the learner's grade — not just
  // the ones marked so far — so a single strong subject can't make an otherwise-unassessed learner look
  // like they are exceeding expectations overall. Unmarked areas count as 0 in this average until entered.
  const meanPct = areas.length? sumPct/areas.length : 0;
  const allMarked = n===areas.length && areas.length>0;
  const overallGrade = gradeFor(school,meanPct,exam.classId);
  // class position for this exam
  const learners = studentsForExam(school, exam);
  const totals = learners.map(s=>{
    let t=0; areas.forEach(a=>{ const sc=(marksForExam[s.id]||{})[a.id]; if(sc!=null) t+=sc; });
    return {id:s.id, t};
  }).sort((a,b)=>b.t-a.t);
  let position = totals.findIndex(x=>x.id===sid)+1;
  const classTeacher = (school.classTeachers||{})[exam.classId] || 'Not Set';
  // history across all exams/years for this learner (for chart)
  const historyExams = school.exams.filter(e=> (school.marks[e.id]||{})[sid])
    .sort((a,b)=> a.year-b.year || a.term.localeCompare(b.term));
  const historyPoints = historyExams.map(e=>{
    const mk = school.marks[e.id][sid];
    let s=0,mx=0; areas.forEach(a=>{ const sc=mk[a.id]; const mmax=e.maxMarksByArea[a.id]??100; if(sc!=null){s+=sc; mx+=mmax;} });
    return {label:e.name+' ('+e.term.slice(-1)+"/'"+String(e.year).slice(-2)+')', pct: mx? s/mx*100:0};
  });
  // A personalized remark for this learner+exam (set under Exams → Personalize Report
  // Remarks, or by their Class Teacher) always wins; otherwise fall back to the auto
  // remark tied to whichever grading level their overall mean % falls into.
  const remark = ((school.remarks||{})[examId]||{})[sid] || overallGrade.remark;
  const chartId = 'chart_'+sid.replace(/\W/g,'');
  // Attendance and term dates are purely informational and only shown once a DOS/HOI has
  // actually filled them in (Exams tab) — an unset totalDays or missing days-present record
  // just leaves that part off the report rather than printing "0 of 0" or a blank date.
  const daysPresent = ((school.attendance||{})[examId]||{})[sid];
  const attendanceLine = (exam.totalDays && daysPresent!=null)
    ? `<div><b>Attendance:</b> ${daysPresent} of ${exam.totalDays} days (${Math.round(daysPresent/exam.totalDays*100)}%)</div>` : '';
  const closeLine = exam.termCloseDate ? `<div><b>Term Closes:</b> ${new Date(exam.termCloseDate).toLocaleDateString()}</div>` : '';
  const nextTermLine = exam.nextTermDate ? `<div><b>Next Term Opens:</b> ${new Date(exam.nextTermDate).toLocaleDateString()}</div>` : '';
  // Fees balance/next-term-fee: purely informational, set by the Finance Portal (bulk CSV
  // import or manual entry) against this exact exam/term — left off entirely for a learner
  // with no fee record yet, rather than printing a misleading "KES 0".
  let feeRec = ((school.fees||{})[examId]||{})[sid];
  if(!feeRec){ const ex0 = school.exams.find(e=>e.id===examId), st0 = school.students.find(x=>x.id===sid); const ft0 = (ex0&&st0) ? (school.feeTerms||[]).find(t=>t.classId===st0.classId && t.term===ex0.term && String(t.year)===String(ex0.year)) : null; if(ft0) feeRec = (school.fees[ft0.id]||{})[sid]; }
  const feesLine = (feeRec && (feeRec.balance!=null || feeRec.nextTermFee!=null))
    ? `<div>${feeRec.balance!=null?`<b>Fees Balance:</b> KES ${Number(feeRec.balance).toLocaleString()}`:''}${(feeRec.balance!=null && feeRec.nextTermFee!=null)?' &nbsp;·&nbsp; ':''}${feeRec.nextTermFee!=null?`<b>Next Term Fee:</b> KES ${Number(feeRec.nextTermFee).toLocaleString()}`:''}</div>` : '';
  const metaLine = (attendanceLine || closeLine || nextTermLine || feesLine) ? `<div class="rc-meta">${attendanceLine}${closeLine}${nextTermLine}${feesLine}</div>` : '';
  // Grading key legend — the class's own custom scale if it has one, else the school default —
  // so EE/ME/AE/BE (or whatever levels a school has renamed them to) are explained right on
  // the report rather than assumed knowledge for parents.
  const keyTable = gradingFor(school, exam.classId);
  const gradingKey = keyTable.length ? `<div class="rc-key">${keyTable.map(k=>`<span><b>${escapeHtml(k.level)}</b> = ${escapeHtml(k.label)}</span>`).join('')}</div>` : '';

  // ---- Learner analysis (class comparison, deviation, strengths/weaknesses, progress) ----
  const sgn=d=>`<b style="color:${d>=0?'#1f8a4c':'#d1473f'}">${d>=0?'+':''}${d.toFixed(1)}</b>`;
  const clsArea=areas.map(a=>{ const v=learners.map(x=>(marksForExam[x.id]||{})[a.id]).filter(x=>x!=null).map(x=>pctOf(x,exam.maxMarksByArea[a.id]??100)); return v.length?v.reduce((t,x)=>t+x,0)/v.length:null; });
  subjectRows.forEach((r,i)=>{ r.cavg=clsArea[i]; r.dev=(r.pct!=null&&r.cavg!=null)?r.pct-r.cavg:null; });
  const lMeans=learners.map(x=>{ let t=0, any=false; areas.forEach(a=>{ const sc=(marksForExam[x.id]||{})[a.id]; if(sc!=null){ t+=pctOf(sc,exam.maxMarksByArea[a.id]??100); any=true; } }); return {m:areas.length?t/areas.length:0, any}; }).filter(x=>x.any);
  const clsMean=lMeans.length?lMeans.reduce((t,x)=>t+x.m,0)/lMeans.length:null;
  const clsSD=raSD(lMeans.map(x=>x.m));
  const beatPct=lMeans.length>1?Math.round(lMeans.filter(x=>x.m<meanPct-1e-9).length/(lMeans.length-1)*100):null;
  const curIdx=historyExams.findIndex(e=>e.id===examId), prevEx=curIdx>0?historyExams[curIdx-1]:null;
  let prevMean=null;
  if(prevEx){ const mk=school.marks[prevEx.id][sid]||{}; let t=0,c=0; areas.forEach(a=>{ const sc=mk[a.id]; if(sc!=null){ t+=pctOf(sc,prevEx.maxMarksByArea[a.id]??100); c++; } }); if(c) prevMean=t/areas.length; }
  const markedRows=subjectRows.filter(r=>r.pct!=null).sort((a,b)=>b.pct-a.pct);
  const kk=markedRows.length>=5?2:1, strong=markedRows.slice(0,kk), weak=markedRows.length>1?markedRows.slice(-kk).reverse():[];
  const lvTbl=gradingFor(school,exam.classId).slice().sort((a,b)=>b.points-a.points), topLv=lvTbl.slice(0,2).map(g=>g.level), lowLv=lvTbl.length>2?lvTbl[lvTbl.length-1].level:null;
  const atExp=markedRows.filter(r=>topLv.includes(r.g.level)).length, needSup=lowLv?markedRows.filter(r=>r.g.level===lowLv):[];
  const ssd=raSD(markedRows.map(r=>r.pct));
  const evenLbl=markedRows.length<3?'':ssd<8?'very even across learning areas':ssd<15?'fairly even across learning areas':'uneven — a big gap between the strongest and weakest areas';
  const nm=a=>a.map(r=>escapeHtml(r.name)+' ('+r.pct.toFixed(0)+'%)').join(', ');
  const delta=prevMean!=null?meanPct-prevMean:null;
  const attPct=(exam.totalDays&&daysPresent!=null)?daysPresent/exam.totalDays*100:null;
  const notes=[];
  if(strong.length) notes.push(`<b>Strongest:</b> ${nm(strong)}.`);
  if(weak.length && weak[0].name!==strong[0].name) notes.push(`<b>Needs most improvement:</b> ${nm(weak)}.`);
  notes.push(`<b>At or above expectation (${topLv.map(escapeHtml).join('/')}):</b> ${atExp} of ${markedRows.length} learning area(s).${needSup.length?` <b>Needs extra support (${escapeHtml(lowLv)}):</b> ${needSup.map(r=>escapeHtml(r.name)).join(', ')}.`:''}`);
  if(evenLbl) notes.push(`<b>Consistency:</b> performance is ${evenLbl}.`);
  if(delta!=null) notes.push(`<b>Progress:</b> ${Math.abs(delta)<2?'steady':delta>0?'improved':'dropped'} since ${escapeHtml(prevEx.name)} (${prevMean.toFixed(1)}% → ${meanPct.toFixed(1)}%).`);
  if(attPct!=null && attPct<85) notes.push(`<b>Attendance:</b> ${attPct.toFixed(0)}% — regular attendance will help improve results.`);
  const analysisHtml = markedRows.length ? `<div class="rc-analysis"><h4>📊 Learner Analysis</h4>
    <div class="rc-tiles">

// Draws one learner's performance-trend line chart onto its canvas.
// Called explicitly after the report HTML has been inserted into the DOM
// (see generateReport/generateAllReports) since scripts set via innerHTML don't run.
function drawProgressChart(chartId, data){
  const c = document.getElementById(chartId); if(!c) return;
  const ctx = c.getContext('2d');
  ctx.clearRect(0,0,c.width,c.height);
  ctx.strokeStyle='#123a63'; ctx.lineWidth=1; ctx.strokeRect(0,0,c.width,c.height);
  if(!data || data.length===0){ ctx.fillStyle='#555'; ctx.font='14px Arial'; ctx.fillText('No historical data yet',16,c.height/2); return; }
  const padL=54,padB=40,padT=16,w=c.width-padL-16,h=c.height-padT-padB;
  // Gridlines and axis labels use a mid-gray dark enough to survive black-and-white/
  // grayscale printing (the previous very light tint was fine on a color screen but
  // printed as good as invisible on paper).
  ctx.strokeStyle='#123a63'; ctx.fillStyle='#123a63'; ctx.font='12px Arial';
  for(let g=0; g<=4; g++){ const y=padT+h-h*(g/4); ctx.fillText((g*25)+'%', 4, y+4); ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(c.width-8,y); ctx.strokeStyle='#a9b6c4'; ctx.lineWidth=1; ctx.stroke(); }
  // The trend line itself is drawn in navy rather than gold: navy keeps strong contrast
  // against white paper whether the report prints in color or in plain black-and-white,
  // while the gold shade used elsewhere as an accent gets too pale once desaturated.
  ctx.beginPath(); ctx.strokeStyle='#123a63'; ctx.lineWidth=3;
  data.forEach((d,i)=>{ const x=padL + (data.length>1? (w*i/(data.length-1)) : w/2); const y=padT+h-h*(d.pct/100);
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); });
  ctx.stroke();
  data.forEach((d,i)=>{ const x=padL + (data.length>1? (w*i/(data.length-1)) : w/2); const y=padT+h-h*(d.pct/100);
    ctx.beginPath(); ctx.arc(x,y,5,0,7); ctx.fillStyle='#d9a441'; ctx.fill(); ctx.lineWidth=1.5; ctx.strokeStyle='#123a63'; ctx.stroke();
    ctx.save(); ctx.translate(x,c.height-10); ctx.fillStyle='#123a63'; ctx.font='11px Arial'; ctx.textAlign='center'; ctx.fillText(d.label, 0, 0); ctx.restore();
  });
}
/* ============================= PRINT: FIT REPORT CARD TO ONE A4 PAGE =============================
   Every learner report must fill the WHOLE printable A4 area (210x297mm minus the 8mm @page
   margin on every side = 194x281mm): equal margins all round, no blank strip below, nothing
   spilling to a 2nd page. The print CSS gives each card the full printable height as a flex
   column, so a short report simply stretches (spacers share the spare height). A report with
   a lot of content is shrunk with CSS zoom — and, because zoom also shrinks the box itself,
   the card's width and height are divided by the zoom factor so that after zooming it still
   covers exactly the full page width and height.
   To decide HOW MUCH to shrink, each card is measured in a hidden copy that has the print
   styles applied (print rules cloned under .rcsim) at the real printable width — measuring
   the on-screen layout (wider, bigger type) would over-shrink the text. */
function rcPrintSimCSS(){
  if(document.getElementById('rcSimCss')) return;
  // Copies every style rule that applies in PRINT (plain rules + @media print/all), in source order,
  // each prefixed with .rcsim. Prefixing every rule equally keeps the cascade — specificity and
  // order — identical to real printing, so the hidden copy measures exactly what the printer will lay out.
  let css='';
  const add=q=>{ if(q.type!==CSSRule.STYLE_RULE) return;
    const sel=q.selectorText.split(',').map(x=>x.trim()).filter(x=>x && !/^(html|body|:root)/.test(x)).map(x=>'.rcsim '+x).join(',');
    if(sel) css+=sel+'{'+q.style.cssText+'}'; };
  Array.from(document.styleSheets).forEach(ss=>{
    let rules; try{ rules=Array.from(ss.cssRules); }catch(e){ return; }   // cross-origin sheet (web font) — skip only that sheet
    rules.forEach(r=>{
      if(r.type===CSSRule.STYLE_RULE) add(r);
      else if(r.type===CSSRule.MEDIA_RULE && /(^|[\s,(])(print|all)\b/.test(r.media.mediaText) && !/only screen|^screen/.test(r.media.mediaText)) Array.from(r.cssRules).forEach(add);
    });
  });
  const st=document.createElement('style'); st.id='rcSimCss'; st.textContent=css; document.head.appendChild(st);
}
function resetReportFit(){
  document.querySelectorAll('.report-card').forEach(el=>{ el.style.zoom=''; el.style.width=''; el.style.height=''; el.style.removeProperty('--rc-pad'); el.style.removeProperty('--rc-ch'); });
}
function fitReportCardsToPage(){
  const PX = mm => mm*96/25.4;
  const PAGE_W = 194, PAGE_H = 280;            // printable A4 (mm): 210-2*8 wide, 297-2*8 tall minus 1mm safety
  const cards = Array.from(document.querySelectorAll('.report-card'));
  resetReportFit();
  if(!cards.length) return;
  rcPrintSimCSS();
  const sim=document.createElement('div');
  sim.className='rcsim';
  sim.style.cssText='position:absolute;left:-10000px;top:0;visibility:hidden;width:'+PAGE_W+'mm;font-size:11px;font-family:var(--font);color:#1c2b3a;line-height:normal;';
  document.body.appendChild(sim);
  cards.forEach(el=>{
    const c=el.cloneNode(true);
    c.classList.remove('print-only-block');
    c.style.cssText='height:auto;width:100%;margin:0;zoom:1;';
    sim.appendChild(c);
    const h=c.scrollHeight;                    // natural height at the real print width/typography
    sim.removeChild(c);
    if(h > PX(PAGE_H)){
      const k=Math.max(0.5, PX(PAGE_H)/h);
      el.style.zoom=k;
      el.style.width=(100/k)+'%';
      el.style.height=(PAGE_H/k)+'mm';
    }else{
      // Short report: instead of leaving one big empty gap, share ~80% of the spare height between
      // taller table rows (55%) and a taller trend chart (25%); the flex spacers take the rest.
      const spare=PX(PAGE_H)-h, rows=el.querySelectorAll('.rc-table tr').length||1;
      el.style.setProperty('--rc-pad', (3.5+Math.min(spare*0.55/rows/2,13)).toFixed(1)+'px');
      el.style.setProperty('--rc-ch', (120+Math.min(spare*0.25,140)).toFixed(0)+'px');
    }
  });
  document.body.removeChild(sim);
}
window.addEventListener('beforeprint', fitReportCardsToPage);
window.addEventListener('afterprint', resetReportFit);
// Asks before producing report forms for an exam whose results are still awaiting DOS/HOI approval.
// (Was called by both generators below but never defined, so the buttons threw an error and nothing appeared.)
function confirmUnapproved(school, examId){
  const e = school.exams.find(x=>x.id===examId);
  if(!e) return true;
  if(!school.requireApproval || e.resultsApproval==='approved') return true;
  const st = e.resultsApproval==='disapproved' ? 'DISAPPROVED' : 'still PENDING approval';
  return confirm('Results for "'+e.name+'" are '+st+'.\n\nReport forms made now are drafts and should not be given to parents.\n\nGenerate them anyway?');
}
// Shared by every "Generate" button: builds the cards, shows them, draws the charts, and reports any
// problem on screen instead of failing silently.
function showReports(areaSel, learners, examId, title){
  const area = qs(areaSel), school = currentSchool();
  if(!area){ toast('Report area not found — reopen the Reports page','err'); return; }
  const exam = school.exams.find(x=>x.id===examId);
  if(!exam){ area.innerHTML='<div class="msg err">That exam no longer exists. Pick the Exam / Term again.</div>'; return; }
  if(!learners.length){ area.innerHTML='<div class="msg err">No learners found for this grade'+(genderMode('repGender')!=='all'?' with the chosen gender filter':'')+'. Add learners first.</div>'; return; }
  const built = [], failed = [];
  learners.forEach(l=>{ try{ built.push(buildReportHTML(school, l.id, examId)); }catch(err){ console.error('Report failed for', l && l.name, err); failed.push((l&&l.name)||'?'); } });
  const marked = Object.keys(school.marks[examId]||{}).length;
  const info = `<div class="no-print small" style="margin:8px 0">${built.length} report form(s) ready · ${escapeHtml(exam.name)} (${escapeHtml(exam.term)} ${exam.year})`
    + (marked===0 ? ' · <b style="color:#9c2c2c">⚠ no marks have been entered for this exam yet — the forms will be blank</b>' : '')
    + (failed.length ? `<br><b style="color:#9c2c2c">⚠ Could not build ${failed.length}: ${escapeHtml(failed.slice(0,8).join(', '))}${failed.length>8?'…':''}</b>` : '') + '</div>';
  area.innerHTML = info + built.map(r=>r.html).join('') +
    `<div class="flexbtns no-print"><button class="gold" onclick="window.print()">🖨 ${title}</button></div>`;
  built.forEach(r=>{ try{ drawProgressChart(r.chartId, r.historyPoints); }catch(e){} });
  try{ area.scrollIntoView({behavior:'smooth', block:'start'}); }catch(e){}
}
function generateReport(sid, examId){
  if(!sid||!examId){ toast('Select a learner and an exam first (add learners/exams if the lists are empty)','err'); return; }
  const school = currentSchool();
  const stu = school.students.find(x=>x.id===sid);
  if(!stu){ toast('Learner not found','err'); return; }
  if(!confirmUnapproved(school, examId)) return;
  showReports('#reportArea', [stu], examId, 'Print This Report');
}
function generateAllReports(classId, examId){
  if(!classId||!examId){ toast('Select a grade and an exam first','err'); return; }

}

// Re-renders whichever portal (DOS/HOI or teacher) is currently open — the Assignments
// functions below are shared by both, gated by permission rather than by role. (Reuses
// the existing renderCurrentPortal() defined above, near the Class Teacher Tools.)
function addAssignment(){
  const school = currentSchool();
  const classId = qs('#asgClass').value;
  const title = qs('#asgTitle').value.trim();
  const dueDate = qs('#asgDue').value;
  const instructions = qs('#asgBody').value.trim();
  const visible = qs('#asgVisible').checked;
  const msgEl = qs('#asgMsg');
  if(!classId){ msgEl.innerHTML = '<div class="msg err">Choose a grade first.</div>'; return; }
  if(teacherDenied('canPostAssignments', classId)) return;
  if(!title){ msgEl.innerHTML = '<div class="msg err">Give the assignment a title.</div>'; return; }
  if(!instructions){ msgEl.innerHTML = '<div class="msg err">Add the assignment instructions — this is what parents will see and print.</div>'; return; }
  const finish = (attachment)=>{
    school.assignments.unshift({ id: uid('asg_'), classId, title, instructions, dueDate, attachment: attachment||'', postedAt: Date.now(), visible });
    saveDB(DB);
    toast(visible ? 'Assignment sent — visible to parents now.' : 'Assignment saved as hidden — toggle it on when ready.');
    renderCurrentPortal();
  };
  const file = qs('#asgFile').files && qs('#asgFile').files[0];
  if(file){
    if(!file.type.startsWith('image/')){ msgEl.innerHTML = '<div class="msg err">Attachment must be an image file.</div>'; return; }
    if(file.size > 2*1024*1024){ msgEl.innerHTML = '<div class="msg err">Image is too large — please use one under 2MB.</div>'; return; }
    const reader = new FileReader();
    reader.onload = ()=>finish(reader.result);
    reader.onerror = ()=>{ msgEl.innerHTML = '<div class="msg err">Could not read that image — please try another file.</div>'; };
    reader.readAsDataURL(file);
  } else finish('');
}
function toggleAssignmentVisible(id){
  const school = currentSchool();
  const a = school.assignments.find(x=>x.id===id);
  if(!a) return;
  if(teacherDenied('canPostAssignments', a.classId)) return;
  a.visible = !a.visible;
  saveDB(DB); renderCurrentPortal();
}
function deleteAssignment(id){
  const school = currentSchool();
  const a = school.assignments.find(x=>x.id===id);
  if(!a) return;
  if(teacherDenied('canPostAssignments', a.classId)) return;
  if(!confirm('Delete this assignment? Parents will no longer be able to see or print it.')) return;

}

// Sends real SMS via a Cloud Function (see GO_LIVE.md) that holds the Africa's Talking
// API key server-side. Each school pays for its own messages out of a prepaid credit
// wallet (1 credit = 1 SMS segment) topped up by the platform admin — see Admin → 💬 SMS
// Credits. Nothing here ever sees or stores the real API key.


/* ---------- SMS balance: server-owned, read-only in the browser ----------
   The wallet lives at schools/{code}/sms/credits in the shared platform database. Database
   rules let any signed-in client READ it but nobody WRITE it; only the Vercel function
   (Admin SDK) changes it — on send, refund, and admin top-up. school.smsCredits is just a
   display cache of that node. It is never pushed to or merged from the cloud school blob. */
let _smsDbPromise = null;
function platformSmsDb(){
  if(!hasPlatformConfig()) return Promise.reject(new Error('No shared database configured'));
  if(_smsDbPromise) return _smsDbPromise;
  _smsDbPromise = new Promise((resolve, reject)=>{
    loadFirebaseAuthSdk(()=>{
      try{
        const app = firebase.apps.find(a=>a.name==='cbcPlatformSms') || firebase.initializeApp(window.PLATFORM_FIREBASE_CONFIG, 'cbcPlatformSms');
        const auth = app.auth(), db = app.database();
        if(auth.currentUser){ resolve(db); return; }
        auth.signInAnonymously().then(()=>resolve(db)).catch(reject);
      }catch(e){ reject(e); }
    });
  }).catch(e=>{ _smsDbPromise = null; throw e; });
  return _smsDbPromise;
}
const smsBalWatch = {};   // schoolCode -> firebase ref being watched
const smsPinSet = {};     // schoolCode -> true/false, whether the admin has issued an SMS PIN (the PIN itself is never readable)
const smsPinMem = {};     // schoolCode -> PIN typed this session. Memory only: never saved, never synced; cleared on logout.
function paintSmsBalance(code, v){
  document.querySelectorAll('[data-smsbal="'+code+'"]').forEach(el=>{ el.textContent = v; });
  const price = DB.settings.smsPricePerCredit||0;
  document.querySelectorAll('[data-smskes="'+code+'"]').forEach(el=>{ el.textContent = price ? ' (≈ KES '+(v*price).toFixed(0)+')' : ''; });
  document.querySelectorAll('[data-smslow="'+code+'"]').forEach(el=>{ el.style.display = v < 20 ? '' : 'none'; });
}
function paintSmsPinStatus(code){
  const on = smsPinSet[code]===true;
  document.querySelectorAll('[data-smspin="'+code+'"]').forEach(el=>{ el.textContent = on ? '✅ Issued' : '⚠ Not issued'; });
  document.querySelectorAll('[data-smspinwarn="'+code+'"]').forEach(el=>{ el.style.display = on ? 'none' : ''; });
}
async function watchSmsBalances(codes){
  if(!hasSmsConfig()) return;
  let db;
  try{ db = await platformSmsDb(); }catch(e){ console.warn('SMS balance unavailable', e); return; }
  codes.forEach(code=>{
    if(smsBalWatch[code]) return;
    const ref = db.ref('schools/'+code+'/sms');
    smsBalWatch[code] = ref;
    ref.on('value', snap=>{
      const node = snap.val() || {};
      const v = Number(node.credits)||0;
      const sc = DB.schools[code];
      if(sc) sc.smsCredits = v;             // in-memory display cache only; deliberately not saved/pushed
      smsPinSet[code] = !!node.pinSet;
      paintSmsBalance(code, v); paintSmsPinStatus(code);
    }, err=>{ console.warn('SMS balance listener failed', err); delete smsBalWatch[code]; });
  });
}
// Admin-only: asks the server to add credit. Needs the cloud admin sign-in (same as Send Test SMS).
// topupId makes the call idempotent — approving the same request twice can never credit twice.
async function adminSmsCall(payload){
  const fbUser = (typeof fbAdminAuth!=='undefined' && fbAdminAuth && fbAdminAuth.currentUser) || null;
  if(!fbUser) throw new Error('Sign in with your synced cloud admin account first (Admin → ☁️ Cloud Admin Account). This can only be done through the server.');
  const idToken = await fbUser.getIdToken();
  const res = await fetch(window.PLATFORM_SMS_ENDPOINT, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(Object.assign({idToken}, payload))
  });
  let data = null; try{ data = await res.json(); }catch(_){}
  if(!res.ok || !data || !data.ok) throw new Error((data && data.error) || ('HTTP '+res.status));
  return data;
}
async function serverTopUp(code, credits, note, topupId){
  return adminSmsCall({purpose:'topup', schoolCode: code, credits, topupId, note: note||''});
}

// Credit is changed ONLY by the server (purpose:'topup'); adminEditAndPush afterwards just
// records the human-readable history line on the school. topupId = idempotency key.
// The SMS PIN is what authorises a school to spend its credit. The server generates it, keeps only a
// scrambled (scrypt) copy where no browser can read it, and returns the real PIN exactly once — here.
async function issueSmsPin(code){
  const sc = DB.schools[code]; if(!sc) return;
  const had = smsPinSet[code]===true;
  if(!confirm(had ? `Issue a NEW SMS PIN for ${sc.name}? The current PIN stops working immediately.` : `Issue an SMS PIN for ${sc.name}?`)) return;
  try{
    const r = await adminSmsCall({purpose:'setpin', schoolCode: code});
    smsPinSet[code] = true; paintSmsPinStatus(code);
    const box = qs('#smsAdminMsg');
    if(box){
      box.innerHTML = `<div class="msg ok"><b>SMS PIN for ${escapeHtml(sc.name)} (${escapeHtml(code)}):</b> <span style="font-size:24px;letter-spacing:5px;font-weight:700;margin-left:8px">${escapeHtml(r.pin)}</span><br><span class="small">Shown only this once — the server keeps just a scrambled copy, so it can't be looked up later. Give it to the school's DOS/HOI only (not teachers or parents). If it's lost, issue a new one.</span></div>`;
      box.scrollIntoView({behavior:'smooth', block:'center'});
    }
  }catch(err){ toast('Could not issue PIN: '+String(err.message||err),'err'); }
}
async function applySmsTopup(code, credits, note, topupId, historyNote){
  try{
    await serverTopUp(code, credits, note, topupId);
  }catch(err){
    toast('Top-up failed: '+String(err.message||err),'err'); return false;
  }
  try{
    await adminEditAndPush(code, s=>{
      s.smsTopups = s.smsTopups||[];
      if(!s.smsTopups.some(t=>t.id===topupId)) s.smsTopups.push({id:topupId, ts:Date.now(), credits, note: historyNote});
    });
  }catch(e){ console.warn('Credit was added, but the history line could not be saved', e); }
  return true;
}
async function quickTopUpSms(code, credits){
  if(!confirm(`Add ${credits} credit(s) to this school's SMS balance?`)) return;
  if(await applySmsTopup(code, credits, 'Manual top-up by admin', uid('top_')+Date.now().toString(36), 'Manual top-up by admin')){
    toast(`+${credits} credit(s) added`); renderAdmin();
  }
}

async function approveSmsTopupRequest(code, reqId){
  const school = DB.schools[code];
  const preview = school && (school.smsTopupRequests||[]).find(r=>r.id===reqId);
  if(!preview){ toast('Request not found','err'); return; }
  if(preview.status!=='pending'){ toast('That request was already handled','err'); return; }
  if(!Number.isInteger(preview.credits) || preview.credits<=0){ toast('This request has no valid credit amount — set a price per credit first, or top up manually.','err'); return; }
  if(!confirm(`Approve and add ${preview.credits} credit(s) to ${school.name}?`)) return;
  const note = `Approved request — M-Pesa ${preview.mpesaCode||'-'}, paid KES ${preview.amountPaid}`;
  // The request id is the idempotency key: if the credit lands but the status update below fails,
  // approving again will NOT credit twice — the server recognises the id and just returns ok.
  try{ await serverTopUp(code, preview.credits, note, reqId); }
  catch(err){ toast('Approval failed: '+String(err.message||err),'err'); return; }
  await adminEditAndPush(code, s=>{
    const r = (s.smsTopupRequests||[]).find(x=>x.id===reqId);
    if(!r || r.status!=='pending') return;
    r.status = 'approved'; r.resolvedTs = Date.now();
    s.smsTopups = s.smsTopups||[];
    if(!s.smsTopups.some(t=>t.id===reqId)) s.smsTopups.push({id:reqId, ts:Date.now(), credits:r.credits, note});
  });
  toast('Top-up approved'); renderAdmin();
}
async function rejectSmsTopupRequest(code, reqId){
  const reason = prompt("Optional reason for rejecting (the school will see this on their own Top-up Request list):",'') || '';
  await adminEditAndPush(code, s=>{
    const r = (s.smsTopupRequests||[]).find(x=>x.id===reqId);
    if(!r || r.status!=='pending') return;
    r.status = 'rejected'; r.resolvedTs = Date.now(); r.resolvedNote = reason;
  });
  toast('Request rejected'); renderAdmin();
}

/* ---------- DOS/HOI + shared sending logic ---------- */
function normalizePhone(raw){
  let p = (raw||'').replace(/[^\d+]/g,'');
  if(!p) return '';
  if(p.startsWith('00')) p = '+'+p.slice(2);                       // 00254… → +254…
  if(p.startsWith('+')) return p;
  if(p.startsWith('0')) return '+254'+p.slice(1);                  // Kenyan local format → international
  if(p.startsWith('254')) return '+'+p;
  if(/^[71]\d{8}$/.test(p)) return '+254'+p;                       // 712345678 (leading 0 dropped)
  return p;
}
// Kenyan numbers must be +254 followed by 7xx/1xx and 8 more digits; other countries just
// need a plausible E.164 length. Stops typos ("0712 34567") from burning credits on dead numbers.
function isValidSmsPhone(n){
  if(!n || !n.startsWith('+')) return false;
  if(n.startsWith('+254')) return /^\+254[71]\d{8}$/.test(n);
  return /^\+\d{8,15}$/.test(n);
}
// Builds the send list: normalises + validates numbers, drops duplicates (same number AND same
// text — e.g. two siblings sharing one parent phone get one announcement, not two charges),
// and reports how many were skipped and why so the school isn't surprised.
function buildSmsRecipients(items){
  const seen = new Set(), out = []; let invalid = 0, dup = 0;
  items.forEach(it=>{
    const phone = normalizePhone(it.phone);
    if(!isValidSmsPhone(phone)){ invalid++; return; }
    const key = phone+'|'+it.message;
    if(seen.has(key)){ dup++; return; }
    seen.add(key); out.push({phone, message: it.message});
  });
  return {recipients: out, invalid, dup};
}

// Records what the school says they paid; nothing is credited yet — an admin has to
// approve it (Admin → 💬 SMS Credits) before smsCredits actually moves. This is the whole
// "payment" flow: no card processor, just a paper trail the admin checks against M-Pesa.
function submitSmsTopupRequest(){
  if(!canEdit()){ noEdit(); return; }
  const school = currentSchool();
  const amount = Number(qs('#topupAmount').value);
  const mpesa = qs('#topupMpesa').value.trim();
  const note = qs('#topupNote').value.trim();
  if(!amount || amount<=0){ toast('Enter the amount you paid','err'); return; }
  const price = DB.settings.smsPricePerCredit||0;
  const credits = price ? Math.floor(amount/price) : 0;
  school.smsTopupRequests = school.smsTopupRequests||[];
  school.smsTopupRequests.push({id:uid('req_'), ts:Date.now(), amountPaid:amount, mpesaCode:mpesa, note, credits, status:'pending'});
  saveDB(DB);
  qs('#topupMsg').innerHTML = '<div class="msg ok">Request submitted — the admin will confirm and top up your balance.</div>';
  rerenderRole();
}
// Re-sends only to the numbers the server reported as failed last time, using the exact
// same per-recipient message text as the original batch (stored in recipientsSnapshot),
// so a retry never has to guess what a learner's result message said.
function retryFailedSms(logId){
  if(smsSending){ toast('A send is already in progress — please wait','err'); return; }
  const school = currentSchool();
  const log = (school.smsLog||[]).find(l=>l.id===logId);
  if(!log || !log.failedNumbers || !log.failedNumbers.length){ toast('Nothing to retry','err'); return; }
  if(!smsPinGate(/Results/.test(log.type)?'smsResultsMsg':'smsAnnounceMsg')) return;
  const failedSet = log.failedNumbers.map(normalizePhone);
  const retry = (log.recipientsSnapshot||[]).filter(r=>failedSet.includes(normalizePhone(r.phone)));
  if(!retry.length){ toast('Could not match the failed numbers to the original message list','err'); return; }
  const credits = retry.reduce((n,r)=>n+smsSegments(r.message),0);
  if(credits > (school.smsCredits||0)){ toast(`Not enough credit: need ${credits}, have ${school.smsCredits||0}`,'err'); return; }
  if(!confirm(`Retry sending to ${retry.length} failed recipient(s) for ${credits} credit(s)?`)) return;
  sendSmsBatch(school, retry, {type:'Retry: '+log.type.replace(/^Retry: /,''), audience: log.audience}, /Results/.test(log.type)?'smsResultsMsg':'smsAnnounceMsg');
}
function smsFillExamOptions(){
  const school = currentSchool(); if(!school || !qs('#smsClass')) return;
  const classId = qs('#smsClass').value;
  const exams = school.exams.filter(e=>e.classId===classId).slice().reverse();
  qs('#smsExam').innerHTML = exams.map(e=>{
    const hasMarks = Object.keys(school.marks[e.id]||{}).length>0;
    const tag = !hasMarks ? ' — no marks yet'
      : (school.requireApproval ? (e.resultsApproval==='approved' ? ' — ✅ approved' : e.resultsApproval==='disapproved' ? ' — ❌ disapproved' : ' — ⏳ pending approval') : '');
    return `<option value="${e.id}">${escapeHtml(e.name)} — ${e.term} ${e.year}${tag}</option>`;
  }).join('') || '<option value="">No exams for this grade yet</option>';
  smsPreviewResults();
}
// Builds one short results text for a single learner — same underlying numbers as the
// printed report card (see buildReportHTML), just condensed to SMS length.
function learnerResultSummary(school, sid, examId){
  const exam = school.exams.find(e=>e.id===examId); if(!exam) return null;
  const student = school.students.find(s=>s.id===sid); if(!student) return null;
  const areas = areasForClass(school, exam.classId);
  const marksForExam = school.marks[examId] || {};
  let sumPct=0;
  areas.forEach(a=>{ const max=exam.maxMarksByArea[a.id]??100; const score=(marksForExam[sid]||{})[a.id]; if(score!=null) sumPct+=pctOf(score,max); });
  const meanPct = areas.length ? sumPct/areas.length : 0;
  const overall = gradeFor(school, meanPct, exam.classId);
  const learners = studentsForExam(school, exam);
  const totals = learners.map(s=>{ let t=0; areas.forEach(a=>{ const sc=(marksForExam[s.id]||{})[a.id]; if(sc!=null) t+=sc; }); return {id:s.id,t}; }).sort((a,b)=>b.t-a.t);
  const position = totals.findIndex(x=>x.id===sid)+1;
  const text = `Dear Parent, ${student.name}'s results for ${exam.name} (${exam.term} ${exam.year}): Mean ${meanPct.toFixed(1)}%, Grade ${overall.level}, Position ${position}/${learners.length}. - ${school.name}`;
  return text;
}
function smsPreviewResults(){
  const school = currentSchool(); const el = qs('#smsResultsPreview'); if(!el) return;
  const classId = qs('#smsClass').value, examId = qs('#smsExam').value;
  if(!examId){ el.innerHTML = ''; return; }
  const exam = school.exams.find(e=>e.id===examId);
  if(!exam || exam.classId!==classId){ el.innerHTML = '<p class="msg err">⚠ That exam is not for the selected grade.</p>'; return; }
  if(exam && school.requireApproval && exam.resultsApproval!=='approved'){
    el.innerHTML = '<p class="msg err">⚠ This exam has not been approved yet — approve it under Exams before sending results to parents.</p>'; return;
  }
  const learners = studentsInClass(school, classId);
  const withPhone = learners.filter(s=>isValidSmsPhone(normalizePhone(s.parentPhone)) && learnerHasMarks(school, s.id, examId));
  const sample = withPhone[0] ? learnerResultSummary(school, withPhone[0].id, examId) : null;
  const credits = sample ? smsCreditsNeeded(withPhone.length, sample) : 0;
  el.innerHTML = `<p>${withPhone.length} of ${learners.length} learner(s) have a valid parent phone AND marks for this exam — ${learners.length-withPhone.length} will be skipped.</p>
  ${sample?`<p><b>Sample message</b> (${sample.length} chars, ${smsSegments(sample)} credit(s) each): <i>"${escapeHtml(sample)}"</i></p><p>Estimated cost: <b>${credits} credit(s)</b> · Balance: ${school.smsCredits||0}</p>`:'<p class="small">No learner with a phone number has marks for this exam yet.</p>'}`;
}
function learnerHasMarks(school, sid, examId){ return Object.keys((school.marks[examId]||{})[sid]||{}).length>0; }
function sendResultsSms(){
  if(smsSending){ toast('A send is already in progress — please wait','err'); return; }
  if(!smsPinGate('smsResultsMsg')) return;
  const school = currentSchool();
  const classId = qs('#smsClass').value, examId = qs('#smsExam').value;
  if(!examId){ toast('Choose a grade and exam first','err'); return; }
  const exam = school.exams.find(e=>e.id===examId);
  if(!exam || exam.classId!==classId){ toast('That exam is not for the selected grade — pick the grade again','err'); return; }
  if(exam && school.requireApproval && exam.resultsApproval!=='approved'){ toast('Approve this exam\'s results before sending to parents','err'); return; }
  const learners = studentsInClass(school, classId).filter(s=>s.parentPhone && s.parentPhone.trim() && learnerHasMarks(school, s.id, examId));
  if(!learners.length){ toast('No learner in this grade has both a parent phone number and marks for this exam','err'); return; }
  const built = buildSmsRecipients(learners.map(s=>({phone:s.parentPhone, message: learnerResultSummary(school, s.id, examId)})));
  const recipients = built.recipients;
  if(!recipients.length){ toast('None of the parent phone numbers are valid — check them on the Learners tab','err'); return; }
  const credits = recipients.reduce((n,r)=>n+smsSegments(r.message),0);
  if(credits > (school.smsCredits||0)){ qs('#smsResultsMsg').innerHTML = `<div class="msg err">Not enough credit: need ${credits}, have ${school.smsCredits||0}.</div>`; return; }
  const skipNote = built.invalid ? `\n\n${built.invalid} learner(s) will be skipped because their parent phone number is invalid.` : '';
  if(!confirm(`Send exam results to ${recipients.length} parent(s) for ${credits} credit(s)?${skipNote}`)) return;
  sendSmsBatch(school, recipients, {type:'Results', audience: (school.classes.find(c=>c.id===classId)||{}).name || classId}, 'smsResultsMsg');
}
function announcementRecipients(school, classId, text){
  const pool = classId ? studentsInClass(school, classId) : school.students;
  const built = buildSmsRecipients(pool.filter(s=>s.parentPhone && s.parentPhone.trim()).map(s=>({phone:s.parentPhone, message:text})));
  return {pool, ...built};
}
function smsPreviewAnnouncement(){
  const el = qs('#smsAnnouncePreview'); if(!el) return;
  const school = currentSchool();
  const classId = qs('#smsAudience').value;
  const text = qs('#smsAnnounceText').value.trim();
  const r = announcementRecipients(school, classId, text||'x');
  if(!text){ el.innerHTML = `<p>${r.recipients.length} unique parent number(s) reachable out of ${r.pool.length} learner(s) in this audience.</p>`; return; }
  const credits = smsCreditsNeeded(r.recipients.length, text);
  el.innerHTML = `<p>${text.length} character(s), ${smsSegments(text)} credit(s) per recipient · ${r.recipients.length} unique parent number(s) reachable out of ${r.pool.length} learner(s)${r.dup?` (${r.dup} duplicate number(s) — e.g. siblings — will only receive it once)`:''}${r.invalid?` · ${r.invalid} invalid number(s) skipped`:''}.</p><p>Estimated cost: <b>${credits} credit(s)</b> · Balance: ${school.smsCredits||0}</p>`;
}
function sendAnnouncementSms(){
  if(smsSending){ toast('A send is already in progress — please wait','err'); return; }
  if(!smsPinGate('smsAnnounceMsg')) return;
  const school = currentSchool();
  const classId = qs('#smsAudience').value;
  const text = qs('#smsAnnounceText').value.trim();
  if(!text){ toast('Write a message first','err'); return; }
  const r = announcementRecipients(school, classId, text);
  const recipients = r.recipients;
  if(!recipients.length){ toast('No valid parent phone number in this audience','err'); return; }
  const credits = smsCreditsNeeded(recipients.length, text);
  if(credits > (school.smsCredits||0)){ qs('#smsAnnounceMsg').innerHTML = `<div class="msg err">Not enough credit: need ${credits}, have ${school.smsCredits||0}.</div>`; return; }
  if(!confirm(`Send this announcement to ${recipients.length} parent(s) for ${credits} credit(s)?`)) return;
  const audienceName = classId ? (school.classes.find(c=>c.id===classId)||{}).name || classId : 'Whole school';
  sendSmsBatch(school, recipients, {type:'Announcement', audience: audienceName}, 'smsAnnounceMsg');
}
// Posts to the Cloud Function, which checks/deducts the school's real credit balance
// server-side (so a tampered client value can't be used to send SMS for free) and
// returns the authoritative new balance, which we then store locally.
// Safeguards: one send at a time (no double-tap double-billing), a 65s timeout, non-JSON
// error pages handled, a timeout is logged as "unknown outcome" (NOT as a clean failure) so the
// school checks before resending, and the log keeps only the failed recipients (not every
// message) so the synced school record doesn't balloon.
let smsSending = false;
const SMS_LOG_MAX = 100;
function pushSmsLog(school, entry){
  school.smsLog.push(entry);
  if(school.smsLog.length > SMS_LOG_MAX) school.smsLog = school.smsLog.slice(-SMS_LOG_MAX);
}
// Returns the 6-digit PIN typed in the SMS tab (or remembered this session), or shows a message and returns null.
function smsPinGate(msgElId){
  const school = currentSchool();
  const typed = qs('#smsPin') ? qs('#smsPin').value.trim() : '';
  const pin = typed || (school && smsPinMem[school.code]) || '';
  if(!/^\d{6}$/.test(pin)){
    const el = qs('#'+msgElId);
    if(el) el.innerHTML = '<div class="msg err">Enter your 6-digit School SMS PIN in the box at the top of this tab first. Ask the platform administrator if your school has not been given one.</div>';
    else toast('Enter your 6-digit School SMS PIN first','err');
    return null;
  }
  if(school) smsPinMem[school.code] = pin;
  return pin;
}
async function sendSmsBatch(school, recipients, meta, msgElId){
  if(smsSending) return;
  const smsPin = smsPinGate(msgElId); if(!smsPin) return;
  smsSending = true;
  const msgEl = qs('#'+msgElId);
  document.querySelectorAll('button[onclick^="sendResultsSms"],button[onclick^="sendAnnouncementSms"],button[onclick^="retryFailedSms"]').forEach(b=>b.disabled=true);
  if(msgEl) msgEl.innerHTML = '<p class="small">Sending… please don\'t close this page.</p>';
  const ctrl = new AbortController();
  const timer = setTimeout(()=>ctrl.abort(), 65000);
  try{
    const res = await fetch(window.PLATFORM_SMS_ENDPOINT, {
      method:'POST', headers:{'Content-Type':'application/json'}, signal: ctrl.signal,
      body: JSON.stringify({schoolCode: school.code, smsPin, recipients})
    });
    let data = null;
    try{ data = await res.json(); }catch(_){ data = null; }
    if(!data || !res.ok || !data.ok){
      const errText = (data && data.error) || ('Server error (HTTP '+res.status+')');
      if(/PIN/i.test(errText)) delete smsPinMem[school.code];   // don't keep a PIN the server rejected
      pushSmsLog(school, {id:uid('sms_'), ts:Date.now(), type:meta.type, audience:meta.audience, recipients:recipients.length, credits:0, ok:false, error:errText});
      saveDB(DB);
      if(msgEl) msgEl.innerHTML = `<div class="msg err">Send failed: ${escapeHtml(errText)}</div>`;
      return;
    }
    if(typeof data.newBalance==='number') school.smsCredits = data.newBalance;
    const failedNumbers = (data.failedNumbers||[]).map(normalizePhone);
    const failedRecipients = recipients.filter(r=>failedNumbers.includes(normalizePhone(r.phone)));
    pushSmsLog(school, {id:uid('sms_'), ts:Date.now(), type:meta.type, audience:meta.audience, recipients:recipients.length, credits:data.creditsUsed||0, ok:true, sent:data.sent, failed:data.failed, failedNumbers, recipientsSnapshot:failedRecipients});
    saveDB(DB);
    toast(`Sent to ${data.sent==null?recipients.length:data.sent} parent(s)${data.failed?`, ${data.failed} failed`:''}`);
    if(session && session.role==='finance'){ if(msgEl) msgEl.innerHTML=`<div class="msg ok">Sent to ${data.sent==null?recipients.length:data.sent} parent(s)${data.failed?`, ${data.failed} failed`:''}.</div>`; } else renderDOS();
  }catch(err){
    const timedOut = err && err.name==='AbortError';
    const errText = timedOut
      ? 'No reply from the SMS service after 65s — some messages MAY have been sent. Check the balance and your log before resending.'
      : 'Could not reach the SMS service: '+String(err.message||err);
    pushSmsLog(school, {id:uid('sms_'), ts:Date.now(), type:meta.type, audience:meta.audience, recipients:recipients.length, credits:0, ok:false, error:errText});
    saveDB(DB);
    if(msgEl) msgEl.innerHTML = `<div class="msg err">${escapeHtml(errText)}</div>`;
  }finally{
    clearTimeout(timer);
    smsSending = false;
    document.querySelectorAll('button[onclick^="sendResultsSms"],button[onclick^="sendAnnouncementSms"],button[onclick^="retryFailedSms"]').forEach(b=>b.disabled=false);
  }
}

/* ============================= INIT ============================= */
resetInactivityTimer(); // arm the 15-minute timeout right away if a session survived a page refresh
route();
</script>
